function onboarding(force){
  if (!force && (S.onb || Object.keys(S.prog).length)) { if (!S.onb) { S.onb = 1; save(); } return; }
  let i = 0;
  const el = document.createElement("div"); el.className = "onb"; document.body.appendChild(el);
  const P3 = [
    ["wave", "Merhaba, ben Gedsche!", "Almancayı her gün biraz, ama düzenli çalışacağız. Ders gibi değil, gerçek hayattaki cümlelerle."],
    ["think", "Her gün bir yol", "Bugün sayfasında kısa bir yol var: kart destesi, kitap, senaryo ve yazı. Bitirince sandık açılır."],
    ["cheer", "Günlük hedefin?", "Ne kadar zaman ayırabilirsin? Sonra ayarlardan değiştirebilirsin."],
  ];
  const draw = () => {
    const [m, h, p] = P3[i], g = S.opt.goal || 20;
    el.innerHTML = `${bat(m, 170, ["flag", "glasses", "crown"][i] || "")}<h2>${h}</h2><p>${p}</p>
      ${i === 2 ? `<div class="goalpick">${[[10, "Hafif"], [20, "Normal"], [30, "Yoğun"]].map(([v, t]) => `<button data-v="${v}" class="${g === v ? "on" : ""}">${v} dk<small>${t}</small></button>`).join("")}</div>` : ""}
      <div class="dots">${P3.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
      <button class="cta" id="onx">${i < 2 ? "Devam" : "Başlayalım"}</button>`;
    el.querySelectorAll(".goalpick button").forEach(b => b.onclick = () => { S.opt.goal = +b.dataset.v; draw(); });
    $("#onx").onclick = () => { sfx("tap"); if (i < 2) { i++; draw(); return; } S.onb = 1; S.opt.goal = S.opt.goal || 20; S.opt.pace = {10:5, 20:10, 30:15}[S.opt.goal]; save(); el.remove(); go("today"); };
  };
  draw();
}

/* ================= EŞİTLEME: iki sürüm arasında kodla taşı, birleştir ================= */
const SYNC_TAG = "ALMANCA1:";
async function syncCode(){
  const json = JSON.stringify(Object.assign({}, S, {drafts: {}}));
  try {
    const st = new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));
    const buf = new Uint8Array(await new Response(st).arrayBuffer());
    let bin = ""; for (let i = 0; i < buf.length; i += 8192) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));
    return SYNC_TAG + "z" + btoa(bin);
  } catch(e) { return SYNC_TAG + "j" + btoa(unescape(encodeURIComponent(json))); }
}
async function readCode(txt){
  txt = (txt || "").trim();
  if (txt[0] === "{") return JSON.parse(txt);  // eski düz yedek
  const i = txt.indexOf(SYNC_TAG); if (i < 0) throw 0;
  const body = txt.slice(i + SYNC_TAG.length).replace(/\s+/g, ""), kind = body[0], b64 = body.slice(1);
  const bin = atob(b64);
  if (kind === "j") return JSON.parse(decodeURIComponent(escape(bin)));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
// iki ilerlemeyi birleştir: her kartta daha çok çalışılmış kayıt kazanır, sayılar en yükseği alır
function mergeState(a, b){
  const m = load(JSON.parse(JSON.stringify(a)));
  b = load(JSON.parse(JSON.stringify(b)));
  const pick = (x, y) => !x ? y : !y ? x : ((y.n || 0) > (x.n || 0) || ((y.n || 0) === (x.n || 0) && (y.last || "") > (x.last || ""))) ? y : x;
  Object.keys(b.prog).forEach(k => m.prog[k] = pick(m.prog[k], b.prog[k]));
  const maxObj = (x, y) => { Object.keys(y || {}).forEach(k => { const v = y[k]; x[k] = typeof v === "number" ? Math.max(x[k] || 0, v) : (x[k] === undefined ? v : x[k]); }); return x; };
  Object.keys(b.days).forEach(d => m.days[d] = maxObj(m.days[d] || {}, b.days[d]));
  m.book.read = maxObj(m.book.read || {}, b.book.read); m.book.last = m.book.last || b.book.last;
  m.scen.done = maxObj(m.scen.done || {}, b.scen.done);
  maxObj(m.gram, b.gram);
  m.askDone = uniq(m.askDone.concat(b.askDone));
  b.ask.forEach(x => { if (!m.ask.some(y => y.id === x.id)) m.ask.push(x); });
  m.ask = m.ask.filter(x => !m.askDone.includes(x.id));
  b.qa.forEach(x => { const i = m.qa.findIndex(y => y.id === x.id); if (i < 0) m.qa.push(x); else if (x.a && !m.qa[i].a) m.qa[i] = x; });
  b.mine.forEach(x => { if (!m.mine.some(y => y.id === x.id)) m.mine.push(x); });
  Object.keys(b.weeks).forEach(k => { if (!m.weeks[k] || (b.weeks[k].n || 0) > (m.weeks[k].n || 0)) m.weeks[k] = b.weeks[k]; });
  const mm = m.miss = m.miss || {}; Object.entries(b.miss || {}).forEach(([k, r]) => { const x = mm[k]; if (!x || (r.last || "") > (x.last || "") || ((r.last || "") === (x.last || "") && (r.n || 0) > (x.n || 0))) mm[k] = r; });
  const fc = m.fchat = m.fchat || []; (b.fchat || []).forEach(x => { const i = fc.findIndex(y => y.id === x.id); if (i < 0) fc.push(x); else if (fc[i].p && !x.p) fc[i] = x; });
  fc.sort((a, b) => a.id.localeCompare(b.id)); m.fmig = m.fmig || b.fmig;
  m.xp = Math.max(m.xp || 0, b.xp || 0); m.badges = Object.assign({}, b.badges || {}, m.badges || {});
  Object.keys(b.games).forEach(k => { const x = m.games[k], y = b.games[k], low = GAMES[k] && GAMES[k].low; m.games[k] = x === undefined ? y : low ? Math.min(x, y) : Math.max(x, y); });
  return m;
}
async function importCode(txt, stay){
  try { const other = await readCode(txt); if (!other || !other.prog) throw 0; S = mergeState(S, other); buildItems(); save(); if (stay) return true; toast("İlerleme birleştirildi ✓"); $("#sheet").classList.remove("show"); go("today"); return true; }
  catch(e) { toast("Bu bir eşitleme kodu değil"); return false; }
}
