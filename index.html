ch!","tr":"Birazdan görüşürüz!","ex":"Ich park nur noch kurz. Bis gleich!","note":"Birkaç dakika sonra görüşecekken; mesajda da çok sık.","cat":"Zaman & plan"},{"id":"L1-049","de":"Kannst du ein bisschen langsamer sprechen?","tr":"Biraz daha yavaş konuşabilir misin?","ex":"Sorry, mein Deutsch ist nicht so gut – kannst du ein bisschen langsamer sprechen?","note":"A2 öğrencisi için hayati; resmi: 'Können Sie bitte langsamer sprechen?'","cat":"Sohbet"},{"id":"L1-050","de":"Schönes Wochenende!","tr":"İyi hafta sonları!","ex":"Ich bin weg. Schönes Wochenende!","note":"Cuma günü iş yerinde, dükkanda.","cat":"İş"},{"id":"L1-051","de":"Gute Nacht!","tr":"İyi geceler!","ex":"Gute Nacht, Gece, schlaf gut!","note":"Yatmadan önce; ailede, çocuğa.","cat":"Ev & aile"},{"id":"L1-052","de":"Guten Appetit!","tr":"Afiyet olsun!","ex":"Das Essen ist fertig. Guten Appetit!","note":"Yemeğe başlarken; masada herkese.","cat":"Ev & aile"},{"id":"L1-053","de":"Gesundheit!","tr":"Çok yaşa!","ex":"Hatschi! – Gesundheit!","note":"Biri hapşırınca.","cat":"Tepki"},{"id":"L1-054","de":"Viel Spaß!","tr":"İyi eğlenceler!","ex":"Ihr geht in den Zoo? Viel Spaß!","note":"Birinin planına iyi dilek.","cat":"Sohbet"},{"id":"L1-055","de":"Wie war's?","tr":"Nasıldı?","ex":"Na, wie war's beim Kinderarzt?","note":"Bir olaydan, randevudan ya da tatilden sonra sorulur; çok sık.","cat":"Sohbet"},{"id":"L1-056","de":"Gute Besserung!","tr":"Geçmiş olsun!","ex":"Du bist krank? Gute Besserung!","note":"Hasta birine; mesajda da çok yaygın.","cat":"Duygu"},{"id":"L1-057","de":"Ich hab keine Zeit.","tr":"Vaktim yok.","ex":"Heute hab ich leider keine Zeit.","note":"Teklifi reddederken; 'leider' ile kibar.","cat":"Zaman & plan"},{"id":"L1-058","de":"Jetzt nicht.","tr":"Şimdi olmaz.","ex":"Jetzt nicht, Gece, Papa telefoniert.","note":"Ertelemek için; kısa ve samimi.","cat":"Zaman & plan"},{"id":"L1-059","de":"Kannst du mal …?","tr":"Bir … verir misin / yapar mısın?","ex":"Kannst du mal das Fenster aufmachen?","note":"'mal' isteği yumuşatır; ev ve iş.","cat":"Rica"},{"id":"L1-060","de":"Kannst du mir helfen?","tr":"Bana yardım eder misin?","ex":"Kannst du mir kurz mit dem Kinderwagen helfen?","note":"Samimi; yabancıya 'Können Sie …?'","cat":"Rica"},{"id":"L1-061","de":"Weißt du was?","tr":"Biliyor musun? / Bak ne diyeceğim.","ex":"Weißt du was? Wir bestellen heute Pizza.","note":"Fikir ya da haber vermeden önce.","cat":"Sohbet"},{"id":"L1-062","de":"Darf ich …?","tr":"… yapabilir miyim?","ex":"Darf ich hier kurz parken?","note":"İzin isterken; kibar.","cat":"Rica"},{"id":"L1-063","de":"Gib mir mal …","tr":"Bir … versene.","ex":"Gib mir mal das Handy, bitte.","note":"Evde, samimi; 'bitte' eklemek iyi olur.","cat":"Rica"},{"id":"L1-064","de":"Ich hab mal 'ne Frage.","tr":"Bir sorum var.","ex":"Ich hab mal 'ne Frage zum Urlaubsantrag.","note":"Soru öncesi giriş; iş yerinde de.","cat":"Rica"},{"id":"L1-065","de":"Was machst du da?","tr":"Orada ne yapıyorsun?","ex":"Gece, was machst du da mit dem Stift?","note":"O anki işi sorar; çocukla çok sık.","cat":"Ev & aile"},{"id":"L1-066","de":"Wo bist du?","tr":"Neredesin?","ex":"Wo bist du? Wir warten schon.","note":"Mesajda ve telefonda.","cat":"Mesajlaşma"},{"id":"L1-067","de":"Quatsch!","tr":"Saçmalık! / Ne alakası var!","ex":"„Bist du sauer?“ – „Quatsch, alles gut.“","note":"Bir şeyi reddederken ya da birini rahatlatırken; samimi, kaba değil.","cat":"Tepki"},{"id":"L1-068","de":"Was kostet das?","tr":"Bu ne kadar?","ex":"Entschuldigung, was kostet das hier?","note":"Fiyat sorarken; pazarda, dükkanda.","cat":"Kafe & Alışveriş"},{"id":"L1-069","de":"Wann kommst du?","tr":"Ne zaman geliyorsun?","ex":"Wann kommst du heute nach Hause?","note":"Eşe, arkadaşa mesajda.","cat":"Mesajlaşma"},{"id":"L1-070","de":"Bin unterwegs.","tr":"Yoldayım.","ex":"Bin unterwegs, in zehn Minuten da.","note":"Mesajda 'ich' düşer.","cat":"Mesajlaşma"},{"id":"L1-071","de":"Bist du zu Hause?","tr":"Evde misin?","ex":"Bist du zu Hause? Das Paket kommt gleich.","note":" "use strict";
const D = window.DATA || {phrases:[],book:{chapters:[],roles:{}},scenarios:[],prompts:[],writings:[],mistakes:[]};
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Claude içinde mi açıldı? (orada mikrofon yok, ama Claude düzeltme ve hesap kaydı var)
const IN_CLAUDE = !!(window.claude && window.claude.use);

/* ---------- tarih ---------- */
const pad = n => String(n).padStart(2, "0");
function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
const TODAY = ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const trDate = s => { const [y,m,d] = s.split("-").map(Number); return d + " " + AYLAR[m-1]; };
const dayNo = () => Math.max(0, Math.round((new Date(TODAY) - new Date(D.start || TODAY)) / 864e5));
function dayRec(){ return S.days[TODAY] = S.days[TODAY] || {}; }
function mark(step){ dayRec()[step] = 1; save(); }
function streak(){
  let n = 0, d = new Date();
  if (!Object.keys(S.days[ymd(d)] || {}).length) d.setDate(d.getDate()-1);
  while (Object.keys(S.days[ymd(d)] || {}).length) { n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- kayıt ---------- */
const KEY = "almanca-gunluk-v1";
let DB = null, SAMPLE = null, syncT = null;
let S = load();
function load(from){
  let s = from || null;
  if (!s) try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  s = s || {};
  s.prog = s.prog || {}; s.days = s.days || {}; s.book = s.book || {}; s.scen = s.scen || {};
  s.drafts = s.drafts || {}; s.games = s.games || {}; s.gram = s.gram || {}; s.mine = s.mine || []; s.weeks = s.weeks || {}; s.ask = s.ask || []; s.askDone = s.askDone || []; s.qa = s.qa || [];
  s.opt = Object.assign({theme:"auto", rate:0.9, pace:10, wpace:5, n:10}, s.opt || {});
  // eski kayıt: puan (s) → kutu (b) ve tekrar tarihi
  Object.values(s.prog).forEach(r => { if (r.b === undefined) { r.b = r.s >= 4 ? 4 : r.s ? 1 : 0; r.due = r.due || ymd(new Date()); } });
  return s;
}
function save(){
  S.ts = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  if (DB) { clearTimeout(syncT); syncT = setTimeout(() => DB.doc("state/progress").set({json: JSON.stringify(S)}).catch(() => {}), 800); }
}
// Claude'un düzelttiği yazılar (hesapta) + data.js'tekiler
let WRITINGS = [];
const allWritings = () => D.writings.concat(WRITINGS).sort((a, b) => (a.date + (a.at || "")).localeCompare(b.date + (b.at || "")));
const allMistakes = () => D.mistakes.concat(...WRITINGS.map(w => (w.mistakes || []).map(m => Object.assign({date: w.date}, m))));

/* ---------- kartlar: tüm çalışılabilir cümleler tek havuzda ---------- */
// src: ph günlük kalıp · bk kitap kalıbı · bl kitap cümlesi · sc senaryo cümlesi
const SRC = {
  ph: {t:"Günlük kalıplar", ic:"💬"},
  bk: {t:"Kitap kalıpları", ic:"🔑"},
  bl: {t:"Kitap cümleleri", ic:"📖"},
  sc: {t:"Senaryo cümleleri", ic:"🎭"},
  wd: {t:"Kelimeler", ic:"🔤"},
  my: {t:"Benim cümlelerim", ic:"🙋"},
  l1: {t:"Sık kalıplar", ic:"⭐"},
};
let ITEMS = [], BYID = {};
function buildItems(){
  ITEMS = []; BYID = {};
  const add = it => { if (!BYID[it.id]) { if (!it.note && NOTES[it.id]) it.note = NOTES[it.id]; ITEMS.push(it); BYID[it.id] = it; } };
  D.phrases.forEach(p => add({id:p.id, src:"ph", de:p.de, tr:p.tr, ex:p.ex, d:p.d, cat:p.cat, note:p.note}));
  D.book.chapters.forEach(c => {
    (c.k || []).forEach((k, j) => add({id:`k${c.n}.${j}`, src:"bk", de:k[0], tr:k[1], ch:c.n}));
    c.lines.forEach((l, j) => add({id:`b${c.n}.${j}`, src:"bl", de:l[1], tr:l[2], ch:c.n, sp:l[0]}));
  });
  D.scenarios.forEach(s => {
    s.lines.forEach((l, j) => { if (l[0] === "U") add({id:`${s.id}.${j}`, src:"sc", de:l[1], tr:l[2], sc:s.id}); });
    (s.k || []).forEach((k, j) => add({id:`${s.id}k${j}`, src:"sc", de:k[0], tr:k[1], sc:s.id}));
  });
  // kendi cümlelerim ("Nasıl derim?")
  (S.mine || []).forEach(m => add({id:m.id, src:"my", de:m.de, tr:m.tr, ex:m.ex, note:m.note, d:m.d}));
  // kelimeler: isim, fiil, sıfat
  const rows = t => t.trim().split("\n").map(l => l.split("|"));
  rows(W_NOUNS).forEach(([aw, pl, tr, cat, rk], i) => { const [art, w] = aw.split(" "); add({id:"n:" + w, src:"wd", kind:"n", de:aw, w, art, pl: pl === "–" ? "" : pl, tr, cat, o: rk ? +rk : 1000 + i}); });
  rows(W_VERBS).forEach(([w, tr, pr, pf, pt, rk], i) => add({id:"v:" + w, src:"wd", kind:"v", de:w, w, tr, pr:pr.split(","), pf, pt, o: rk ? +rk : 1000 + i}));
  rows(W_ADJ).forEach(([w, tr, opp, rk], i) => add({id:"a:" + w, src:"wd", kind:"a", de:w, w, tr, opp, o: rk ? +rk : 1000 + i}));
  // en sık günlük kalıplar: sadece oyun havuzu için (günlük desteye girmez); Claude'dan gelen aynı kimlikli kalıp önce eklenir
  (typeof L1PH !== "undefined" ? L1PH : []).forEach((p, i) => add({id:p.id, src:"l1", de:p.de, tr:p.tr, ex:p.ex, note:p.note, cat:p.cat, o:i}));
}
const WORDS = () => ITEMS.filter(i => i.src === "wd");
buildItems();

/* ---------- aralıklı tekrar: kutu 0-8, doğru → bir üst kutu ---------- */
const IV = [0, 1, 2, 4, 8, 16, 35, 75, 160];
const lvl = it => { const r = S.prog[it.id]; return !r ? 0 : r.b >= 4 ? 2 : 1; };
const LVL_TXT = ["Yeni", "Öğreniyorum", "Oturdu"];
const isDue = it => { const r = S.prog[it.id]; return r && r.due <= TODAY; };
function seen(it){ if (!S.prog[it.id]) { S.prog[it.id] = {b:0, due:TODAY, f:TODAY}; const k = it.src === "wd" ? "newW" : "newSeen"; dayRec()[k] = (dayRec()[k] || 0) + 1; } }
function grade(it, ok){
  const r = S.prog[it.id] = S.prog[it.id] || {b:0, due:TODAY};
  if (ok) { r.b = Math.min(8, r.b + 1); r.due = addDays(IV[r.b]); }
  else { r.b = Math.max(1, Math.floor(r.b / 2)); r.due = addDays(r.b > 2 ? 1 : 0); }
  r.last = TODAY; r.n = (r.n || 0) + 1; if (!ok) r.x = (r.x || 0) + 1;
  const d = dayRec(); d.n = (d.n || 0) + 1; if (ok) d.ok = (d.ok || 0) + 1;
}

function todaysPhrases(){
  const ps = ITEMS.filter(i => i.src === "ph");
  const t = ps.filter(p => p.d === TODAY);
  if (t.length) return t;
  // bugün için kalıp gelmediyse: tarihi geçmiş ve henüz başlanmamış olanlar
  return ps.filter(p => p.d <= TODAY && !S.prog[p.id]).slice(0, 10);
}
// okunan kitap bölümleri (yoksa ilk bölüm): kitap alıştırmaları buradan
const readChapters = () => { const r = Object.keys(S.book.read || {}).map(Number); return r.length ? r : [1]; };
function poolFor(src){
  if (src === "ph") return ITEMS.filter(i => i.src === "ph" && i.d <= TODAY);
  if (src === "bk" || src === "bl") { const rc = readChapters(); return ITEMS.filter(i => i.src === src && rc.includes(i.ch)); }
  if (src === "sc") { const done = Object.keys(S.scen.done || {}); const sc = done.length ? done : [todaysScenario() && todaysScenario().id]; return ITEMS.filter(i => i.src === "sc" && sc.includes(i.sc)); }
  if (src === "due") return dueItems();
  if (src === "wd") return WORDS();
  if (src === "my") return ITEMS.filter(i => i.src === "my");
  return [];
}
const dueItems = () => ITEMS.filter(isDue).sort((a, b) => S.prog[a.id].due.localeCompare(S.prog[b.id].due) || S.prog[a.id].b - S.prog[b.id].b);
// günün destesi: vadesi gelenler + yeni kartlar (önce günün kalıpları, sonra okunan bölümün kalıpları)
function newItems(){
  const out = ITEMS.filter(i => i.src === "my" && !S.prog[i.id]).concat(todaysPhrases().filter(p => !S.prog[p.id]));
  const rc = readChapters();
  const extra = ITEMS.filter(i => i.src === "bk" && rc.includes(i.ch) && !S.prog[i.id]);
  const room = Math.max(0, S.opt.pace - (dayRec().newSeen || 0));
  const wroom = Math.max(0, S.opt.wpace - (dayRec().newW || 0));
  const ws = WORDS().filter(w => !S.prog[w.id]).sort((a, b) => a.o - b.o).slice(0, wroom);
  return out.concat(extra.slice(0, Math.max(0, room - out.length)), ws);
}
function deck(){ return {due: dueItems().slice(0, 40), fresh: newItems()}; }

/* ---------- ses ---------- */
let VOICES = [], TRV = null;
function loadVoices(){
  if (!(!!window.speechSynthesis)) return;
  const all = speechSynthesis.getVoices();
  VOICES = all.filter(v => /^de(-|_|$)/i.test(v.lang));
  TRV = all.find(v => /^tr(-|_|$)/i.test(v.lang)) || null;
}
if (!!window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const cleanSpeech = t => String(t).replace(/…/g, "").replace(/ \/ /g, ". ").replace(/[\u{1F300}-\u{1FAFF}]/gu, "");
// Telefonlarda ses: iOS ilk dokunuştan önce sesi kilitler, bazı Android'lerde "bitti" haberi gelmez.
const HAS_TTS = !!window.speechSynthesis && typeof window.SpeechSynthesisUtterance === "function";
let TTS_OK = null, ttsWarned = false;
function ttsUnlock(){
  if (!HAS_TTS || ttsUnlock.done) return; ttsUnlock.done = true;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch(e) {}
}
document.addEventListener("pointerdown", ttsUnlock, {once:true, capture:true});
document.addEventListener("touchend", ttsUnlock, {once:true, capture:true});
function ttsFail(){
  if (ttsWarned) return; ttsWarned = true;
  toast(HAS_TTS ? "Ses çalmadı. Telefon sessizde mi? Olmazsa linki Safari/Chrome'da aç." : "Bu ekranda ses yok. Linki Safari ya da Chrome'da aç.");
}
function speak(text, who, onend, opt){
  opt = opt || {};
  let f = 0; const done = () => { if (!f++ && onend) onend(); };
  if (noListen()) { if (onend) setTimeout(done, 250); return; }  // "şu an dinleyemem": ses yok
  const t = cleanSpeech(text).trim();
  if (!HAS_TTS || !t) { if (!HAS_TTS) ttsFail(); if (onend) setTimeout(done, t ? 400 + t.length * 60 : 100); return; }
  if (!VOICES.length) loadVoices();
  const u = new SpeechSynthesisUtterance(t);
  const rate = opt.rate || S.opt.rate;
  u.rate = rate;
  if (opt.tr) { u.lang = "tr-TR"; if (TRV) u.voice = TRV; }
  else {
    u.lang = "de-DE";
    if (VOICES.length) u.voice = VOICES[(who || 0) % VOICES.length];
    if (who && VOICES.length < 2) u.pitch = who % 2 ? 1.25 : 0.9;
  }
  u.onstart = () => { TTS_OK = true; };
  u.onend = done; u.onerror = e => { if (e && e.error !== "interrupted" && e.error !== "canceled" && !TTS_OK) ttsFail(); done(); };
  // "bitti" haberi gelmezse akış takılmasın
  if (onend) setTimeout(done, 2500 + t.length * 110 / rate);
  setTimeout(() => { if (TTS_OK === null) { TTS_OK = false; ttsFail(); } }, 2500);
  const go = () => { try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch(e) { ttsFail(); done(); } };
  if (!opt.queue && (speechSynthesis.speaking || speechSynthesis.pending)) { speechSynthesis.cancel(); setTimeout(go, 80); }
  else go();
}
const speakTR = (t, onend, rate) => speak(t, 0, onend, {tr:1, rate});
const stopSpeak = () => { if (!!window.speechSynthesis) speechSynthesis.cancel(); };
// mikrofon: tarayıcı destekliyorsa ve sayfaya izin verilmişse; ilk denemede reddedilirse kapanır
// "şu an dinleyemem / konuşamam": bir süre sesli soruları sorma (bu cihazda)
const quietUntil = k => ((S.opt.quiet || {})[k] || 0);
const noListen = () => quietUntil("nl") > Date.now();
const noSpeak = () => quietUntil("ns") > Date.now();
function setQuiet(k, ms){ S.opt.quiet = S.opt.quiet || {}; S.opt.quiet[k] = ms ? Date.now() + ms : 0; save(); }
const SR_CTOR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const micAllowed = () => { try { const fp = document.permissionsPolicy || document.featurePolicy; return !fp || !fp.allowsFeature || fp.allowsFeature("microphone"); } catch(e) { return true; } };
const micOff = () => { try { return localStorage.getItem("micOff") === "1"; } catch(e) { return false; } };
let SR = SR_CTOR && micAllowed() && !micOff() ? SR_CTOR : null;
function micFail(){
  SR = null; try { localStorage.setItem("micOff", "1"); } catch(e) {}
  toast("Mikrofon bu ekranda açılmadı. Şimdilik dinleyip kendin söylüyorsun; Ayarlar'dan tekrar deneyebilirsin.");

const norm = s => s.toLowerCase().replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/[.,!?¿¡;:"“„”'’()–\-…\/]/g," ").replace(/\s+/g," ").trim();
function similar(a, b){
  a = norm(a); b = norm(b);
  if (!a || !b) return 0;
  const m = a.length, n = b.length, dp = Array.from({length:m+1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return 1 - dp[m][n] / Math.max(m, n);
}
// "A / B" ve "(…)" içeren kalıplarda en iyi eşleşen varyant
function bestVariant(it, said){
  const vars = it.de.split(" / ").flatMap(v => [v, v.replace(/\([^)]*\)/g, "")]).map(v => v.replace(/…/g, ""));
  return Math.max(...vars.map(v => similar(v, said)));
}
// alıştırmalar için tek, sade biçim: ilk varyant, parantez ve üç nokta yok
const plain = it => it.de.split(" / ")[0].replace(/\([^)]*\)/g, "").replace(/…/g, "").replace(/\s+/g, " ").trim();
const words = it => plain(it).split(" ").filter(Boolean);
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = a => a[Math.random() * a.length | 0];
// yanlış şıklar: önce aynı türden, uzunluğu benzer olanlar
function distractors(it, n, key){
  key = key || "de";
  const seenV = new Set([norm(it[key])]);
  const cand = shuffle(ITEMS.filter(x => x.id !== it.id)).sort((a, b) => (a.src !== it.src) - (b.src !== it.src) || Math.abs(a[key].length - it[key].length) - Math.abs(b[key].length - it[key].length));
  const out = [];
  for (const x of cand.slice(0, 40).sort(() => Math.random() - .5).concat(cand.slice(40))) {
    const v = norm(x[key]); if (seenV.has(v)) continue; seenV.add(v); out.push(x); if (out.length >= n) break;
  }

}

  const fin = (ok, said) => { answer(it, ok); $("#vd").innerHTML = verdict(ok, it, said); speak(plain(it)); footNext(); };
  if (typing) {

function startMistakes(){
  const L = shuffle(allMistakes()).slice(0, 15);
  if (!L.length) { toast("Henüz hata kartı yok"); return; }
  const q = [];
  L.forEach(m => q.push({m, k:"pick"}));
  L.forEach(m => { const n = m.right.split(" ").filter(Boolean).length; if (n >= 2 && n <= 12 && norm(m.right) !== norm(m.wrong)) q.push({m, k:"build"}); });

  const r = () => {
    setTop("Hatalarım", true); lock = 0;
    const cur = q[i];

    const m = cur.m, top = `<div class="ptop"><div class="pbar"><i style="width:${i/q.length*100}%"></i></div><span class="small muted">${i+1}/${q.length}</span></div>`;

        <div class="opts">${opts.map((o, j) => `<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div>
        <div id="vd"></div><div class="foot" hidden></div>`;
      $$(".opt").forEach(b => b.onclick = () => {
        if (lock) return; lock = 1;
        const ok = opts[+b.dataset.j] === m.right;

        fin(ok, cur); speak(m.right);
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Doğru!" : "Doğrusu:"}<b>${esc(m.right)}</b>${rule}</div>`;

    } else {

        <div class="card flash" style="min-height:90px"><div class="mid">Senin yazdığın</div><div class="big" style="font-size:19px;color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px">${esc(m.wrong)}</div></div>

        <div id="vd"></div>
        <div class="foot"><div class="row2"><button class="btn2" id="clr">Temizle</button><button class="cta" id="ck" disabled>Kontrol et</button></div></div>`;
      const draw = () => {
        $("#built").innerHTML = built.map((k, j) => `<button class="wd" data-j="${j}">${esc(pool[k].x)}</button>`).join("");
        $$("#pool .wd").forEach(b => b.classList.toggle("used", built.includes(+b.dataset.k)));
        $$("#built .wd").forEach(b => b.onclick = () => { if (lock) return; built.splice(+b.dataset.j, 1); draw(); });
        $("#ck").disabled = built.length !== w.length;
      };
      $$("#pool .wd").forEach(b => b.onclick = () => { if (lock || built.includes(+b.dataset.k)) return; built.push(+b.dataset.k); draw(); });
      $("#clr").onclick = () => { if (lock) return; built.length = 0; draw(); };
      $("#ck").onclick = () => {
        if (lock) return; lock = 1;
        const ok = norm(built.map(k => pool[k].x).join(" ")) === norm(m.right);
        fin(ok, cur); speak(m.right);
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Harika!" : "Doğrusu:"}<b>${esc(m.right)}</b>${rule}</div>`;
        foot();
      };
    }
  };
  open(r);

const PERS = ["ich", "du", "er/sie", "wir", "ihr", "sie/Sie"];
function wordInfo(it){

}

    <div id="vd"></div><div class="foot" hidden></div>`;
  $$(".opt").forEach(b => b.onclick = () => {
    if (P.lock) return; P.lock = 1;
    const ok = opts[+b.dataset.i] === right;
    b.classList.add(ok ? "good" : "bad"); if (!ok) $(`.opt[data-i="${opts.indexOf(right)}"]`).classList.add("good");

  },
  plural(it){
    const w = it.w, cand = [w + "e", w + "en", w + "n", w + "s", umlaut(w) + "e", w, w + "er", umlaut(w) + "er", umlaut(w)].filter(x => x !== it.pl);
    choose(it, "plural", `<div class="mid">${esc(it.tr)}</div><div class="big">${esc(it.de)}</div><div class="mid">→ die ?</div>`, shuffle(cand).slice(0, 3).map(x => x), it.pl, 2);

  },
  conj(it){
    const p = Math.random() * 6 | 0, right = it.pr[p];

    const reg = [stem + "e", stem + "st", stem + "t", it.w, stem + "en"].map(f => it.pr[0].includes(" ") ? f + " " + it.pr[0].split(" ")[1] : f);
    choose(it, "conj", `<div class="mid">${esc(it.w)} · ${esc(it.tr)}</div><div class="big">${PERS[p]} ___</div>`, shuffle(uniq(it.pr.concat(reg))).filter(f => f !== right).slice(0, 3), right, 2);
  },
  perfekt(it){

    const alt = aux === "hat" ? "ist" : "hat", stem = it.w.replace(/^sich /, "").replace(/ \S+$/, "").replace(/e?n$/, "");

  return ch.find(c => c.n === last + 1) || ch.find(c => !(S.book.read||{})[c.n]) || ch[0];
}
const todaysScenario = () => D.scenarios.length ? D.scenarios[dayNo() % D.scenarios.length] : null;
const todaysPrompt = () => D.prompts.length ? D.prompts[dayNo() % D.prompts.length] : {tr:"Bugün neler yaptın?", start:""};

  const n = dk.due.length + dk.fresh.length;
  const out = [{k:"deck", ic:"🃏", t:"Günün destesi",
    s: n ? [dk.fresh.length ? dk.fresh.length + " yeni" : "", dk.due.length ? dk.due.length + " tekrar" : ""].filter(Boolean).join(" · ") + " · karışık alıştırma" : "Bugünlük kart kalmadı",
    run: () => n ? startSession({items: dk.fresh.concat(dk.due.slice(0, 30)), mode:"deck", title:"Günün destesi", stepKey:"deck"}) : toast("Bugünlük kart kalmadı 👏")}];
  if (ch) out.push({k:"book", ic:"📖", t:"Kitap: " + ch.n + ". bölüm", s:ch.de + " · " + ch.tr, eve:1, run:() => openReader("book", ch.n)});

  out.push({k:"write", ic:"✍️", t:"Günlük yazı", s:pr.tr, eve:1, run:() => open(renderWrite)});
  if (weekDue()) out.push({k:"week", ic:"📝", t:"Haftalık kontrol", s:"Bu haftanın kartlarından 5 dakikalık test", eve:1, run:() => startWeekly()});

/* ================= TURBO: duy, söyle, düzelt ================= */
let T = null;
function startTurbo(src){
  if (noListen()) return toast("Şu an dinleyemem açık. Bugün ekranından kapatabilirsin.");
  const items = srcItems(src, 20);
  if (!items.length) { toast("Bu kaynakta cümle yok"); return; }
  T = {items, i:0, dir: S.opt.tdir || "trde", run:true, tok:0, ok:0, n:0, res:{}};
  open(renderTurbo);
  onLeave = stopTurbo;
  wake(true);
  setTimeout(turboStep, 400);
}
function stopTurbo(){
  if (!T) return; T.run = false; T.tok++; stopSpeak(); wake(false);
  Object.entries(T.res).forEach(([id, ok]) => { seen(BYID[id]); grade(BYID[id], ok); }); T.res = {}; save();
  if (T.rec) try { T.rec.abort(); } catch(e) {}
}
function renderTurbo(){
  setTop("Turbo", true);
  const it = T.items[T.i];
  $("#view").innerHTML = `
    <div class="seg" id="tdir" style="margin-top:6px"><button data-v="trde" class="${T.dir === "trde" ? "on" : ""}">Türkçe → Almanca</button><button data-v="detr" class="${T.dir === "detr" ? "on" : ""}">Almanca → Türkçe</button></div>
    <div class="ptop"><div class="pbar"><i style="width:${T.i/T.items.length*100}%"></i></div><span class="small muted">${T.i+1}/${T.items.length}</span></div>
    <div class="card player">
      <div class="phase2" id="ph">Hazır ol</div>
      <div class="${T.dir === "trde" ? "tr" : "de"}" id="q">${it ? esc(T.dir === "trde" ? it.tr : it.de) : ""}</div>
      <div class="${T.dir === "trde" ? "de" : "tr"}" id="a" style="visibility:hidden">${it ? esc(T.dir === "trde" ? it.de : it.tr) : ""}</div>
      <div id="vd"></div>
    </div>
    <div class="tfbtn" id="self" style="margin-top:14px;visibility:hidden"><button class="y" data-v="1">✓ Bildim</button><button class="n" data-v="0">✗ Bilemedim</button></div>
    <div class="ctrl"><button id="tp" aria-label="Duraklat">${T.run ? "❚❚" : "▶"}</button><button id="tn" aria-label="Sonraki">⏭</button></div>
    <p class="hint">${SR && T.dir === "trde" ? "Bip sesi yok: Türkçeyi duyunca hemen Almancasını söyle." : "Türkçeyi duy, Almancasını yüksek sesle söyle; sonra doğrusunu duyarsın. İstersen Bildim/Bilemedim'e dokun."}</p>`;
  $$("#tdir button").forEach(b => b.onclick = () => { T.dir = S.opt.tdir = b.dataset.v; save(); T.tok++; stopSpeak(); renderTurbo(); if (T.run) setTimeout(turboStep, 300); });
  $("#tp").onclick = () => { T.run = !T.run; T.tok++; stopSpeak(); if (T.rec) try { T.rec.abort(); } catch(e) {} renderTurbo(); if (T.run) setTimeout(turboStep, 300); };
  $("#tn").onclick = () => { T.tok++; stopSpeak(); T.i++; renderTurbo(); if (T.run) setTimeout(turboStep, 300); };
  $$("#self button").forEach(b => b.onclick = () => { const it = T.items[T.i]; if (it) { T.res[it.id] = b.dataset.v === "1"; $("#self").style.visibility = "hidden"; toast(b.dataset.v === "1" ? "👍" : "Tekrar gelecek"); } });
}
function turboStep(){
  if (!T || !T.run || screen !== renderTurbo) return;
  const it = T.items[T.i], tok = ++T.tok, live = () => T && T.run && T.tok === tok;
  if (!it) { stopTurbo(); setTop("Turbo", true); endCard("⚡", "Turbo bitti", T.items.length + " cümle", "Tamam"); return; }
  renderTurbo();
  const ph = t => { const e = $("#ph"); if (e) e.textContent = t; };
  const reveal = () => { const a = $("#a"); if (a) a.style.visibility = "visible"; };
  const nextIt = (ms) => setTimeout(() => { if (live()) { T.i++; turboStep(); } }, ms);
  const think = Math.max(2500, plain(it).length * 90);
  if (T.dir === "detr") {
    ph("Dinle");
    speak(it.de, 0, () => { if (!live()) return; ph("Anlamı ne?"); setTimeout(() => { if (!live()) return; reveal(); $("#self").style.visibility = "visible"; speakTR(it.tr, () => live() && nextIt(1600)); }, think); });
    return;
  }
  ph("Türkçesi");
  speakTR(it.tr, () => {
    if (!live()) return;
    if (SR && !noSpeak()) {
      ph("Söyle…");
      T.rec = listen(alts => {
        if (!live()) return;
        const said = alts.sort((a, b) => bestVariant(it, b) - bestVariant(it, a))[0], ok = bestVariant(it, said) >= 0.72;
        T.res[it.id] = ok; reveal();
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}" style="margin-top:8px">${ok ? "Doğru!" : "Sen: “" + esc(said) + "”"}</div>`;
        ph(ok ? "Doğru" : "Doğrusu");
        speak(it.de, 0, () => live() && nextIt(900));
      }, () => { if (!live()) return; reveal(); ph("Doğrusu"); speak(it.de, 0, () => live() && nextIt(1200)); });
    } else {
      ph("Şimdi sen söyle");
      setTimeout(() => { if (!live()) return; reveal(); ph("Doğrusu"); $("#self").style.visibility = "visible"; speak(it.de, 0, () => { if (!live()) return; setTimeout(() => live() && speak(it.de, 0, () => live() && nextIt(1800)), 700); }); }, think);
    }
  });
}
// ekran kararmasın (destekleyen tarayıcılarda)
let WL = null;
function wake(on){
  try {
    if (on && navigator.wakeLock) navigator.wakeLock.request("screen").then(w => WL = w, () => {});
    else if (WL) { WL.release(); WL = null; }
  } catch(e) {}
}

let L = null;
function startPlayer(s){
  if (noListen()) return toast("Şu an dinleyemem açık. Bugün ekranından kapatabilirsin.");

  if (!L.list.length) return toast("Liste boş");
  open(renderPlayer);
  onLeave = () => { if (L) { L.playing = false; L.tok++; } wake(false); };
  wake(true);

}
function renderPlayer(){
  setTop("Dinle", true);
  const it = L.list[L.i] || {};
  const o = S.opt;
  $("#view").innerHTML = `
    <div class="ptop"><div class="pbar"><i style="width:${(L.i+1)/L.list.length*100}%"></i></div><span class="small muted">${L.i+1}/${L.list.length}</span></div>

      ${it.who ? `<div class="who">${esc(it.who)}</div>` : ""}
      <div class="de" id="pde" ${o.ldir === "trde" ? 'style="visibility:hidden"' : ""}>${esc(it.de || "")}</div>
      <div class="tr">${esc(it.tr || "")}</div>
    </div>
    <div class="ctrl"><button id="pv" aria-label="Önceki">⏮</button><button class="pp" id="pp" aria-label="Oynat/Duraklat">${L.playing ? "❚❚" : "▶"}</button><button id="pn" aria-label="Sonraki">⏭</button></div>
    <p class="hint">${LDIR.find(d => d[0] === o.ldir)[1]} · ${o.lrep}× · ${({0.7:"çok yavaş",0.85:"yavaş",1:"normal",1.15:"hızlı"})[o.lrate] || ""}. Liste bitince başa döner.</p>`;
  $("#pp").onclick = () => { L.playing = !L.playing; L.tok++; stopSpeak(); renderPlayer(); if (L.playing) playCur(); };
  $("#pn").onclick = () => { L.tok++; stopSpeak(); L.i = (L.i + 1) % L.list.length; renderPlayer(); if (L.playing) playCur(); };
  $("#pv").onclick = () => { L.tok++; stopSpeak(); L.i = (L.i - 1 + L.list.length) % L.list.length; renderPlayer(); if (L.playing) playCur(); };
  if ("mediaSession" in navigator) try {
    navigator.mediaSession.metadata = new MediaMetadata({title: it.de || "", artist: it.tr || "", album: "Almanca Günlük"});
    navigator.mediaSession.setActionHandler("nexttrack", () => $("#pn") && $("#pn").click());
    navigator.mediaSession.setActionHandler("previoustrack", () => $("#pv") && $("#pv").click());
    navigator.mediaSession.setActionHandler("pause", () => L.playing && $("#pp") && $("#pp").click());
    navigator.mediaSession.setActionHandler("play", () => !L.playing && $("#pp") && $("#pp").click());
  } catch(e) {}
}
function playCur(){
  if (!L || !L.playing || screen !== renderPlayer) return;
  const tok = ++L.tok, live = () => L && L.playing && L.tok === tok && screen === renderPlayer;
  const o = S.opt, it = L.list[L.i], gap = o.lgap * 1000, rate = o.lrate;
  renderPlayer();
  const de = n => done => speak(it.de, it.v || 0, () => { if (!live()) return; n > 1 ? setTimeout(() => live() && de(n - 1)(done), 700) : done(); }, {rate});
  const advance = () => setTimeout(() => { if (!live()) return; L.i = (L.i + 1) % L.list.length; playCur(); }, gap);
  if (o.ldir === "de") de(o.lrep)(advance);
  else if (o.ldir === "detr") de(o.lrep)(() => setTimeout(() => live() && (it.tr ? speakTR(it.tr, () => live() && advance(), Math.min(1, rate + .1)) : advance()), 500));
  else speakTR(it.tr || "", () => setTimeout(() => { if (!live()) return; const e = $("#pde"); if (e) e.style.visibility = "visible"; de(o.lrep)(advance); }, Math.max(2000, gap + 1000)), Math.min(1, rate + .1));
}

// oyun havuzu: gördüğün kartlar + bugünkü kalıplar + okunan bölümün kalıpları
function gamePool(){
  let p = ITEMS.filter(i => S.prog[i.id]).concat(todaysPhrases(), poolFor("bk"));
  if (p.length < 12) p = p.concat(ITEMS.filter(i => i.src === "ph" && i.d <= TODAY), ITEMS.filter(i => i.src === "bk" && i.ch <= 3));
  p = p.concat(ITEMS.filter(i => i.src === "l1"));                 // en sık 167 günlük kalıp
  return p.filter((x, i, a) => a.findIndex(y => y.id === x.id) === i);
}

// oyundan çıkınca ya da yeni oyun başlayınca eski zamanlayıcılar ekrana dokunmasın
function later(fn, ms){ const me = G; setTimeout(() => { if (G === me && screen) fn(); }, ms); }
function gameTimer(sec, onEnd){

/* Blitz: iki şıklı hızlı seçim */
function gBlitz(){
  const pool = shuffle(gamePool());
  G = {i:0, sc:0, combo:0};
  const draw = () => {
    const it = pool[G.i % pool.length], other = distractors(it, 1, "de")[0];
    const opts = shuffle([it, other]);
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""}</span><span class="t" id="gt">${G.left}</span></div>

      <div class="opts">${opts.map(o => `<button class="opt" data-id="${o.id}">${esc(o.de)}</button>`).join("")}</div>`;
    $$(".opt").forEach(b => b.onclick = () => {
      const ok = b.dataset.id === it.id;
      b.classList.add(ok ? "good" : "bad");

  };

  gameTimer(60, () => gameOver("blitz", "Blitz 60", G.sc, "puan"));

}

      } else later(() => { a.classList.add("back"); x.classList.add("back"); G.open = []; }, 900);

function gBuild(){
  const pool = shuffle(gamePool().filter(i => { const n = words(i).length; return n >= 3 && n <= 9; }));
  if (!pool.length) return toast("Önce birkaç kart çalış");
  G = {i:0, sc:0};
  const draw = () => {
    const it = pool[G.i % pool.length], w = words(it), sh = shuffle(w.map((x, i) => ({x, i}))), built = [];
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="t" id="gt">${G.left}</span></div>
      <div class="card flash" style="min-height:90px"><div class="big" style="font-size:20px">${esc(it.tr)}</div></div>
      <div class="built" id="built"></div>

      <div style="margin-top:14px" class="row2"><button class="btn2" id="sk">Geç</button><button class="btn2" id="clr">Temizle</button></div>`;
    const redraw = () => {
      $("#built").innerHTML = built.map(k => `<span class="wd">${esc(sh[k].x)}</span>`).join("");
      $$(".pool .wd").forEach(b => b.classList.toggle("used", built.includes(+b.dataset.k)));
      if (built.length === w.length) {
        const ok = norm(built.map(k => sh[k].x).join(" ")) === norm(w.join(" "));
        $("#built").style.borderColor = ok ? "var(--ok)" : "var(--bad)";
        if (ok) { G.sc += w.length; speak(plain(it)); }
        later(() => { if (G.left > 0) { if (ok) G.i++; else { built.length = 0; $("#built").style.borderColor = ""; return redraw(); } draw(); } }, ok ? 500 : 700);
      }
    };
    $$(".pool .wd").forEach(b => b.onclick = () => { if (!built.includes(+b.dataset.k) && built.length < w.length) { built.push(+b.dataset.k); redraw(); } });
    $("#clr").onclick = () => { built.length = 0; redraw(); };
    $("#sk").onclick = () => { G.i++; draw(); };
  };
  open(() => setTop("Cümle Kur", true));
  gameTimer(90, () => gameOver("build", "Cümle Kur", G.sc, "puan"));
  draw();
}

// önce gördüğün kelimeler, azsa listenin başındakiler
function wordPool(kind, n){
  const all = WORDS().filter(w => !kind || w.kind === kind);
  const seenW = all.filter(w => S.prog[w.id]);
  return shuffle(seenW.length >= (n || 12) ? seenW : seenW.concat(all.filter(w => !S.prog[w.id]).sort((a, b) => a.o - b.o).slice(0, 40)));
}
// 60 saniyelik seçmeli oyun iskeleti
function timedChoice(id, title, pool, make){
  G = {i:0, sc:0, combo:0};
  const draw = () => {
    const it = pool[G.i % pool.length], q = make(it);
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""}</span><span class="t" id="gt">${G.left}</span></div>
      <div class="card flash" style="min-height:150px">${q.top}</div>
      <div class="opts2" ${q.opts.length === 3 ? 'style="grid-template-columns:repeat(3,1fr)"' : ""}>${q.opts.map((o, i) => `<button class="opt" data-i="${i}" style="min-height:62px">${esc(o)}</button>`).join("")}</div>
      <div id="vd" class="hint"></div>`;
    $$(".opt").forEach(b => b.onclick = () => {
      if (G.lock) return; G.lock = 1;
      const ok = q.opts[+b.dataset.i] === q.right;
      b.classList.add(ok ? "good" : "bad");
      if (ok) { G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else { G.combo = 0; $(`.opt[data-i="${q.opts.indexOf(q.right)}"]`).classList.add("good"); }
      speak(q.say || it.de);
      G.i++; later(() => { G.lock = 0; if (G.left > 0) draw(); }, ok ? 300 : 1100);
    });
  };
  open(() => setTop(title, true));
  gameTimer(60, () => gameOver(id, title, G.sc));
  draw();
}

/* Adam Asmaca */
function gHang(){
  const pool = wordPool("n").filter(w => w.w.length >= 4 && w.w.length <= 11);
  G = {i:0, sc:0, lives:6};
  const KEYS = "QWERTZUIOPÜASDFGHJKLÖÄYXCVBNM".split("");
  const round = () => {
    const it = pool[G.i % pool.length], W = it.w.toUpperCase(), got = new Set(), miss = new Set();
    const draw = () => {
      const shown = W.split("").map(c => got.has(c) ? c : "_").join(" ");
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span>${"❤️".repeat(Math.max(0, G.lives))}${"🤍".repeat(6 - Math.max(0, G.lives))}</span></div>
        <div class="card flash" style="min-height:150px"><div class="mid">${esc(it.tr)} · ${esc(it.art)} …</div>
          <div class="big" style="letter-spacing:.12em;font-size:28px">${shown}</div></div>
        <div class="pool" style="gap:6px">${KEYS.map(k => `<button class="wd" data-k="${k}" style="min-width:34px;padding:9px 8px;${got.has(k) ? "background:var(--ok-d)" : miss.has(k) ? "opacity:.3" : ""}" ${got.has(k) || miss.has(k) ? "disabled" : ""}>${k}</button>`).join("")}</div>`;
      $$(".pool .wd").forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        if (G.lives <= 0 || W.split("").every(c => got.has(c))) return;
        if (W.includes(k)) got.add(k); else { miss.add(k); G.lives--; }
        const won = W.split("").every(c => got.has(c));
        if (won) { G.sc++; speak(it.de); toast("✓ " + it.de); G.i++; later(round, 900); draw(); return; }
        if (G.lives <= 0) { speak(it.de); toast(it.de); later(() => gameOver("hang", "Adam Asmaca", G.sc), 1200); }
        draw();
      });
    };

}

/* Kelime Avı: 8x8 tablo, 5 kelime */
function gHunt(){
  const N = 8, AB = "ABDEFGHIKLMNORSTUWZ";
  const words5 = wordPool("n").filter(w => w.w.length >= 3 && w.w.length <= 8 && /^[A-Za-z]+$/.test(w.w)).slice(0, 5);
  const grid = Array.from({length:N}, () => Array(N).fill(""));
  const placed = [];
  words5.forEach(it => {
    const W = it.w.toUpperCase();
    for (let t = 0; t < 200; t++) {
      const dir = pick([[0,1],[1,0],[1,1]]), r = Math.random() * N | 0, c = Math.random() * N | 0;
      const cells = W.split("").map((ch, i) => [r + dir[0] * i, c + dir[1] * i, ch]);
      if (cells.every(([y, x, ch]) => y < N && x < N && (!grid[y][x] || grid[y][x] === ch))) { cells.forEach(([y, x, ch]) => grid[y][x] = ch); placed.push({it, cells}); break; }
    }
  });
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!grid[y][x]) grid[y][x] = pick(AB.split(""));
  G = {found:new Set(), sel:null, t0:Date.now()};
  const draw = () => {
    const hit = new Set(placed.filter(p => G.found.has(p.it.id)).flatMap(p => p.cells.map(([y, x]) => y + "," + x)));
    $("#view").innerHTML = `<div class="hud"><span class="small muted">Bulunan: <b style="font-size:16px">${G.found.size}/${placed.length}</b></span><span class="small muted">İlk ve son harfe dokun</span></div>
      <div class="gpush" style="display:grid;grid-template-columns:repeat(${N},1fr);gap:4px">${grid.map((row, y) => row.map((ch, x) => `<button class="mc" data-y="${y}" data-x="${x}" style="min-height:40px;padding:0;font-size:17px;${hit.has(y + "," + x) ? "background:var(--ok-d);border-color:var(--ok)" : ""}${G.sel && G.sel[0] === y && G.sel[1] === x ? "border-color:var(--acc);background:var(--acc-d)" : ""}">${ch}</button>`).join("")).join("")}</div>
      <div class="sec">Bul</div>
      <div class="chips">${placed.map(p => `<span class="chip ${G.found.has(p.it.id) ? "on" : ""}" style="display:inline-flex;align-items:center">${G.found.has(p.it.id) ? esc(p.it.de) : esc(p.it.tr)}</span>`).join("")}</div>`;
    $$(".mc").forEach(b => b.onclick = () => {
      const y = +b.dataset.y, x = +b.dataset.x;
      if (!G.sel) { G.sel = [y, x]; return draw(); }
      const [y0, x0] = G.sel; G.sel = null;
      const p = placed.find(p => !G.found.has(p.it.id) && ((p.cells[0][0] === y0 && p.cells[0][1] === x0 && p.cells.at(-1)[0] === y && p.cells.at(-1)[1] === x) || (p.cells[0][0] === y && p.cells[0][1] === x && p.cells.at(-1)[0] === y0 && p.cells.at(-1)[1] === x0)));
      if (p) { G.found.add(p.it.id); speak(p.it.de); }
      draw();
      if (G.found.size === placed.length) later(() => gameOver("hunt", "Kelime Avı", Math.round((Date.now() - G.t0) / 1000)), 700);
    });
  };
  open(() => setTop("Kelime Avı", true));
  draw();
}

/* Harf Çarkı: 8 kelime */
function gWheel(){
  const pool = wordPool().filter(w => !/\s/.test(w.w) && w.w.length >= 3 && w.w.length <= 8).slice(0, 8);
  G = {i:0, sc:0};
  const round = () => {
    const it = pool[G.i];
    if (!it) return gameOver("wheel", "Harf Çarkı", G.sc);
    let L = shuffle(it.w.toUpperCase().split("").map((c, i) => ({c, i}))), built = [], hint = 0;
    const draw = () => {
      const R = 108, n = L.length;
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.i + 1}/${pool.length}</span></div>
        <div class="card flash" style="min-height:96px;padding:16px"><div class="mid">${esc(it.tr)}${it.art ? " · " + it.art : ""}</div>
          <div class="big" style="letter-spacing:.1em">${it.w.toUpperCase().split("").map((c, i) => i < built.length ? L[built[i]].c : i < hint ? `<span style="color:var(--tx3)">${c}</span>` : "_").join(" ")}</div></div>
        <div style="position:relative;width:${R * 2 + 64}px;height:${R * 2 + 64}px;margin:18px auto 0;border-radius:50%;background:var(--bg2);border:1px solid var(--line)">
          ${L.map((x, k) => { const a = k / n * 2 * Math.PI - Math.PI / 2; return `<button class="wd" data-k="${k}" style="position:absolute;left:${R + 32 + Math.cos(a) * R - 24}px;top:${R + 32 + Math.sin(a) * R - 24}px;width:48px;height:48px;padding:0;border-radius:50%;font-size:19px;${built.includes(k) ? "visibility:hidden" : ""}">${x.c}</button>`; }).join("")}
        </div>
        <div class="row2" style="margin-top:14px"><button class="btn2" id="wsh">🔀 Karıştır</button><button class="btn2" id="whn">💡 İpucu</button></div>
        <button class="linkbtn" id="wcl">Sil</button>`;
      $$(".wd[data-k]").forEach(b => b.onclick = () => {
        built.push(+b.dataset.k); draw();
        if (built.length === L.length) {
          const ok = built.map(k => L[k].c).join("") === it.w.toUpperCase();
          if (ok) { G.sc += hint ? 1 : 2; speak(it.de); G.i++; later(round, 800); }
          else { toast("Olmadı, tekrar dene"); built = []; later(draw, 500); }
        }
      });
      $("#wsh").onclick = () => { built = []; L = shuffle(L); draw(); };
      $("#whn").onclick = () => { hint = Math.min(it.w.length - 1, hint + 1); built = []; draw(); };
      $("#wcl").onclick = () => { built.pop(); draw(); };
    };
    draw();
  };
  open(() => setTop("Harf Çarkı", true));
  round();
}

/* Kelime Solitaire: masada 6 Almanca kart, desteden Türkçe gelir */
function gSoli(){
  const all = wordPool().slice(0, 18);
  const table = all.slice(0, 6), stock = all.slice(6);
  let deck = shuffle(all.map(w => w.id)), top = null;
  G = {draws:0, cleared:0};
  const nextTop = () => { deck = deck.filter(id => !G.gone || !G.gone.has(id)); top = deck.shift(); if (top) deck.push(top); };
  G.gone = new Set();
  nextTop();
  const draw = () => {
    const t = BYID[top];
    $("#view").innerHTML = `<div class="hud"><span class="small muted">Toplanan: <b style="font-size:16px">${G.cleared}/${all.length}</b></span><span class="small muted">Çekiş: <b style="font-size:16px">${G.draws}</b></span></div>
      <div class="card flash" style="min-height:110px;border-color:var(--acc)"><div class="mid">Destedeki kart</div><div class="big" style="font-size:22px">${t ? esc(t.tr) : ""}</div></div>
      <div class="mgrid" style="grid-template-columns:repeat(3,1fr)">${table.map((w, i) => w ? `<button class="mc" data-i="${i}" style="min-height:74px">${esc(w.de)}</button>` : `<span></span>`).join("")}</div>
      <button class="btn2" id="sdraw" style="width:100%;margin-top:14px">Masada yok · yeni kart çek</button>`;
    $$(".mc").forEach(b => b.onclick = () => {
      const w = table[+b.dataset.i];
      if (w.id === top) {
        speak(w.de); G.gone.add(w.id); G.cleared++;
        table[+b.dataset.i] = stock.shift() || null;
        if (G.cleared === all.length) return gameOver("soli", "Kelime Solitaire", G.draws);
        nextTop(); draw();
      } else { b.classList.add("bad"); later(() => b.classList.remove("bad"), 400); G.draws++; $(".hud b:last-child") && draw(); }
    });
    $("#sdraw").onclick = () => { G.draws++; nextTop(); draw(); };
  };
  open(() => setTop("Kelime Solitaire", true));
  draw();
}

/* Kategori Solitaire: 20 kart, 4 grup */
function gCats(){
  const nouns = WORDS().filter(w => w.kind === "n");
  const cats = shuffle(Object.keys(W_CATS)).slice(0, 4);
  const pool = shuffle(nouns.filter(w => cats.includes(w.cat))).slice(0, 20);
  G = {i:0, sc:0};
  const draw = () => {
    const it = pool[G.i];
    if (!it) return gameOver("cats", "Kategori Solitaire", G.sc);

      <div class="card flash" style="min-height:140px"><div class="big">${esc(it.de)}</div><div class="mid" id="ctr" style="visibility:hidden">${esc(it.tr)}</div></div>

// ortak iskelet: düşme döngüsü, klavye, çıkınca temizlik
function dropLoop(step){
  const me = G; let last = performance.now();
  const tick = now => {
    if (G !== me || G.over || screen === null) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!G.pause) step(dt);
    G.raf = requestAnimationFrame(tick);
  };
  G.raf = requestAnimationFrame(tick);
}
function dropKeys(fn){
  const h = e => { if (fn(e.key)) e.preventDefault(); };
  document.addEventListener("keydown", h);
  const raf = () => cancelAnimationFrame(G && G.raf), me = G;
  onLeave = () => { me.over = 1; raf(); document.removeEventListener("keydown", h); };
}
function dropEnd(id, title, sc){ G.over = 1; if (onLeave) { const f = onLeave; onLeave = null; f(); } gameOver(id, title, sc); }

/* Artikel Düşüşü: 3 can, her doğruda biraz hızlanır */
function gArtDrop(){
  const pool = wordPool("n");
  G = {i:0, sc:0, combo:0, life:3, ok:0};
  open(() => setTop("Artikel Düşüşü", true));
  const ARTS = ["der", "die", "das"];
  $("#view").innerHTML = `<div class="hud"><b id="ds">0</b><span class="small muted" id="dc"></span><span id="dl"></span></div>
    <div class="drop" id="df"><div class="dw" id="dw"><b></b><span></span></div>
      <div class="gates">${ARTS.map((a, k) => `<button class="gate g${k}" data-k="${k}">${a}</button>`).join("")}</div></div>
    <p class="hint">Kapıya dokun ya da ← ↓ → tuşları</p>`;
  const f = $("#df"), w = $("#dw"), gates = $$(".gate");
  const hud = () => { $("#ds").textContent = G.sc; $("#dc").textContent = G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""; $("#dl").textContent = "❤️".repeat(G.life) + "🤍".repeat(3 - G.life); };
  const next = () => {
    G.it = pool[G.i++ % pool.length]; G.y = 0; G.pick = null; G.x = 50; G.pause = 0;
    G.dur = Math.max(2.4, 7 * Math.pow(0.95, G.ok));            // tüm düşüş saniyesi
    w.className = "dw"; w.style.left = "50%"; w.querySelector("b").textContent = G.it.w; w.querySelector("span").textContent = G.it.tr;
    gates.forEach(g => g.classList.remove("good", "bad"));
  };
  const pick = k => { if (G.pick !== null || G.pause) return; G.pick = k; G.x = (k * 2 + 1) * 100 / 6; w.style.left = G.x + "%"; land(); };
  const land = () => {
    G.pause = 1;
    const right = ARTS.indexOf(G.it.art), ok = G.pick === right;
    gates[right].classList.add("good"); if (G.pick !== null && !ok) gates[G.pick].classList.add("bad");
    w.querySelector("b").textContent = G.it.art + " " + G.it.w; w.classList.add(ok ? "ok" : "no", ok ? "pop" : "x");
    speak(G.it.de);
    if (ok) { G.ok++; G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else { G.combo = 0; G.life--; }
    hud();
    later(() => G.life > 0 ? next() : dropEnd("artdrop", "Artikel Düşüşü", G.sc), ok ? 260 : 1500);
  };
  gates.forEach(g => g.onclick = () => pick(+g.dataset.k));
  dropKeys(key => { const k = {ArrowLeft:0, ArrowDown:1, ArrowRight:2, 1:0, 2:1, 3:2}[key]; if (k === undefined) return false; pick(k); return true; });
  hud(); next();
  dropLoop(dt => {
    const H = f.clientHeight - gates[0].offsetHeight - w.offsetHeight;
    G.y += dt * H / G.dur;
    if (G.y >= H) { G.y = H; land(); }
    w.style.transform = `translate(-50%, ${G.y}px)`;
  });
}

    const a = G.a = pool[G.i++ % pool.length];
    G.opts = [[a.w, a.opp], [a.k, a.xk], [a.s, a.xs]].map(o => shuffle(o));
    G.right = [a.w, a.k, a.s]; G.row = 0; G.pick = null; G.y = 0; G.pause = 0;
    G.dur = Math.max(6, 14 * Math.pow(0.96, G.ok));          // ilk sıraya ~5 sn
    w.className = "dw"; w.style.left = "50%"; w.querySelector("b").textContent = a.tr; w.querySelector("span").textContent = "";
    rows.forEach((r, i) => { r.className = "grow" + (i === 0 ? " on" : ""); r.querySelectorAll(".gate").forEach((g, c) => { g.textContent = G.opts[i][c]; g.className = "gate"; }); });
  };
  const pick = c => { if (G.pick !== null || G.pause) return; G.pick = c; w.style.left = (c ? 75 : 25) + "%"; G.opts[G.row][c] === G.right[G.row] ? pass() : fail(); };
  const fail = () => {
    G.pause = 1; G.combo = 0; hud();
    const g = rows[G.row].querySelectorAll(".gate");
    if (G.pick !== null) g[G.pick].classList.add("bad");
    g[G.opts[G.row].indexOf(G.right[G.row])].classList.add("good");
    w.classList.add("no");
    const a = G.a, f3 = G.right.map((x, i) => i === G.row ? `<u>${esc(x)}</u>` : esc(x)).join(" → ");
    db.innerHTML = `<div class="big">${f3}</div><div class="mid">${esc(a.tr)}</div><div class="ex">${esc(a.exd)}<br><span class="muted">${esc(a.ext)}</span></div><button class="cta" id="dn">Devam</button>`;
    db.hidden = false; speak(a.w + ", " + a.k + ", " + a.s + ". " + a.exd);
    $("#dn").onclick = () => { db.hidden = true; stopSpeak(); next(); };
  };
  const pass = () => {
    const r = rows[G.row]; r.querySelectorAll(".gate")[G.pick].classList.add("good"); r.classList.remove("on"); r.classList.add("done");
    w.querySelector("span").textContent = G.a.tr; w.querySelector("b").textContent = G.right[G.row];
    G.row++; G.pick = null;
    if (G.row < 3) { rows[G.row].classList.add("on"); return; }
    G.ok++; G.combo++; G.sc += G.combo >= 4 ? 2 : 1; hud();
    G.pause = 1; w.classList.add("ok"); later(() => w.classList.add("pop"), 150); speak(G.right.join(", "));
    later(() => G.left > 0 && next(), 450);
  };
  rows.forEach((r, i) => r.querySelectorAll(".gate").forEach((g, c) => g.onclick = () => i === G.row && pick(c)));
  dropKeys(key => { const c = {ArrowLeft:0, ArrowRight:1}[key]; if (c === undefined) return false; pick(c); return true; });
  hud(); next();
  let sec = 0;
  dropLoop(dt => {
    sec += dt; if (sec >= 1) { sec -= 1; G.left--; const t = $("#gt"); t.textContent = G.left; t.classList.toggle("low", G.left <= 10); if (G.left <= 0) return dropEnd("cmpdrop", "Karşılaştırma Düşüşü", G.sc); }
    const H = f.clientHeight, ty = ROWS[G.row] * H - w.offsetHeight - 6;
    G.y += dt * H / G.dur;
    if (G.y >= ty) { G.y = ty; fail(); }                          // seçmeden sıraya değdi
    w.style.transform = `translate(-50%, ${G.y}px)`;
  });
}

const N_ONES = ["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
const N_TENS = ["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
function numDE(n){
  if (n < 20) return N_ONES[n];
  if (n < 100) { const o = n % 10, t = N_TENS[n / 10 | 0]; return o ? (o === 1 ? "ein" : N_ONES[o]) + "und" + t : t; }
  if (n < 1000) { const h = n / 100 | 0, r = n % 100; return (h === 1 ? "ein" : N_ONES[h]) + "hundert" + (r ? numDE(r) : ""); }
  return "eintausend";
}
const rnd = (a, b) => a + (Math.random() * (b - a + 1) | 0);
// yakın ama yanlış sayılar: bir eksik/fazla, onluk kayması, rakam takası (einundzwanzig ↔ 12 hatası)
function nearNums(n, k, max){
  const sw = n >= 10 && n < 100 ? (n % 10) * 10 + (n / 10 | 0) : -1;
  const c = uniq([sw, n + 1, n - 1, n + 10, n - 10, n + 2, n - 20, n + 100, n - 100].filter(x => x >= 0 && x <= (max || 1000) && x !== n));
  return shuffle(c.slice(0, 4)).slice(0, k);
}
const priceDE = c => { const e = c / 100 | 0, ct = c % 100; return (e === 1 ? "ein" : numDE(e)) + " Euro" + (ct ? " " + numDE(ct) : ""); };
const priceNum = c => (c / 100).toFixed(2).replace(".", ",") + " €";

function quiz(id, title, pool, make, o){
  o = o || {}; const max = o.lives || 0;
  G = {i:0, sc:0, life:max};
  const end = () => gameOver(id, title, G.sc);
  const draw = () => {
    if ((o.n && G.i >= o.n) || (max && G.life <= 0) || !pool.length) return end();
    const it = pool[G.i % pool.length], q = make(it), short = q.opts.every(x => x.length <= 16);
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${o.n ? (G.i + 1) + "/" + o.n : ""}</span><span>${max ? hearts(G.life, max) : ""}</span></div>
      <div class="card flash" style="min-height:140px">${q.top}</div>
      <div id="vd"></div>
      <div class="${short ? "opts2" : "opts"}" ${short && q.opts.length === 3 ? 'style="grid-template-columns:repeat(3,1fr)"' : ""}>${q.opts.map((x, i) => `<button class="opt" data-i="${i}" style="min-height:58px">${esc(x)}</button>`).join("")}</div>
      <div id="vdn"></div>`;
    let lock = 0;
    const answer = i => {
      if (lock++) return;
      const ok = q.opts[i] === q.right, bs = $$(".opt");
      bs[i].classList.add(ok ? "good" : "bad"); if (!ok) bs[q.opts.indexOf(q.right)].classList.add("good");
      if (ok) G.sc++; else if (max) G.life--;
      if (q.say !== "") speak(q.say || q.right);
      G.i++;
      if (!ok || q.note) {
        if (q.note || q.full) $("#vd").innerHTML = `<div class="tip" style="margin-top:0">${q.note || ""}${!ok && q.full ? `<div style="margin-top:4px"><b>${esc(q.full)}</b></div>` : ""}</div>`;
        if (!ok) $("#vdn").innerHTML = '<button class="cta" id="gn" style="margin-top:12px">Devam</button>';
        if (ok) later(draw, 1700); else $("#gn").onclick = draw;
      } else later(draw, 650);
    };
    $$(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  };
  open(() => setTop(title, true));
  draw();
}

/* ---------- Almanca Matematik ---------- */
const MATH_KEYS = ["null","eins","ein","zwei","drei","vier","fünf","sechs","sech","sieben","sieb","acht","neun","zehn","elf","zwölf","und","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig","hundert"];
function gMath(){
  G = {sc:0, b:[]};
  const OPS = [["plus", (a, b) => a + b], ["minus", (a, b) => a - b], ["mal", (a, b) => a * b], ["geteilt durch", (a, b) => a / b]];
  const next = () => {
    const [name, fn] = pick(OPS); let a = rnd(1, 10), b = rnd(1, 10);
    if (name === "minus" && b > a) [a, b] = [b, a];
    if (name === "geteilt durch") a = a * b;
    G.r = fn(a, b); G.b = [];
    G.ok = G.r === 100 ? ["einhundert", "hundert"] : [numDE(G.r)];
    $("#mq").textContent = numDE(a) + " " + name + " " + numDE(b); $("#mn").textContent = a + " " + {plus:"+", minus:"−", mal:"×", "geteilt durch":"÷"}[name] + " " + b + " = ?";
    show();
  };
  const show = () => { $("#mb").textContent = G.b.join("") || "…"; $("#mb").style.color = ""; };
  const done = ok => {
    G.lock = 1; $("#mb").style.color = ok ? "var(--ok)" : "var(--bad)";
    if (ok) G.sc++; else $("#mb").textContent = G.ok[0];
    $("#ms").textContent = G.sc; speak(G.ok[0]);
    later(() => { G.lock = 0; if (G.left > 0) next(); }, ok ? 500 : 1600);
  };
  open(() => setTop("Almanca Matematik", true));
  $("#view").innerHTML = `<div class="hud"><b id="ms">0</b><span class="t" id="gt">60</span></div>
    <div class="card flash" style="min-height:140px;gap:8px"><div class="big" id="mq" style="font-size:23px"></div><div class="mid" id="mn"></div>
      <div class="big" id="mb" style="font-size:22px;color:var(--acc);word-break:break-word">…</div></div>
    <div class="pool" style="gap:6px">${MATH_KEYS.map(k => `<button class="wd" data-k="${k}" style="padding:8px 10px;font-size:15px">${k}</button>`).join("")}</div>
    <div class="row2" style="margin-top:12px"><button class="btn2" id="mdel">⌫ Sil</button><button class="btn2" id="mok">✓ Kontrol</button></div>`;
  $$(".wd[data-k]").forEach(b => b.onclick = () => {
    if (G.lock) return; G.b.push(b.dataset.k); show();
    if (G.ok.includes(G.b.join(""))) done(true);
  });
  $("#mdel").onclick = () => { if (!G.lock) { G.b.pop(); show(); } };
  $("#mok").onclick = () => { if (!G.lock && G.b.length) done(G.ok.includes(G.b.join(""))); };
  gameTimer(60, () => gameOver("math", "Almanca Matematik", G.sc));
  next();
}

/* ---------- Café Berlin ---------- */
// ad|artikel|fiyat (sent)|emoji|çoğul (2+ için; içecekler "zweimal")
const CAFE_MENU = `
Kaffee|der|250|☕|
Tee|der|220|🍵|
Kakao|der|280|🍫|
Cola|die|260|🥤|
Wasser|das|190|💧|
Saft|der|240|🧃|
Brezel|die|150|🥨|Brezeln
Croissant|das|210|🥐|Croissants
Brötchen|das|80|🥯|Brötchen
Kuchen|der|340|🍰|Stück Kuchen
Muffin|der|230|🧁|Muffins
Sandwich|das|450|🥪|Sandwiches`.trim().split("\n").map(l => { const [n, a, p, e, pl] = l.split("|"); return {n, a, p:+p, e, pl}; });
const ACC = {der:"einen", die:"eine", das:"ein"}, KEIN = {der:"keinen", die:"keine", das:"kein"};
const cafePhrase = (m, q) => q === 1 ? ACC[m.a] + " " + m.n : m.pl ? numDE(q) + " " + m.pl : numDE(q) + "mal " + m.n;
const listDE = a => a.length === 1 ? a[0] : a.slice(0, -1).join(", ") + " und " + a.at(-1);
function cafeOrder(k){
  const items = shuffle(CAFE_MENU).slice(0, rnd(1, k < 2 ? 2 : 3)).map(m => ({m, q: Math.random() < .3 ? 2 : 1}));
  const L = listDE(items.map(x => cafePhrase(x.m, x.q)));
  let txt = pick(["Ich hätte gern " + L + ".", "Ich nehme " + L + ".", "Für mich bitte " + L + ".", "Ich möchte " + L + ".", L.charAt(0).toUpperCase() + L.slice(1) + ", bitte."]);
  if (k >= 2 && Math.random() < .45) {
    const extra = CAFE_MENU.filter(m => !items.some(x => x.m === m));
    if (items.length > 1 && Math.random() < .5) {
      const x = items.find(i => i.q === 1);
      if (x) { txt += " Ach nein, doch " + KEIN[x.m.a] + " " + x.m.n + "."; items.splice(items.indexOf(x), 1); }
    } else { const m = pick(extra); txt += " Ach, und noch " + ACC[m.a] + " " + m.n + ", bitte."; items.push({m, q:1}); }
  }
  return {txt, items, total: items.reduce((s, x) => s + x.m.p * x.q, 0)};
}
function gCafe(){

/* ---------- Perfekt'e Çevir ---------- */
const HABEN = ["habe", "hast", "hat", "haben", "habt", "haben"], SEIN = ["bin", "bist", "ist", "sind", "seid", "sind"];
const PRON = ["Ich", "Du", "Er", "Wir", "Ihr", "Sie"];
function gPerf(){
  const pool = wordPool("v").filter(v => !/^(können|müssen|wollen|sollen|dürfen|mögen|möchten)$/.test(v.w) && v.pf);
  G = {sc:0, combo:0};
  const draw = () => {
    const v = pick(pool), p = rnd(0, 5), sein = /^ist /.test(v.pf), part = v.pf.split(" ").slice(1).join(" ");
    const aux = (sein ? SEIN : HABEN)[p], other = (sein ? HABEN : SEIN)[p];
    const stem = v.w.replace(/e?n$/, "");
    const wrongP = uniq(shuffle(["ge" + stem + "t", "ge" + v.w, part.replace(/t$/, "en"), part.replace(/en$/, "t")]).filter(x => x !== part)).slice(0, 2);
    const pres = PRON[p] + " " + v.pr[p] + ".", perf = PRON[p] + " " + aux + " " + part + ".";
    let step = 0;
    const show = () => {
      const opts = step === 0 ? shuffle([aux, other]) : shuffle([part].concat(wrongP));
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""}</span><span class="t" id="gt">${G.left}</span></div>
        <div class="card flash" style="min-height:170px"><div class="mid">${esc(v.w)} · ${esc(v.tr)}</div><div class="big" style="font-size:23px">${esc(pres)}</div>
          <div class="big" style="font-size:21px;color:var(--acc)">${esc(PRON[p])} ${step ? esc(aux) : "___"} … ___.</div></div>
        <div id="vd"></div><p class="hint">${step ? "Partizip II hangisi?" : "Yardımcı fiil: haben mi sein mi?"}</p>
        <div class="opts2" ${opts.length === 3 ? 'style="grid-template-columns:repeat(3,1fr)"' : ""}>${opts.map(o => `<button class="opt" style="min-height:60px">${esc(o)}</button>`).join("")}</div>`;
      let lock = 0;
      $$(".opt").forEach(b => b.onclick = () => {
        if (lock++) return;
        const right = step ? part : aux, ok = b.textContent === right;
        b.classList.add(ok ? "good" : "bad"); if (!ok) $$(".opt").find(x => x.textContent === right).classList.add("good");
        if (!ok) { G.combo = 0; speak(perf); $("#vd").innerHTML = `<div class="tip"><b>${esc(perf)}</b></div>`; return later(() => G.left > 0 && draw(), 1700); }
        if (step === 0) { step = 1; return later(show, 250); }
        G.combo++; G.sc += G.combo >= 5 ? 2 : 1; speak(perf); later(() => G.left > 0 && draw(), 700);
      });
    };
    show();
  };
  open(() => setTop("Perfekt'e Çevir", true));
  gameTimer(60, () => gameOver("perf", "Perfekt'e Çevir", G.sc));
  draw();
}

/* ---------- Cümle Sırala ---------- */
function gOrder(){
  const pool = shuffle(gamePool().filter(i => { const n = words(i).length; return n >= 3 && n <= 10; })).slice(0, 10);
  if (!pool.length) return toast("Önce birkaç kart çalış");
  G = {i:0, sc:0};
  const draw = () => {
    const it = pool[G.i];
    if (!it) return gameOver("order", "Cümle Sırala", G.sc);
    const w = words(it), sh = shuffle(w.map((x, i) => ({x, i}))), built = []; let miss = 0;
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.i + 1}/${pool.length}</span></div>
      <div class="card flash" style="min-height:90px"><div class="big" style="font-size:20px">${esc(it.tr)}</div></div>
      <div class="built" id="built"></div>
      <div class="pool">${sh.map((p, k) => `<button class="wd" data-k="${k}">${esc(p.x)}</button>`).join("")}</div>
      <div style="margin-top:14px" class="row2"><button class="btn2" id="sk">Göster</button><button class="btn2" id="clr">Temizle</button></div>`;
    const redraw = () => {
      $("#built").innerHTML = built.map(k => `<span class="wd">${esc(sh[k].x)}</span>`).join("");
      $$(".pool .wd").forEach(b => b.classList.toggle("used", built.includes(+b.dataset.k)));
      if (built.length === w.length) {
        const ok = norm(built.map(k => sh[k].x).join(" ")) === norm(w.join(" "));
        $("#built").style.borderColor = ok ? "var(--ok)" : "var(--bad)";
        if (ok) { if (!miss) G.sc++; speak(plain(it)); G.i++; later(draw, 900); }
        else { miss++; later(() => { built.length = 0; $("#built").style.borderColor = ""; redraw(); }, 700); }
      }
    };
    $$(".pool .wd").forEach(b => b.onclick = () => { if (!built.includes(+b.dataset.k) && built.length < w.length) { built.push(+b.dataset.k); redraw(); } });
    $("#clr").onclick = () => { built.length = 0; redraw(); };
    $("#sk").onclick = () => { miss++; toast(plain(it)); speak(plain(it)); };
  };
  open(() => setTop("Cümle Sırala", true));
  draw();
}

/* ---------- 9 Kelime ---------- */
function gNine(){
  const pool = shuffle(WORDS().filter(w => /^[A-Za-zÄÖÜäöüß]{3,10}$/.test(w.w)).sort((a, b) => a.o - b.o).slice(0, 100)).slice(0, 9).sort((a, b) => a.w.length - b.w.length);
  G = {i:0, sc:0, res:[]};
  const round = () => {
    clearInterval(G.tm);
    const it = pool[G.i];
    if (!it) {
      best("nine", G.sc); setTop("9 Kelime", true);
      $("#view").innerHTML = `<div class="card flash" style="margin-top:14px;min-height:0"><div class="big">${G.sc}/9 kelime</div></div>
        <div class="card plist" style="margin-top:12px">${G.res.map(r => `<div class="pi"><span class="dot ${r.ok ? "s2" : ""}"></span><div><div class="de">${esc(r.it.de)}</div><div class="tr">${esc(r.it.tr)}</div></div></div>`).join("")}</div>
        <div class="foot"><button class="cta" id="nx">Tekrar oyna</button><button class="linkbtn" id="gb">Oyunlara dön</button></div>`;
      $("#nx").onclick = () => gNine(); $("#gb").onclick = () => go("games"); return;
    }
    const W = it.w.toUpperCase(); let L = shuffle(W.split("").map((c, i) => ({c, i}))), built = [], shuf = 1;
    const fin = ok => { clearInterval(G.tm); G.res.push({it, ok}); if (ok) G.sc++; speak(it.de); G.i++; later(round, ok ? 600 : 1400); if (!ok) $("#nb").innerHTML = esc(W.split("").join(" ")); };
    const draw = () => {
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.i + 1}/9</span><span class="t" id="gt">${G.left}</span></div>
        <div class="card flash" style="min-height:120px"><div class="mid">${esc(it.tr)}</div><div class="big" id="nb" style="letter-spacing:.12em">${W.split("").map((c, i) => i < built.length ? L[built[i]].c : "_").join(" ")}</div></div>
        <div class="pool">${L.map((x, k) => `<button class="wd" data-k="${k}" style="min-width:44px;font-size:20px;${built.includes(k) ? "visibility:hidden" : ""}">${x.c}</button>`).join("")}</div>
        <div class="row2" style="margin-top:14px"><button class="btn2" id="nsh" ${shuf ? "" : "disabled style=\"opacity:.4\""}>🔀 Karıştır (${shuf})</button><button class="btn2" id="ndel">⌫ Sil</button></div>`;
      $$(".wd[data-k]").forEach(b => b.onclick = () => {
        built.push(+b.dataset.k); draw();
        if (built.length === L.length) { if (built.map(k => L[k].c).join("") === W) fin(true); else { toast("Olmadı"); built = []; later(draw, 400); } }
      });
      $("#nsh").onclick = () => { if (shuf) { shuf--; built = []; L = shuffle(L); draw(); } };
      $("#ndel").onclick = () => { built.pop(); draw(); };
    };
    G.left = 30; draw();
    G.tm = setInterval(() => { if (screen === null) return clearInterval(G.tm); G.left--; const t = $("#gt"); if (t) { t.textContent = G.left; t.classList.toggle("low", G.left <= 10); } if (G.left <= 0) fin(false); }, 1000);
    const tm = G.tm; onLeave = () => clearInterval(tm);
  };
  open(() => setTop("9 Kelime", true));
  round();
}

/* ---------- Almanca Wordle ---------- */
function gWordle(daily){
  const cand = WORDS().filter(w => /^[A-Za-zÄÖÜäöü]{5}$/.test(w.w)).sort((a, b) => a.id.localeCompare(b.id));
  if (!cand.length) return toast("Kelime yok");
  const it = daily === false ? pick(cand) : cand[dayNo() * 7 % cand.length], W = it.w.toUpperCase();
  const rows = [], KEYS = ["QWERTZUIOPÜ", "ASDFGHJKLÖÄ", "YXCVBNM"];
  let cur = "", over = 0;
  const score = g => { const r = Array(5).fill("x"), rest = W.split(""); g.split("").forEach((c, i) => { if (c === W[i]) { r[i] = "g"; rest[i] = null; } }); g.split("").forEach((c, i) => { if (r[i] !== "g") { const j = rest.indexOf(c); if (j >= 0) { r[i] = "y"; rest[j] = null; } } }); return r; };
  const COL = {g:"var(--ok)", y:"var(--acc)", x:"var(--bg4)"};
  const keyState = {};
  const draw = () => {
    const cell = (c, s) => `<div style="width:52px;height:52px;display:grid;place-items:center;border-radius:10px;font-weight:700;font-size:22px;${s ? `background:${COL[s]};color:${s === "x" ? "var(--tx)" : "#fff"}` : "border:2px solid var(--line)"}">${c || ""}</div>`;
    const grid = Array.from({length:6}, (_, r) => `<div style="display:flex;gap:6px;justify-content:center">${rows[r] ? rows[r].g.split("").map((c, i) => cell(c, rows[r].s[i])).join("") : Array.from({length:5}, (_, i) => cell(r === rows.length ? cur[i] : "")).join("")}</div>`).join("");
    $("#view").innerHTML = `<div class="hud"><span class="small muted">${esc(it.tr)}${it.art ? " · " + it.art : ""}?</span><span class="small muted">${rows.length}/6</span></div>
      <div style="display:flex;flex-direction:column;gap:6px;margin:auto 0">${grid}</div>
      <div id="wmsg" style="margin-bottom:10px"></div>
      ${KEYS.map((r, ri) => `<div style="display:flex;gap:4px;justify-content:center;margin-top:5px">${ri === 2 ? '<button class="wd" data-k="ENTER" style="padding:10px 8px;font-size:13px">OK</button>' : ""}${r.split("").map(k => `<button class="wd" data-k="${k}" style="flex:1;max-width:34px;padding:10px 0;font-size:15px;${keyState[k] ? `background:${COL[keyState[k]]};color:${keyState[k] === "x" ? "var(--tx3)" : "#fff"}` : ""}">${k}</button>`).join("")}${ri === 2 ? '<button class="wd" data-k="DEL" style="padding:10px 8px;font-size:13px">⌫</button>' : ""}</div>`).join("")}`;
    $$(".wd[data-k]").forEach(b => b.onclick = () => key(b.dataset.k));
    if (over) {
      $("#wmsg").innerHTML = `<div class="tip"><b>${esc(it.de)}</b> · ${esc(it.tr)}</div><div class="foot"><button class="cta" id="wn">Yeni kelime</button><button class="linkbtn" id="gb">Oyunlara dön</button></div>`;
      $("#wn").onclick = () => gWordle(false); $("#gb").onclick = () => go("games");
    }
  };
  const key = k => {
    if (over) return;
    if (k === "DEL") cur = cur.slice(0, -1);
    else if (k === "ENTER") {
      if (cur.length < 5) return toast("5 harf gerekli");
      const s = score(cur); rows.push({g:cur, s});
      cur.split("").forEach((c, i) => { const o = keyState[c]; if (o !== "g" && !(o === "y" && s[i] === "x")) keyState[c] = s[i]; });
      if (s.every(x => x === "g")) { over = 1; speak(it.de); best("wordle", rows.length, true); toast(rows.length + ". denemede buldun!"); }
      else if (rows.length >= 6) { over = 1; speak(it.de); mark("game"); }
      cur = "";
    } else if (cur.length < 5) cur += k;
    draw();
  };
  const h = e => { const k = e.key.toUpperCase(); if (k === "ENTER" || k === "BACKSPACE") key(k === "ENTER" ? "ENTER" : "DEL"); else if (/^[A-ZÄÖÜ]$/.test(k)) key(k); };
  open(() => setTop("Almanca Wordle", true));
  document.addEventListener("keydown", h); onLeave = () => document.removeEventListener("keydown", h);
  draw();
}

/* ---------- Eşleştirme Izgarası ---------- */
function gGrid(){
  G = {sc:0, sel:null};
  const board = () => {
    const its = wordPool().filter(w => w.w.length <= 14 && w.tr.length <= 16).slice(0, 8);
    G.cells = shuffle(its.flatMap(it => [{id:it.id, t:it.w, de:1}, {id:it.id, t:it.tr.split(",")[0]}])); G.done = 0; G.sel = null;
    draw();
  };
  const draw = () => {
    $("#view").innerHTML = `<div class="hud"><span><b>${G.sc}</b> <span class="small muted">çift</span></span><span class="small muted">${8 - G.done} kaldı</span><span class="t" id="gt">${G.left}</span></div>
      <p class="hint gpush" style="margin-bottom:10px"><span class="glg de"></span> Almanca &nbsp; <span class="glg"></span> Türkçe · ikisine dokun</p>
      <div class="ggrid">${G.cells.map((c, i) => `<button class="gt ${c.de ? "de" : ""} ${c.gone ? "gone" : ""} ${G.sel === i ? "sel" : ""}" data-i="${i}"><span>${esc(c.t)}</span></button>`).join("")}</div>`;
    $$(".ggrid .gt").forEach(b => b.onclick = () => {
      const i = +b.dataset.i, c = G.cells[i];
      if (c.gone || G.lock) return;
      if (G.sel === null || G.sel === i) { G.sel = G.sel === i ? null : i; if (c.de) speak(BYID[c.id].de); return draw(); }
      const a = G.cells[G.sel];
      if (a.id === c.id && a.de !== c.de) {
        const pb = $$(".ggrid .gt")[G.sel]; b.classList.add("hit"); pb.classList.add("hit"); G.lock = 1;
        a.gone = c.gone = 1; G.sel = null; G.sc++; G.done++;
        return later(() => { G.lock = 0; G.done === 8 ? board() : draw(); }, 280);
      }
      b.classList.add("bad"); $$(".ggrid .gt")[G.sel].classList.add("bad"); G.lock = 1; G.sel = null;
      later(() => { G.lock = 0; draw(); }, 450);
    });
  };
  open(() => setTop("Eşleştirme Izgarası", true));
  gameTimer(60, () => gameOver("grid", "Eşleştirme Izgarası", G.sc));
  board();
}

/* ---------- Doğru mu Yanlış mı? ---------- */
function gTF(){
  const pool = wordPool("n");
  G = {i:0, sc:0, combo:0};
  const draw = () => {
    const it = pool[G.i++ % pool.length], t = it.pl ? rnd(0, 2) : pick([0, 2]), truth = Math.random() < .5;
    let st, right;
    if (t === 0) { const a = truth ? it.art : pick(["der", "die", "das"].filter(x => x !== it.art)); st = a + " " + it.w; right = it.de; }
    else if (t === 1) { const w = it.w, wr = pick([w + "e", w + "en", w + "s", umlaut(w) + "e", w + "n", w + "er"].filter(x => x !== it.pl)); st = it.de + " → die " + (truth ? it.pl : wr); right = it.de + " → die " + it.pl; }
    else { const tr = truth ? it.tr : kindOther(it, 1, "tr")[0]; st = it.de + " = " + tr; right = it.de + " = " + it.tr; }
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""}</span><span class="t" id="gt">${G.left}</span></div>
      <div class="card flash" style="min-height:160px"><div class="mid">${["Artikel", "Çoğul", "Anlam"][t]}</div><div class="big" style="font-size:24px">${esc(st)}</div><div class="mid" id="tfr" style="visibility:hidden">${esc(right)}</div></div>
      <div class="tfbtn" style="margin-top:14px"><button class="y" data-v="1">✓ Doğru</button><button class="n" data-v="0">✗ Yanlış</button></div>`;
    let lock = 0;
    $$(".tfbtn button").forEach(b => b.onclick = () => {
      if (lock++) return;
      const ok = (b.dataset.v === "1") === truth;
      b.style.outline = "3px solid " + (ok ? "var(--ok)" : "var(--bad)");
      if (ok) { G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else { G.combo = 0; $("#tfr").style.visibility = "visible"; speak(it.de); }
      later(() => G.left > 0 && draw(), ok ? 350 : 1400);
    });
  };
  open(() => setTop("Doğru mu Yanlış mı?", true));
  gameTimer(60, () => gameOver("tf", "Doğru mu Yanlış mı?", G.sc));
  draw();
}

/* ---------- Harf Salatası ---------- */
function gSalad(){
  const pool = wordPool().filter(w => /^[A-Za-zÄÖÜäöüß]{3,9}$/.test(w.w));
  G = {i:0, sc:0};
  const draw = () => {
    const it = pool[G.i++ % pool.length], W = it.w.toUpperCase(), L = shuffle(W.split("")), built = [];
    const pos = L.map((_, k) => ({x: 8 + (k % 4) * 22 + rnd(-4, 4), y: 10 + (k / 4 | 0) * 30 + rnd(-5, 5), r: rnd(-25, 25)}));
    const show = () => {
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${esc(it.tr)}${it.art ? " · " + it.art : ""}</span><span class="t" id="gt">${G.left}</span></div>
        <div class="card flash" style="min-height:80px;padding:14px"><div class="big" style="letter-spacing:.12em">${W.split("").map((c, i) => i < built.length ? L[built[i]] : "_").join(" ")}</div></div>
        <div style="position:relative;height:${Math.ceil(L.length / 4) * 30 + 30}%;min-height:200px;margin-top:14px;border-radius:50% 50% 46% 46%/30% 30% 70% 70%;background:var(--acc-d);border:2px solid var(--line)">
          ${L.map((c, k) => `<button class="wd" data-k="${k}" style="position:absolute;left:${pos[k].x}%;top:${pos[k].y}%;transform:rotate(${pos[k].r}deg);width:46px;height:46px;padding:0;font-size:20px;${built.includes(k) ? "visibility:hidden" : ""}">${c}</button>`).join("")}</div>
        <div class="row2" style="margin-top:14px"><button class="btn2" id="sdel">⌫ Sil</button><button class="btn2" id="sskip">Geç</button></div>`;
      $$(".wd[data-k]").forEach(b => b.onclick = () => {
        built.push(+b.dataset.k); show();
        if (built.length === L.length) { if (built.map(k => L[k]).join("") === W) { G.sc++; speak(it.de); later(() => G.left > 0 && draw(), 500); } else { toast("Olmadı"); built.length = 0; later(show, 400); } }
      });
      $("#sdel").onclick = () => { built.pop(); show(); };
      $("#sskip").onclick = () => { toast(it.de); speak(it.de); draw(); };
    };
    show();
  };
  open(() => setTop("Harf Salatası", true));
  gameTimer(60, () => gameOver("salad", "Harf Salatası", G.sc));
  draw();
}

/* ---------- Kelime Eşle (iki sütun) ---------- */
function gMatch(){
  const all = wordPool().filter(w => w.tr.length <= 22).slice(0, 20);
  G = {r:0, t0:Date.now(), pen:0};
  const round = () => {
    const its = all.slice(G.r * 5, G.r * 5 + 5);
    if (its.length < 5 || G.r >= 4) return gameOver("match", "Kelime Eşle", Math.round((Date.now() - G.t0) / 1000) + G.pen);
    const L = shuffle(its), R = shuffle(its), gone = new Set(); let sel = null;
    const draw = () => {
      $("#view").innerHTML = `<div class="hud"><span class="small muted">Tur ${G.r + 1}/4</span><span class="small muted">${G.pen ? "+" + G.pen + " sn ceza" : ""}</span></div>
        <div class="gpush" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div style="display:flex;flex-direction:column;gap:8px">${L.map(w => `<button class="mc ${gone.has(w.id) ? "done" : ""} ${sel === w.id ? "sel" : ""}" data-l="${w.id}" style="min-height:62px">${esc(w.de)}</button>`).join("")}</div>
          <div style="display:flex;flex-direction:column;gap:8px">${R.map(w => `<button class="mc ${gone.has(w.id) ? "done" : ""}" data-r="${w.id}" style="min-height:62px;color:var(--tx2)">${esc(w.tr)}</button>`).join("")}</div></div>`;
      $$("[data-l]").forEach(b => b.onclick = () => { sel = b.dataset.l; speak(BYID[sel].de); draw(); });
      $$("[data-r]").forEach(b => b.onclick = () => {
        if (!sel) return toast("Önce soldan seç");
        if (b.dataset.r === sel) { gone.add(sel); sel = null; if (gone.size === 5) { G.r++; return later(round, 300); } draw(); }
        else { G.pen += 3; b.classList.add("bad"); later(() => b.classList.remove("bad"), 400); }
      });
    };
    draw();
  };
  open(() => setTop("Kelime Eşle", true));
  round();
}

/* ---------- Kelime Tahmini (fiil + sıfat adam asmaca) ---------- */
function gGuess(){
  const pool = shuffle(WORDS().filter(w => w.kind !== "n" && /^[A-Za-zÄÖÜäöüß]{3,11}$/.test(w.w)));
  G = {i:0, sc:0, lives:6};
  const KEYS = "QWERTZUIOPÜASDFGHJKLÖÄYXCVBNMß".split("");
  const round = () => {
    const it = pool[G.i % pool.length], W = it.w.toUpperCase().replace(/ẞ/g, "ß"), got = new Set(), miss = new Set();
    const draw = () => {
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span>${hearts(G.lives, 6)}</span></div>
        <div class="card flash" style="min-height:150px"><div class="mid">${esc(it.tr)} · ${it.kind === "v" ? "fiil" : "sıfat"}</div>
          <div class="big" style="letter-spacing:.12em;font-size:28px">${W.split("").map(c => got.has(c) ? c : "_").join(" ")}</div></div>
        <div class="pool" style="gap:6px">${KEYS.map(k => `<button class="wd" data-k="${k}" style="min-width:34px;padding:9px 8px;${got.has(k) ? "background:var(--ok-d)" : miss.has(k) ? "opacity:.3" : ""}" ${got.has(k) || miss.has(k) ? "disabled" : ""}>${k}</button>`).join("")}</div>`;
      $$(".pool .wd").forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        if (G.lives <= 0 || W.split("").every(c => got.has(c))) return;
        if (W.includes(k)) got.add(k); else { miss.add(k); G.lives--; }
        if (W.split("").every(c => got.has(c))) { G.sc++; speak(it.w); toast("✓ " + it.w); G.i++; later(round, 900); }
        else if (G.lives <= 0) { speak(it.w); toast(it.w); later(() => gameOver("guess", "Kelime Tahmini", G.sc), 1200); }
        draw();
      });
    };
    draw();
  };
  open(() => setTop("Kelime Tahmini", true));
  round();
}
