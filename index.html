<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0D12">
<title>Almanca Günlük</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanca">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0D12; --bg2:#17161D; --bg3:#201F28; --bg4:#2B2934;
  --line:#26242F; --tx:#F3F0F6; --tx2:#ABA5B5; --tx3:#7F7890;
  --acc:#FFC24B; --acc2:#FF9A3C; --acc-d:#33260F; --onacc:#1A1305;
  --ok:#48DB8E; --ok-d:#12301F; --bad:#FF6F63; --bad-d:#3A1B18; --blue:#6CBEF5; --blue-d:#132A3B;
  --grad:linear-gradient(135deg,#FFD473 0%,#FF9E3D 100%);
  --sh:0 1px 2px rgba(0,0,0,.35),0 12px 28px -20px rgba(0,0,0,.7);
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:dark;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F7F3EC; --bg2:#FFFFFF; --bg3:#F0EADF; --bg4:#E4DCCD;
  --line:#E6DFD1; --tx:#211C16; --tx2:#5F574B; --tx3:#857B6E;
  --acc:#9A5F06; --acc2:#C4761A; --acc-d:#F8EDD6; --onacc:#2C1E06;
  --ok:#1E8A58; --ok-d:#DBF2E5; --bad:#C33027; --bad-d:#FAE2DF; --blue:#1A6FB4; --blue-d:#DCEBF8;
  --sh:0 1px 2px rgba(60,40,10,.06),0 12px 28px -22px rgba(60,40,10,.35);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#F7F3EC; --bg2:#FFFFFF; --bg3:#F0EADF; --bg4:#E4DCCD;
    --line:#E6DFD1; --tx:#211C16; --tx2:#5F574B; --tx3:#857B6E;
    --acc:#9A5F06; --acc2:#C4761A; --acc-d:#F8EDD6; --onacc:#2C1E06;
    --ok:#1E8A58; --ok-d:#DBF2E5; --bad:#C33027; --bad-d:#FAE2DF; --blue:#1A6FB4; --blue-d:#DCEBF8;
    --sh:0 1px 2px rgba(60,40,10,.06),0 12px 28px -22px rgba(60,40,10,.35);
  }
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
textarea,input{font:inherit;color:var(--tx)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* üst bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px;padding-top:env(safe-area-inset-top)}
.top h1{font-size:20px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tx2)}
.ib:active{background:var(--bg3)}
.ib svg{width:22px;height:22px}
.streak{display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;color:var(--tx3);padding:0 6px}
.streak.on{color:var(--acc2)}

/* alt menü */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:64px;padding:0 6px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--tx3)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--acc)}
body.full .nav{display:none}
body.full{padding-bottom:env(safe-area-inset-bottom)}

/* genel */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin:26px 2px 10px}
.muted{color:var(--tx2)}
.small{font-size:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:15px;background:var(--grad);color:var(--onacc);font-weight:700;font-size:17px;box-shadow:0 12px 30px -10px rgba(255,160,60,.45)}
.cta:active{transform:scale(.985)}
.cta[disabled]{opacity:.45;box-shadow:none}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;background:var(--bg3);font-weight:600;color:var(--tx)}
.btn2:active{background:var(--bg4)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--bg3);border-radius:12px;padding:4px;gap:4px;margin:4px 0 6px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--tx2)}
.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:var(--sh)}
.empty{text-align:center;color:var(--tx2);padding:28px 18px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* Bugün */
.hello{margin:6px 2px 16px}
.hello .d{color:var(--tx3);font-size:14px;font-weight:600}
.hello .t{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.ring{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px}
.ring .bar{flex:1;height:10px;border-radius:6px;background:var(--bg3);overflow:hidden}
.ring .bar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .4s}
.ring b{font-size:15px;white-space:nowrap}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.step{display:flex;align-items:center;gap:14px;padding:14px 14px;text-align:left;width:100%}
.step .ic{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--bg3);font-size:21px}
.step .tx{flex:1;min-width:0}
.step .tx b{display:block;font-size:16px}
.step .tx span{display:block;font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--bg4);display:grid;place-items:center}
.step.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done .tx b{color:var(--tx2)}
.step.next{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,var(--sh)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--acc-d);color:var(--acc);margin-left:6px;vertical-align:2px}

/* kalıp listesi */
.plist{display:flex;flex-direction:column}
.pi{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.pi:last-child{border-bottom:0}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--bg4)}
.dot.s1{background:var(--acc)}.dot.s2{background:var(--ok)}
.pi .de{font-weight:600;font-size:16px}
.pi .tr{color:var(--tx2);font-size:14px}
.pi .ex{display:none;margin-top:6px;font-size:14px;color:var(--tx2);font-style:italic}
.pi.open .ex{display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--tx2);margin:8px 2px 0}
.legend span{display:flex;align-items:center;gap:6px}.legend .dot{margin:0}

/* alıştırma */
.ptop{display:flex;align-items:center;gap:10px;padding:10px 0}
.pbar{flex:1;height:8px;border-radius:5px;background:var(--bg3);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad);transition:width .3s}
.phase{font-size:13px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin:10px 0 14px}
.flash{padding:28px 20px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.flash .big{font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.flash .mid{font-size:18px;color:var(--tx2)}
.flash .ex{font-size:15px;color:var(--tx2);font-style:italic;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.say{display:inline-flex;align-items:center;gap:6px;align-self:center;padding:8px 14px;border-radius:20px;background:var(--bg3);font-weight:600;font-size:14px;color:var(--tx2)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{padding:15px 16px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--line);text-align:left;font-weight:600;font-size:16px}
.opt.good{border-color:var(--ok);background:var(--ok-d)}
.opt.bad{border-color:var(--bad);background:var(--bad-d)}
.mic{width:84px;height:84px;border-radius:50%;background:var(--grad);color:var(--onacc);display:grid;place-items:center;margin:18px auto 8px;box-shadow:0 12px 30px -10px rgba(255,160,60,.5)}
.mic svg{width:34px;height:34px}
.mic.rec{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.typed{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);padding:12px 14px;font-size:17px;margin-top:12px}
.verdict{margin-top:14px;padding:14px;border-radius:14px;font-size:15px}
.verdict.good{background:var(--ok-d);color:var(--ok)}
.verdict.bad{background:var(--bad-d);color:var(--bad)}
.verdict b{display:block;color:var(--tx);margin-top:4px;font-size:16px}
.foot{position:sticky;bottom:0;padding:12px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);margin-top:16px}

/* diyalog okuyucu */
.chap{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.chap:last-child{border-bottom:0}
.chap .no{flex:none;width:34px;height:34px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--tx2)}
.chap.read .no{background:var(--ok-d);color:var(--ok)}
.chap .tx{flex:1;min-width:0}
.chap .tx b{display:block;font-weight:600}
.chap .tx span{font-size:13.5px;color:var(--tx2)}
.chap .cnt{font-size:12px;color:var(--tx3);font-weight:600}
.hero{padding:18px;margin-bottom:6px}
.hero .k{font-size:13px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.hero .h{font-size:21px;font-weight:700;margin:4px 0 2px}
.hero .s{color:var(--tx2);font-size:14px;margin-bottom:14px}
.desc{padding:14px 16px;font-size:15px;color:var(--tx2);margin-bottom:10px}
.msgs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;background:var(--bg2);border:1px solid var(--line);align-self:flex-start;text-align:left;position:relative}
.msg.me{align-self:flex-end;background:var(--acc-d);border-color:transparent}
.msg .who{font-size:12px;font-weight:700;color:var(--tx3);margin-bottom:2px}
.msg .de{font-size:16.5px}
.msg .tr{display:none;font-size:14px;color:var(--tx2);margin-top:4px}
.msg.showtr .tr{display:block}
.msg.hide .de{filter:blur(7px);user-select:none}
.msg.hide .tr{display:block;color:var(--tx)}
.msg.cur{outline:2px solid var(--acc);outline-offset:2px}
.msg.wait{outline:2px dashed var(--acc);outline-offset:2px}
.hint{font-size:13px;color:var(--tx3);text-align:center;margin:10px 0 0}
.klist{padding:6px 0}
.klist div{display:flex;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:15px}
.klist div:last-child{border-bottom:0}
.klist b{font-weight:600}
.klist span{color:var(--tx2)}
.tip{padding:14px 16px;font-size:14.5px;background:var(--blue-d);color:var(--tx);border-radius:14px;margin-top:12px}
.tip b{color:var(--blue)}

/* yazı */
.prompt{padding:18px}
.prompt .k{font-size:13px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.prompt .h{font-size:20px;font-weight:700;margin:6px 0}
.prompt .st{font-size:15px;color:var(--tx2);font-style:italic}
textarea.write{width:100%;min-height:220px;margin-top:12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--bg2);padding:14px 16px;font-size:17px;line-height:1.55;resize:vertical}
textarea.write:focus,.typed:focus{outline:none;border-color:var(--acc)}
.wc{display:flex;justify-content:space-between;font-size:13px;color:var(--tx3);margin:8px 2px 12px}
.mist{padding:14px 16px;border-bottom:1px solid var(--line)}
.mist:last-child{border-bottom:0}
.mist .w{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.mist .r{color:var(--ok);font-weight:600;margin-top:2px}
.mist .rule{font-size:14px;color:var(--tx2);margin-top:4px}
.wr{padding:14px 16px;border-bottom:1px solid var(--line)}
.wr:last-child{border-bottom:0}
.wr .dt{font-size:13px;color:var(--tx3);font-weight:600}
.wr .nat{margin-top:6px;font-size:15.5px}
.wr details{margin-top:6px;font-size:14px;color:var(--tx2)}

/* ayarlar */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .in{background:var(--bg2);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto}
.sheet h2{font-size:19px;margin:4px 2px 12px}
.sheet .lbl{font-size:14px;font-weight:600;color:var(--tx2);margin:14px 2px 4px}
.sheet .row2{margin-top:8px}

/* Claude: düzeltme ve sohbet */
.ai{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
.fixbox{margin-top:14px;padding:16px}
.fixbox .nat{font-size:17px;line-height:1.55}
.fixbox .note{font-size:14.5px;color:var(--tx2);margin-top:10px}
.linkbtn{display:block;margin:10px auto 0;font-size:14px;font-weight:600;color:var(--tx2);text-decoration:underline;text-underline-offset:3px}
.thinking{color:var(--tx3);font-style:italic}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chat .fix{align-self:flex-end;max-width:86%;font-size:13.5px;color:var(--ok);background:var(--ok-d);padding:6px 12px;border-radius:12px}
.chatin{display:flex;gap:8px;align-items:flex-end}
.chatin textarea{flex:1;min-width:0;min-height:50px;max-height:140px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);padding:12px 14px;font-size:16px;resize:none}
.chatin textarea:focus{outline:none;border-color:var(--acc)}
.chatin .cta{width:auto;min-width:64px;min-height:50px;padding:0 16px;font-size:16px}

/* seçim çipleri ve mod ızgarası */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:19px;background:var(--bg3);font-weight:600;font-size:14px;color:var(--tx2);border:1.5px solid transparent}
.chip.on{background:var(--acc-d);color:var(--acc);border-color:var(--acc)}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.grp{font-size:12.5px;font-weight:700;color:var(--tx3);margin:14px 2px 8px;letter-spacing:.03em}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:74px;padding:8px 4px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--tx2);text-align:center}
.mode i{font-style:normal;font-size:22px}
.mode.on{border-color:var(--acc);color:var(--tx);background:var(--acc-d)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:15px 14px;text-align:left;min-height:104px}
.tile .ic{font-size:24px}
.tile b{font-size:15.5px}
.tile span{font-size:13px;color:var(--tx2);line-height:1.35}
.tile .best{margin-top:auto;font-size:12px;font-weight:700;color:var(--acc)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0}
.tile.wide .tx{flex:1}
.tile.wide .tx b,.tile.wide .tx span{display:block}

/* kelime kutucukları (sırala) */
.built{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:12px;border-radius:14px;border:1.5px dashed var(--bg4);margin-top:14px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.wd{padding:10px 13px;border-radius:11px;background:var(--bg2);border:1.5px solid var(--line);font-weight:600;font-size:16px;box-shadow:var(--sh)}
.wd.used{visibility:hidden}
.built .wd{background:var(--acc-d);border-color:transparent;box-shadow:none}
.gapw{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--acc);color:var(--acc)}
.tfbtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfbtn button{min-height:60px;border-radius:15px;font-weight:700;font-size:17px}
.tfbtn .y{background:var(--ok-d);color:var(--ok)}
.tfbtn .n{background:var(--bad-d);color:var(--bad)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.mc{min-height:66px;padding:10px;border-radius:13px;background:var(--bg2);border:1.5px solid var(--line);font-weight:600;font-size:14.5px;line-height:1.3}
.mc.sel{border-color:var(--acc);background:var(--acc-d)}
.mc.done{opacity:.25;pointer-events:none}
.mc.bad{border-color:var(--bad);background:var(--bad-d)}
.mc.back{background:var(--bg3);color:transparent}

/* oyun üst bilgisi */
.hud{display:flex;justify-content:space-between;align-items:center;margin:12px 2px}
.hud b{font-size:22px}
.hud .t{font-size:22px;font-weight:700;color:var(--acc)}
.hud .t.low{color:var(--bad)}

/* oynatıcı */
.player{padding:26px 20px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.player .de{font-size:25px;font-weight:700;line-height:1.3}
.player .tr{font-size:17px;color:var(--tx2)}
.player .who{font-size:12.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.ctrl{display:flex;justify-content:center;align-items:center;gap:22px;margin:20px 0 6px}
.ctrl button{width:56px;height:56px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-size:20px}
.ctrl .pp{width:76px;height:76px;background:var(--grad);color:var(--onacc);font-size:28px;box-shadow:0 12px 30px -10px rgba(255,160,60,.5)}
.phase2{font-size:13px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opts2 .opt{text-align:center;font-size:15px}
textarea.imp{width:100%;min-height:90px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg3);padding:10px;font-size:13px}
</style>
</head>
<body>
<header class="top"><div class="wrap">

<script src="data.js"></script>
<script>
"use strict";
const D = window.DATA || {phrases:[],book:{chapters:[],roles:{}},scenarios:[],prompts:[],writings:[],mistakes:[]};
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Claude içinde mi açıldı? (orada mikrofon yok, ama Claude düzeltme ve hesap kaydı var)
const IN_CLAUDE = !!(window.claude && window.claude.use);

/* ---------- tarih ---------- */
const pad = n => String(n).padStart(2, "0");
function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
const TODAY = ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const trDate = s => { const [y,m,d] = s.split("-").map(Number); return d + " " + AYLAR[m-1]; };
const dayNo = () => Math.max(0, Math.round((new Date(TODAY) - new Date(D.start || TODAY)) / 864e5));
function dayRec(){ return S.days[TODAY] = S.days[TODAY] || {}; }
function mark(step){ dayRec()[step] = 1; save(); }
function streak(){
  let n = 0, d = new Date();
  if (!Object.keys(S.days[ymd(d)] || {}).length) d.setDate(d.getDate()-1);
  while (Object.keys(S.days[ymd(d)] || {}).length) { n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- kayıt ---------- */
const KEY = "almanca-gunluk-v1";
let DB = null, SAMPLE = null, syncT = null;
let S = load();
function load(from){
  let s = from || null;
  if (!s) try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  s = s || {};
  s.prog = s.prog || {}; s.days = s.days || {}; s.book = s.book || {}; s.scen = s.scen || {};
  s.drafts = s.drafts || {}; s.games = s.games || {};
  s.opt = Object.assign({theme:"auto", rate:0.9, pace:10, n:10}, s.opt || {});
  // eski kayıt: puan (s) → kutu (b) ve tekrar tarihi
  Object.values(s.prog).forEach(r => { if (r.b === undefined) { r.b = r.s >= 4 ? 4 : r.s ? 1 : 0; r.due = r.due || ymd(new Date()); } });
  return s;
}
function save(){
  S.ts = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  if (DB) { clearTimeout(syncT); syncT = setTimeout(() => DB.doc("state/progress").set({json: JSON.stringify(S)}).catch(() => {}), 800); }
}
// Claude'un düzelttiği yazılar (hesapta) + data.js'tekiler
let WRITINGS = [];
const allWritings = () => D.writings.concat(WRITINGS).sort((a, b) => (a.date + (a.at || "")).localeCompare(b.date + (b.at || "")));
const allMistakes = () => D.mistakes.concat(...WRITINGS.map(w => (w.mistakes || []).map(m => Object.assign({date: w.date}, m))));

/* ---------- kartlar: tüm çalışılabilir cümleler tek havuzda ---------- */
// src: ph günlük kalıp · bk kitap kalıbı · bl kitap cümlesi · sc senaryo cümlesi
const SRC = {
  ph: {t:"Günlük kalıplar", ic:"💬"},
  bk: {t:"Kitap kalıpları", ic:"🔑"},
  bl: {t:"Kitap cümleleri", ic:"📖"},
  sc: {t:"Senaryo cümleleri", ic:"🎭"},
};
let ITEMS = [], BYID = {};
function buildItems(){
  ITEMS = []; BYID = {};
  const add = it => { if (!BYID[it.id]) { ITEMS.push(it); BYID[it.id] = it; } };
  D.phrases.forEach(p => add({id:p.id, src:"ph", de:p.de, tr:p.tr, ex:p.ex, d:p.d, cat:p.cat}));
  D.book.chapters.forEach(c => {
    (c.k || []).forEach((k, j) => add({id:`k${c.n}.${j}`, src:"bk", de:k[0], tr:k[1], ch:c.n}));
    c.lines.forEach((l, j) => add({id:`b${c.n}.${j}`, src:"bl", de:l[1], tr:l[2], ch:c.n, sp:l[0]}));
  });
  D.scenarios.forEach(s => {
    s.lines.forEach((l, j) => { if (l[0] === "U") add({id:`${s.id}.${j}`, src:"sc", de:l[1], tr:l[2], sc:s.id}); });
    (s.k || []).forEach((k, j) => add({id:`${s.id}k${j}`, src:"sc", de:k[0], tr:k[1], sc:s.id}));
  });
}
buildItems();

/* ---------- aralıklı tekrar: kutu 0-8, doğru → bir üst kutu ---------- */
const IV = [0, 1, 2, 4, 8, 16, 35, 75, 160];
const lvl = it => { const r = S.prog[it.id]; return !r ? 0 : r.b >= 4 ? 2 : 1; };
const LVL_TXT = ["Yeni", "Öğreniyorum", "Oturdu"];
const isDue = it => { const r = S.prog[it.id]; return r && r.due <= TODAY; };
function seen(it){ if (!S.prog[it.id]) { S.prog[it.id] = {b:0, due:TODAY}; dayRec().newSeen = (dayRec().newSeen || 0) + 1; } }
function grade(it, ok){
  const r = S.prog[it.id] = S.prog[it.id] || {b:0, due:TODAY};
  if (ok) { r.b = Math.min(8, r.b + 1); r.due = addDays(IV[r.b]); }
  else { r.b = Math.max(1, Math.floor(r.b / 2)); r.due = addDays(r.b > 2 ? 1 : 0); }
  r.last = TODAY; r.n = (r.n || 0) + 1; if (!ok) r.x = (r.x || 0) + 1;
}

function todaysPhrases(){
  const ps = ITEMS.filter(i => i.src === "ph");
  const t = ps.filter(p => p.d === TODAY);
  if (t.length) return t;
  // bugün için kalıp gelmediyse: tarihi geçmiş ve henüz başlanmamış olanlar
  return ps.filter(p => p.d <= TODAY && !S.prog[p.id]).slice(0, 10);
}
// okunan kitap bölümleri (yoksa ilk bölüm): kitap alıştırmaları buradan
const readChapters = () => { const r = Object.keys(S.book.read || {}).map(Number); return r.length ? r : [1]; };
function poolFor(src){
  if (src === "ph") return ITEMS.filter(i => i.src === "ph" && i.d <= TODAY);
  if (src === "bk" || src === "bl") { const rc = readChapters(); return ITEMS.filter(i => i.src === src && rc.includes(i.ch)); }
  if (src === "sc") { const done = Object.keys(S.scen.done || {}); const sc = done.length ? done : [todaysScenario() && todaysScenario().id]; return ITEMS.filter(i => i.src === "sc" && sc.includes(i.sc)); }
  if (src === "due") return dueItems();
  return [];
}
const dueItems = () => ITEMS.filter(isDue).sort((a, b) => S.prog[a.id].due.localeCompare(S.prog[b.id].due) || S.prog[a.id].b - S.prog[b.id].b);
// günün destesi: vadesi gelenler + yeni kartlar (önce günün kalıpları, sonra okunan bölümün kalıpları)
function newItems(){
  const out = todaysPhrases().filter(p => !S.prog[p.id]);
  const rc = readChapters();
  const extra = ITEMS.filter(i => i.src === "bk" && rc.includes(i.ch) && !S.prog[i.id]);
  const room = Math.max(0, S.opt.pace - (dayRec().newSeen || 0));
  return out.concat(extra.slice(0, Math.max(0, room - out.length)));
}
function deck(){ return {due: dueItems().slice(0, 40), fresh: newItems()}; }

/* ---------- ses ---------- */
let VOICES = [], TRV = null;
function loadVoices(){
  if (!("speechSynthesis" in window)) return;
  const all = speechSynthesis.getVoices();
  VOICES = all.filter(v => /^de(-|_|$)/i.test(v.lang));
  TRV = all.find(v => /^tr(-|_|$)/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const cleanSpeech = t => String(t).replace(/…/g, "").replace(/ \/ /g, ". ").replace(/[\u{1F300}-\u{1FAFF}]/gu, "");
function speak(text, who, onend, opt){
  opt = opt || {};
  if (!("speechSynthesis" in window)) { if (onend) setTimeout(onend, 600); return; }
  if (!opt.queue) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(cleanSpeech(text));
  u.rate = opt.rate || S.opt.rate;
  if (opt.tr) { u.lang = "tr-TR"; if (TRV) u.voice = TRV; }
  else {
    u.lang = "de-DE";
    if (VOICES.length) u.voice = VOICES[(who || 0) % VOICES.length];
    if (who && VOICES.length < 2) u.pitch = who % 2 ? 1.25 : 0.9;
  }
  if (onend) { let f = 0; const fn = () => { if (!f++) onend(); }; u.onend = fn; u.onerror = fn; }
  speechSynthesis.speak(u);
}
const speakTR = (t, onend, rate) => speak(t, 0, onend, {tr:1, rate});
const stopSpeak = () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); };
// mikrofon: Claude içinde yok; telefondaki uygulamada var
const SR = IN_CLAUDE ? null : (window.SpeechRecognition || window.webkitSpeechRecognition || null);
function listen(onres, onerr){
  const r = new SR(); r.lang = "de-DE"; r.interimResults = false; r.maxAlternatives = 3;
  let got = false;
  r.onresult = e => { got = true; onres(Array.from(e.results[0]).map(a => a.transcript)); };
  r.onerror = () => { if (!got) { got = true; onerr && onerr(); } };
  r.onend = () => { if (!got) { got = true; onerr && onerr(); } };
  try { r.start(); } catch(e) { onerr && onerr(); }
  return r;
}

/* ---------- metin karşılaştırma ---------- */
const norm = s => s.toLowerCase().replace(/ß/g,"ss").replace(/[.,!?¿¡;:"“„”'’()–\-…\/]/g," ").replace(/\s+/g," ").trim();
function similar(a, b){
  a = norm(a); b = norm(b);
  if (!a || !b) return 0;
  const m = a.length, n = b.length, dp = Array.from({length:m+1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return 1 - dp[m][n] / Math.max(m, n);
}
// "A / B" ve "(…)" içeren kalıplarda en iyi eşleşen varyant
function bestVariant(it, said){
  const vars = it.de.split(" / ").flatMap(v => [v, v.replace(/\([^)]*\)/g, "")]).map(v => v.replace(/…/g, ""));
  return Math.max(...vars.map(v => similar(v, said)));
}
// alıştırmalar için tek, sade biçim: ilk varyant, parantez ve üç nokta yok
const plain = it => it.de.split(" / ")[0].replace(/\([^)]*\)/g, "").replace(/…/g, "").replace(/\s+/g, " ").trim();
const words = it => plain(it).split(" ").filter(Boolean);
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = a => a[Math.random() * a.length | 0];
// yanlış şıklar: önce aynı türden, uzunluğu benzer olanlar
function distractors(it, n, key){
  key = key || "de";
  const seenV = new Set([norm(it[key])]);
  const cand = shuffle(ITEMS.filter(x => x.id !== it.id)).sort((a, b) => (a.src !== it.src) - (b.src !== it.src) || Math.abs(a[key].length - it[key].length) - Math.abs(b[key].length - it[key].length));
  const out = [];
  for (const x of cand.slice(0, 40).sort(() => Math.random() - .5).concat(cand.slice(40))) {
    const v = norm(x[key]); if (seenV.has(v)) continue; seenV.add(v); out.push(x); if (out.length >= n) break;
  }
  return out;
}

/* ---------- arayüz yardımcıları ---------- */
let tab = "today", screen = null, onLeave = null;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2300); }
function setTop(title, back){
  $("#title").textContent = title;
  $("#back").hidden = !back;
  document.body.classList.toggle("full", !!back);
  const n = streak(); const st = $("#streak");
  st.textContent = "🔥 " + n; st.classList.toggle("on", n > 0);
}
function copy(text, msg){
  const done = () => toast(msg || "Kopyalandı. Claude'a yapıştır.");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback(){ const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); done(); } catch(e) { toast("Kopyalanamadı"); } t.remove(); }
}
const ICON_SPK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
const ICON_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>';

const TABS = {};
function leave(){ stopSpeak(); if (onLeave) { const f = onLeave; onLeave = null; f(); } }
function go(t){
  leave(); screen = null; tab = t;
  $$(".nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  TABS[t]();
  window.scrollTo(0, 0);
}
function open(fn){ leave(); screen = fn; fn(); window.scrollTo(0, 0); }
$("#back").onclick = () => go(tab);
$$(".nav button").forEach(b => b.onclick = () => go(b.dataset.tab));
// bir oturumu bitirdikten sonra: o sekmeye dön
function endCard(icon, title, sub, btn, fn){
  $("#view").innerHTML = `
    <div class="card flash" style="margin-top:20px"><div style="font-size:48px">${icon}</div>
      <div class="big">${title}</div>${sub ? `<div class="mid">${sub}</div>` : ""}</div>
    <div class="foot"><button class="cta" id="nx">${btn || "Tamam"}</button></div>`;
  $("#nx").onclick = fn || (() => go(tab));
}

/* ================= ALIŞTIRMA MOTORU ================= */
// g: 0 tanı · 1 hatırla · 2 üret
function gapCands(it){ return words(it).map((w, i) => ({w: w.replace(/[.,!?;:"„“]/g, ""), i})).filter(x => x.w.length >= 3 && /^[A-Za-zÄÖÜäöüß]+$/.test(x.w)); }
const MODES = {
  learn:  {t:"Öğren",       ic:"👀", g:0, d:"Kartı gör, dinle, tekrar et"},
  rquiz:  {t:"Anlamı",      ic:"🇹🇷", g:0, d:"Almancayı oku, anlamını seç"},
  tf:     {t:"Doğru mu?",   ic:"⚖️", g:0, d:"Çeviri doğru mu, yanlış mı"},
  match:  {t:"Eşleştir",    ic:"🧩", g:0, d:"Almanca ve Türkçeyi eşle", group:true},
  hear:   {t:"Dinle, seç",  ic:"👂", g:0, d:"Duyduğunun anlamını seç"},
  quiz:   {t:"Almancası",   ic:"🇩🇪", g:1, d:"Türkçeden Almancayı seç"},
  finish: {t:"Tamamla",     ic:"✂️", g:1, d:"Cümlenin sonunu bul", need: it => words(it).length >= 4},
  gap:    {t:"Boşluk",      ic:"⬜", g:1, d:"Eksik kelimeyi seç", need: it => gapCands(it).length > 0 && words(it).length >= 2},
  order:  {t:"Sırala",      ic:"🔀", g:1, d:"Kelimeleri sıraya koy", need: it => { const n = words(it).length; return n >= 3 && n <= 11; }},
  gapw:   {t:"Boşluğu yaz", ic:"✏️", g:2, d:"Eksik kelimeyi yaz", need: it => gapCands(it).length > 0 && words(it).length >= 2},
  dictate:{t:"Dikte",       ic:"🎧", g:2, d:"Duyduğunu yaz"},
  write:  {t:"Yaz",         ic:"⌨️", g:2, d:"Türkçeden Almancayı yaz"},
  speak:  {t:"Konuş",       ic:"🎙️", g:2, d:"Türkçeden Almanca söyle", need: () => !!SR},
};
const GROUPS = ["Tanı", "Hatırla", "Üret"];
const can = (m, it) => !MODES[m].need || MODES[m].need(it);
const GRADED = Object.keys(MODES).filter(m => m !== "learn" && m !== "match");
function modeFor(it){
  // kutu küçükse tanıma, büyüdükçe üretme
  const b = (S.prog[it.id] || {}).b || 0;
  const pool = b <= 1 ? ["quiz","rquiz","tf","hear","order","gap"] : b <= 3 ? ["quiz","order","gap","finish","gapw","dictate","write"] : ["write","gapw","dictate","order","speak"];
  return pick(pool.filter(m => can(m, it))) || "quiz";
}

let P = null;
// opts: {items, mode: "deck"|"mix"|<mod>, title, stepKey, done}
function startSession(o){
  let items = o.items.filter((x, i, a) => a.findIndex(y => y.id === x.id) === i);
  if (!items.length) { toast("Burada çalışılacak cümle yok"); return; }
  const q = [];
  if (o.mode === "deck") {
    const fresh = items.filter(it => !S.prog[it.id]), old = items.filter(it => S.prog[it.id]);
    fresh.forEach(it => q.push({m:"learn", it}));
    shuffle(fresh).forEach(it => q.push({m:"quiz", it}));
    shuffle(old).forEach(it => q.push({m:modeFor(it), it}));
    shuffle(fresh).forEach(it => q.push({m: can("order", it) ? "order" : "write", it}));
  } else if (o.mode === "mix") {
    shuffle(items).forEach(it => q.push({m: S.prog[it.id] ? modeFor(it) : "learn", it}));
    shuffle(items).filter(it => !S.prog[it.id]).forEach(it => q.push({m:"quiz", it}));
  } else if (o.mode === "match") {
    const L = shuffle(items);
    for (let i = 0; i < L.length; i += 5) { const g = L.slice(i, i + 5); if (g.length >= 3 || !q.length) q.push({m:"match", its:g}); }
  } else {
    items.forEach(it => q.push({m: can(o.mode, it) ? o.mode : "write", it}));
  }
  P = {q, i:0, ok:0, total:0, res:{}, redo:new Set(), o};
  open(renderSession);
  onLeave = flushSession;
}
function flushSession(){
  if (!P) return;
  Object.entries(P.res).forEach(([id, ok]) => BYID[id] && grade(BYID[id], ok));
  P.res = {}; save();
}
function answer(it, ok){
  P.total++; if (ok) P.ok++;
  seen(it);
  P.res[it.id] = (P.res[it.id] === undefined ? true : P.res[it.id]) && ok;
  const cur = P.q[P.i];
  // yanlışı oturumun sonuna bir kez daha ekle
  if (!ok && !P.redo.has(it.id)) { P.redo.add(it.id); P.q.push({m: cur.m === "match" ? "quiz" : cur.m, it}); }
}
function next(){ P.lock = 0; P.i++; renderSession(); }
function head(title){
  return `<div class="ptop"><div class="pbar"><i style="width:${P.i/P.q.length*100}%"></i></div><span class="small muted">${P.i+1}/${P.q.length}</span></div><div class="phase">${MODES[title] ? MODES[title].ic + " " + MODES[title].t : title}</div>`;
}
function footNext(){ $(".foot").innerHTML = `<button class="cta" id="nx">Devam</button>`; $(".foot").hidden = false; $("#nx").onclick = next; $("#nx").focus({preventScroll:true}); }
function verdict(ok, it, said, extra){
  return `<div class="verdict ${ok ? "good" : "bad"}">${ok ? pick(["Doğru!","Harika!","Süper!","Aynen!"]) : (said ? "Tam olmadı." : "Doğrusu:")}${said ? ` <span class="muted">(“${esc(said)}”)</span>` : ""}<b>${esc(it.de)}</b>${extra || `<span class="muted small">${esc(it.tr)}</span>`}</div>`;
}

function renderSession(){
  const cur = P.q[P.i];
  if (!cur) return renderSessionEnd();
  setTop(P.o.title || "Alıştırma", true);
  R_MODE[cur.m](cur.it || cur.its, cur);
}
function renderSessionEnd(){
  flushSession(); onLeave = null;
  if (P.o.stepKey) mark(P.o.stepKey);
  const pct = P.total ? Math.round(P.ok / P.total * 100) : 100;
  setTop(P.o.title || "Alıştırma", true);
  endCard(pct >= 80 ? "🎉" : "💪", "Bitti!", P.total ? `${P.ok} / ${P.total} doğru · %${pct}` : "Kartlar tamam", P.o.stepKey === "deck" ? "Bugün ekranına dön" : "Tamam", () => go(tab));
}

function optsQuiz(it, ask, key, show){

function gapMode(it, cur, typing){
  const w = words(it), c = cur.g || (cur.g = pick(gapCands(it)));
  const shown = w.map((x, i) => i === c.i ? x.replace(c.w, `<span class="gapw">${typing ? "&nbsp;?&nbsp;" : "&nbsp;…&nbsp;"}</span>`) : esc(x)).join(" ");
  let optsHtml = "";
  let opts = [];
  if (!typing) {
    const pool = [...new Set(distractors(it, 30, "de").flatMap(x => gapCands(x).map(g => g.w)))].filter(x => x.toLowerCase() !== c.w.toLowerCase());
    opts = shuffle([c.w].concat(shuffle(pool).sort((a, b) => Math.abs(a.length - c.w.length) - Math.abs(b.length - c.w.length)).slice(0, 3)));
    optsHtml = `<div class="opts2">${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  }
  $("#view").innerHTML = head(typing ? "gapw" : "gap") + `
    <div class="card flash" style="min-height:130px"><div class="mid">${esc(it.tr)}</div><div class="big" style="font-size:22px">${shown}</div></div>
    ${typing ? `<input class="typed" id="typed" placeholder="Eksik kelime" autocomplete="off" autocapitalize="off" spellcheck="false">` : optsHtml}
    <div id="vd"></div>
    <div class="foot" ${typing ? "" : "hidden"}>${typing ? `<div class="row2"><button class="btn2" id="sk">Bilmiyorum</button><button class="cta" id="ck">Kontrol et</button></div>` : ""}</div>`;
  const fin = (ok, said) => { answer(it, ok); $("#vd").innerHTML = verdict(ok, it, said); speak(plain(it)); footNext(); };
  if (typing) {
    const chk = () => { if (P.lock) return; P.lock = 1; const v = $("#typed").value.trim(); fin(!!v && similar(v, c.w) >= (c.w.length > 6 ? 0.8 : 0.99), v); };
    $("#ck").onclick = chk; $("#typed").onkeydown = e => { if (e.key === "Enter") chk(); };
    $("#sk").onclick = () => { if (P.lock) return; P.lock = 1; fin(false, ""); };
    setTimeout(() => $("#typed") && $("#typed").focus({preventScroll:true}), 50);
  } else $$(".opt").forEach(b => b.onclick = () => {
    if (P.lock) return; P.lock = 1;
    const ok = opts[+b.dataset.i] === c.w;
    b.classList.add(ok ? "good" : "bad"); if (!ok) $(`.opt[data-i="${opts.indexOf(c.w)}"]`).classList.add("good");
    fin(ok);
  });
}
function typed(it, m, top, audio){

function steps(){
  const dk = deck(), ch = nextChapter(), sc = todaysScenario(), pr = todaysPrompt(), rec = dayRec(), ms = allMistakes();
  const n = dk.due.length + dk.fresh.length;
  const out = [{k:"deck", ic:"🃏", t:"Günün destesi",
    s: n ? [dk.fresh.length ? dk.fresh.length + " yeni" : "", dk.due.length ? dk.due.length + " tekrar" : ""].filter(Boolean).join(" · ") + " · karışık alıştırma" : "Bugünlük kart kalmadı",
    run: () => n ? startSession({items: dk.fresh.concat(dk.due.slice(0, 30)), mode:"deck", title:"Günün destesi", stepKey:"deck"}) : toast("Bugünlük kart kalmadı 👏")}];
  if (ch) out.push({k:"book", ic:"📖", t:"Kitap: " + ch.n + ". bölüm", s:ch.de + " · " + ch.tr, eve:1, run:() => openReader("book", ch.n)});
  if (sc) out.push({k:"scen", ic:"🎭", t:"Senaryo: " + sc.title, s: SAMPLE ? "Oku, sonra Claude ile canlı konuş" : "Rol yap, kendi replikini söyle", eve:1, run:() => openReader("scen", sc.id)});
  out.push({k:"write", ic:"✍️", t:"Günlük yazı", s:pr.tr, eve:1, run:() => open(renderWrite)});
  if (ms.length) out.push({k:"mist", ic:"🩹", t:"Hatalarım", s:ms.length + " hata kartı", eve:1, run:() => startMistakes()});
  out.forEach(s => s.done = !!rec[s.k]);

}

// seçilen kaynaktan n kart: önce vadesi gelen, sonra yeni, sonra en zayıf
function srcItems(src, n){
  const pool = poolFor(src);
  const rank = it => { const r = S.prog[it.id]; return !r ? 1 : r.due <= TODAY ? 0 : 2 + r.b; };
  const L = shuffle(pool).sort((a, b) => rank(a) - rank(b));
  return n ? L.slice(0, n) : L;
}
function srcCount(src){ return src === "mist" ? allMistakes().length : poolFor(src).length; }

/* ================= TURBO: duy, söyle, düzelt ================= */
let T = null;
function startTurbo(src){
  const items = srcItems(src, 20);
  if (!items.length) { toast("Bu kaynakta cümle yok"); return; }
  T = {items, i:0, dir: S.opt.tdir || "trde", run:true, tok:0, ok:0, n:0, res:{}};
  open(renderTurbo);
  onLeave = stopTurbo;
  wake(true);
  setTimeout(turboStep, 400);
}
function stopTurbo(){
  if (!T) return; T.run = false; T.tok++; stopSpeak(); wake(false);
  Object.entries(T.res).forEach(([id, ok]) => { seen(BYID[id]); grade(BYID[id], ok); }); T.res = {}; save();
  if (T.rec) try { T.rec.abort(); } catch(e) {}
}
function renderTurbo(){
  setTop("Turbo", true);
  const it = T.items[T.i];
  $("#view").innerHTML = `
    <div class="seg" id="tdir" style="margin-top:6px"><button data-v="trde" class="${T.dir === "trde" ? "on" : ""}">Türkçe → Almanca</button><button data-v="detr" class="${T.dir === "detr" ? "on" : ""}">Almanca → Türkçe</button></div>
    <div class="ptop"><div class="pbar"><i style="width:${T.i/T.items.length*100}%"></i></div><span class="small muted">${T.i+1}/${T.items.length}</span></div>
    <div class="card player">
      <div class="phase2" id="ph">Hazır ol</div>
      <div class="${T.dir === "trde" ? "tr" : "de"}" id="q">${it ? esc(T.dir === "trde" ? it.tr : it.de) : ""}</div>
      <div class="${T.dir === "trde" ? "de" : "tr"}" id="a" style="visibility:hidden">${it ? esc(T.dir === "trde" ? it.de : it.tr) : ""}</div>
      <div id="vd"></div>
    </div>
    <div class="tfbtn" id="self" style="margin-top:14px;visibility:hidden"><button class="y" data-v="1">✓ Bildim</button><button class="n" data-v="0">✗ Bilemedim</button></div>
    <div class="ctrl"><button id="tp" aria-label="Duraklat">${T.run ? "❚❚" : "▶"}</button><button id="tn" aria-label="Sonraki">⏭</button></div>
    <p class="hint">${SR && T.dir === "trde" ? "Bip sesi yok: Türkçeyi duyunca hemen Almancasını söyle." : "Türkçeyi duy, Almancasını yüksek sesle söyle; sonra doğrusunu duyarsın. İstersen Bildim/Bilemedim'e dokun."}</p>`;
  $$("#tdir button").forEach(b => b.onclick = () => { T.dir = S.opt.tdir = b.dataset.v; save(); T.tok++; stopSpeak(); renderTurbo(); if (T.run) setTimeout(turboStep, 300); });
  $("#tp").onclick = () => { T.run = !T.run; T.tok++; stopSpeak(); if (T.rec) try { T.rec.abort(); } catch(e) {} renderTurbo(); if (T.run) setTimeout(turboStep, 300); };
  $("#tn").onclick = () => { T.tok++; stopSpeak(); T.i++; renderTurbo(); if (T.run) setTimeout(turboStep, 300); };
  $$("#self button").forEach(b => b.onclick = () => { const it = T.items[T.i]; if (it) { T.res[it.id] = b.dataset.v === "1"; $("#self").style.visibility = "hidden"; toast(b.dataset.v === "1" ? "👍" : "Tekrar gelecek"); } });
}
function turboStep(){
  if (!T || !T.run || screen !== renderTurbo) return;
  const it = T.items[T.i], tok = ++T.tok, live = () => T && T.run && T.tok === tok;
  if (!it) { stopTurbo(); setTop("Turbo", true); endCard("⚡", "Turbo bitti", T.items.length + " cümle", "Tamam"); return; }
  renderTurbo();
  const ph = t => { const e = $("#ph"); if (e) e.textContent = t; };
  const reveal = () => { const a = $("#a"); if (a) a.style.visibility = "visible"; };
  const nextIt = (ms) => setTimeout(() => { if (live()) { T.i++; turboStep(); } }, ms);
  const think = Math.max(2500, plain(it).length * 90);
  if (T.dir === "detr") {
    ph("Dinle");
    speak(it.de, 0, () => { if (!live()) return; ph("Anlamı ne?"); setTimeout(() => { if (!live()) return; reveal(); $("#self").style.visibility = "visible"; speakTR(it.tr, () => live() && nextIt(1600)); }, think); });
    return;
  }
  ph("Türkçesi");
  speakTR(it.tr, () => {
    if (!live()) return;
    if (SR) {
      ph("Söyle…");
      T.rec = listen(alts => {
        if (!live()) return;
        const said = alts.sort((a, b) => bestVariant(it, b) - bestVariant(it, a))[0], ok = bestVariant(it, said) >= 0.72;
        T.res[it.id] = ok; reveal();
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}" style="margin-top:8px">${ok ? "Doğru!" : "Sen: “" + esc(said) + "”"}</div>`;
        ph(ok ? "Doğru" : "Doğrusu");
        speak(it.de, 0, () => live() && nextIt(900));
      }, () => { if (!live()) return; reveal(); ph("Doğrusu"); speak(it.de, 0, () => live() && nextIt(1200)); });
    } else {
      ph("Şimdi sen söyle");
      setTimeout(() => { if (!live()) return; reveal(); ph("Doğrusu"); $("#self").style.visibility = "visible"; speak(it.de, 0, () => { if (!live()) return; setTimeout(() => live() && speak(it.de, 0, () => live() && nextIt(1800)), 700); }); }, think);
    }
  });
}
// ekran kararmasın (destekleyen tarayıcılarda)
let WL = null;
function wake(on){
  try {
    if (on && navigator.wakeLock) navigator.wakeLock.request("screen").then(w => WL = w, () => {});
    else if (WL) { WL.release(); WL = null; }
  } catch(e) {}
}

function listenSources(){
  const out = [];
  const tp = todaysPhrases(); if (tp.length) out.push({k:"today", t:"Günün kalıpları", s:tp.length + " kalıp", items:() => tp});
  const du = dueItems(); if (du.length) out.push({k:"due", t:"Tekrarı gelenler", s:du.length + " cümle", items:() => du.slice(0, 40)});
  const ch = nextChapter(); if (ch) out.push({k:"book", t:"Kitap: " + ch.n + ". " + ch.de, s:"Atakan & Nisa · " + ch.lines.length + " replik", items:() => ch.lines.map((l, j) => ({de:l[1], tr:l[2], who:D.book.roles[l[0]], v:l[0] === "N" ? 1 : 0}))});
  const all = ITEMS.filter(i => i.src === "ph" && i.d <= TODAY); out.push({k:"ph", t:"Tüm kalıplar", s:all.length + " kalıp", items:() => shuffle(all)});
  const sc = todaysScenario(); if (sc) out.push({k:"scen", t:"Senaryo: " + sc.title, s:sc.lines.length + " replik", items:() => sc.lines.map(l => ({de:l[1], tr:l[2], who:sc.roles[l[0]], v:l[0] === "U" ? 0 : 1}))});
  const bk = ITEMS.filter(i => i.src === "bk" && readChapters().includes(i.ch)); if (bk.length) out.push({k:"bk", t:"Kitap kalıpları", s:bk.length + " kalıp", items:() => shuffle(bk)});
  const ms = allMistakes(); if (ms.length) out.push({k:"mist", t:"Hatalarım (doğru hâlleri)", s:ms.length + " cümle", items:() => ms.map(m => ({de:m.right, tr:m.rule || ""}))});
  return out;
}

let L = null;
function startPlayer(s){
  L = {s, list: s.items(), i:0, playing:true, tok:0};
  if (!L.list.length) return toast("Liste boş");
  open(renderPlayer);
  onLeave = () => { if (L) { L.playing = false; L.tok++; } wake(false); };
  wake(true);
  playCur();
}
function renderPlayer(){
  setTop("Dinle", true);
  const it = L.list[L.i] || {};
  const o = S.opt;
  $("#view").innerHTML = `
    <div class="ptop"><div class="pbar"><i style="width:${(L.i+1)/L.list.length*100}%"></i></div><span class="small muted">${L.i+1}/${L.list.length}</span></div>
    <div class="phase">${esc(L.s.t)}</div>
    <div class="card player">
      ${it.who ? `<div class="who">${esc(it.who)}</div>` : ""}
      <div class="de" id="pde" ${o.ldir === "trde" ? 'style="visibility:hidden"' : ""}>${esc(it.de || "")}</div>
      <div class="tr">${esc(it.tr || "")}</div>
    </div>
    <div class="ctrl"><button id="pv" aria-label="Önceki">⏮</button><button class="pp" id="pp" aria-label="Oynat/Duraklat">${L.playing ? "❚❚" : "▶"}</button><button id="pn" aria-label="Sonraki">⏭</button></div>
    <p class="hint">${LDIR.find(d => d[0] === o.ldir)[1]} · ${o.lrep}× · ${({0.7:"çok yavaş",0.85:"yavaş",1:"normal",1.15:"hızlı"})[o.lrate] || ""}. Liste bitince başa döner.</p>`;
  $("#pp").onclick = () => { L.playing = !L.playing; L.tok++; stopSpeak(); renderPlayer(); if (L.playing) playCur(); };
  $("#pn").onclick = () => { L.tok++; stopSpeak(); L.i = (L.i + 1) % L.list.length; renderPlayer(); if (L.playing) playCur(); };
  $("#pv").onclick = () => { L.tok++; stopSpeak(); L.i = (L.i - 1 + L.list.length) % L.list.length; renderPlayer(); if (L.playing) playCur(); };
  if ("mediaSession" in navigator) try {
    navigator.mediaSession.metadata = new MediaMetadata({title: it.de || "", artist: it.tr || "", album: "Almanca Günlük"});
    navigator.mediaSession.setActionHandler("nexttrack", () => $("#pn") && $("#pn").click());
    navigator.mediaSession.setActionHandler("previoustrack", () => $("#pv") && $("#pv").click());
    navigator.mediaSession.setActionHandler("pause", () => L.playing && $("#pp") && $("#pp").click());
    navigator.mediaSession.setActionHandler("play", () => !L.playing && $("#pp") && $("#pp").click());
  } catch(e) {}
}
function playCur(){
  if (!L || !L.playing || screen !== renderPlayer) return;
  const tok = ++L.tok, live = () => L && L.playing && L.tok === tok && screen === renderPlayer;
  const o = S.opt, it = L.list[L.i], gap = o.lgap * 1000, rate = o.lrate;
  renderPlayer();
  const de = n => done => speak(it.de, it.v || 0, () => { if (!live()) return; n > 1 ? setTimeout(() => live() && de(n - 1)(done), 700) : done(); }, {rate});
  const advance = () => setTimeout(() => { if (!live()) return; L.i = (L.i + 1) % L.list.length; playCur(); }, gap);
  if (o.ldir === "de") de(o.lrep)(advance);
  else if (o.ldir === "detr") de(o.lrep)(() => setTimeout(() => live() && (it.tr ? speakTR(it.tr, () => live() && advance(), Math.min(1, rate + .1)) : advance()), 500));
  else speakTR(it.tr || "", () => setTimeout(() => { if (!live()) return; const e = $("#pde"); if (e) e.style.visibility = "visible"; de(o.lrep)(advance); }, Math.max(2000, gap + 1000)), Math.min(1, rate + .1));
}

/* ================= OYUNLAR ================= */
// oyun havuzu: gördüğün kartlar + bugünkü kalıplar + okunan bölümün kalıpları
function gamePool(){
  let p = ITEMS.filter(i => S.prog[i.id]).concat(todaysPhrases(), poolFor("bk"));
  if (p.length < 12) p = p.concat(ITEMS.filter(i => i.src === "ph" && i.d <= TODAY), ITEMS.filter(i => i.src === "bk" && i.ch <= 3));
  return p.filter((x, i, a) => a.findIndex(y => y.id === x.id) === i);
}
const GAMES = {
  blitz:  {t:"Blitz 60",      ic:"⚡", d:"60 saniyede kaç tane? Türkçeyi gör, doğru Almancaya dokun.", run:() => gBlitz()},
  memory: {t:"Hafıza",        ic:"🧠", d:"Kartları çevir, Almancayı Türkçesiyle eşle.", run:() => gMemory()},
  build:  {t:"Cümle Kur",     ic:"🧱", d:"90 saniye: kelimeleri doğru sıraya diz.", run:() => gBuild()},
  hearit: {t:"Dinle & Seç",   ic:"👂", d:"Duyduğun cümlenin anlamını seç. 3 canın var.", run:() => gHear()},
};
function best(id, sc, lowerBetter){
  const b = S.games[id];
  const nb = b === undefined || (lowerBetter ? sc < b : sc > b);
  if (nb) { S.games[id] = sc; }
  mark("game"); save();
  return nb;
}
function renderGames(){
  setTop("Oyun");
  $("#view").innerHTML = `
    <p class="hint" style="text-align:left;margin:6px 2px 14px">Oyunlar senin kartlarından gelir: ne kadar çalışırsan o kadar çeşit olur.</p>

      <button class="card tile" data-k="${k}"><span class="ic">${g.ic}</span><b>${g.t}</b><span>${g.d}</span>
        ${S.games[k] !== undefined ? `<span class="best">En iyi: ${k === "memory" ? S.games[k] + " hamle" : S.games[k]}</span>` : ""}</button>`).join("")}</div>
    <p class="hint" style="margin-top:18px">Kelime oyunları (artikel, çoğul, fiil çekimi, adam asmaca…) kelime listemiz gelince eklenecek.</p>`;
  $$(".tile").forEach(b => b.onclick = () => GAMES[b.dataset.k].run());

function gameOver(id, title, sc, unit, lowerBetter){
  const nb = best(id, sc, lowerBetter);
  setTop(title, true);
  endCard(nb ? "🏆" : "🎮", nb ? "Yeni rekor!" : "Oyun bitti", `${sc} ${unit}${nb ? "" : " · en iyi " + S.games[id]}`, "Tekrar oyna", () => GAMES[id].run());
  $(".foot").insertAdjacentHTML("beforeend", `<button class="linkbtn" id="gb">Oyunlara dön</button>`);
  $("#gb").onclick = () => go("games");
}
let G = null;
function gameTimer(sec, onEnd){
  G.left = sec;
  G.tm = setInterval(() => {
    if (screen === null || !G) return clearInterval(G && G.tm);
    G.left--; const t = $("#gt"); if (t) { t.textContent = G.left; t.classList.toggle("low", G.left <= 10); }
    if (G.left <= 0) { clearInterval(G.tm); onEnd(); }
  }, 1000);
  const tm = G.tm; onLeave = () => clearInterval(tm);
}

/* Blitz: iki şıklı hızlı seçim */
function gBlitz(){
  const pool = shuffle(gamePool());
  G = {i:0, sc:0, combo:0};
  const draw = () => {
    const it = pool[G.i % pool.length], other = distractors(it, 1, "de")[0];
    const opts = shuffle([it, other]);
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""}</span><span class="t" id="gt">${G.left}</span></div>
      <div class="card flash" style="min-height:150px"><div class="big" style="font-size:23px">${esc(it.tr)}</div></div>
      <div class="opts">${opts.map(o => `<button class="opt" data-id="${o.id}">${esc(o.de)}</button>`).join("")}</div>`;
    $$(".opt").forEach(b => b.onclick = () => {
      const ok = b.dataset.id === it.id;
      b.classList.add(ok ? "good" : "bad");
      if (ok) { G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else G.combo = 0;
      G.i++; setTimeout(() => G.left > 0 && draw(), ok ? 180 : 600);
    });
  };

  gameTimer(60, () => gameOver("blitz", "Blitz 60", G.sc, "puan"));
  draw();
}

/* Hafıza: 6 çift */
function gMemory(){
  const its = shuffle(gamePool()).filter(i => plain(i).length <= 34).slice(0, 6);
  const cards = shuffle(its.flatMap(it => [{id:it.id, t:plain(it), k:"de"}, {id:it.id, t:it.tr, k:"tr"}]));
  G = {open:[], done:0, moves:0};
  open(() => setTop("Hafıza", true));
  $("#view").innerHTML = `<div class="hud"><span class="small muted">Eşleşen: <b id="gd" style="font-size:16px">0</b>/6</span><span class="small muted">Hamle: <b id="gm" style="font-size:16px">0</b></span></div>
    <div class="mgrid" style="grid-template-columns:repeat(3,1fr)">${cards.map((c, i) => `<button class="mc back" data-i="${i}" style="min-height:84px;font-size:13px">${esc(c.t)}</button>`).join("")}</div>`;
  $$(".mc").forEach(b => b.onclick = () => {
    const c = cards[+b.dataset.i];
    if (!b.classList.contains("back") || G.open.length >= 2) return;
    b.classList.remove("back"); if (c.k === "de") speak(BYID[c.id].de);
    G.open.push(b);
    if (G.open.length === 2) {
      G.moves++; $("#gm").textContent = G.moves;
      const [a, x] = G.open, ca = cards[+a.dataset.i], cx = cards[+x.dataset.i];
      if (ca.id === cx.id && ca.k !== cx.k) {
        setTimeout(() => { a.classList.add("done"); x.classList.add("done"); G.open = []; G.done++; $("#gd").textContent = G.done; if (G.done === 6) setTimeout(() => gameOver("memory", "Hafıza", G.moves, "hamle", true), 500); }, 350);
      } else setTimeout(() => { a.classList.add("back"); x.classList.add("back"); G.open = []; }, 900);
    }
  });
}

/* Cümle Kur: 90 sn, kelime dizme */
function gBuild(){
  const pool = shuffle(gamePool().filter(i => { const n = words(i).length; return n >= 3 && n <= 9; }));
  if (!pool.length) return toast("Önce birkaç kart çalış");
  G = {i:0, sc:0};
  const draw = () => {
    const it = pool[G.i % pool.length], w = words(it), sh = shuffle(w.map((x, i) => ({x, i}))), built = [];
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="t" id="gt">${G.left}</span></div>
      <div class="card flash" style="min-height:90px"><div class="big" style="font-size:20px">${esc(it.tr)}</div></div>
      <div class="built" id="built"></div>
      <div class="pool">${sh.map((p, k) => `<button class="wd" data-k="${k}">${esc(p.x)}</button>`).join("")}</div>
      <div style="margin-top:14px" class="row2"><button class="btn2" id="sk">Geç</button><button class="btn2" id="clr">Temizle</button></div>`;
    const redraw = () => {
      $("#built").innerHTML = built.map(k => `<span class="wd">${esc(sh[k].x)}</span>`).join("");
      $$(".pool .wd").forEach(b => b.classList.toggle("used", built.includes(+b.dataset.k)));
      if (built.length === w.length) {
        const ok = norm(built.map(k => sh[k].x).join(" ")) === norm(w.join(" "));
        $("#built").style.borderColor = ok ? "var(--ok)" : "var(--bad)";
        if (ok) { G.sc += w.length; speak(plain(it)); }
        setTimeout(() => { if (G.left > 0) { if (ok) G.i++; else { built.length = 0; $("#built").style.borderColor = ""; return redraw(); } draw(); } }, ok ? 500 : 700);
      }
    };
    $$(".pool .wd").forEach(b => b.onclick = () => { if (!built.includes(+b.dataset.k) && built.length < w.length) { built.push(+b.dataset.k); redraw(); } });
    $("#clr").onclick = () => { built.length = 0; redraw(); };
    $("#sk").onclick = () => { G.i++; draw(); };
  };
  open(() => setTop("Cümle Kur", true));
  gameTimer(90, () => gameOver("build", "Cümle Kur", G.sc, "puan"));
  draw();
}

const ERR = {
  not_granted: "Claude'a izin verilmedi. Sayfayı yenileyip izin verirsen düzeltme açılır.",

  session_expired: "Oturum süresi doldu. Sayfayı yenile.",
  prompt_too_large: "Metin çok uzun. Biraz kısaltıp tekrar dene.",
};

function correctionPrompt(topic, text){
  return `Sen Atakan'ın Almanca öğretmenisin. Atakan Türk, Almanya'da yaşıyor, seviyesi A2 civarı. Hedefi sınav Almancası değil, günlük hayatta doğal konuşmak ve yazmak.
Aşağıdaki günlük yazısını düzelt.

Kurallar:
- "natural": metnin bir Almanın günlük hayatta yazacağı doğal hâli. Anlamı ve kişisel içeriği koru, gereksiz süsleme yapma, A2-B1 seviyesinde tut.
- "mistakes": gerçek hatalar (dilbilgisi, kelime seçimi, doğal olmayan ifade). Her biri için "wrong" (Atakan'ın yazdığı kısa parça), "right" (doğrusu), "rule" (Türkçe, tek kısa cümle, ezber kural değil pratik ipucu). En fazla 8 tane, en önemlileri.
- "note": Türkçe, tek cümle, samimi bir geri bildirim (neyi iyi yaptı ya da bir sonraki adım).
Sadece şu biçimde JSON döndür: {"natural":"...","mistakes":[{"wrong":"...","right":"...","rule":"..."}],"note":"..."}

Konu: ${topic}
Metin:
${text}`;
}

/* ---------- senaryo: Claude ile canlı sohbet ---------- */
let C = null;
function chatRules(src){
  const other = Object.entries(src.roles).find(([k]) => k !== "U")[1];
  return `Rol yapma pratiği. Sen "${other}" rolündesin, karşındaki Atakan (Türk, Almanya'da yaşıyor, A2 seviyesi).
Durum: ${src.desc}
Örnek diyalog (aynen tekrar etme, doğal ve biraz farklı ilerlet):
${src.lines.map(l => (src.roles[l[0]] || l[0]) + ": " + l[1]).join("\n")}

Kurallar:
- Sadece rolündeki kişi olarak, kısa (1-2 cümle), günlük, doğal Almanca konuş. A2 seviyesinde kal.
- Her cevabında sohbeti ilerletecek basit bir soru ya da tepki ver.
- Atakan'ın son mesajında hata varsa "fix" alanına Türkçe tek satırla doğru hâlini yaz (örn. "Ich hätte gern einen Kaffee" daha doğal). Hata yoksa "fix" boş olsun.
- Her cevapta JSON döndür: {"de":"senin Almanca replikin","tr":"Türkçe çevirisi","fix":""}`;
}
function openChat(src){
  C = {src, turns: [], items: [], busy: false};
  open(renderChat);
  ask();
}
function renderChat(){
  const {src} = C;
  setTop(src.title, true);
  $("#view").innerHTML = `
    <div class="card desc">${esc(src.desc)}<br><span class="ai" style="margin-top:6px">Claude: ${esc(Object.entries(src.roles).find(([k]) => k !== "U")[1])}</span></div>
    <div class="chat" id="chat">${C.items.map((m, i) => m.fix ? `<div class="fix">✎ ${esc(m.fix)}</div>` :
      `<button class="msg ${m.me ? "me" : ""}" data-i="${i}"><div class="de">${esc(m.de)}</div>${m.tr ? `<div class="tr">${esc(m.tr)}</div>` : ""}</button>`).join("")}
      ${C.busy ? `<div class="msg"><span class="thinking">yazıyor…</span></div>` : ""}</div>
    <p class="hint">Claude'un mesajına dokun: Türkçesi açılır ve okunur.</p>
    <div class="foot"><div class="chatin"><textarea id="cin" rows="1" placeholder="Almanca cevap yaz…" lang="de" spellcheck="false"></textarea><button class="cta" id="csend" ${C.busy ? "disabled" : ""}>Gönder</button></div>
      <button class="linkbtn" id="cdone">Bitirdim ✓</button></div>`;
  document.querySelectorAll("#chat .msg[data-i]").forEach(b => b.onclick = () => { const m = C.items[+b.dataset.i]; b.classList.toggle("showtr"); speak(m.de, m.me ? 0 : 1); });
  const send = () => {
    const t = $("#cin").value.trim();
    if (!t || C.busy) return;
    C.items.push({me: true, de: t}); C.turns.push({role: "user", content: t});
    ask();
  };
  $("#csend").onclick = send;
  $("#cin").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  $("#cdone").onclick = () => { S.scen.done = S.scen.done || {}; S.scen.done[src.id] = (S.scen.done[src.id] || 0) + 1; mark("scen"); toast("Kaydedildi ✓"); go(tab); };
  const last = $("#chat").lastElementChild; if (last) last.scrollIntoView({block: "end"});
}
async function ask(){
  if (!SAMPLE) { toast("Claude bağlı değil"); return; }
  C.busy = true; renderChat();
  const input = [{role: "user", content: chatRules(C.src) + "\n\nSohbeti sen başlat."}];
  // geçmiş: Claude'un cevapları JSON olarak, Atakan'ın mesajları düz metin
  C.turns.forEach(t => input.push(t));
  if (input[input.length - 1].role !== "user") input.push({role: "user", content: "(devam)"});
  try {
    const r = await SAMPLE.json(input, {modelTier: "quick", cache: false});
    const de = String(r.de || "").trim(), tr = String(r.tr || ""), fix = String(r.fix || "").trim();
    if (fix && C.items.length) C.items.push({fix});
    C.items.push({me: false, de, tr});
    C.turns.push({role: "assistant", content: JSON.stringify({de, tr, fix})});
    C.busy = false; renderChat();
    speak(de, 1);
  } catch(e) {
    C.busy = false; renderChat(); toast(errText(e));
    // gönderilemeyen mesajı kutuya geri koy
    const lu = C.turns[C.turns.length - 1];
    if (lu && lu.role === "user") { C.turns.pop(); C.items.pop(); renderChat(); $("#cin").value = lu.content; }
  }
}

let R = null;
function openReader(kind, id){
  const src = kind === "book" ? D.book.chapters.find(c => c.n === id) : D.scenarios.find(s => s.id === id);
  if (!src) return;
  const roles = kind === "book" ? D.book.roles : src.roles;
  const keys = Object.keys(roles);
  R = {kind, id, src, roles, keys, me: kind === "scen" ? "U" : null, play:-1, waiting:false};
  open(renderReader);
}
function renderReader(){
  const {kind, src, roles, keys} = R;
  setTop(kind === "book" ? src.n + ". " + src.de : src.title, true);
  $("#view").innerHTML = `
    ${kind === "scen" ? `<div class="card desc">${esc(src.desc)}</div>` : ""}
    <div class="seg" id="roles"><button data-r="" class="${!R.me ? "on" : ""}">Sadece oku</button>
      ${keys.map(k => `<button data-r="${k}" class="${R.me === k ? "on" : ""}">Ben: ${esc(roles[k])}</button>`).join("")}</div>
    <p class="hint">${R.me ? "Senin repliklerin gizli: Türkçesine bakıp Almancasını söyle, sonra dokunup kontrol et." : "Bir cümleye dokun: Türkçesi açılır ve okunur."}</p>
    <div class="msgs">${src.lines.map((l, i) => `
      <button class="msg ${l[0] === (R.me || (kind === "book" ? "A" : "U")) ? "me" : ""} ${R.me && l[0] === R.me ? "hide" : ""}" data-i="${i}">
        <div class="who">${esc(roles[l[0]] || l[0])}</div><div class="de">${esc(l[1])}</div><div class="tr">${esc(l[2])}</div></button>`).join("")}</div>
    ${src.k && src.k.length ? `<div class="sec">Bu bölümün kalıpları</div><div class="card klist">${src.k.map(k => `<div><b>${esc(k[0])}</b><span>${esc(k[1])}</span></div>`).join("")}</div>
      <button class="btn2" id="kq" style="width:100%;margin-top:10px">Bu kalıpları alıştır</button>` : ""}
    ${src.vary ? `<div class="tip"><b>Sonra:</b> ${esc(src.vary)}</div>` : ""}
    ${kind === "scen" ? `<button class="btn2" id="live" style="width:100%;margin-top:12px">💬 Claude ile canlı konuş</button>` : ""}
    <div class="foot"><div class="row2"><button class="btn2" id="play">▶ Sesli oynat</button><button class="cta" id="fin">Bitirdim ✓</button></div></div>`;
  $$("#roles button").forEach(b => b.onclick = () => { stopSpeak(); R.me = b.dataset.r || null; R.play = -1; renderReader(); });
  $$(".msg").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, l = src.lines[i];
    if (R.waiting && i === R.play) { b.classList.remove("hide", "wait"); speak(l[1], keys.indexOf(l[0]), () => { R.waiting = false; R.play++; playStep(); }); return; }
    if (b.classList.contains("hide")) { b.classList.remove("hide"); b.classList.add("showtr"); }
    else b.classList.toggle("showtr");
    speak(l[1], keys.indexOf(l[0]));
  });
  $("#play").onclick = () => {
    if (R.play >= 0) { stopSpeak(); R.play = -1; R.waiting = false; $("#play").textContent = "▶ Sesli oynat"; clearCur(); return; }
    R.play = 0; $("#play").textContent = "■ Durdur"; playStep();
  };
  $("#fin").onclick = () => {
    stopSpeak();
    if (kind === "book") { S.book.read = S.book.read || {}; S.book.read[src.n] = (S.book.read[src.n] || 0) + 1; S.book.last = src.n; mark("book"); }
    else { S.scen.done = S.scen.done || {}; S.scen.done[src.id] = (S.scen.done[src.id] || 0) + 1; mark("scen"); }
    save(); toast("Kaydedildi ✓"); go(tab);
  };
  if ($("#kq")) $("#kq").onclick = () => startSession({items: kind === "book" ? ITEMS.filter(i => i.src === "bk" && i.ch === src.n) : ITEMS.filter(i => i.sc === src.id), mode:"mix", title:"Bölüm kalıpları"});
  if ($("#live")) $("#live").onclick = () => liveChat(src);
}
function clearCur(){ $$(".msg").forEach(m => m.classList.remove("cur", "wait")); }
function playStep(){
  if (!R || R.play < 0 || screen !== renderReader) return;
  clearCur();
  const i = R.play, l = R.src.lines[i];
  if (!l) { R.play = -1; const b = $("#play"); if (b) b.textContent = "▶ Sesli oynat"; return; }
  const el = document.querySelector(`.msg[data-i="${i}"]`);
  el.scrollIntoView({block:"center", behavior:"smooth"});
  if (R.me && l[0] === R.me) { el.classList.add("wait"); R.waiting = true; return; }  // sıra sende: söyle, sonra balona dokun
  el.classList.add("cur");
  speak(l[1], R.keys.indexOf(l[0]), () => { if (R && R.play === i) { R.play++; setTimeout(playStep, 350); } });
}

/* ================= AYARLAR ================= */
function applyTheme(){ if (IN_CLAUDE) return; const t = S.opt.theme; if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }
applyTheme();
$("#gear").onclick = () => {
  const o = S.opt;
  const seen = Object.keys(S.prog).length, sat = Object.values(S.prog).filter(r => r.b >= 4).length;
  $("#sheetIn").innerHTML = `<h2>Ayarlar</h2>
    ${IN_CLAUDE ? "" : `<div class="lbl">Görünüm</div>
    <div class="seg" id="th">${[["auto","Otomatik"],["dark","Koyu"],["light","Açık"]].map(([k, t]) => `<button data-v="${k}" class="${o.theme===k?"on":""}">${t}</button>`).join("")}</div>`}
    <div class="lbl">Okuma hızı</div>
    <div class="seg" id="rt">${[[0.75,"Yavaş"],[0.9,"Normal"],[1.05,"Hızlı"]].map(([k, t]) => `<button data-v="${k}" class="${o.rate==k?"on":""}">${t}</button>`).join("")}</div>
    <div class="lbl">Günde yeni kart</div>
    <div class="seg" id="pc">${[5,10,15,20].map(k => `<button data-v="${k}" class="${o.pace==k?"on":""}">${k}</button>`).join("")}</div>
    <p class="small muted" style="margin:4px 2px">Günün 10 kalıbı her zaman gelir; bu sayı kitap kalıplarından ne kadar ekleneceğini belirler.</p>
    <div class="lbl">İlerleme</div>
    <p class="small muted" style="margin:4px 2px">${seen} kart başladı · ${sat} kart oturdu · ${Object.keys(S.days).length} gün çalıştın</p>
    <p class="small muted" style="margin:4px 2px">${DB ? "İlerlemen hesabına kaydediliyor; telefonda ve bilgisayarda aynı." : "İlerlemen bu cihazda duruyor. Yedeği kopyalayıp saklayabilirsin."}</p>
    <div class="row2"><button class="btn2" id="exp">Yedeği kopyala</button><button class="btn2" id="imp">Yedek yükle</button></div>
    <div id="impbox" hidden><textarea class="imp" id="impt" placeholder="Yedek metnini buraya yapıştır"></textarea><button class="btn2" id="impgo" style="width:100%;margin-top:8px">Yükle</button></div>
    ${IN_CLAUDE ? `<div class="lbl">Claude</div>
    <p class="small muted" style="margin:4px 2px">${SAMPLE ? "Bağlı: yazı düzeltme ve canlı konuşma açık." : "Bağlı değil: düzeltme için yazını kopyalayıp gönderebilirsin."} Mikrofon burada çalışmaz; Konuş modu ve sesli Turbo telefondaki uygulamada.</p>` : ""}
    <div class="lbl">İçerik</div>
    <p class="small muted" style="margin:4px 2px">${D.phrases.length} kalıp · ${D.book.chapters.length} kitap bölümü · ${D.scenarios.length} senaryo · ${ITEMS.length} çalışılabilir cümle · ${allWritings().length} düzeltilmiş yazı</p>
    <button class="btn2" id="cls" style="width:100%;margin-top:14px">Kapat</button>`;
  $("#sheet").classList.add("show");
  $$("#th button").forEach(b => b.onclick = () => { o.theme = b.dataset.v; save(); applyTheme(); $("#gear").onclick(); });
  $$("#rt button").forEach(b => b.onclick = () => { o.rate = +b.dataset.v; save(); speak("Das ist die neue Geschwindigkeit."); $("#gear").onclick(); });
  $$("#pc button").forEach(b => b.onclick = () => { o.pace = +b.dataset.v; save(); $("#gear").onclick(); });
  $("#exp").onclick = () => copy(JSON.stringify(S), "Yedek kopyalandı");
  $("#imp").onclick = () => { $("#impbox").hidden = false; $("#impt").focus(); };
  $("#impgo").onclick = () => {
    try { const s = JSON.parse($("#impt").value); if (!s.prog) throw 0; S = load(s); save(); toast("Yedek yüklendi"); $("#sheet").classList.remove("show"); go("today"); }
    catch(e) { toast("Bu metin bir yedek değil"); }
  };
  $("#cls").onclick = () => $("#sheet").classList.remove("show");
};
$("#sheet").onclick = e => { if (e.target.id === "sheet") $("#sheet").classList.remove("show"); };

/* ================= AÇILIŞ ================= */
Object.assign(TABS, {today:renderToday, practice:renderPracticeTab, games:renderGames, listen:renderListen, library:renderLibrary});
go("today");
const rerender = () => { if (!screen) go(tab); };
if (IN_CLAUDE) (async () => {
  // Claude: yazı düzeltme ve canlı konuşma; hesap: ilerleme, yazılar, yeni kalıplar
  claude.use("sample").then(fn => { if (fn) { SAMPLE = fn; rerender(); } });
  const db = await claude.use("db");
  if (!db) return;
  DB = db;
  try {
    const ps = await db.collection("phrases").get();
    ps.docs.forEach(d => { const p = Object.assign({id: d.id}, d.data()); const i = D.phrases.findIndex(x => x.id === p.id); if (i >= 0) D.phrases[i] = p; else D.phrases.push(p); });
    D.phrases.sort((a, b) => a.d.localeCompare(b.d));
    buildItems();
    const ws = await db.collection("writings").get();
    WRITINGS = ws.docs.map(d => Object.assign({id: d.id}, d.data()));
    const st = await db.doc("state/progress").get();
    if (st.exists) {
      const remote = JSON.parse(st.data().json || "{}");
      if ((remote.ts || 0) > (S.ts || 0)) { try { localStorage.setItem(KEY, JSON.stringify(remote)); } catch(e) {} S = load(remote); }
      else if ((S.ts || 0) > (remote.ts || 0)) save();
    } else if (S.ts) save();
  } catch(e) {}
  rerender();
})();
else if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
