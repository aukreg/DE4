tr":"Sana ne zaman uyar?","ex":"Wann passt es dir am besten?","note":"Buluşma ayarlarken; resmi: 'passt es Ihnen'.","cat":"Zaman & plan"},{"id":"L1-085","de":"Vielleicht ein andermal.","tr":"Belki başka zaman.","ex":"Heute geht's nicht, vielleicht ein andermal.","note":"Teklifi nazikçe geri çevirirken.","cat":"Zaman & plan"},{"id":"L1-086","de":"Das geht nicht.","tr":"Olmaz / mümkün değil.","ex":"Freitag geht nicht, da arbeite ich.","note":"Bir şeyin mümkün olmadığını söylerken.","cat":"Sohbet"},{"id":"L1-087","de":"Komm gut nach Hause!","tr":"Eve sağ salim git! / Dikkatli git!","ex":"Danke für den Abend, komm gut nach Hause!","note":"Misafiri ya da arkadaşı uğurlarken; çok tipik bir Alman vedası.","cat":"Sohbet"},{"id":"L1-088","de":"Ich hab Hunger.","tr":"Acıktım.","ex":"Ich hab Hunger, was gibt's heute?","note":"Evde, arkadaşla; çok yaygın.","cat":"Ev & aile"},{"id":"L1-089","de":"Was gibt's zu essen?","tr":"Yemekte ne var?","ex":"Schatz, was gibt's heute zu essen?","note":"Evde, akşam yemeği öncesi.","cat":"Ev & aile"},{"id":"L1-090","de":"Lecker!","tr":"Çok lezzetli!","ex":"Mmh, lecker! Hast du das selbst gemacht?","note":"Yemeği övmek için; çok yaygın.","cat":"Ev & aile"},{"id":"L1-091","de":"Ich bin so müde.","tr":"Çok yorgunum / uykum var.","ex":"Gece war nachts wach, ich bin so müde.","note":"Uykusuzluk ya da yorgunluk; samimi.","cat":"Duygu"},{"id":"L1-092","de":"Mir geht's nicht so gut.","tr":"Pek iyi değilim.","ex":"Mir geht's heute nicht so gut, ich bleib zu Hause.","note":"Hastalık ya da moral bozukluğu.","cat":"Duygu"},{"id":"L1-093","de":"Kein Stress.","tr":"Acele yok / sıkıntı yok.","ex":"Kein Stress, wir haben noch Zeit.","note":"Birini rahatlatırken; çok yaygın ve samimi.","cat":"Tepki"},{"id":"L1-094","de":"Ich freu mich auf …","tr":"… için sabırsızlanıyorum / dört gözle bekliyorum.","ex":"Ich freu mich auf den Urlaub.","note":"Gelecekteki bir şey için sevinç.","cat":"Duygu"},{"id":"L1-095","de":"Das freut mich.","tr":"Buna sevindim.","ex":"Das freut mich, dass es dir besser geht.","note":"Başkasının iyi haberine sevinç.","cat":"Duygu"},{"id":"L1-096","de":"Wie schön!","tr":"Ne güzel!","ex":"Ihr habt eine Wohnung gefunden? Wie schön!","note":"İyi habere içten tepki.","cat":"Tepki"},{"id":"L1-097","de":"Wahnsinn!","tr":"İnanılmaz! / Vay be!","ex":"Wahnsinn, wie schnell Gece wächst!","note":"Şaşkınlık ya da hayranlık; samimi.","cat":"Tepki"},{"id":"L1-098","de":"Oh nein!","tr":"Eyvah! / Olamaz!","ex":"Oh nein, ich hab den Schlüssel drinnen vergessen.","note":"Kötü bir şey olunca.","cat":"Tepki"},{"id":"L1-099","de":"Alles Gute (zum Geburtstag)!","tr":"Her şey gönlünce olsun! / Doğum günün kutlu olsun!","ex":"Alles Gute zum Geburtstag, Nisa!","note":"Doğum günü ve iyi dileklerde en yaygın kalıp.","cat":"Duygu"},{"id":"L1-100","de":"Ich bin krank.","tr":"Hastayım.","ex":"Ich bin krank, ich komm heute nicht ins Büro.","note":"'krankgeschrieben'den çok daha temel ve sık; önce bunu öğrenmek gerekir.","cat":"Duygu"},{"id":"L1-101","de":"Mist!","tr":"Hay aksi! / Kahretsin!","ex":"Mist, der Akku ist leer.","note":"Hafif küfür yerine; kaba değil.","cat":"Duygu"},{"id":"L1-102","de":"Endlich!","tr":"Nihayet! / Sonunda!","ex":"Endlich Wochenende!","note":"Uzun beklenen bir şey olunca.","cat":"Tepki"},{"id":"L1-103","de":"Zum Glück.","tr":"Neyse ki / çok şükür.","ex":"Zum Glück war es nichts Schlimmes.","note":"Kötü bir şey olmayınca rahatlama.","cat":"Tepki"},{"id":"L1-104","de":"Hoffentlich.","tr":"İnşallah / umarım.","ex":"Hoffentlich schläft Gece heute durch.","note":"Umut ederken; tek başına da kullanılır.","cat":"Tepki"},{"id":"L1-105","de":"Bist du sicher?","tr":"Emin misin?","ex":"Bist du sicher, dass der Laden offen hat?","note":"Şüphe ederken.","cat":"Sohbet"},{"id":"L1-106","de":"Viel Glück! / Viel Erfolg!","tr":"Bol şans! / Başarılar!","ex":"Morgen ist dein Vorstellungsgespräch? Viel Erfolg!","note":"Sınav, iş görüşmesi gibi durumlardan önce.","cat":"Duygu"},{"id":"L1-107","de":"Ich bin mir nicht sicher.","tr":"Emin değilim.","ex":"Ich bin mir nicht sicher, ob das richtig ist.","note":"Kararsızlık; işte de kibar.","cat":"Sohbet"},{"id":"L1-108","de":"Ehrlich gesagt, …","tr":"Açıkçası, …","ex":"Ehrlich gesagt hab ich keine Lust auf Kino.","note":"Dürüst bir görüş öncesi.","cat":"Sohbet"},{"id":"L1-109","de":"Übrigens, …","tr":"Bu arada, …","ex":"Übrigens, Nisa lässt dich grüßen.","note":"Konu değiştirirken ya da eklerken.","cat":"Sohbet"},{"id":"L1-110","de":"Na gut.","tr":"Peki / tamam, öyle olsun.","ex":"Na gut, noch eine Folge, dann ins Bett.","note":"İsteksizce razı olurken.","cat":"Tepki"},{"id":"L1-111","de":"Mach ich!","tr":"Yaparım! / Tamamdır!","ex":"„Bringst du Brot mit?“ – „Mach ich!“","note":"Bir isteği kabul ederken.","cat":"Tepki"},{"id":"L1-112","de":"Ich bin gleich wieder da.","tr":"Hemen dönüyorum.","ex":"Ich bin gleich wieder da, ich hol nur schnell die Windeln.","note":"Kısa süreliğine ayrılırken; evde ve işte.","cat":"Zaman & plan"},{"id":"L1-113","de":"Ich mach das schon.","tr":"Ben hallederim.","ex":"Lass stehen, ich mach den Abwasch schon.","note":"Bir işi üstlenirken; 'sen uğraşma, ben yaparım' anlamında.","cat":"Ev & aile"},{"id":"L1-114","de":"Lass mal.","tr":"Boş ver / bırak, gerek yok.","ex":"Lass mal, ich zahl heute.","note":"Teklifi ya da yardımı kibarca geri çevirme.","cat":"Tepki"},{"id":"L1-115","de":"Ich hab's dir doch gesagt.","tr":"Ben sana söylemiştim.","ex":"Siehst du? Ich hab's dir doch gesagt.","note":"Haklı çıkınca; hafif sitemli.","cat":"Sohbet"},{"id":"L1-116","de":"Das stimmt nicht.","tr":"Bu doğru değil.","ex":"Das stimmt nicht, ich hab gestern abgewaschen.","note":"Karşı çıkarken.","cat":"Sohbet"},{"id":"L1-117","de":"Auf keinen Fall.","tr":"Asla / kesinlikle hayır.","ex":"Auf keinen Fall fahr ich bei dem Schnee.","note":"Güçlü 'hayır'.","cat":"Tepki"},{"id":"L1-118","de":"Hast du meinen … gesehen?","tr":"…'imi gördün mü?","ex":"Hast du meinen Schlüssel gesehen?","note":"Bir şey ararken; evde çok sık. Dikkat: meinen (der), meine (die/çoğul), mein (das) → 'Hast du meine Brille / mein Handy gesehen?'","cat":"Ev & aile"},{"id":"L1-119","de":"Pass auf!","tr":"Dikkat et!","ex":"Pass auf, Gece, die Treppe!","note":"Tehlike anında; çocukla çok sık.","cat":"Ev & aile"},{"id":"L1-120","de":"Lass das!","tr":"Bırak onu! / Yapma!","ex":"Gece, lass das, das ist heiß!","note":"Çocuğu durdururken; kesin bir ton.","cat":"Ev & aile"},{"id":"L1-121","de":"Gut gemacht!","tr":"Aferin! / Bravo!","ex":"Gut gemacht, Gece, alles aufgeräumt!","note":"Çocuğu ya da birini överken.","cat":"Ev & aile"},{"id":"L1-122","de":"Hab dich lieb!","tr":"Seni seviyorum! (sevgiyle)","ex":"Hab dich lieb, meine Kleine.","note":"Çocuğa, aileye; 'Ich liebe dich'ten hafif.","cat":"Ev & aile"},{"id":"L1-123","de":"Ab ins Bett!","tr":"Hadi yatağa!","ex":"So, Zähne putzen und ab ins Bett!","note":"Çocuğa yatma vakti.","cat":"Ev & aile"},{"id":"L1-124","de":"Sie schläft gerade.","tr":"Şu an uyuyor.","ex":"Leise bitte, Gece schläft gerade.","note":"Misafire, kuryeye, telefonda.","cat":"Ev & aile"},{"id":"L1-125","de":"Ich wickel sie mal kurz.","tr":"Hemen bezini değiştireyim.","ex":"Moment, ich wickel sie mal kurz.","note":"Bebek bezi değiştirirken. Yazıda 'wickle', konuşmada 'wickel'.","cat":"Ev & aile"},{"id":"L1-126","de":"Kannst du sie von der Kita abholen?","tr":"Onu kreşten alabilir misin?","ex":"Kannst du sie heute von der Kita abholen?","note":"Eşler arasında günlük planlama.","cat":"Ev & aile"},{"id":"L1-127","de":"Bist du so weit?","tr":"Hazır mısın?","ex":"Bist du so weit? Wir müssen los.","note":"Çıkmadan önce; samimi.","cat":"Zaman & plan"},{"id":"L1-128","de":"Ich bin gleich fertig.","tr":"Birazdan hazırım / bitiriyorum.","ex":"Zwei Minuten, ich bin gleich fertig.","note":"Birini bekletirken.","cat":"Zaman & plan"},{"id":"L1-129","de":"Kein Wunder.","tr":"Hiç şaşırmadım / normal tabii.","ex":"„Gece ist total müde.“ – „Kein Wunder, sie hat keinen Mittagsschlaf gemacht.“","note":"Bir şeyin sebebi belli olunca; çok yaygın.","cat":"Tepki"},{"id":"L1-130","de":"Beeil dich!","tr":"Acele et!","ex":"Beeil dich, der Bus kommt!","note":"Samimi; emir tonunda.","cat":"Zaman & plan"},{"id":"L1-131","de":"Lass dir Zeit.","tr":"Acele etme.","ex":"Kein Stress, lass dir Zeit.","note":"Birini rahatlatırken.","cat":"Zaman & plan"},{"id":"L1-132","de":"Ich bin spät dran.","tr":"Geç kalıyorum / geciktim.","ex":"Ich bin spät dran, mein Zug hat Verspätung. Fangt schon mal an!","note":"Gecikme haberi; mesajda da.","cat":"Zaman & plan"},{"id":"L1-133","de":"Wie spät ist es?","tr":"Saat kaç?","ex":"Wie spät ist es? Muss Gece schon ins Bett?","note":"Saati sorarken; 'Wie viel Uhr ist es?' de çok yaygın.","cat":"Zaman & plan"},{"id":"L1-134","de":"Wie lange dauert das?","tr":"Ne kadar sürer?","ex":"Wie lange dauert das ungefähr?","note":"Tamirde, doktorda, sırada.","cat":"Zaman & plan"},{"id":"L1-135","de":"Wie war dein Wochenende?","tr":"Hafta sonun nasıldı?","ex":"Morgen! Wie war dein Wochenende?","note":"Pazartesi iş yerinde klasik soru.","cat":"İş"},{"id":"L1-136","de":"Ich bin heute im Homeoffice.","tr":"Bugün evden çalışıyorum.","ex":"Ich bin heute im Homeoffice, schreib mir einfach.","note":"Mesajda, toplantıda.","cat":"İş"},{"id":"L1-137","de":"Ich bin krankgeschrieben.","tr":"Raporluyum.","ex":"Ich bin bis Freitag krankgeschrieben.","note":"İşe hastalık bildirirken.","cat":"İş"},{"id":"L1-138","de":"Ich hab gleich 'nen Termin.","tr":"Birazdan bir randevum / toplantım var.","ex":"Lass uns später reden, ich hab gleich 'nen Termin.","note":"Konuşmayı kibarca kısaltırken.","cat":"İş"},{"id":"L1-139","de":"Können wir das verschieben?","tr":"Bunu erteleyebilir miyiz?","ex":"Können wir das auf nächste Woche verschieben?","note":"Randevu, toplantı; resmi: 'Können wir den Termin …'.","cat":"Telefon & randevu"},{"id":"L1-140","de":"Lange nicht gesehen!","tr":"Görüşmeyeli uzun zaman oldu!","ex":"Hey, lange nicht gesehen! Wie geht's?","note":"Eski tanıdığa rastlayınca.","cat":"Sohbet"},{"id":"L1-141","de":"Komm rein!","tr":"Gel içeri!","ex":"Hallo, komm rein! Schuhe kannst du anlassen.","note":"Misafiri kapıda karşılarken.","cat":"Ev & aile"},{"id":"L1-142","de":"Ich bin's.","tr":"Benim.","ex":"Hallo Schatz, ich bin's.","note":"Telefonda ya da kapıda tanıdığa.","cat":"Telefon & randevu"},{"id":"L1-143","de":"Hallo, hier ist …","tr":"Merhaba, ben …","ex":"Hallo, hier ist Atakan Ünlü.","note":"Telefonda kendini tanıtırken.","cat":"Telefon & randevu"},{"id":"L1-144","de":"Einen Moment, bitte.","tr":"Bir dakika lütfen.","ex":"Einen Moment, bitte, ich such die Nummer.","note":"Telefonda, gişede; kibar.","cat":"Telefon & randevu"},{"id":"L1-145","de":"Ich verstehe Sie ganz schlecht.","tr":"Sizi çok kötü duyuyorum.","ex":"Entschuldigung, ich verstehe Sie ganz schlecht.","note":"Telefonda hat kötü olunca.","cat":"Telefon & randevu"},{"id":"L1-146","de":"Können Sie das buchstabieren?","tr":"Harf harf söyler misiniz?","ex":"Können Sie den Namen bitte buchstabieren?","note":"İsim, adres, e-posta alırken.","cat":"Telefon & randevu"},{"id":"L1-147","de":"Kannst du mich zurückrufen?","tr":"Beni geri arar mısın?","ex":"Kannst du mich zurückrufen? Ich bin im Supermarkt.","note":"Telefonda ya da mesajda.","cat":"Telefon & randevu"},{"id":"L1-148","de":"Wer ist dran? – Ich bin dran.","tr":"Sıra kimde? – Sıra bende.","ex":"„Wer ist als Nächstes dran?“ – „Ich glaube, ich bin dran.“","note":"Fırında, kasada, doktorda; her gün duyulur.","cat":"Kafe & Alışveriş"},{"id":"L1-149","de":"Auf Wiederhören!","tr":"Hoşça kalın! (telefonda)","ex":"Vielen Dank, auf Wiederhören!","note":"Resmi telefon görüşmesinin sonunda.","cat":"Telefon & randevu"},{"id":"L1-150","de":"Ich bräuchte einen Termin.","tr":"Bir randevu almam lazım.","ex":"Guten Tag, ich bräuchte einen Termin beim Kinderarzt.","note":"Doktor, kuaför vb. ararken; kibar.","cat":"Telefon & randevu"},{"id":"L1-151","de":"Geht's auch früher?","tr":"Daha erken olur mu?","ex":"Der Zwölfte? Geht's auch früher?","note":"Önerilen tarihi öne çekmek için.","cat":"Telefon & randevu"},{"id":"L1-152","de":"Kann ich Ihnen helfen?","tr":"Yardımcı olabilir miyim?","ex":"„Kann ich Ihnen helfen?“ – „Ich schau mich nur um.“","note":"Mağazada satıcı sorar; anlamak önemli.","cat":"Kafe & Alışveriş"},{"id":"L1-153","de":"Ich schau mich nur um.","tr":"Sadece bakıyorum.","ex":"Danke, ich schau mich nur um.","note":"Satıcıya kibar cevap.","cat":"Kafe & Alışveriş"},{"id":"L1-154","de":"Haben Sie das auch in …?","tr":"Bunun … olanı da var mı?","ex":"Haben Sie das auch in Größe 92?","note":"Beden, renk sorarken.","cat":"Kafe & Alışveriş"},{"id":"L1-155","de":"Ich nehm das.","tr":"Bunu alıyorum.","ex":"Okay, ich nehm das hier.","note":"Karar verince; konuşmada 'nehm'.","cat":"Kafe & Alışveriş"},{"id":"L1-156","de":"Sonst noch was?","tr":"Başka bir şey?","ex":"„Sonst noch was?“ – „Nein, danke.“","note":"Kasiyer, fırıncı sorar.","cat":"Kafe & Alışveriş"},{"id":"L1-157","de":"Das wär's.","tr":"Bu kadar / hepsi bu.","ex":"Zwei Brezeln, und das wär's.","note":"'Sonst noch was?'a cevap.","cat":"Kafe & Alışveriş"},{"id":"L1-158","de":"Mahlzeit!","tr":"Afiyet olsun! (öğle selamı)","ex":"Mahlzeit! Gehst du auch in die Kantine?","note":"İş yerinde öğlen koridorda selam. Özellikle Batı/Güney Almanya'da ve kurumsal/kamu ortamında yaygın; bazıları eski moda bulur. Cevabı da 'Mahlzeit!'.","cat":"İş"},{"id":"L1-159","de":"Ist hier noch frei?","tr":"Burası boş mu?","ex":"Entschuldigung, ist hier noch frei?","note":"Kafede, trende yer sorarken.","cat":"Kafe & Alışveriş"},{"id":"L1-160","de":"Wir würden gern bestellen.","tr":"Sipariş verebilir miyiz?","ex":"Entschuldigung, wir würden gern bestellen.","note":"Restoranda garsona; kibar.","cat":"Kafe & Alışveriş"},{"id":"L1-161","de":"Brauchen wir noch was?","tr":"Başka bir şey lazım mı?","ex":"Ich geh einkaufen. Brauchen wir noch was?","note":"Alışveriş öncesi eşe.","cat":"Ev & aile"},{"id":"L1-162","de":"Soll ich was mitbringen?","tr":"Bir şey getireyim mi?","ex":"Bin gleich im Rewe, soll ich was mitbringen?","note":"Mesajda, davetten önce.","cat":"Mesajlaşma"},{"id":"L1-163","de":"Hast du meine Nachricht gesehen?","tr":"Mesajımı gördün mü?","ex":"Hast du meine Nachricht wegen Samstag gesehen?","note":"Cevap gelmeyince.","cat":"Mesajlaşma"},{"id":"L1-164","de":"Das ist nett von dir.","tr":"Çok naziksin.","ex":"Du hast Kuchen gebracht? Das ist nett von dir.","note":"İyiliğe teşekkür; resmi: 'von Ihnen'.","cat":"Duygu"},{"id":"L1-165","de":"Das schaffst du!","tr":"Başarırsın! / Yaparsın!","ex":"Keine Angst vor der Prüfung, das schaffst du!","note":"Cesaret verirken.","cat":"Duygu"},{"id":"L1-166","de":"Nicht weinen.","tr":"Ağlama.","ex":"Nicht weinen, Schatz, ist ja gut.","note":"Çocuğu teselli ederken; şefkatli ton.","cat":"Ev & aile"},{"id":"L1-167","de":"Was ist mit …?","tr":"… ne olacak? / … ne durumda?","ex":"Und was ist mit Sonntag?","note":"Bir konuyu ya da kişiyi gündeme getirir.","cat":"Sohbet"},{"id":"L1-168","de":"Ich habe Kopfschmerzen.","tr":"Başım ağrıyor.","ex":"Ich habe seit gestern Kopfschmerzen.","note":"Bauch-, Hals-, Rückenschmerzen da aynı kalıpla söylenir.","cat":"Sağlık"},{"id":"L1-169","de":"Hallo!","tr":"Merhaba!","ex":"Hallo, Lena! Schön, dich zu sehen.","note":"Her yerde, herkese; en yaygın selam.","cat":"Sohbet"},{"id":"L1-170","de":"Mein Kind ist krank.","tr":"Çocuğum hasta.","ex":"Mein Kind ist krank, ich bleibe heute zu Hause.","note":"İşe veya kreşe haber verirken en sık cümle.","cat":"Sağlık"},{"id":"L1-171","de":"Tschüss!","tr":"Hoşça kal! / Görüşürüz!","ex":"Tschüss, bis morgen!","note":"Samimi veda; markette kasiyere de denir.","cat":"Sohbet"},{"id":"L1-172","de":"Mir ist schlecht.","tr":"Midem bulanıyor; kendimi kötü hissediyorum.","ex":"Halt mal an, mir ist schlecht.","note":"'Ich bin schlecht' deme; o 'kötü biriyim' demek.","cat":"Sağlık"},{"id":"L1-173","de":"Guten Morgen!","tr":"Günaydın!","ex":"Guten Morgen! Gut geschlafen?","note":"Öğlene kadar; kısaca \"Morgen!\" da denir.","cat":"Sohbet"},{"id":"L1-174","de":"Ich bin erkältet.","tr":"Soğuk algınlığım var; üşüttüm.","ex":"Ich bin erkältet und habe Schnupfen.","note":"Hafif hastalık için en yaygın ifade.","cat":"Sağlık"},{"id":"L1-175","de":"Guten Tag!","tr":"İyi günler! / Merhaba!","ex":"Guten Tag, ich habe einen Termin um zehn.","note":"Resmî ortamda selam; vedada kullanılmaz.","cat":"Sohbet"},{"id":"L1-176","de":"Wo ist die nächste Haltestelle?","tr":"En yakın durak nerede?","ex":"Entschuldigung, wo ist die nächste Haltestelle?","note":"Otobüs ve tramvay için Haltestelle; tren için Bahnhof.","cat":"Yol & ulaşım"},{"id":"L1-177","de":"Gut, danke.","tr":"İyiyim, teşekkürler.","ex":"– Wie geht's? – Gut, danke. Und dir?","note":"\"Wie geht's?\" sorusuna en tipik cevap.","cat":"Sohbet"},{"id":"L1-178","de":"Wie komme ich zum Bahnhof?","tr":"İstasyona nasıl giderim?","ex":"Entschuldigung, wie komme ich zum Bahnhof?","note":"zum/zur + yer: zur Post, zum Rathaus.","cat":"Yol & ulaşım"},{"id":"L1-179","de":"Vielen Dank!","tr":"Çok teşekkür ederim!","ex":"Vielen Dank für Ihre Hilfe!","note":"Her ortamda; \"für …\" ile neye teşekkür ettiğini söyle.","cat":"Rica"},{"id":"L1-180","de":"Geradeaus und dann links.","tr":"Dümdüz, sonra sola.","ex":"– Wo ist die Apotheke? – Geradeaus und dann links.","note":"Yol tarifinde en sık duyulan cevap.","cat":"Yol & ulaşım"},{"id":"L1-181","de":"Ja, bitte.","tr":"Evet, lütfen.","ex":"– Möchten Sie eine Tüte? – Ja, bitte.","note":"Bir teklifi kabul ederken kısa ve kibar.","cat":"Rica"},{"id":"L1-182","de":"Der Zug hat Verspätung.","tr":"Trenin rötarı var.","ex":"Der Zug hat zwanzig Minuten Verspätung.","note":"Anonslarda çok sık duyulur.","cat":"Yol & ulaşım"},{"id":"L1-183","de":"Wie heißt du?","tr":"Adın ne?","ex":"– Wie heißt du? – Ich heiße Atakan.","note":"Resmîde: \"Wie heißen Sie?\"","cat":"Sohbet"},{"id":"L1-184","de":"Unterschreiben Sie bitte hier.","tr":"Lütfen buraya imza atın.","ex":"Unterschreiben Sie bitte hier unten.","note":"Resmi dairede, bankada, kargoda sürekli duyulur.","cat":"Resmi işler"},{"id":"L1-185","de":"Ich heiße …","tr":"Adım …","ex":"Hallo, ich heiße Atakan und komme aus der Türkei.","note":"Resmîde \"Mein Name ist …\" da denir.","cat":"Sohbet"},{"id":"L1-186","de":"Ich rufe wegen … an.","tr":"… için arıyorum.","ex":"Guten Tag, ich rufe wegen meines Termins an.","note":"wegen + Genitiv; konuşmada Dativ de duyulur.","cat":"Telefon & randevu"},{"id":"L1-187","de":"Woher kommst du?","tr":"Nerelisin?","ex":"– Woher kommst du? – Aus der Türkei, aus Izmir.","note":"Resmîde: \"Woher kommen Sie?\"","cat":"Sohbet"},{"id":"L1-188","de":"Ich komme aus der Türkei.","tr":"Türkiye'denim.","ex":"Ich komme aus der Türkei, aber ich wohne in Köln.","note":"Dikkat: \"aus der Türkei\" — artikelli söylenir.","cat":"Sohbet"},{"id":"L1-189","de":"Was darf's sein?","tr":"Ne alırsınız? / Buyurun?","ex":"– Was darf's sein? – Zwei Brötchen, bitte.","note":"Fırında, kasada, kafede satıcının ilk sorusu.","cat":"Kafe & Alışveriş"},{"id":"L1-190","de":"Mit Karte oder bar?","tr":"Kartla mı, nakit mi?","ex":"– Das macht 8,50. Mit Karte oder bar? – Mit Karte.","note":"Kasiyer sorar; cevap: \"Mit Karte\" / \"Bar\".","cat":"Kafe & Alışveriş"},{"id":"L1-191","de":"Das macht … Euro.","tr":"… euro ediyor.","ex":"Das macht zwölf Euro fünfzig, bitte.","note":"Kasada toplam tutar böyle söylenir.","cat":"Kafe & Alışveriş"},{"id":"L1-192","de":"Es ist halb drei.","tr":"Saat iki buçuk.","ex":"– Wie spät ist es? – Es ist halb drei.","note":"Dikkat: \"halb drei\" = 2:30, bir sonraki saat söylenir!","cat":"Zaman & plan"},{"id":"L1-193","de":"Um wie viel Uhr?","tr":"Saat kaçta?","ex":"– Wir treffen uns morgen. – Um wie viel Uhr?","note":"Cevap 'um' ile: 'Um acht.'","cat":"Zaman & plan"},{"id":"L1-194","de":"Liebe Grüße","tr":"Sevgiler","ex":"Bis Samstag! Liebe Grüße, Atakan","note":"Mesaj ve e-posta sonu; kısaltması \"LG\".","cat":"Mesajlaşma"},{"id":"L1-195","de":"Essen ist fertig!","tr":"Yemek hazır!","ex":"Gece, Nisa, Essen ist fertig! Kommt ihr?","note":"Evde herkesi sofraya çağırmak için.","cat":"Ev & aile"},{"id":"L1-196","de":"Schlaf gut!","tr":"İyi uykular!","ex":"Gute Nacht, mein Schatz, schlaf gut!","note":"Yatmadan önce; çocuğa ve eşe sık denir.","cat":"Ev & aile"},{"id":"L1-197","de":"Brauchen Sie eine Tüte?","tr":"Poşet ister misiniz?","ex":"– Brauchen Sie eine Tüte? – Nein, danke, ich hab eine.","note":"Kasada sorulur; poşet genelde paralıdır.","cat":"Kafe & Alışveriş"},{"id":"L1-198","de":"Wo finde ich …?","tr":"… nerede bulabilirim?","ex":"Entschuldigung, wo finde ich die Milch?","note":"Markette, mağazada ürün sorarken.","cat":"Kafe & Alışveriş"},{"id":"L1-199","de":"Möchtest du etwas trinken?","tr":"Bir şey içer misin?","ex":"Komm rein! Möchtest du etwas trinken? Tee oder Kaffee?","note":"Misafire ilk ikram; resmîde \"Möchten Sie …\".","cat":"Rica"},{"id":"L1-200","de":"Wo tut es weh?","tr":"Neresi ağrıyor?","ex":"– Wo tut es weh? – Hier, am Bauch.","note":"Çocuğa: 'Wo tut's dir weh?'","cat":"Sağlık"},{"id":"L1-201","de":"Es tut hier weh.","tr":"Burası ağrıyor.","ex":"Es tut hier weh, wenn ich laufe.","note":"Gösterirken kullanılır; 'Das tut weh!' = Acıyor!","cat":"Sağlık"},{"id":"L1-202","de":"Haben Sie etwas gegen Husten?","tr":"Öksürüğe karşı bir şeyiniz var mı?","ex":"Haben Sie etwas gegen Husten für Kinder?","note":"Eczanede: etwas gegen Schnupfen, Fieber, Schmerzen.","cat":"Sağlık"},{"id":"L1-203","de":"Wie oft soll ich das nehmen?","tr":"Bunu ne sıklıkla almalıyım?","ex":"– Wie oft soll ich das nehmen? – Dreimal täglich.","note":"İlaçta 'nehmen' kullanılır, 'trinken' değil.","cat":"Sağlık"},{"id":"L1-204","de":"Ihren Ausweis, bitte.","tr":"Kimliğiniz lütfen.","ex":"– Ihren Ausweis, bitte. – Hier, bitte.","note":"Pass = pasaport; Ausweis = kimlik kartı.","cat":"Resmi işler"},{"id":"L1-205","de":"Bin ich hier richtig?","tr":"Doğru yerde miyim?","ex":"Entschuldigung, bin ich hier richtig für die Anmeldung?","note":"Daire, kat veya sıra konusunda emin değilken.","cat":"Resmi işler"},{"id":"L1-206","de":"Auf Wiedersehen!","tr":"Hoşça kalın! / Güle güle!","ex":"Vielen Dank und auf Wiedersehen!","note":"Resmî veda: doktor, resmî daire, mağaza.","cat":"Sohbet"},{"id":"L1-207","de":"Was muss ich mitbringen?","tr":"Yanımda ne getirmem lazım?","ex":"– Was muss ich mitbringen? – Ihren Pass und den Mietvertrag.","note":"Randevudan önce sorulur.","cat":"Resmi işler"},{"id":"L1-208","de":"Guten Abend!","tr":"İyi akşamlar!","ex":"Guten Abend, haben Sie einen Tisch für zwei?","note":"Akşam selamı; vedada \"Schönen Abend!\" denir.","cat":"Sohbet"},{"id":"L1-209","de":"Können Sie mir das erklären?","tr":"Bunu bana açıklayabilir misiniz?","ex":"Ich verstehe den Brief nicht. Können Sie mir das erklären?","note":"Kibar; 'bitte' ekleyince daha da kibar olur.","cat":"Resmi işler"},{"id":"L1-210","de":"Wo wohnst du?","tr":"Nerede oturuyorsun?","ex":"– Wo wohnst du? – In Ehrenfeld, nicht weit von hier.","note":"Tanışırken klasik soru.","cat":"Sohbet"},{"id":"L1-211","de":"Was bist du von Beruf?","tr":"Mesleğin ne?","ex":"– Was bist du von Beruf? – Ich bin Ingenieur.","note":"Meslek söylerken artikel yok: \"Ich bin Lehrer.\"","cat":"Sohbet"},{"id":"L1-212","de":"Ich arbeite als …","tr":"… olarak çalışıyorum.","ex":"Ich arbeite als Koch in einem Restaurant.","note":"\"als\" + meslek, artikelsiz.","cat":"Sohbet"},{"id":"L1-213","de":"Ist das weit von hier?","tr":"Buradan uzak mı?","ex":"– Ist das weit von hier? – Nein, nur fünf Minuten.","note":"Cevapta 'zu Fuß' (yürüyerek) sık geçer.","cat":"Yol & ulaşım"},{"id":"L1-214","de":"Hast du Kinder?","tr":"Çocuğun var mı?","ex":"– Hast du Kinder? – Ja, eine Tochter. Sie ist drei.","note":"Tanışırken çok sorulur.","cat":"Sohbet"},{"id":"L1-215","de":"Das ist gleich um die Ecke.","tr":"Hemen köşede; çok yakın.","ex":"Der Supermarkt ist gleich um die Ecke.","note":"'Çok yakın' anlamında da kullanılır.","cat":"Yol & ulaşım"},{"id":"L1-216","de":"Wie alt bist du?","tr":"Kaç yaşındasın?","ex":"– Wie alt bist du, Gece? – Drei!","note":"Yetişkine pek sorulmaz; çocuklar için çok yaygın.","cat":"Sohbet"},{"id":"L1-217","de":"Fährt dieser Bus zum …?","tr":"Bu otobüs …'e gidiyor mu?","ex":"Entschuldigung, fährt dieser Bus zum Krankenhaus?","note":"Şoföre binmeden önce sorulur.","cat":"Yol & ulaşım"},{"id":"L1-218","de":"Ich spreche nur ein bisschen Deutsch.","tr":"Sadece biraz Almanca konuşuyorum.","ex":"Entschuldigung, ich spreche nur ein bisschen Deutsch.","note":"Karşındakinin yavaşlamasını sağlar.","cat":"Sohbet"},{"id":"L1-219","de":"Wo muss ich umsteigen?","tr":"Nerede aktarma yapmalıyım?","ex":"Ich will nach Spandau. Wo muss ich umsteigen?","note":"aussteigen = inmek, einsteigen = binmek.","cat":"Yol & ulaşım"},{"id":"L1-220","de":"Können Sie das bitte wiederholen?","tr":"Bunu tekrarlayabilir misiniz lütfen?","ex":"Entschuldigung, können Sie das bitte wiederholen?","note":"Resmî ortamda, derste, telefonda.","cat":"Sohbet"},{"id":"L1-221","de":"Ein Ticket nach …, bitte.","tr":"…'e bir bilet, lütfen.","ex":"Ein Ticket nach Hamburg, bitte.","note":"Fahrkarte de denir; ikisi de çok yaygın.","cat":"Yol & ulaşım"},{"id":"L1-222","de":"Was bedeutet …?","tr":"… ne demek?","ex":"Was bedeutet \"Feierabend\"?","note":"Bilmediğin bir kelimeyi sormak için.","cat":"Sohbet"},{"id":"L1-223","de":"Sprechen Sie Englisch?","tr":"İngilizce konuşuyor musunuz?","ex":"Entschuldigung, sprechen Sie Englisch?","note":"Samimi: \"Sprichst du Englisch?\"","cat":"Sohbet"},{"id":"L1-224","de":"Von welchem Gleis fährt der Zug?","tr":"Tren hangi perondan kalkıyor?","ex":"Von welchem Gleis fährt der Zug nach München?","note":"Gleis = peron/ray; 'auf Gleis 5'.","cat":"Yol & ulaşım"},{"id":"L1-225","de":"Schön, dich kennenzulernen.","tr":"Seninle tanıştığıma memnun oldum.","ex":"Ich bin Atakan. Schön, dich kennenzulernen!","note":"Resmîde: \"Schön, Sie kennenzulernen.\"","cat":"Sohbet"},{"id":"L1-226","de":"Wann fährt der nächste Zug nach …?","tr":"…'e bir sonraki tren ne zaman?","ex":"Wann fährt der nächste Zug nach Köln?","note":"Bus, Bahn için de aynı kalıp.","cat":"Yol & ulaşım"},{"id":"L1-227","de":"Das ist meine Frau.","tr":"Bu benim eşim.","ex":"Das ist meine Frau Nisa, und das ist Gece.","note":"Birini tanıştırırken: \"Das ist …\"","cat":"Sohbet"},{"id":"L1-228","de":"Ich habe den Bus verpasst.","tr":"Otobüsü kaçırdım.","ex":"Sorry, ich habe den Bus verpasst und komme später.","note":"verpassen: treni, fırsatı, aramayı kaçırmak.","cat":"Yol & ulaşım"},{"id":"L1-229","de":"Wie geht es Ihnen?","tr":"Nasılsınız?","ex":"Guten Tag, Frau Weber! Wie geht es Ihnen?","note":"\"Sie\" ile konuştuğun kişilere resmî hâli.","cat":"Sohbet"},{"id":"L1-230","de":"Nächster Halt: …","tr":"Sonraki durak: …","ex":"Nächster Halt: Hauptbahnhof. Ausstieg links.","note":"Otobüs ve trende anons; sadece duyulur.","cat":"Yol & ulaşım"},{"id":"L1-231","de":"Herzlich willkommen!","tr":"Hoş geldiniz!","ex":"Herzlich willkommen bei uns! Kommt rein.","note":"Ev, iş, etkinlik; cevap genelde \"Danke!\"","cat":"Sohbet"},{"id":"L1-232","de":"An der Ampel rechts.","tr":"Trafik ışığında sağa.","ex":"Fahren Sie geradeaus und an der Ampel rechts.","note":"an der Kreuzung = kavşakta.","cat":"Yol & ulaşım"},{"id":"L1-233","de":"Ich finde das gut.","tr":"Bence bu iyi.","ex":"Ich finde das gut, dass du mitkommst.","note":"Fikir bildirmenin en basit yolu: \"Ich finde …\"","cat":"Tepki"},{"id":"L1-234","de":"Ich stehe im Stau.","tr":"Trafiğe takıldım.","ex":"Ich stehe im Stau, ich komme zehn Minuten später.","note":"Geç kalma mesajlarında çok sık.","cat":"Yol & ulaşım"},{"id":"L1-235","de":"Finde ich auch.","tr":"Ben de öyle düşünüyorum.","ex":"– Der Film war super. – Finde ich auch!","note":"Katılırken çok doğal ve kısa.","cat":"Tepki"},{"id":"L1-236","de":"Die Heizung ist kaputt.","tr":"Kalorifer bozuk.","ex":"Hallo, bei uns ist die Heizung kaputt.","note":"Waschmaschine, Spülmaschine ist kaputt: aynı kalıp.","cat":"Ev & komşu"},{"id":"L1-237","de":"Haben Sie ein Paket für mich?","tr":"Bana gelen bir paket var mı?","ex":"Hallo, haben Sie ein Paket für mich angenommen?","note":"Komşu paketi aldıysa kapıda böyle sorulur.","cat":"Ev & komşu"},{"id":"L1-238","de":"Soll ich dir helfen?","tr":"Yardım edeyim mi?","ex":"Das ist schwer. Soll ich dir helfen?","note":"Yardım teklif etmek için en tipik cümle.","cat":"Rica"},{"id":"L1-239","de":"Wie hoch ist die Miete?","tr":"Kira ne kadar?","ex":"Wie hoch ist die Miete mit Nebenkosten?","note":"Kaltmiete = yan giderler hariç; Warmmiete = dahil.","cat":"Ev & komşu"},{"id":"L1-240","de":"Nichts zu danken.","tr":"Teşekküre gerek yok. / Ne demek.","ex":"– Danke fürs Abholen! – Nichts zu danken.","note":"Teşekküre cevap; \"Gern geschehen\" da denir.","cat":"Rica"},{"id":"L1-241","de":"Sie kommt heute nicht in die Kita.","tr":"Bugün kreşe gelmiyor.","ex":"Guten Morgen, Gece kommt heute nicht in die Kita.","note":"Sabah kreşi arayınca veya mesajda.","cat":"Okul & kreş"},{"id":"L1-242","de":"Entschuldigung, darf ich mal vorbei?","tr":"Pardon, geçebilir miyim?","ex":"Entschuldigung, darf ich mal vorbei? Ich muss hier raus.","note":"Otobüste, markette yol isterken.","cat":"Rica"},{"id":"L1-243","de":"Bis wann muss ich sie abholen?","tr":"Onu saat kaça kadar almam lazım?","ex":"Bis wann muss ich sie heute abholen?","note":"Oğlan için: ihn abholen.","cat":"Okul & kreş"},{"id":"L1-244","de":"Mir ist kalt.","tr":"Üşüyorum.","ex":"Mir ist kalt. Machst du das Fenster zu?","note":"\"Ich bin kalt\" yanlış! Sıcak için \"Mir ist warm.\"","cat":"Duygu"},{"id":"L1-245","de":"Wie war sie heute?","tr":"Bugün nasıldı?","ex":"Hallo! Wie war sie heute? Alles gut?","note":"Kreşten alırken öğretmene sorulur.","cat":"Okul & kreş"},{"id":"L1-246","de":"Hat sie gut gegessen?","tr":"İyi yemek yedi mi?","ex":"Hat sie heute gut gegessen und geschlafen?","note":"Kreşten alırken sık sorulur.","cat":"Okul & kreş"},{"id":"L1-247","de":"Das nervt!","tr":"Sinir bozucu! / Bıktım!","ex":"Die Bahn ist schon wieder zu spät. Das nervt!","note":"Günlük ve samimi; şikâyet ederken.","cat":"Duygu"},{"id":"L1-248","de":"Was habt ihr heute gemacht?","tr":"Bugün ne yaptınız?","ex":"Na, mein Schatz, was habt ihr heute gemacht?","note":"Çocuğa kreş veya okul sonrası sorulur.","cat":"Okul & kreş"},{"id":"L1-249","de":"Ich bin gestresst.","tr":"Stresliyim.","ex":"Ich bin gerade total gestresst wegen der Arbeit.","note":"Günlük konuşmada çok sık.","cat":"Duygu"},{"id":"L1-250","de":"Hast du deine Hausaufgaben gemacht?","tr":"Ödevlerini yaptın mı?","ex":"Hast du deine Hausaufgaben schon gemacht?","note":"Hausaufgaben genelde çoğul kullanılır.","cat":"Okul & kreş"},{"id":"L1-251","de":"Ich liebe dich.","tr":"Seni seviyorum.","ex":"Ich liebe dich, Nisa. Danke für alles.","note":"Romantik; \"Hab dich lieb\" daha hafif ve sıcak.","cat":"Duygu"},{"id":"L1-252","de":"Können wir kurz sprechen?","tr":"Kısaca konuşabilir miyiz?","ex":"Frau Weber, können wir kurz sprechen?","note":"Öğretmenle veya iş yerinde kısa görüşme için.","cat":"Okul & kreş"},{"id":"L1-253","de":"Herzlichen Glückwunsch!","tr":"Tebrikler! / Kutlarım!","ex":"Herzlichen Glückwunsch zur neuen Wohnung!","note":"Doğum günü, iş, sınav için; \"zu\" + olay.","cat":"Duygu"},{"id":"L1-254","de":"Wann haben Sie einen Termin frei?","tr":"Ne zaman boş randevunuz var?","ex":"Wann haben Sie nächste Woche einen Termin frei?","note":"Doktor, kuaför, resmi daire için.","cat":"Telefon & randevu"},{"id":"L1-255","de":"Schön, dich zu sehen!","tr":"Seni görmek ne güzel!","ex":"Hallo, Tom! Schön, dich zu sehen!","note":"Tanıdığınla karşılaşınca sıcak selam.","cat":"Duygu"},{"id":"L1-256","de":"Passt Ihnen Dienstag um zehn?","tr":"Salı saat on size uyar mı?","ex":"– Passt Ihnen Dienstag um zehn? – Ja, das passt.","note":"passen + Dativ: mir, Ihnen, dir.","cat":"Telefon & randevu"},{"id":"L1-257","de":"Es ist Viertel nach vier.","tr":"Saat dördü çeyrek geçiyor.","ex":"Beeil dich, es ist schon Viertel nach vier!","note":"\"Viertel vor vier\" = dörde çeyrek var.","cat":"Zaman & plan"},{"id":"L1-258","de":"Das passt mir gut.","tr":"Bu bana uyar.","ex":"Donnerstag um drei? Ja, das passt mir gut.","note":"Olumsuz: 'Das passt mir leider nicht.'","cat":"Telefon & randevu"},{"id":"L1-259","de":"Kann ich mit Frau … sprechen?","tr":"… Hanım'la görüşebilir miyim?","ex":"Guten Tag, kann ich mit Frau Schulz sprechen?","note":"Erkek için: mit Herrn … sprechen.","cat":"Telefon & randevu"},{"id":"L1-260","de":"Kommst du mit?","tr":"Sen de geliyor musun?","ex":"Wir gehen in den Park. Kommst du mit?","note":"Birini birlikte gitmeye çağırırken.","cat":"Zaman & plan"},{"id":"L1-261","de":"Ich komme zehn Minuten später.","tr":"On dakika geç geleceğim.","ex":"Entschuldigung, ich komme etwa zehn Minuten später.","note":"Randevuya geç kalınca önceden haber vermek kibarlıktır.","cat":"Telefon & randevu"},{"id":"L1-262","de":"Wann treffen wir uns?","tr":"Ne zaman buluşuyoruz?","ex":"– Wann treffen wir uns? – Um sieben am Bahnhof.","note":"Yer için: \"Wo treffen wir uns?\"","cat":"Zaman & plan"},{"id":"L1-263","de":"Wie war Ihr Name noch mal?","tr":"Adınız neydi?","ex":"Entschuldigung, wie war Ihr Name noch mal?","note":"Geçmiş zaman kibarlık katar; unutulan isim için.","cat":"Telefon & randevu"},{"id":"L1-264","de":"Ich lade dich ein.","tr":"Ben ısmarlıyorum. / Seni davet ediyorum.","ex":"Lass mal, ich lade dich ein.","note":"Hesabı ödemek veya davet etmek için.","cat":"Zaman & plan"},{"id":"L1-265","de":"Wir sehen uns!","tr":"Görüşürüz!","ex":"Okay, wir sehen uns morgen!","note":"Rahat veda; zaman da eklenebilir.","cat":"Zaman & plan"},{"id":"L1-266","de":"In einer halben Stunde.","tr":"Yarım saat sonra.","ex":"– Wann bist du fertig? – In einer halben Stunde.","note":"\"in\" + süre = … sonra.","cat":"Zaman & plan"},{"id":"L1-267","de":"Die Rechnung, bitte.","tr":"Hesap, lütfen.","ex":"Entschuldigung, die Rechnung, bitte.","note":"\"Zahlen, bitte!\" ile aynı anlamda.","cat":"Restoran"},{"id":"L1-268","de":"Zusammen oder getrennt?","tr":"Birlikte mi, ayrı ayrı mı?","ex":"– Zusammen oder getrennt? – Getrennt, bitte.","note":"Almanya'da garson hesapta mutlaka sorar.","cat":"Restoran"},{"id":"L1-269","de":"Hat es geschmeckt?","tr":"Beğendiniz mi? / Lezzetli miydi?","ex":"– Hat es geschmeckt? – Ja, sehr gut, danke.","note":"Garson tabağı alırken sorar.","cat":"Restoran"},{"id":"L1-270","de":"Was möchten Sie trinken?","tr":"Ne içmek istersiniz?","ex":"– Was möchten Sie trinken? – Ein Wasser, bitte.","note":"Garsonun ilk sorusu; içecek önce söylenir.","cat":"Restoran"},{"id":"L1-271","de":"Einen Tisch für zwei, bitte.","tr":"İki kişilik bir masa, lütfen.","ex":"Guten Abend, einen Tisch für zwei, bitte.","note":"Restorana girince; sayıyı değiştir.","cat":"Restoran"},{"id":"L1-272","de":"Die Speisekarte, bitte.","tr":"Menü, lütfen.","ex":"Können wir bitte die Speisekarte haben?","note":"Kısaca \"die Karte\" da denir.","cat":"Restoran"},{"id":"L1-273","de":"Für mich …, bitte.","tr":"Bana …, lütfen.","ex":"Für mich die Pizza Margherita, bitte.","note":"Grupta sipariş verirken kendi payını söyle.","cat":"Restoran"},{"id":"L1-274","de":"Wo sind die Toiletten?","tr":"Tuvaletler nerede?","ex":"Entschuldigung, wo sind die Toiletten?","note":"Her yerde; \"Wo ist die Toilette?\" da olur.","cat":"Restoran"},{"id":"L1-275","de":"Ich bekomme …","tr":"… alayım.","ex":"Ich bekomme einen Cappuccino und ein Croissant.","note":"Kafede, fırında sipariş verirken çok yaygın.","cat":"Kafe & Alışveriş"},{"id":"L1-276","de":"Kann ich das anprobieren?","tr":"Bunu deneyebilir miyim?","ex":"Kann ich die Jacke mal anprobieren?","note":"Kabin: \"Wo sind die Umkleidekabinen?\"","cat":"Kafe & Alışveriş"},{"id":"L1-277","de":"Möchten Sie den Kassenbon?","tr":"Fişi ister misiniz?","ex":"– Möchten Sie den Kassenbon? – Nein, danke.","note":"Kasada çok sorulur; kısaca \"den Bon\".","cat":"Kafe & Alışveriş"},{"id":"L1-278","de":"Der Nächste, bitte!","tr":"Sıradaki, lütfen!","ex":"– Der Nächste, bitte! – Hallo, ich hätte gern zwei Brötchen.","note":"Kasada, fırında, resmî dairede duyulur.","cat":"Kafe & Alışveriş"},{"id":"L1-279","de":"Ich hab Urlaub.","tr":"İzinde Ich gehe kurz einkaufen. Brauchst du was?","note":"\"einkaufen gehen\" günlük market alışverişi.","cat":"Ev & aile"},{"id":"L1-291","de":"Zähne putzen!","tr":"Diş fırçalama vakti!","ex":"Gece, Schlafanzug an und Zähne putzen!","note":"Çocuğa kısa emir; mastar hâli.","cat":"Ev & aile"},{"id":"L1-292","de":"Mach bitte das Licht aus.","tr":"Lütfen ışığı kapat.","ex":"Ich will schlafen, mach bitte das Licht aus.","note":"Açmak: \"Mach das Licht an.\"","cat":"Ev & aile"},{"id":"L1-293","de":"Wer ist da?","tr":"Kim o?","ex":"Es klingelt. – Wer ist da? – Die Post!","note":"Kapı zili çalınca diafonda.","cat":"Ev & aile"},{"id":"L1-294","de":"Rufen Sie einen Krankenwagen!","tr":"Ambulans çağırın!","ex":"Schnell, rufen Sie einen Krankenwagen!","note":"Acil numara 112.","cat":"Sağlık"},{"id":"L1-295","de":"Ich bin zum ersten Mal hier.","tr":"İlk defa geliyorum.","ex":"Guten Tag, ich bin zum ersten Mal hier.","note":"Muayenehanede; genelde form doldurtulur.","cat":"Sağlık"},{"id":"L1-296","de":"Ich verstehe den Brief nicht.","tr":"Mektubu anlamıyorum.","ex":"Ich verstehe den Brief vom Jobcenter nicht.","note":"Resmi mektuplar için yardım isterken.","cat":"Resmi işler"},{"id":"L1-297","de":"Ich möchte Geld abheben.","tr":"Para çekmek istiyorum.","ex":"Ich möchte hundert Euro abheben.","note":"Para yatırmak: Geld einzahlen.","cat":"Resmi işler"},{"id":"L1-298","de":"Ich habe meine Karte verloren.","tr":"Kartımı kaybettim.","ex":"Ich habe meine Bankkarte verloren. Was soll ich machen?","note":"Kart kaybında hemen kapattır: 116 116.","cat":"Resmi işler"},{"id":"L1-299","de":"Ich möchte das Paket in die Türkei schicken.","tr":"Paketi Türkiye'ye göndermek istiyorum.","ex":"– Was kann ich für Sie tun? – Ich möchte das Paket in die Türkei schicken.","note":"in die Türkei: Türkei hep artikelle kullanılır.","cat":"Resmi işler"},{"id":"L1-300","de":"Hin und zurück?","tr":"Gidiş dönüş mü?","ex":"– Einmal nach Bonn, bitte. – Hin und zurück?","note":"Sadece gidiş: 'Nur hin.' / einfach.","cat":"Yol & ulaşım"},{"id":"L1-301","de":"Die Fahrkarten, bitte!","tr":"Biletler, lütfen!","ex":"Guten Tag, die Fahrkarten, bitte!","note":"Kontrolörden duyulur; biletsiz binmek: schwarzfahren.","cat":"Yol & ulaşım"},{"id":"L1-302","de":"Wo kann ich ein Ticket kaufen?","tr":"Nereden bilet alabilirim?","ex":"Entschuldigung, wo kann ich hier ein Ticket kaufen?","note":"Automat = otomat; App ile de alınır.","cat":"Yol & ulaşım"},{"id":"L1-303","de":"Können Sie mir das auf der Karte zeigen?","tr":"Bunu haritada gösterebilir misiniz?","ex":"Ich finde das nicht. Können Sie mir das auf der Karte zeigen?","note":"Telefondaki haritayı uzatarak sorulur.","cat":"Yol & ulaşım"},{"id":"L1-304","de":"Kann man da zu Fuß hingehen?","tr":"Oraya yürüyerek gidilir mi?","ex":"– Kann man da zu Fuß hingehen? – Ja, zehn Minuten.","note":"zu Fuß = yürüyerek.","cat":"Yol & ulaşım"},{"id":"L1-305","de":"Wo kann ich hier parken?","tr":"Burada nereye park edebilirim?","ex":"Entschuldigung, wo kann ich hier parken?","note":"Parkplatz = park yeri; Parkhaus = otopark binası.","cat":"Yol & ulaşım"},{"id":"L1-306","de":"Wie lange wohnst du schon in Deutschland?","tr":"Ne zamandır Almanya'da yaşıyorsun?","ex":"– Wie lange wohnst du schon in Deutschland? – Seit drei Jahren.","note":"Göçmenlere çok sorulur; cevap \"seit\" ile.","cat":"Sohbet"},{"id":"L1-307","de":"Ich lerne Deutsch.","tr":"Almanca öğreniyorum.","ex":"Ich lerne Deutsch, bitte sprich langsam.","note":"İnsanlar genelde sabırlı olur, rahat söyle.","cat":"Sohbet"},{"id":"L1-308","de":"Ich habe ein Zimmer reserviert.","tr":"Bir oda ayırttım.","ex":"Guten Abend, ich habe ein Zimmer auf den Namen Yılmaz reserviert.","note":"auf den Namen … = … adına.","cat":"Yol & ulaşım"},{"id":"L1-309","de":"Ich bin verheiratet.","tr":"Evliyim.","ex":"Ich bin verheiratet und habe eine Tochter.","note":"Bekâr: \"ledig\"; ilişkide: \"Ich habe eine Freundin.\"","cat":"Sohbet"},{"id":"L1-310","de":"Haben Sie noch ein Zimmer frei?","tr":"Boş odanız var mı?","ex":"H . Können Sie das bitte aufschreiben?","note":"Telefon, adres, isim anlaşılmayınca.","cat":"Rica"},{"id":"L1-321","de":"Wir sind gerade eingezogen.","tr":"Buraya yeni taşındık.","ex":"Hallo, wir sind gerade eingezogen. Wir wohnen im zweiten Stock.","note":"Yeni komşularla tanışırken.","cat":"Ev & komşu"},{"id":"L1-322","de":"Hallo zusammen!","tr":"Herkese merhaba!","ex":"Hallo zusammen! Sorry, dass ich zu spät bin.","note":"Gruba selam; işte ve grup mesajında.","cat":"Sohbet"},{"id":"L1-323","de":"Ich bin Ihr neuer Nachbar.","tr":"Yeni komşunuzum.","ex":"Guten Tag, ich bin Ihr neuer Nachbar von oben.","note":"Kadın: Ihre neue Nachbarin.","cat":"Ev & komşu"},{"id":"L1-324","de":"Entschuldigung, es ist ein bisschen laut.","tr":"Pardon, biraz gürültü var.","ex":"Entschuldigung, es ist ein bisschen laut. Unser Kind schläft.","note":"Komşuya kibarca şikayet etmek için.","cat":"Ev & komşu"},{"id":"L1-325","de":"Das ist mir zu teuer.","tr":"Bu bana pahalı geliyor.","ex":"Die Jacke ist schön, aber das ist mir zu teuer.","note":"\"mir zu …\" = bana fazla …","cat":"Tepki"},{"id":"L1-326","de":"Bedien dich!","tr":"Buyur, al!","ex":"Hier sind Kekse, bedien dich!","note":"Misafire ikram; çoğulda \"Bedient euch!\"","cat":"Rica"},{"id":"L1-327","de":"Ist das okay für dich?","tr":"Senin için uygun mu?","ex":"Ich komme um acht. Ist das okay für dich?","note":"Karşının onayını almak için.","cat":"Rica"},{"id":"L1-328","de":"Der Aufzug funktioniert nicht.","tr":"Asansör çalışmıyor.","ex":"Der Aufzug funktioniert schon wieder nicht.","note":"Konuşmada 'geht nicht' de denir.","cat":"Ev & komşu"},{"id":"L1-329","de":"Ich bin traurig.","tr":"Üzgünüm. / Moralim bozuk.","ex":"Ich bin ein bisschen traurig, weil Lena wegzieht.","note":"Özür için değil, duygu için; özür \"Tut mir leid\".","cat":"Duygu"},{"id":"L1-330","de":"Ich muss den Hausmeister anrufen.","tr":"Hausmeister'i aramam lazım.","ex":"Die Haustür schließt nicht, ich muss den Hausmeister anrufen.","note":"Hausmeister = bina sorumlu k duyulur.","cat":"Telefon & randevu"},{"id":"L1-352","de":"Still oder mit Kohlensäure?","tr":"Gazsız mı, gazlı mı?","ex":"– Ein Wasser, bitte. – Still oder mit Kohlensäure?","note":"Almanya'da \"Wasser\" denince hep sorulur.","cat":"Restoran"},{"id":"L1-353","de":"Mit Milch und Zucker?","tr":"Sütlü ve şekerli mi?","ex":"– Einen Kaffee, bitte. – Mit Milch und Zucker?","note":"Kafede, ofiste, evde misafire.","cat":"Kafe & Alışveriş"},{"id":"L1-354","de":"Ich suche …","tr":"… arıyorum.","ex":"Ich suche eine Winterjacke für meine Tochter.","note":"Satıcıya ne istediğini söylemek için.","cat":"Kafe & Alışveriş"},{"id":"L1-355","de":"Welche Größe haben Sie?","tr":"Bedeniniz kaç?","ex":"– Welche Größe haben Sie? – M, glaube ich.","note":"Ayakkabıda: \"Welche Schuhgröße?\"","cat":"Kafe & Alışveriş"},{"id":"L1-356","de":"Das passt mir nicht.","tr":"Bu bana olmuyor.","ex":"Die Hose passt mir nicht, sie ist zu eng.","note":"Kıyafet beden olarak uymayınca.","cat":"Kafe & Alışveriş"},{"id":"L1-357","de":"Bis wann haben Sie geöffnet?","tr":"Saat kaça kadar açıksınız?","ex":"Bis wann haben Sie heute geöffnet?","note":"Pazar günleri çoğu dükkân kapalı!","cat":"Kafe & Alışveriş"},{"id":"L1-358","de":"Hast du die Mail bekommen?","tr":"Maili aldın mı?","ex":"Hast du die Mail von heute Morgen bekommen?","note":"İşte kontrol için çok sık.","cat":"İş"},{"id":"L1-359","de":"Ich schick dir das per Mail.","tr":"Bunu sana mail atarım.","ex":"Ich schick dir das gleich per Mail.","note":"\"schick\" = \"schicke\"nin günlük hâli.","cat":"İş"},{"id":"L1-360","de":"Ich gehe heute früher.","tr":"Bugün erken çıkıyorum.","ex":"Ich gehe heute früher, ich muss Gece abholen.","note":"İş arkadaşlarına haber verirken.","cat":"İş"},{"id":"L1-361","de":"Sorry, hab deine Nachricht zu spät gesehen.","tr":"Pardon, mesajını geç gördüm.","ex":"Sorry, hab deine Nachricht zu spät gesehen! Passt morgen?","note":"Geç cevap verirken mesaj başı.","cat":"Mesajlaşma"},{"id":"L1-362","de":"Ich bin vor der Tür.","tr":"Ka ache mir Sorgen um dich.\"","cat":"Duygu"},{"id":"L1-383","de":"Ich muss meinen Termin absagen.","tr":"Randevumu iptal etmem lazım.","ex":"Leider muss ich meinen Termin morgen absagen.","note":"Ertelemek: den Termin verschieben.","cat":"Telefon & randevu"},{"id":"L1-384","de":"Hast du am Samstag schon was vor?","tr":"Cumartesi bir planın var mı?","ex":"Hast du am Samstag schon was vor? Wir grillen.","note":"Davetten önce müsaitliği sormanın tipik yolu.","cat":"Zaman & plan"},{"id":"L1-385","de":"Ich hab schon was vor.","tr":"Başka bir planım var.","ex":"Am Freitag geht's leider nicht, ich hab schon was vor.","note":"Daveti kibarca reddetmek için.","cat":"Zaman & plan"},{"id":"L1-386","de":"Ich möchte das umtauschen.","tr":"Bunu değiştirmek istiyorum.","ex":"Ich möchte das umtauschen, es ist zu klein.","note":"Fişi (Kassenbon) yanında götür.","cat":"Kafe & Alışveriş"},{"id":"L1-387","de":"Ich bin gerade in einem Meeting.","tr":"Şu an toplantıdayım.","ex":"Ich bin gerade in einem Meeting, ich ruf dich gleich zurück.","note":"\"Besprechung\" da denir, daha resmî.","cat":"İş"},{"id":"L1-388","de":"Ich kümmere mich darum.","tr":"Ben ilgilenirim.","ex":"Kein Problem, ich kümmere mich darum.","note":"İşte ve evde sorumluluk alırken.","cat":"İş"},{"id":"L1-389","de":"Mir ist schwindelig.","tr":"Başım dönüyor.","ex":"Mir ist schwindelig, ich muss mich setzen.","note":"Mir ist kalt/warm gibi Dativ'le kurulur.","cat":"Sağlık"},{"id":"L1-390","de":"Ich bin allergisch gegen …","tr":"…'e alerjim var.","ex":"Ich bin allergisch gegen Penicillin.","note":"Doktorda ve restoranda önemli.","cat":"Sağlık"},{"id":"L1-391","de":"Machen Sie bitte den Oberkörper frei.","tr":"Lütfen belden yukarı soyunun.","ex":"Machen Sie bitte den Oberkörper frei, ich höre Sie ab.","note":"Muayenede doktordan duyulur.","cat":"Sağlık"},{"id":"L1-392","de":"Ich brauche eine Überweisung.","tr":"Sevk kâğıdı lazım.","ex":"Ich brauche eine Überweisung zum Hautarzt.","note":"Uzman doktor için ev doktorundan alını on?","tr":"Bunun bir fotokopisi var mı?","ex":"Haben Sie eine Kopie davon? Das Original bekommen Sie zurück.","note":"Resmi dairelerde genelde fotokopi istenir.","cat":"Resmi işler"},{"id":"L1-403","de":"Das Formular finden Sie online.","tr":"Formu internette bulabilirsiniz.","ex":"Das Formular finden Sie online auf unserer Webseite.","note":"Resmi yerlerde sık duyulur.","cat":"Resmi işler"},{"id":"L1-404","de":"Mein Aufenthaltstitel läuft bald ab.","tr":"Oturma iznimin süresi yakında doluyor.","ex":"Mein Aufenthaltstitel läuft bald ab. Was muss ich tun?","note":"Pasaport için: 'Mein Pass ist abgelaufen.'","cat":"Resmi işler"},{"id":"L1-405","de":"Ich habe noch keine Antwort bekommen.","tr":"Henüz cevap almadım.","ex":"Ich habe vor vier Wochen geschrieben und noch keine Antwort bekommen.","note":"Başvuruyu takip ederken kullanılır.","cat":"Resmi işler"},{"id":"L1-406","de":"Können Sie mir eine Bestätigung geben?","tr":"Bana bir onay belgesi verebilir misiniz?","ex":"Können Sie mir bitte eine Bestätigung für den Arbeitgeber geben?","note":"Bescheinigung de denir.","cat":"Resmi işler"},{"id":"L1-407","de":"Bitte zurückbleiben!","tr":"Lütfen geri çekilin!","ex":"Bitte zurückbleiben, die Türen schließen.","note":"Metroda kapı kapanırken anons.","cat":"Yol & ulaşım"},{"id":"L1-408","de":"Gilt das Ticket auch für die S-Bahn?","tr":"Bilet S-Bahn için de geçerli mi?","ex":"Ich habe ein Deutschlandticket. Gilt das auch für die S-Bahn?","note":"gelten = geçerli olmak; ICE'de Deutschlandticket geçmez.","cat":"Yol & ulaşım"},{"id":"L1-409","de":"Ich habe mich verlaufen.","tr":"Yolumu kaybettim (yürürken).","ex":"Entschuldigung, ich habe mich verlaufen. Wo ist der Marktplatz?","note":"Arabayla kaybolunca: 'Ich habe mich verfahren.'","cat":"Yol & ulaşım"},{"id":"L1-410","de":"Die Bahn streikt.","tr":"Demiryolu grevde.","ex":"Morgen streikt die Bahn, ich arbeite im Homeoffice.","note":"Almanya'da sık olur; Streik = grev.","cat":"Yol & ulaşım"},{"id":"L1-411","de":"Wie lange fährt {"id":"L1-421","de":"Der Müll wird am Dienstag abgeholt.","tr":"Çöp salı günü alınıyor.","ex":"Der Restmüll wird am Dienstag abgeholt.","note":"Restmüll, Biomüll, Papier, Gelber Sack ayrı toplanır.","cat":"Ev & komşu"},{"id":"L1-422","de":"In welche Tonne kommt das?","tr":"Bu hangi çöp kutusuna gidiyor?","ex":"– In welche Tonne kommt das? – In die gelbe.","note":"Tonne = çöp konteyneri.","cat":"Ev & komşu"},{"id":"L1-423","de":"Das wäre nett.","tr":"Çok iyi olur.","ex":"– Soll ich dich mitnehmen? – Oh ja, das wäre nett!","note":"Teklifi kibarca kabul ederken.","cat":"Rica"},{"id":"L1-424","de":"Wann kann ich die Wohnung besichtigen?","tr":"Daireyi ne zaman görebilirim?","ex":"Wann kann ich die Wohnung besichtigen?","note":"Besichtigung = ev gezme.","cat":"Ev & komşu"},{"id":"L1-425","de":"Sind die Nebenkosten inklusive?","tr":"Yan giderler dahil mi?","ex":"Die Miete ist 800 Euro. Sind die Nebenkosten inklusive?","note":"Nebenkosten: ısınma, su, çöp vb.","cat":"Ev & komşu"},{"id":"L1-426","de":"Es zieht.","tr":"Cereyan yapıyor.","ex":"Mach bitte das Fenster zu, es zieht.","note":"Almanlar cereyandan çok şikayet eder.","cat":"Ev & komşu"},{"id":"L1-427","de":"Ich bin aufgeregt.","tr":"Heyecanlıyım.","ex":"Morgen ist mein erster Arbeitstag. Ich bin so aufgeregt!","note":"Hem güzel heyecan hem gerginlik için.","cat":"Duygu"},{"id":"L1-428","de":"Bitte bringen Sie Wechselkleidung mit.","tr":"Lütfen yedek kıyafet getirin.","ex":"Bitte bringen Sie Wechselkleidung und Windeln mit.","note":"Kreşte sık duyulur.","cat":"Okul & kreş"},{"id":"L1-429","de":"Morgen ist Elternabend.","tr":"Yarın veli toplantısı var.","ex":"Morgen ist Elternabend, kannst du auf Gece aufpassen?","note":"Elterngespräch = öğretmenle bireysel görüşme.","cat":"Okul & kreş"},{"id":"L1-430","de":"Haben Sie noch einen Kita-Platz frei?","tr":"Boş kreş yeriniz var mı?","ex":"Guten Tag, haben Sie noch einen Kita-Platz frei?","note":"Kita-Gutschein birçok şehirde gerekli.","cat":"Okul & kreş"},{"id":"L1-431","d amandır bekliyoruz.","ex":"Entschuldigung, wir warten schon lange auf das Essen.","note":"Kibar ama net şikâyet.","cat":"Restoran"},{"id":"L1-441","de":"Ich verbinde Sie.","tr":"Sizi bağlıyorum.","ex":"Einen Augenblick, ich verbinde Sie.","note":"Santralden duyulur.","cat":"Telefon & randevu"},{"id":"L1-442","de":"Alle Mitarbeiter sind im Gespräch.","tr":"Tüm temsilcilerimiz meşgul.","ex":"Alle Mitarbeiter sind im Gespräch. Bitte warten Sie.","note":"Bekleme müziğinde duyulan anons.","cat":"Telefon & randevu"},{"id":"L1-443","de":"Ich habe es schon mehrmals versucht.","tr":"Birkaç kez denedim.","ex":"Ich habe es schon mehrmals versucht, aber niemand geht ran.","note":"rangehen = telefonu açmak.","cat":"Telefon & randevu"},{"id":"L1-444","de":"Kann ich den Termin online buchen?","tr":"Randevuyu internetten alabilir miyim?","ex":"Kann ich den Termin auch online buchen?","note":"Birçok doktor Doctolib vb. kullanır.","cat":"Telefon & randevu"},{"id":"L1-445","de":"Der nächste freie Termin ist im März.","tr":"En yakın boş randevu Mart'ta.","ex":"Tut mir leid, der nächste freie Termin ist erst im März.","note":"Uzman doktorlarda çok sık duyulur.","cat":"Telefon & randevu"},{"id":"L1-446","de":"Kann ich das zurückgeben?","tr":"Bunu iade edebilir miyim?","ex":"Kann ich das zurückgeben, wenn es nicht passt?","note":"İade süresi genelde 14 gün; fişi sakla.","cat":"Kafe & Alışveriş"},{"id":"L1-447","de":"Mit wem spreche ich?","tr":"Kiminle görüşüyorum?","ex":"Entschuldigung, mit wem spreche ich?","note":"Telefonda karşı taraf adını söylemeyince.","cat":"Telefon & randevu"},{"id":"L1-448","de":"Ich bin um zehn Uhr angemeldet.","tr":"Saat onda randevum var.","ex":"Guten Morgen, ich bin um zehn Uhr bei Dr. Kaya angemeldet.","note":"Muayenehane girişinde resepsiyona söylenir.","cat":"Telefon & randevu"},{"id":"L1-449","de":"Bis wann brauchst du das?","tr":"Buna ne zamana kadar ihtiyacın var?","ex":"Klar, mach ich. Bis wann brauchst du das?","note":"İşte görev alırken teslim tarihini sor.","cat":"İş"},{"id":"L1-450","de":"Der Wasserhahn tropft.","tr":"Musluk damlatıyor.","ex":"Der Wasserhahn in der Küche tropft.","note":"Küçük tamirler için ev sahibine bildirilir.","cat":"Ev & komşu"},{"id":"L1-451","de":"Ich habe mich ausgesperrt.","tr":"Kapıda kaldım; anahtarım içeride.","ex":"Ich habe mich ausgesperrt, der Schlüssel ist drin.","note":"Schlüsseldienst = çilingir (pahalı).","cat":"Ev & komşu"},{"id":"L1-452","de":"Wann bekomme ich die Kaution zurück?","tr":"Depozitomu ne zaman geri alırım?","ex":"Ich bin ausgezogen. Wann bekomme ich die Kaution zurück?","note":"Kaution en fazla üç aylık soğuk kira olabilir.","cat":"Ev & komşu"},{"id":"L1-453","de":"Brauche ich eine beglaubigte Übersetzung?","tr":"Onaylı tercüme gerekir mi?","ex":"Meine Geburtsurkunde ist auf Türkisch. Brauche ich eine beglaubigte Übersetzung?","note":"Yeminli tercümana yaptırılır.","cat":"Resmi işler"},{"id":"L1-454","de":"In der Gruppe gibt es Läuse.","tr":"Grupta bit var.","ex":"Achtung: In der Gruppe gibt es Läuse.","note":"Kreşte sık duyurulan bir uyarı.","cat":"Okul & kreş"},{"id":"L1-455","de":"Bitte sprechen Sie nach dem Signalton.","tr":"Lütfen sinyal sesinden sonra konuşun.","ex":"Ich bin nicht erreichbar. Bitte sprechen Sie nach dem Signalton.","note":"Telesekreter (Mailbox) anonsu.","cat":"Telefon & randevu"},{"id":"L1-456","de":"Was ist das?","tr":"Bu ne?","ex":"– Was ist das? – Das ist ein Brötchen.","note":"Kişi için: 'Wer ist das?' (Bu kim?).","cat":"Sohbet"},{"id":"L1-457","de":"Gibt es hier …?","tr":"Burada … var mı?","ex":"Gibt es hier in der Nähe eine Apotheke?","note":"'es gibt' + Akkusativ: einen, eine, ein.","cat":"Sohbet"},{"id":"L1-458","de":"Es geht.","tr":"İdare eder / Şöyle böyle.","ex":"– Wie geht's dir? – Es geht, ich bin müde.","note":"'Wie geht's?' sorusuna ne iyi ne kötü cevabı.","cat":"Tepki"},{"id":"L1-459","de":"Bis bald!","tr":"Görüşmek üzere!","ex":"Danke für alles, bis bald!","note":"Ne zaman görüşeceğiniz belli değilse kullanılır.","cat":"Tepki"},{"id":"L1-460","de":"Am Montag um neun (Uhr).","tr":"Pazartesi saat dokuzda.","ex":"– Wann ist der Termin? – Am Montag um neun Uhr.","note":"Gün: am Montag; saat: um neun; ay: im Mai.","cat":"Zaman & plan"},{"id":"L1-461","de":"Ich hab Durst.","tr":"Susadım.","ex":"Mama, ich hab Durst! Kann ich Wasser haben?","note":"'Ich bin durstig' denmez pek; 'Durst haben' doğal.","cat":"Duygu"},{"id":"L1-462","de":"Hilfe!","tr":"İmdat! / Yardım edin!","ex":"Hilfe! Hier ist jemand umgefallen!","note":"Acil durumda yüksek sesle bağır.","cat":"Sağlık"},{"id":"L1-463","de":"Das gefällt mir.","tr":"Bunu beğendim / Hoşuma gidiyor.","ex":"Die Wohnung ist hell, das gefällt mir.","note":"Çoğulda: 'Die Schuhe gefallen mir.'","cat":"Duygu"},{"id":"L1-464","de":"Viele Grüße","tr":"Selamlar / Saygılar (nötr)","ex":"Bis Montag und viele Grüße, Atakan","note":"Öğretmen, ev sahibi, iş: 'Liebe Grüße'den daha nötr.","cat":"Mesajlaşma"},{"id":"L1-465","de":"Liebe …, / Lieber …,","tr":"Sevgili …, / Merhaba …, (mesaj başı)","ex":"Liebe Lena, vielen Dank für die Einladung!","note":"Kadına 'Liebe', erkeğe 'Lieber': Lieber Tom.","cat":"Mesajlaşma"},{"id":"L1-466","de":"Ich … gern.","tr":"… yapmayı severim.","ex":"Ich koche gern, aber ich putze nicht gern.","note":"'gern' fiilden sonra gelir: Ich schwimme gern.","cat":"Sohbet"},{"id":"L1-467","de":"Frohe Weihnachten!","tr":"Mutlu Noeller!","ex":"Frohe Weihnachten und schöne Feiertage!","note":"Aralıkta komşu, iş, kreşte herkes söyler.","cat":"Ev & aile"},{"id":"L1-468","de":"Guten Rutsch!","tr":"İyi seneler! (yılbaşı öncesi)","ex":"Bis nächstes Jahr – guten Rutsch!","note":"31 Aralık'tan önce söylenir; sonra 'Frohes neues Jahr!'","cat":"Ev & aile"},{"id":"L1-469","de":"Frohes neues Jahr!","tr":"Mutlu yıllar! (yeni yıl)","ex":"Frohes neues Jahr! Wie war Silvester?","note":"Ocak başında selamlaşırken kullanılır.","cat":"Ev & aile"},{"id":"L1-470","de":"Welcher Tag ist heute?","tr":"Bugün günlerden ne?","ex":"– Welcher Tag ist heute? – Heute ist Mittwoch.","note":"Tarih için: 'Der Wievielte ist heute?'","cat":"Zaman & plan"},{"id":"L1-471","de":"Prost! / Zum Wohl!","tr":"Şerefe!","ex":"Prost! Auf Lenas Geburtstag!","note":"Kadeh tokuştururken göz göze bakılır.","cat":"Tepki"},{"id":"L1-472","de":"Gute Reise!","tr":"İyi yolculuklar!","ex":"Ihr fliegt morgen in die Türkei? Gute Reise!","note":"Arabayla gidene 'Gute Fahrt!' de denir.","cat":"Tepki"},{"id":"L1-473","de":"Schönen Urlaub!","tr":"İyi tatiller!","ex":"Ab Montag bist du weg? Schönen Urlaub!","note":"İşte tatile çıkan meslektaşa söylenir.","cat":"Tepki"},{"id":"L1-474","de":"Schöne Grüße an …!","tr":"…'e selam söyle!","ex":"Schöne Grüße an Nisa!","note":"Kısa hali: 'Grüß Nisa von mir!'","cat":"Ev & aile"},{"id":"L1-475","de":"Was für ein schönes Wetter!","tr":"Ne güzel hava!","ex":"Was für ein schönes Wetter! Gehen wir in den Park?","note":"Komşuyla, kasada sohbet açmanın en kolay yolu.","cat":"Tepki"},{"id":"L1-476","de":"Es regnet schon wieder.","tr":"Yine yağmur yağıyor.","ex":"Es regnet schon wieder, nimm einen Regenschirm mit.","note":"Kar için: 'Es schneit.'","cat":"Sohbet"},{"id":"L1-477","de":"Wie wird das Wetter morgen?","tr":"Yarın hava nasıl olacak?","ex":"– Wie wird das Wetter morgen? – Warm und sonnig.","note":"Plan yaparken sık sorulur.","cat":"Sohbet"},{"id":"L1-478","de":"Heute ist es richtig heiß.","tr":"Bugün hava çok sıcak.","ex":"Heute ist es richtig heiß, über dreißig Grad!","note":"Soğuk için: 'Heute ist es richtig kalt.'","cat":"Sohbet"},{"id":"L1-479","de":"Ich bin … Jahre alt.","tr":"… yaşındayım.","ex":"– Wie alt ist Gece? – Sie ist drei Jahre alt.","note":"'Ich habe … Jahre' denmez!","cat":"Sohbet"},{"id":"L1-480","de":"Ich wohne seit … in …","tr":"…'dan beri …'da oturuyorum.","ex":"Ich wohne seit drei Jahren in Deutschland.","note":"seit + Dativ, fiil şimdiki zamanda kalır.","cat":"Sohbet"},{"id":"L1-481","de":"vor … (Tagen/Jahren)","tr":"… (gün/yıl) önce","ex":"Ich bin vor zwei Jahren nach Deutschland gekommen.","note":"vor + Dativ: vor einer Woche, vor zwei Tagen.","cat":"Zaman & plan"},{"id":"L1-482","de":"von … bis …","tr":"…'dan …'a kadar","ex":"Ich arbeite von Montag bis Freitag, von acht bis vier.","note":"Açılış saatleri ve randevularda çok geçer.","cat":"Zaman & plan"},{"id":"L1-483","de":"Ruf sofort die 112 an!","tr":"Hemen 112'yi ara!","ex":"Er atmet nicht richtig – ruf sofort die 112 an!","note":"112: ambulans ve itfaiye; polis 110.","cat":"Sağlık"},{"id":"L1-484","de":"Rufen Sie die Polizei!","tr":"Polisi arayın!","ex":"Da ist ein Unfall passiert, rufen Sie die Polizei!","note":"Polis numarası 110.","cat":"Sağlık"},{"id":"L1-485","de":"Ich brauche einen Arzt.","tr":"Bir doktora ihtiyacım var.","ex":"Mir geht es sehr schlecht, ich brauche einen Arzt.","note":"Gece/hafta sonu: Bereitschaftsdienst 116 117.","cat":"Sağlık"},{"id":"L1-486","de":"Wo ist das nächste Krankenhaus?","tr":"En yakın hastane nerede?","ex":"Entschuldigung, wo ist das nächste Krankenhaus?","note":"Acil servis: 'die Notaufnahme'.","cat":"Sağlık"},{"id":"L1-487","de":"Seit … Tagen.","tr":"… gündür.","ex":"– Seit wann haben Sie Fieber? – Seit drei Tagen.","note":"Doktor hep 'Seit wann?' diye sorar.","cat":"Sağlık"},{"id":"L1-488","de":"Noch ein …, bitte.","tr":"Bir … daha, lütfen.","ex":"Noch ein Wasser, bitte!","note":"Eril: 'Noch einen Kaffee, bitte.'","cat":"Restoran"},{"id":"L1-489","de":"Haben Sie einen Kinderstuhl?","tr":"Mama sandalyeniz var mı?","ex":"Wir sind zu dritt. Haben Sie einen Kinderstuhl?","note":"Restoranda küçük çocukla en sık soru.","cat":"Restoran"},{"id":"L1-490","de":"Ich esse kein Schweinefleisch.","tr":"Domuz eti yemiyorum.","ex":"Ich esse kein Schweinefleisch. Ist die Wurst vom Rind?","note":"'Ist da Schweinefleisch drin?' ile birlikte kullanışlı.","cat":"Restoran"},{"id":"L1-491","de":"Wo muss ich aussteigen?","tr":"Nerede inmem lazım?","ex":"Ich will zum Rathaus. Wo muss ich aussteigen?","note":"'umsteigen' aktarma, 'aussteigen' inmek.","cat":"Yol & ulaşım"},{"id":"L1-492","de":"Tut mir leid, ich bin nicht von hier.","tr":"Üzgünüm, buralı değilim.","ex":"– Wo ist die Post? – Tut mir leid, ich bin nicht von hier.","note":"Yol bilmediğinde kibar cevap.","cat":"Yol & ulaşım"},{"id":"L1-493","de":"Wie ist Ihre Adresse?","tr":"Adresiniz nedir?","ex":"– Wie ist Ihre Adresse? – Bahnhofstraße 5 in Köln.","note":"Önce sokak, sonra numara söylenir.","cat":"Resmi işler"},{"id":"L1-494","de":"Ich möchte ein Paket abholen.","tr":"Bir paket teslim almak istiyorum.","ex":"Ich möchte ein Paket abholen. Hier ist die Karte.","note":"Evde değilsen postacı kart bırakır; kimlik götür.","cat":"Resmi işler"},{"id":"L1-495","de":"Was machen wir heute?","tr":"Bugün ne yapıyoruz?","ex":"Es ist Sonntag. Was machen wir heute mit Gece?","note":"Hafta sonu ailede en sık soru.","cat":"Ev & aile"},{"id":"L1-496","de":"Das macht Spaß!","tr":"Bu çok eğlenceli!","ex":"Schwimmen macht Gece richtig Spaß.","note":"Olumsuz: 'Das macht keinen Spaß.'","cat":"Duygu"},{"id":"L1-497","de":"Ich bin so froh!","tr":"Çok sevindim! / Çok mutluyum!","ex":"Ich bin so froh, dass es dir besser geht.","note":"Sık kalıp: 'Ich bin froh, dass …'","cat":"Duygu"},{"id":"L1-498","de":"Wann hast du Feierabend?","tr":"İşten kaçta çıkıyorsun?","ex":"– Wann hast du heute Feierabend? – Um fünf.","note":"'Feierabend' = mesai bitişi, çok günlük kelime.","cat":"İş"},{"id":"L1-499","de":"Gibst du mir deine Nummer?","tr":"Numaranı verir misin?","ex":"Gibst du mir deine Nummer? Dann schreib ich dir.","note":"Resmî: 'Wie ist Ihre Telefonnummer?'","cat":"Telefon & randevu"},{"id":"L1-500","de":"Danke, es war sehr schön!","tr":"Teşekkürler, çok güzeldi!","ex":"Danke für das Essen, es war sehr schön!","note":"Misafirlikten ayrılırken söylenir.","cat":"Sohbet"},{"id":"L1-501","de":"Danke für deine Hilfe!","tr":"Yardımın için teşekkürler!","ex":"Danke für deine Hilfe beim Umzug!","note":"Resmî: 'Vielen Dank für Ihre Hilfe!'","cat":"Tepki"},{"id":"L1-502","de":"Frohe Ostern!","tr":"Mutlu Paskalyalar!","ex":"Frohe Ostern! Habt ihr Eier gesucht?","note":"Kreşte de Paskalya kutlanır.","cat":"Ev & aile"},{"id":"L1-503","de":"Schöne Feiertage!","tr":"İyi tatiller! (bayram/tatil günleri)","ex":"Bis Januar – schöne Feiertage!","note":"Noel–yılbaşı arası işte ve kreşte çok duyulur.","cat":"Ev & aile"},{"id":"L1-504","de":"Ich bin stolz auf dich!","tr":"Seninle gurur duyuyorum!","ex":"Du hast dich ganz allein angezogen? Ich bin stolz auf dich!","note":"stolz auf + Akkusativ.","cat":"Ev & aile"},{"id":"L1-505","de":"Herein!","tr":"Girin!","ex":"– (Klopfen) – Herein! – Guten Tag, ich habe einen Termin.","note":"Ofiste kapı çalınca duyacağın cevap.","cat":"Tepki"},{"id":"L1-506","de":"Eine Briefmarke für …, bitte.","tr":"… için bir pul, lütfen.","ex":"Eine Briefmarke für einen Brief in die Türkei, bitte.","note":"Postanede veya kioskta sorulur.","cat":"Resmi işler"},{"id":"L1-507","de":"Wie groß ist die Wohnung?","tr":"Daire kaç metrekare?","ex":"– Wie groß ist die Wohnung? – 75 Quadratmeter, drei Zimmer.","note":"Almanya'da büyüklük m² ve oda sayısıyla söylenir.","cat":"Ev & komşu"},{"id":"L1-508","de":"Ich habe einen neuen Job.","tr":"Yeni bir işim var.","ex":"Ich habe einen neuen Job, ab Montag fange ich an.","note":"'Job' günlük; resmî: 'eine neue Stelle'.","cat":"İş"},{"id":"L1-509","de":"Ist das auch für Kinder?","tr":"Bu çocuklar için de uygun mu?","ex":"Meine Tochter ist drei. Ist das auch für Kinder?","note":"Eczanede ilaç alırken mutlaka sor.","cat":"Sağlık"},{"id":"L1-510","de":"Es brennt!","tr":"Yangın var!","ex":"Es brennt! Alle raus, ruf die 112 an!","note":"İtfaiye de 112'dir.","cat":"Sağlık"},{"id":"L1-511","de":"Sehr geehrte Damen und Herren,","tr":"Sayın yetkili, (resmî yazı başı)","ex":"Sehr geehrte Damen und Herren, ich habe eine Frage zu meinem Antrag.","note":"İsim biliniyorsa: 'Sehr geehrte Frau Weber,'","cat":"Mesajlaşma"},{"id":"L1-512","de":"Mit freundlichen Grüßen","tr":"Saygılarımla (resmî kapanış)","ex":"Vielen Dank für Ihre Hilfe. Mit freundlichen Grüßen","note":"Resmî yazıda standart kapanış; sonrasına virgül konmaz.","cat":"Mesajlaşma"},{"id":"L1-513","de":"Dreimal täglich (nach dem Essen).","tr":"Günde üç kez (yemekten sonra).","ex":"Nehmen Sie die Tabletten dreimal täglich nach dem Essen.","note":"'vor dem Essen' = yemekten önce.","cat":"Sağlık"},{"id":"L1-514","de":"Können Sie mir sagen, wo …?","tr":"… nerede, söyler misiniz?","ex":"Können Sie mir sagen, wo die Toiletten sind?","note":"Fiil sona gider: '…, wo der Bahnhof ist?'","cat":"Rica"},{"id":"L1-515","de":"Vielen Dank im Voraus!","tr":"Şimdiden çok teşekkürler!","ex":"Können Sie mir die Unterlagen schicken? Vielen Dank im Voraus!","note":"Rica içeren e-postaların sonunda kullanılır.","cat":"Mesajlaşma"},{"id":"L1-516","de":"Frohes Fest!","tr":"İyi bayramlar! (özellikle Noel)","ex":"Frohes Fest! Feiert ihr mit der Familie?","note":"En çok Noel'de; Bayram için 'Schönes Fest!' de denir.","cat":"Ev & aile"},{"id":"L1-517","de":"Toi, toi, toi!","tr":"Bol şans! (nazar değmesin)","ex":"Morgen hast du die Prüfung? Toi, toi, toi!","note":"Sınav, mülakat öncesi; samimi.","cat":"Tepki"},{"id":"L1-518","de":"Warst du schon mal in …?","tr":"Hiç …'da bulundun mu?","ex":"Warst du schon mal in Istanbul?","note":"Cevap: 'Ja, schon oft.' / 'Nein, noch nie.'","cat":"Sohbet"},{"id":"L1-519","de":"Fühl dich wie zu Hause!","tr":"Kendi evindeymiş gibi rahat ol!","ex":"Komm rein und fühl dich wie zu Hause!","note":"Resmî: 'Fühlen Sie sich wie zu Hause!'","cat":"Sohbet"},{"id":"L1-520","de":"Entschuldigung für die Verspätung.","tr":"Geç kaldığım için özür dilerim.","ex":"Entschuldigung für die Verspätung, die Bahn kam nicht.","note":"Samimi: 'Sorry, dass ich zu spät bin.'","cat":"Tepki"},{"id":"L1-521","de":"Ich möchte Geld überweisen.","tr":"Para havale etmek istiyorum.","ex":"Ich möchte Geld auf dieses Konto überweisen.","note":"Doktordaki 'Überweisung' (sevk) ile karıştırma.","cat":"Resmi işler"},{"id":"L1-522","de":"Ist die Wohnung noch frei?","tr":"Daire hâlâ boş mu?","ex":" /* ---------- tarih ---------- */
const pad = n => String(n).padStart(2, "0");

const TODAY = ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const trDate = s => { const [y,m,d] = s.split("-").map(Number); return d + " " + AYLAR[m-1]; };
const dayNo = () => Math.max(0, Math.round((new Date(TODAY) - new Date(D.start || TODAY)) / 864e5));
function dayRec(){ return S.days[TODAY] = S.days[TODAY] || {}; }
function mark(step){ dayRec()[step] = 1; save(); }
function streak(){
  let n = 0, d = new Date();
  if (!Object.keys(S.days[ymd(d)] || {}).length) d.setDate(d.getDate()-1);
  while (Object.keys(S.days[ymd(d)] || {}).length) { n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- kayıt ---------- */
const KEY = "almanca-gunluk-v1";
let DB = null, SAMPLE = null, syncT = null;
let S = load();
function load(from){
  let s = from || null;

  s.drafts = s.drafts || {}; s.games = s.games || {}; s.gram = s.gram || {}; s.mine = s.mine || []; s.weeks = s.weeks || {}; s.ask = s.ask || []; s.askDone = s.askDone || []; s.qa = s.qa || []; s.skip = s.skip || {}; s.pin = s.pin || {};
  s.opt = Object.assign({theme:"auto", rate:0.9, pace:10, wpace:5, n:10}, s.opt || {});
  // eski kayıt: puan (s) → kutu (b) ve tekrar tarihi
  Object.values(s.prog).forEach(r => { if (r.b === undefined) { r.b = r.s >= 4 ? 4 : r.s ? 1 : 0; r.due = r.due || ymd(new Date()); } });
  return s;
}
function save(){
  S.ts = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  if (DB) { clearTimeout(syncT); syncT = setTimeout(() => DB.doc("state/progress").set({json: JSON.stringify(S)}).catch(() => {}), 800); }
}
// Claude'un düzelttiği yazılar (hesapta) + data.js'tekiler

/* ---------- kartlar: tüm çalışılabilir cümleler tek havuzda ---------- */
// src: ph günlük kalıp · bk kitap kalıbı · bl kitap cümlesi · sc senaryo cümlesi

  sc: {t:"Senaryo cümleleri", ic:"🎭"},

  my: {t:"Benim cümlelerim", ic:"🙋"},

let ITEMS = [], BYID = {}, ITEMS_ALL = [];

const isSkipped = id => (S.skip[id] || 0) > 0, isPinned = id => (S.pin[id] || 0) > 0;
function buildItems(){
  ITEMS = []; BYID = {};
  const add = it => { if (!BYID[it.id]) {
    if (!it.note && NOTES[it.id]) it.note = NOTES[it.id];
    const x = typeof WEX !== "undefined" && WEX[it.id];   // örnek cümle, Türkçesi, ipucu
    if (x) { if (x[0]) it.ex = x[0]; if (x[1] && it.ex) it.ext = x[1]; if (x[2] && !it.note) it.note = x[2]; }
    ITEMS.push(it); BYID[it.id] = it; } };
  D.phrases.forEach(p => add({id:p.id, src:"ph", de:p.de, tr:p.tr, ex:p.ex, d:p.d, cat:p.cat, note:p.note}));
  D.book.chapters.forEach(c => {
    (c.k || []).forEach((k, j) => add({id:`k${c.n}.${j}`, src:"bk", de:k[0], tr:k[1], ch:c.n}));
    c.lines.forEach((l, j) => add({id:`b${c.n}.${j}`, src:"bl", de:l[1], tr:l[2], ch:c.n, sp:l[0]}));
  });
  D.scenarios.forEach(s => {
    s.lines.forEach((l, j) => { if (l[0] === "U") add({id:`${s.id}.${j}`, src:"sc", de:l[1], tr:l[2], sc:s.id}); });
    (s.k || []).forEach((k, j) => add({id:`${s.id}k${j}`, src:"sc", de:k[0], tr:k[1], sc:s.id}));
  });
  // kendi cümlelerim ("Nasıl derim?")
  (S.mine || []).forEach(m => add({id:m.id, src:"my", de:m.de, tr:m.tr, ex:m.ex, note:m.note, d:m.d}));
  // hata defterindeki kartsız hatalar (oyunlardan: sayılar, çekimler, kalıp cümleler)
  if (typeof missCards === "function") missCards(add);
  // kelimeler: isim, fiil, sıfat
  const rows = t => t.trim().split("\n").map(l => l.split("|"));
  rows(W_NOUNS).forEach(([aw, pl, tr, cat, rk], i) => { const [art, w] = aw.split(" "); add({id:"n:" + w, src:"wd", kind:"n", de:aw, w, art, pl: pl === "–" ? "" : pl, tr, cat, o: rk ? +rk : 1000 + i}); });
  rows(W_VERBS).forEach(([w, tr, pr, pf, pt, rk], i) => add({id:"v:" + w, src:"wd", kind:"v", de:w, w, tr, pr:pr.split(","), pf, pt, o: rk ? +rk : 1000 + i}));
  rows(W_ADJ).forEach(([w, tr, opp, rk], i) => add({id:"a:" + w, src:"wd", kind:"a", de:w, w, tr, opp, o: rk ? +rk : 1000 + i}));
  // en sık günlük kalıplar: sadece oyun havuzu için (günlük desteye girmez); Claude'dan gelen aynı kimlikli kalıp önce eklenir
  // en sık 167 kalıp: 12 Ekim'den itibaren her gün 10 tanesi günün kalıbı olur (Claude'daki sabah rutiniyle aynı sıra)
  (typeof L1PH !== "undefined" ? L1PH : []).forEach((p, i) => { const d = new Date(2026, 9, 12 + Math.floor(i / 10)); add({id:p.id, src:"ph", l1:1, de:p.de, tr:p.tr, ex:p.ex, note:p.note, cat:p.cat, d:ymd(d), o:i}); });
  ITEMS_ALL = ITEMS; ITEMS = ITEMS_ALL.filter(i => !isSkipped(i.id));
}
const WORDS = () => ITEMS.filter(i => i.src === "wd");
buildItems();

/* ---------- aralıklı tekrar: kutu 0-8, doğru → bir üst kutu ---------- */
const IV = [0, 1, 2, 4, 8, 16, 35, 75, 160];
const lvl = it => { const r = S.prog[it.id]; return !r ? 0 : r.b >= 4 ? 2 : 1; };
const LVL_TXT = ["Yeni", "Öğreniyorum", "Oturdu"];
const isDue = it => { const r = S.prog[it.id]; return r && r.due <= TODAY; };
function seen(it){ if (!S.prog[it.id]) { S.prog[it.id] = {b:0, due:TODAY, f:TODAY}; const k = it.src === "wd" ? "newW" : "newSeen"; dayRec()[k] = (dayRec()[k] || 0) + 1; } }
function grade(it, ok){
  const r = S.prog[it.id] = S.prog[it.id] || {b:0, due:TODAY};
  if (ok) { r.b = Math.min(8, r.b + 1); r.due = addDays(IV[r.b]); }
  else { r.b = Math.max(1, Math.floor(r.b / 2)); r.due = addDays(r.b > 2 ? 1 : 0); }
  r.last = TODAY; r.n = (r.n || 0) + 1; if (!ok) r.x = (r.x || 0) + 1;
  const d = dayRec(); d.n = (d.n || 0) + 1; if (ok) d.ok = (d.ok || 0) + 1;
}

function todaysPhrases(){
  const ps = ITEMS.filter(i => i.src === "ph");
  const t = ps.filter(p => p.d === TODAY);
  if (t.length) return t;
  // bugün için kalıp gelmediyse: tarihi geçmiş ve henüz başlanmamış olanlar
  return ps.filter(p => p.d <= TODAY && !S.prog[p.id]).slice(0, 10);
}
// okunan kitap bölümleri (yoksa ilk bölüm): kitap alıştırmaları buradan
const readChapters = () => { const r = Object.keys(S.book.read || {}).map(Number); return r.length ? r : [1]; };
function poolFor(src){
  if (src === "ph") return ITEMS.filter(i => i.src === "ph" && (i.d <= TODAY || isPinned(i.id)));
  if (src === "bk" || src === "bl") { const rc = readChapters(); return ITEMS.filter(i => i.src === src && rc.includes(i.ch)); }
  if (src === "sc") { const done = Object.keys(S.scen.done || {}); const sc = done.length ? done : [todaysScenario() && todaysScenario().id]; return ITEMS.filter(i => i.src === "sc" && sc.includes(i.sc)); }
  if (src === "due") return dueItems();
  if (src === "wd") return WORDS();
  if (src === "my") return ITEMS.filter(i => i.src === "my");
  if (src === "ms") return missItems();
  return [];
}
const dueItems = () => ITEMS.filter(isDue).sort((a, b) => S.prog[a.id].due.localeCompare(S.prog[b.id].due) || S.prog[a.id].b - S.prog[b.id].b);
// günün destesi: vadesi gelenler + yeni kartlar (önce günün kalıpları, sonra okunan bölümün kalıpları)
function newItems(){
  // içerik listesinden elle eklenenler en önde
  const pinned = ITEMS.filter(i => isPinned(i.id) && !S.prog[i.id]);
  const out = pinned.concat(ITEMS.filter(i => i.src === "my" && !S.prog[i.id] && !isPinned(i.id)), todaysPhrases().filter(p => !S.prog[p.id] && !isPinned(p.id)));
  const rc = readChapters();
  const extra = ITEMS.filter(i => i.src === "bk" && rc.includes(i.ch) && !S.prog[i.id] && !isPinned(i.id));
  const room = Math.max(0, S.opt.pace - (dayRec().newSeen || 0));
  const wroom = Math.max(0, S.opt.wpace - (dayRec().newW || 0));
  const ws = WORDS().filter(w => !S.prog[w.id] && !isPinned(w.id)).sort((a, b) => a.o - b.o).slice(0, wroom);
  return out.concat(extra.slice(0, Math.max(0, room - out.length)), ws);
}
function deck(){ return {due: dueItems().slice(0, 40), fresh: newItems()}; }

let VOICES = [], TRV = null;
function loadVoices(){
  if (!(!!window.speechSynthesis)) return;

}

const cleanSpeech = t => String(t).replace(/…/g, "").replace(/ \/ /g, ". ").replace(/[\u{1F300}-\u{1FAFF}]/gu, "");
// Telefonlarda ses: iOS ilk dokunuştan önce sesi kilitler, bazı Android'lerde "bitti" haberi gelmez.
const HAS_TTS = !!window.speechSynthesis && typeof window.SpeechSynthesisUtterance === "function";

function speak(text, who, onend, opt){
  opt = opt || {};

  if (noListen()) { if (onend) setTimeout(done, 250); return; }  // "şu an dinleyemem": ses yok

  const rate = opt.rate || S.opt.rate;
  u.rate = rate;
  if (opt.tr) { u.lang = "tr-TR"; if (TRV) u.voice = TRV; }
  else {
    u.lang = "de-DE";

  const go = () => { try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch(e) { ttsFail(); done(); } };
  if (!opt.queue && (speechSynthesis.speaking || speechSynthesis.pending)) { speechSynthesis.cancel(); setTimeout(go, 80); }

// mikrofon: tarayıcı destekliyorsa ve sayfaya izin verilmişse; ilk denemede reddedilirse kapanır

}

/* ---------- metin karşılaştırma ---------- */
const norm = s => s.toLowerCase().replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/[.,!?¿¡;:"“„”'’()–\-…\/]/g," ").replace(/\s+/g," ").trim();
function similar(a, b){
  a = norm(a); b = norm(b);
  if (!a || !b) return 0;
  const m = a.length, n = b.length, dp = Array.from({length:m+1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return 1 - dp[m][n] / Math.max(m, n);
}
// "A / B" ve "(…)" içeren kalıplarda en iyi eşleşen varyant
function bestVariant(it, said){
  const vars = it.de.split(" / ").flatMap(v => [v, v.replace(/\([^)]*\)/g, "")]).map(v => v.replace(/…/g, ""));
  return Math.max(...vars.map(v => similar(v, said)));
}
// alıştırmalar için tek, sade biçim: ilk varyant, parantez ve üç nokta yok
const plain = it => it.de.split(" / ")[0].replace(/\([^)]*\)/g, "").replace(/…/g, "").replace(/\s+/g, " ").replace(/ ([.,!?;:])/g, "$1").trim();
const words = it => plain(it).split(" ").filter(Boolean);
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = a => a[Math.random() * a.length | 0];
// yanlış şıklar: önce aynı türden, uzunluğu benzer olanlar
function distractors(it, n, key){
  key = key || "de";
  const seenV = new Set([norm(it[key])]);
  const cand = shuffle(ITEMS.filter(x => x.id !== it.id)).sort((a, b) => (a.src !== it.src) - (b.src !== it.src) || Math.abs(a[key].length - it[key].length) - Math.abs(b[key].length - it[key].length));
  const out = [];
  for (const x of cand.slice(0, 40).sort(() => Math.random() - .5).concat(cand.slice(40))) {
    const v = norm(x[key]); if (seenV.has(v)) continue;
    if (key === "tr" && [it, ...out].some(y => trSame(y.tr, x.tr))) continue;   // "tren" ile "tren, metro" aynı şık olmasın
    seenV.add(v); out.push(x); if (out.length >= n) break;
  }
  return out;
}
