    <div class="card player">
      <div class="phase2" id="ph">Hazır ol</div>
      <div class="${T.dir === "trde" ? "tr" : "de"}" id="q">${it ? esc(T.dir === "trde" ? it.tr : it.de) : ""}</div>
      <div class="${T.dir === "trde" ? "de" : "tr"}" id="a" style="visibility:hidden">${it ? esc(T.dir === "trde" ? it.de : it.tr) : ""}</div>
      <div id="vd"></div>
    </div>
    <div class="tfbtn" id="self" style="margin-top:14px;visibility:hidden"><button class="y" data-v="1">✓ Bildim</button><button class="n" data-v="0">✗ Bilemedim</button></div>
    <div class="ctrl"><button id="tp" aria-label="Duraklat">${T.run ? "❚❚" : "▶"}</button><button id="tn" aria-label="Sonraki">⏭</button></div>
    <p class="hint">${SR && T.dir === "trde" ? "Bip sesi yok: Türkçeyi duyunca hemen Almancasını söyle." : "Türkçeyi duy, Almancasını yüksek sesle söyle; sonra doğrusunu duyarsın. İstersen Bildim/Bilemedim'e dokun."}</p>`;
  $$("#tdir button").forEach(b => b.onclick = () => { T.dir = S.opt.tdir = b.dataset.v; save(); T.tok++; stopSpeak(); renderTurbo(); if (T.run) setTimeout(turboStep, 300); });
  $("#tp").onclick = () => { T.run = !T.run; T.tok++; stopSpeak(); if (T.rec) try { T.rec.abort(); } catch(e) {} renderTurbo(); if (T.run) setTimeout(turboStep, 300); };
  $("#tn").onclick = () => { T.tok++; stopSpeak(); T.i++; renderTurbo(); if (T.run) setTimeout(turboStep, 300); };
  $$("#self button").forEach(b => b.onclick = () => { const it = T.items[T.i]; if (it) { T.res[it.id] = b.dataset.v === "1"; if (b.dataset.v !== "1") miss(it, "Turbo"); $("#self").style.visibility = "hidden"; toast(b.dataset.v === "1" ? "👍" : "Tekrar gelecek"); } });
}
function turboStep(){
  if (!T || !T.run || screen !== renderTurbo) return;
  const it = T.items[T.i], tok = ++T.tok, live = () => T && T.run && T.tok === tok;
  if (!it) { stopTurbo(); setTop("Turbo", true); endCard("⚡", "Turbo bitti", T.items.length + " cümle", "Tamam"); return; }
  renderTurbo();
  const ph = t => { const e = $("#ph"); if (e) e.textContent = t; };
  const reveal = () => { const a = $("#a"); if (a) a.style.visibility = "visible"; };
  const nextIt = (ms) => setTimeout(() => { if (live()) { T.i++; turboStep(); } }, ms);
  const think = Math.max(2500, plain(it).length * 90);
  if (T.dir === "detr") {
    ph("Dinle");
    speak(it.de, 0, () => { if (!live()) return; ph("Anlamı ne?"); setTimeout(() => { if (!live()) return; reveal(); $("#self").style.visibility = "visible"; speakTR(it.tr, () => live() && nextIt(1600)); }, think); });
    return;
  }
  ph("Türkçesi");
  speakTR(it.tr, () => {
    if (!live()) return;
    if (SR && !noSpeak()) {
      ph("Söyle…");
      T.rec = listen(alts => {
        if (!live()) return;
        const said = alts.sort((a, b) => bestVariant(it, b) - bestVariant(it, a))[0], ok = bestVariant(it, said) >= 0.72;
        T.res[it.id] = ok; reveal(); if (!ok) miss(it, "Turbo");
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}" style="margin-top:8px">${ok ? "Doğru!" : "Sen: “" + esc(said) + "”"}</div>`;
        ph(ok ? "Doğru" : "Doğrusu");
        speak(it.de, 0, () => live() && nextIt(900));
      }, () => { if (!live()) return; miss(it, "Turbo"); reveal(); ph("Doğrusu"); speak(it.de, 0, () => live() && nextIt(1200)); });
    } else {
      ph("Şimdi sen söyle");
      setTimeout(() => { if (!live()) return; reveal(); ph("Doğrusu"); $("#self").style.visibility = "visible"; speak(it.de, 0, () => { if (!live()) return; setTimeout(() => live() && speak(it.de, 0, () => live() && nextIt(1800)), 700); }); }, think);
    }
  });
}

function wake(on){
  try {
    if (on && navigator.wakeLock) navigator.wakeLock.request("screen").then(w => WL = w, () => {});

  } catch(e) {}
}

function playCur(){
  if (!L || !L.playing || screen !== renderPlayer) return;
  const tok = ++L.tok, live = () => L && L.playing && L.tok === tok && screen === renderPlayer;
  const o = S.opt, it = L.list[L.i], gap = o.lgap * 1000, rate = o.lrate;
  renderPlayer();
  const de = n => done => speak(it.de, it.v || 0, () => { if (!live()) return; n > 1 ? setTimeout(() => live() && de(n - 1)(done), 700) : done(); }, {rate});
  const advance = () => setTimeout(() => { if (!live()) return; L.i = (L.i + 1) % L.list.length; playCur(); }, gap);
  if (o.ldir === "de") de(o.lrep)(advance);
  else if (o.ldir === "detr") de(o.lrep)(() => setTimeout(() => live() && (it.tr ? speakTR(it.tr, () => live() && advance(), Math.min(1, rate + .1)) : advance()), 500));
  else speakTR(it.tr || "", () => setTimeout(() => { if (!live()) return; const e = $("#pde"); if (e) e.style.visibility = "visible"; de(o.lrep)(advance); }, Math.max(2000, gap + 1000)), Math.min(1, rate + .1));
}

  if (p.length < 12) p = p.concat(ITEMS.filter(i => i.src === "ph" && i.d <= TODAY), ITEMS.filter(i => i.src === "bk" && i.ch <= 3));

// önce gördüğün kelimeler, azsa listenin başındakiler
function wordPool(kind, n){
  const all = WORDS().filter(w => !kind || w.kind === kind);
  const seenW = all.filter(w => S.prog[w.id]);
  return shuffle(seenW.length >= (n || 12) ? seenW : seenW.concat(all.filter(w => !S.prog[w.id]).sort((a, b) => a.o - b.o).slice(0, 40)));
}
// 60 saniyelik seçmeli oyun iskeleti
function timedChoice(id, title, pool, make){
  G = {i:0, sc:0, combo:0};
  const draw = () => {

    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""}</span><span class="t" id="gt">${G.left}</span></div>
      <div class="card flash" style="min-height:150px">${q.top}</div>

      if (G.lock) return; G.lock = 1;
      const ok = q.opts[+b.dataset.i] === q.right;
      b.classList.add(ok ? "good" : "bad");
      if (ok) { G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else { G.combo = 0; $(`.opt[data-i="${q.opts.indexOf(q.right)}"]`).classList.add("good"); miss(q.m || it, GAMES[id].t); }
      speak(q.say || it.de);
      G.i++; later(() => { G.lock = 0; if (G.left > 0) draw(); }, ok ? 300 : 1100);
    });

  gameTimer(60, () => gameOver(id, title, G.sc));
  draw();
}

/* Adam Asmaca */
function gHang(){
  const pool = wordPool("n").filter(w => w.w.length >= 4 && w.w.length <= 11);
  G = {i:0, sc:0, lives:6};
  const KEYS = "QWERTZUIOPÜASDFGHJKLÖÄYXCVBNM".split("");
  const round = () => {
    const it = pool[G.i % pool.length], W = it.w.toUpperCase(), got = new Set(), miss = new Set();
    const draw = () => {
      const shown = W.split("").map(c => got.has(c) ? c : "_").join(" ");
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span>${"❤️".repeat(Math.max(0, G.lives))}${"🤍".repeat(6 - Math.max(0, G.lives))}</span></div>
        <div class="card flash" style="min-height:150px"><div class="mid">${esc(it.tr)} · ${esc(it.art)} …</div>
          <div class="big" style="letter-spacing:.12em;font-size:28px">${shown}</div></div>
        <div class="pool" style="gap:6px">${KEYS.map(k => `<button class="wd" data-k="${k}" style="min-width:34px;padding:9px 8px;${got.has(k) ? "background:var(--ok-d)" : miss.has(k) ? "opacity:.3" : ""}" ${got.has(k) || miss.has(k) ? "disabled" : ""}>${k}</button>`).join("")}</div>`;
      $$(".pool .wd").forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        if (G.lives <= 0 || W.split("").every(c => got.has(c))) return;
        if (W.includes(k)) got.add(k); else { miss.add(k); G.lives--; }
        const won = W.split("").every(c => got.has(c));
        if (won) { G.sc++; speak(it.de); toast("✓ " + it.de); G.i++; later(round, 900); draw(); return; }
        if (G.lives <= 0) { window.miss(it, GAMES.hang.t); speak(it.de); toast(it.de); later(() => gameOver("hang", "Adam Asmaca", G.sc), 1200); }
        draw();
      });
    };
    draw();
  };
  open(() => setTop("Adam Asmaca", true));
  round();
}

/* Kelime Avı: 8x8 tablo, 5 kelime */
function gHunt(){
  const N = 8, AB = "ABDEFGHIKLMNORSTUWZ";
  const words5 = wordPool("n").filter(w => w.w.length >= 3 && w.w.length <= 8 && /^[A-Za-z]+$/.test(w.w)).slice(0, 5);
  const grid = Array.from({length:N}, () => Array(N).fill(""));
  const placed = [];
  words5.forEach(it => {
    const W = it.w.toUpperCase();
    for (let t = 0; t < 200; t++) {
      const dir = pick([[0,1],[1,0],[1,1]]), r = Math.random() * N | 0, c = Math.random() * N | 0;
      const cells = W.split("").map((ch, i) => [r + dir[0] * i, c + dir[1] * i, ch]);
      if (cells.every(([y, x, ch]) => y < N && x < N && (!grid[y][x] || grid[y][x] === ch))) { cells.forEach(([y, x, ch]) => grid[y][x] = ch); placed.push({it, cells}); break; }
    }
  });
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!grid[y][x]) grid[y][x] = pick(AB.split(""));
  G = {found:new Set(), sel:null, t0:Date.now()};
  const draw = () => {
    const hit = new Set(placed.filter(p => G.found.has(p.it.id)).flatMap(p => p.cells.map(([y, x]) => y + "," + x)));
    $("#view").innerHTML = `<div class="hud"><span class="small muted">Bulunan: <b style="font-size:16px">${G.found.size}/${placed.length}</b></span><span class="small muted">İlk ve son harfe dokun</span></div>
      <div class="gpush" style="display:grid;grid-template-columns:repeat(${N},1fr);gap:4px">${grid.map((row, y) => row.map((ch, x) => `<button class="mc" data-y="${y}" data-x="${x}" style="min-height:40px;padding:0;font-size:17px;${hit.has(y + "," + x) ? "background:var(--ok-d);border-color:var(--ok)" : ""}${G.sel && G.sel[0] === y && G.sel[1] === x ? "border-color:var(--acc);background:var(--acc-d)" : ""}">${ch}</button>`).join("")).join("")}</div>
      <div class="sec">Bul</div>
      <div class="chips">${placed.map(p => `<span class="chip ${G.found.has(p.it.id) ? "on" : ""}" style="display:inline-flex;align-items:center">${G.found.has(p.it.id) ? esc(p.it.de) : esc(p.it.tr)}</span>`).join("")}</div>`;
    $$(".mc").forEach(b => b.onclick = () => {
      const y = +b.dataset.y, x = +b.dataset.x;
      if (!G.sel) { G.sel = [y, x]; return draw(); }
      const [y0, x0] = G.sel; G.sel = null;
      const p = placed.find(p => !G.found.has(p.it.id) && ((p.cells[0][0] === y0 && p.cells[0][1] === x0 && p.cells.at(-1)[0] === y && p.cells.at(-1)[1] === x) || (p.cells[0][0] === y && p.cells[0][1] === x && p.cells.at(-1)[0] === y0 && p.cells.at(-1)[1] === x0)));
      if (p) { G.found.add(p.it.id); speak(p.it.de); }
      else { const q = placed.find(q => !G.found.has(q.it.id) && [[y0, x0], [y, x]].some(([a, b]) => q.cells[0][0] === a && q.cells[0][1] === b)); if (q) miss(q.it, GAMES.hunt.t); }
      draw();
      if (G.found.size === placed.length) later(() => gameOver("hunt", "Kelime Avı", Math.round((Date.now() - G.t0) / 1000)), 700);
    });
  };
  open(() => setTop("Kelime Avı", true));
  draw();
}

/* Harf Çarkı: 8 kelime */
function gWheel(){
  const pool = wordPool().filter(w => !/\s/.test(w.w) && w.w.length >= 3 && w.w.length <= 8).slice(0, 8);
  G = {i:0, sc:0};
  const round = () => {
    const it = pool[G.i];
    if (!it) return gameOver("wheel", "Harf Çarkı", G.sc);
    let L = shuffle(it.w.toUpperCase().split("").map((c, i) => ({c, i}))), built = [], hint = 0;
    const draw = () => {
      const R = 108, n = L.length;
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.i + 1}/${pool.length}</span></div>
        <div class="card flash" style="min-height:96px;padding:16px"><div class="mid">${esc(it.tr)}${it.art ? " · " + it.art : ""}</div>
          <div class="big" style="letter-spacing:.1em">${it.w.toUpperCase().split("").map((c, i) => i < built.length ? L[built[i]].c : i < hint ? `<span style="color:var(--tx3)">${c}</span>` : "_").join(" ")}</div></div>
        <div style="position:relative;width:${R * 2 + 64}px;height:${R * 2 + 64}px;margin:18px auto 0;border-radius:50%;background:var(--bg2);border:1px solid var(--line)">
          ${L.map((x, k) => { const a = k / n * 2 * Math.PI - Math.PI / 2; return `<button class="wd" data-k="${k}" style="position:absolute;left:${R + 32 + Math.cos(a) * R - 24}px;top:${R + 32 + Math.sin(a) * R - 24}px;width:48px;height:48px;padding:0;border-radius:50%;font-size:19px;${built.includes(k) ? "visibility:hidden" : ""}">${x.c}</button>`; }).join("")}
        </div>
        <div class="row2" style="margin-top:14px"><button class="btn2" id="wsh">🔀 Karıştır</button><button class="btn2" id="whn">💡 İpucu</button></div>
        <button class="linkbtn" id="wcl">Sil</button>`;
      $$(".wd[data-k]").forEach(b => b.onclick = () => {
        built.push(+b.dataset.k); draw();
        if (built.length === L.length) {
          const ok = built.map(k => L[k].c).join("") === it.w.toUpperCase();
          if (ok) { G.sc += hint ? 1 : 2; speak(it.de); G.i++; later(round, 800); }
          else { miss(it, GAMES.wheel.t); toast("Olmadı, tekrar dene"); built = []; later(draw, 500); }
        }
      });
      $("#wsh").onclick = () => { built = []; L = shuffle(L); draw(); };
      $("#whn").onclick = () => { hint = Math.min(it.w.length - 1, hint + 1); built = []; draw(); };
      $("#wcl").onclick = () => { built.pop(); draw(); };
    };
    draw();
  };
  open(() => setTop("Harf Çarkı", true));
  round();
}

/* Kelime Solitaire: masada 6 Almanca kart, desteden Türkçe gelir */
function gSoli(){
  const all = wordPool().slice(0, 18);
  const table = all.slice(0, 6), stock = all.slice(6);
  let deck = shuffle(all.map(w => w.id)), top = null;
  G = {draws:0, cleared:0};
  const nextTop = () => { deck = deck.filter(id => !G.gone || !G.gone.has(id)); top = deck.shift(); if (top) deck.push(top); };
  G.gone = new Set();
  nextTop();
  const draw = () => {
    const t = BYID[top];
    $("#view").innerHTML = `<div class="hud"><span class="small muted">Toplanan: <b style="font-size:16px">${G.cleared}/${all.length}</b></span><span class="small muted">Çekiş: <b style="font-size:16px">${G.draws}</b></span></div>
      <div class="card flash" style="min-height:110px;border-color:var(--acc)"><div class="mid">Destedeki kart</div><div class="big" style="font-size:22px">${t ? esc(t.tr) : ""}</div></div>
      <div class="mgrid" style="grid-template-columns:repeat(3,1fr)">${table.map((w, i) => w ? `<button class="mc" data-i="${i}" style="min-height:74px">${esc(w.de)}</button>` : `<span></span>`).join("")}</div>
      <button class="btn2" id="sdraw" style="width:100%;margin-top:14px">Masada yok · yeni kart çek</button>`;
    $$(".mc").forEach(b => b.onclick = () => {
      const w = table[+b.dataset.i];
      if (w.id === top) {
        speak(w.de); G.gone.add(w.id); G.cleared++;
        table[+b.dataset.i] = stock.shift() || null;
        if (G.cleared === all.length) return gameOver("soli", "Kelime Solitaire", G.draws);
        nextTop(); draw();
      } else { miss(t, GAMES.soli.t); b.classList.add("bad"); later(() => b.classList.remove("bad"), 400); G.draws++; $(".hud b:last-child") && draw(); }
    });
    $("#sdraw").onclick = () => { G.draws++; nextTop(); draw(); };
  };
  open(() => setTop("Kelime Solitaire", true));
  draw();
}

/* Kategori Solitaire: 20 kart, 4 grup */
function gCats(){
  const nouns = WORDS().filter(w => w.kind === "n");
  const cats = shuffle(Object.keys(W_CATS)).slice(0, 4);
  const pool = shuffle(nouns.filter(w => cats.includes(w.cat))).slice(0, 20);
  G = {i:0, sc:0};
  const draw = () => {
    const it = pool[G.i];
    if (!it) return gameOver("cats", "Kategori Solitaire", G.sc);

      <div class="card flash" style="min-height:140px"><div class="big">${esc(it.de)}</div><div class="mid" id="ctr" style="visibility:hidden">${esc(it.tr)}</div></div>
      <div class="opts2">${cats.map(c => `<button class="opt" data-c="${c}" style="min-height:70px">${W_CATS[c]}</button>`).join("")}</div>`;
    speak(it.de);

}

// ortak iskelet: düşme döngüsü, klavye, çıkınca temizlik
function dropLoop(step){
  const me = G; let last = performance.now();
  const tick = now => {
    if (G !== me || G.over || screen === null) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!G.pause) step(dt);
    G.raf = requestAnimationFrame(tick);
  };
  G.raf = requestAnimationFrame(tick);
}
function dropKeys(fn){
  const h = e => { if (fn(e.key)) e.preventDefault(); };
  document.addEventListener("keydown", h);
  const raf = () => cancelAnimationFrame(G && G.raf), me = G;
  onLeave = () => { me.over = 1; raf(); document.removeEventListener("keydown", h); };
}
function dropEnd(id, title, sc){ G.over = 1; if (onLeave) { const f = onLeave; onLeave = null; f(); } gameOver(id, title, sc); }

/* Artikel Düşüşü: 3 can, her doğruda biraz hızlanır */
function gArtDrop(){
  const pool = wordPool("n");
  G = {i:0, sc:0, combo:0, life:3, ok:0};
  open(() => setTop("Artikel Düşüşü", true));
  const ARTS = ["der", "die", "das"];
  $("#view").innerHTML = `<div class="hud"><b id="ds">0</b><span class="small muted" id="dc"></span><span id="dl"></span></div>
    <div class="drop" id="df"><div class="dw" id="dw"><b></b><span></span></div>
      <div class="gates">${ARTS.map((a, k) => `<button class="gate g${k}" data-k="${k}">${a}</button>`).join("")}</div></div>
    <p class="hint">Kapıya dokun ya da ← ↓ → tuşları</p>`;
  const f = $("#df"), w = $("#dw"), gates = $$(".gate");
  const hud = () => { $("#ds").textContent = G.sc; $("#dc").textContent = G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""; $("#dl").textContent = "❤️".repeat(G.life) + "🤍".repeat(3 - G.life); };
  const next = () => {
    G.it = pool[G.i++ % pool.length]; G.y = 0; G.pick = null; G.x = 50; G.pause = 0;
    G.dur = Math.max(2.4, 7 * Math.pow(0.95, G.ok));            // tüm düşüş saniyesi
    w.className = "dw"; w.style.left = "50%"; w.querySelector("b").textContent = G.it.w; w.querySelector("span").textContent = G.it.tr;
    gates.forEach(g => g.classList.remove("good", "bad"));
  };
  const pick = k => { if (G.pick !== null || G.pause) return; G.pick = k; G.x = (k * 2 + 1) * 100 / 6; w.style.left = G.x + "%"; land(); };
  const land = () => {
    G.pause = 1;
    const right = ARTS.indexOf(G.it.art), ok = G.pick === right;
    gates[right].classList.add("good"); if (G.pick !== null && !ok) gates[G.pick].classList.add("bad");
    w.querySelector("b").textContent = G.it.art + " " + G.it.w; w.classList.add(ok ? "ok" : "no", ok ? "pop" : "x");
    speak(G.it.de);
    if (ok) { G.ok++; G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else { G.combo = 0; G.life--; miss(G.it, GAMES.artdrop.t); }
    hud();
    later(() => G.life > 0 ? next() : dropEnd("artdrop", "Artikel Düşüşü", G.sc), ok ? 260 : 1500);
  };
  gates.forEach(g => g.onclick = () => pick(+g.dataset.k));
  dropKeys(key => { const k = {ArrowLeft:0, ArrowDown:1, ArrowRight:2, 1:0, 2:1, 3:2}[key]; if (k === undefined) return false; pick(k); return true; });
  hud(); next();
  dropLoop(dt => {
    const H = f.clientHeight - gates[0].offsetHeight - w.offsetHeight;
    G.y += dt * H / G.dur;
    if (G.y >= H) { G.y = H; land(); }
    w.style.transform = `translate(-50%, ${G.y}px)`;
  });
}

    const a = G.a = pool[G.i++ % pool.length];
    G.opts = [[a.w, a.opp], [a.k, a.xk], [a.s, a.xs]].map(o => shuffle(o));
    G.right = [a.w, a.k, a.s]; G.row = 0; G.pick = null; G.y = 0; G.pause = 0;
    G.dur = Math.max(6, 14 * Math.pow(0.96, G.ok));          // ilk sıraya ~5 sn
    w.className = "dw"; w.style.left = "50%"; w.querySelector("b").textContent = a.tr; w.querySelector("span").textContent = "";
    rows.forEach((r, i) => { r.className = "grow" + (i === 0 ? " on" : ""); r.querySelectorAll(".gate").forEach((g, c) => { g.textContent = G.opts[i][c]; g.className = "gate"; }); });
  };
  const pick = c => { if (G.pick !== null || G.pause) return; G.pick = c; w.style.left = (c ? 75 : 25) + "%"; G.opts[G.row][c] === G.right[G.row] ? pass() : fail(); };
  const fail = () => {
    G.pause = 1; G.combo = 0; hud();
    miss({de: G.right.join(" → "), tr: G.a.tr, note: G.a.exd + " = " + G.a.ext}, GAMES.cmpdrop.t);
    const g = rows[G.row].querySelectorAll(".gate");
    if (G.pick !== null) g[G.pick].classList.add("bad");
    g[G.opts[G.row].indexOf(G.right[G.row])].classList.add("good");
    w.classList.add("no");
    const a = G.a, f3 = G.right.map((x, i) => i === G.row ? `<u>${esc(x)}</u>` : esc(x)).join(" → ");
    db.innerHTML = `<div class="big">${f3}</div><div class="mid">${esc(a.tr)}</div><div class="ex">${esc(a.exd)}<br><span class="muted">${esc(a.ext)}</span></div><button class="cta" id="dn">Devam</button>`;
    db.hidden = false; speak(a.w + ", " + a.k + ", " + a.s + ". " + a.exd);
    $("#dn").onclick = () => { db.hidden = true; stopSpeak(); next(); };
  };
  const pass = () => {
    const r = rows[G.row]; r.querySelectorAll(".gate")[G.pick].classList.add("good"); r.classList.remove("on"); r.classList.add("done");
    w.querySelector("span").textContent = G.a.tr; w.querySelector("b").textContent = G.right[G.row];
    G.row++; G.pick = null;
    if (G.row < 3) { rows[G.row].classList.add("on"); return; }
    G.ok++; G.combo++; G.sc += G.combo >= 4 ? 2 : 1; hud();
    G.pause = 1; w.classList.add("ok"); later(() => w.classList.add("pop"), 150); speak(G.right.join(", "));
    later(() => G.left > 0 && next(), 450);
  };
  rows.forEach((r, i) => r.querySelectorAll(".gate").forEach((g, c) => g.onclick = () => i === G.row && pick(c)));
  dropKeys(key => { const c = {ArrowLeft:0, ArrowRight:1}[key]; if (c === undefined) return false; pick(c); return true; });
  hud(); next();
  let sec = 0;
  dropLoop(dt => {
    sec += dt; if (sec >= 1) { sec -= 1; G.left--; const t = $("#gt"); t.textContent = G.left; t.classList.toggle("low", G.left <= 10); if (G.left <= 0) return dropEnd("cmpdrop", "Karşılaştırma Düşüşü", G.sc); }
    const H = f.clientHeight, ty = ROWS[G.row] * H - w.offsetHeight - 6;
    G.y += dt * H / G.dur;
    if (G.y >= ty) { G.y = ty; fail(); }                          // seçmeden sıraya değdi
    w.style.transform = `translate(-50%, ${G.y}px)`;
  });
}

const N_ONES = ["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
const N_TENS = ["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
function numDE(n){
  if (n < 20) return N_ONES[n];
  if (n < 100) { const o = n % 10, t = N_TENS[n / 10 | 0]; return o ? (o === 1 ? "ein" : N_ONES[o]) + "und" + t : t; }
  if (n < 1000) { const h = n / 100 | 0, r = n % 100; return (h === 1 ? "ein" : N_ONES[h]) + "hundert" + (r ? numDE(r) : ""); }
  return "eintausend";
}
const rnd = (a, b) => a + (Math.random() * (b - a + 1) | 0);
// yakın ama yanlış sayılar: bir eksik/fazla, onluk kayması, rakam takası (einundzwanzig ↔ 12 hatası)
function nearNums(n, k, max){
  const sw = n >= 10 && n < 100 ? (n % 10) * 10 + (n / 10 | 0) : -1;
  const c = uniq([sw, n + 1, n - 1, n + 10, n - 10, n + 2, n - 20, n + 100, n - 100].filter(x => x >= 0 && x <= (max || 1000) && x !== n));
  return shuffle(c.slice(0, 4)).slice(0, k);
}
const priceDE = c => { const e = c / 100 | 0, ct = c % 100; return (e === 1 ? "ein" : numDE(e)) + " Euro" + (ct ? " " + numDE(ct) : ""); };
const priceNum = c => (c / 100).toFixed(2).replace(".", ",") + " €";

function quiz(id, title, pool, make, o){
  o = o || {}; const max = o.lives || 0;
  G = {i:0, sc:0, life:max};
  const end = () => gameOver(id, title, G.sc);
  const draw = () => {
    if ((o.n && G.i >= o.n) || (max && G.life <= 0) || !pool.length) return end();
    const it = pool[G.i % pool.length], q = make(it), short = q.opts.every(x => x.length <= 16);
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${o.n ? (G.i + 1) + "/" + o.n : ""}</span><span>${max ? hearts(G.life, max) : ""}</span></div>
      <div class="card flash" style="min-height:140px">${q.top}</div>
      <div id="vd"></div>
      <div class="${short ? "opts2" : "opts"}" ${short && q.opts.length === 3 ? 'style="grid-template-columns:repeat(3,1fr)"' : ""}>${q.opts.map((x, i) => `<button class="opt" data-i="${i}" style="min-height:58px">${esc(x)}</button>`).join("")}</div>
      <div id="vdn"></div>`;
    let lock = 0;
    const answer = i => {
      if (lock++) return;
      const ok = q.opts[i] === q.right, bs = $$(".opt");
      bs[i].classList.add(ok ? "good" : "bad"); if (!ok) bs[q.opts.indexOf(q.right)].classList.add("good");
      if (ok) G.sc++; else { if (max) G.life--; miss(q.m || it, GAMES[id].t); }
      if (q.say !== "") speak(q.say || q.right);
      G.i++;
      if (!ok || q.note) {
        if (q.note || q.full) $("#vd").innerHTML = `<div class="tip" style="margin-top:0">${q.note || ""}${!ok && q.full ? `<div style="margin-top:4px"><b>${esc(q.full)}</b></div>` : ""}</div>`;
        if (!ok) $("#vdn").innerHTML = '<button class="cta" id="gn" style="margin-top:12px">Devam</button>';
        if (ok) later(draw, 1700); else $("#gn").onclick = draw;
      } else later(draw, 650);
    };
    $$(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  };
  open(() => setTop(title, true));
  draw();
}

/* ---------- Almanca Matematik ---------- */
const MATH_KEYS = ["null","eins","ein","zwei","drei","vier","fünf","sechs","sech","sieben","sieb","acht","neun","zehn","elf","zwölf","und","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig","hundert"];
function gMath(){
  G = {sc:0, b:[]};
  const OPS = [["plus", (a, b) => a + b], ["minus", (a, b) => a - b], ["mal", (a, b) => a * b], ["geteilt durch", (a, b) => a / b]];
  const next = () => {
    const [name, fn] = pick(OPS); let a = rnd(1, 10), b = rnd(1, 10);
    if (name === "minus" && b > a) [a, b] = [b, a];
    if (name === "geteilt durch") a = a * b;
    G.r = fn(a, b); G.b = [];
    G.ok = G.r === 100 ? ["einhundert", "hundert"] : [numDE(G.r)];
    $("#mq").textContent = numDE(a) + " " + name + " " + numDE(b); $("#mn").textContent = a + " " + {plus:"+", minus:"−", mal:"×", "geteilt durch":"÷"}[name] + " " + b + " = ?";
    G.q = {de: numDE(a) + " " + name + " " + numDE(b) + " = " + G.ok[0], tr: $("#mn").textContent.replace("?", G.r)};
    show();
  };
  const show = () => { $("#mb").textContent = G.b.join("") || "…"; $("#mb").style.color = ""; };
  const done = ok => {
    G.lock = 1; $("#mb").style.color = ok ? "var(--ok)" : "var(--bad)";
    if (ok) G.sc++; else { $("#mb").textContent = G.ok[0]; miss(G.q, GAMES.math.t); }
    $("#ms").textContent = G.sc; speak(G.ok[0]);
    later(() => { G.lock = 0; if (G.left > 0) next(); }, ok ? 500 : 1600);
  };
  open(() => setTop("Almanca Matematik", true));
  $("#view").innerHTML = `<div class="hud"><b id="ms">0</b><span class="t" id="gt">60</span></div>
    <div class="card flash" style="min-height:140px;gap:8px"><div class="big" id="mq" style="font-size:23px"></div><div class="mid" id="mn"></div>
      <div class="big" id="mb" style="font-size:22px;color:var(--acc);word-break:break-word">…</div></div>
    <div class="pool" style="gap:6px">${MATH_KEYS.map(k => `<button class="wd" data-k="${k}" style="padding:8px 10px;font-size:15px">${k}</button>`).join("")}</div>
    <div class="row2" style="margin-top:12px"><button class="btn2" id="mdel">⌫ Sil</button><button class="btn2" id="mok">✓ Kontrol</button></div>`;
  $$(".wd[data-k]").forEach(b => b.onclick = () => {
    if (G.lock) return; G.b.push(b.dataset.k); show();
    if (G.ok.includes(G.b.join(""))) done(true);
  });
  $("#mdel").onclick = () => { if (!G.lock) { G.b.pop(); show(); } };
  $("#mok").onclick = () => { if (!G.lock && G.b.length) done(G.ok.includes(G.b.join(""))); };
  gameTimer(60, () => gameOver("math", "Almanca Matematik", G.sc));
  next();
}

    if (items.length > 1 && Math.random() < .5) {
      const x = items.find(i => i.q === 1);
      if (x) { txt += " Ach nein, doch " + KEIN[x.m.a] + " " + x.m.n + "."; items.splice(items.indexOf(x), 1); }
    } else { const m = pick(extra); txt += " Ach, und noch " + ACC[m.a] + " " + m.n + ", bitte."; items.push({m, q:1}); }
  }
  return {txt, items, total: items.reduce((s, x) => s + x.m.p * x.q, 0)};
}

/* ---------- Perfekt'e Çevir ---------- */
const HABEN = ["habe", "hast", "hat", "haben", "habt", "haben"], SEIN = ["bin", "bist", "ist", "sind", "seid", "sind"];
const PRON = ["Ich", "Du", "Er", "Wir", "Ihr", "Sie"];
function gPerf(){
  const pool = wordPool("v").filter(v => !/^(können|müssen|wollen|sollen|dürfen|mögen|möchten)$/.test(v.w) && v.pf);
  G = {sc:0, combo:0};
  const draw = () => {
    const v = pick(pool), p = rnd(0, 5), sein = /^ist /.test(v.pf), part = v.pf.split(" ").slice(1).join(" ");
    const aux = (sein ? SEIN : HABEN)[p], other = (sein ? HABEN : SEIN)[p];
    const stem = v.w.replace(/e?n$/, "");
    const wrongP = uniq(shuffle(["ge" + stem + "t", "ge" + v.w, part.replace(/t$/, "en"), part.replace(/en$/, "t")]).filter(x => x !== part)).slice(0, 2);
    const pres = PRON[p] + " " + v.pr[p] + ".", perf = PRON[p] + " " + aux + " " + part + ".";
    let step = 0;
    const show = () => {
      const opts = step === 0 ? shuffle([aux, other]) : shuffle([part].concat(wrongP));
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""}</span><span class="t" id="gt">${G.left}</span></div>
        <div class="card flash" style="min-height:170px"><div class="mid">${esc(v.w)} · ${esc(v.tr)}</div><div class="big" style="font-size:23px">${esc(pres)}</div>
          <div class="big" style="font-size:21px;color:var(--acc)">${esc(PRON[p])} ${step ? esc(aux) : "___"} … ___.</div></div>
        <div id="vd"></div><p class="hint">${step ? "Partizip II hangisi?" : "Yardımcı fiil: haben mi sein mi?"}</p>
        <div class="opts2" ${opts.length === 3 ? 'style="grid-template-columns:repeat(3,1fr)"' : ""}>${opts.map(o => `<button class="opt" style="min-height:60px">${esc(o)}</button>`).join("")}</div>`;
      let lock = 0;
      $$(".opt").forEach(b => b.onclick = () => {
        if (lock++) return;
        const right = step ? part : aux, ok = b.textContent === right;
        b.classList.add(ok ? "good" : "bad"); if (!ok) $$(".opt").find(x => x.textContent === right).classList.add("good");
        if (!ok) { G.combo = 0; speak(perf); miss({de: perf, tr: v.tr + ", " + PERS_TR[p] + " (geçmiş)", note: pres + " → " + perf}, GAMES.perf.t); $("#vd").innerHTML = `<div class="tip"><b>${esc(perf)}</b></div>`; return later(() => G.left > 0 && draw(), 1700); }
        if (step === 0) { step = 1; return later(show, 250); }
        G.combo++; G.sc += G.combo >= 5 ? 2 : 1; speak(perf); later(() => G.left > 0 && draw(), 700);
      });
    };
    show();
  };
  open(() => setTop("Perfekt'e Çevir", true));
  gameTimer(60, () => gameOver("perf", "Perfekt'e Çevir", G.sc));
  draw();
}

function gOrder(){
  const pool = shuffle(gamePool().filter(i => { const n = words(i).length; return n >= 3 && n <= 10; })).slice(0, 10);
  if (!pool.length) return toast("Önce birkaç kart çalış");
  G = {i:0, sc:0};
  const draw = () => {
    const it = pool[G.i];
    if (!it) return gameOver("order", "Cümle Sırala", G.sc);
    const w = words(it), sh = shuffle(w.map((x, i) => ({x, i}))), built = []; let miss = 0;
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.i + 1}/${pool.length}</span></div>
      <div class="card flash" style="min-height:90px"><div class="big" style="font-size:20px">${esc(it.tr)}</div></div>
      <div class="built" id="built"></div>
      <div class="pool">${sh.map((p, k) => `<button class="wd" data-k="${k}">${esc(p.x)}</button>`).join("")}</div>
      <div style="margin-top:14px" class="row2"><button class="btn2" id="sk">Göster</button><button class="btn2" id="clr">Temizle</button></div>`;
    const redraw = () => {
      $("#built").innerHTML = built.map(k => `<span class="wd">${esc(sh[k].x)}</span>`).join("");
      $$(".pool .wd").forEach(b => b.classList.toggle("used", built.includes(+b.dataset.k)));
      if (built.length === w.length) {
        const ok = norm(built.map(k => sh[k].x).join(" ")) === norm(w.join(" "));
        $("#built").style.borderColor = ok ? "var(--ok)" : "var(--bad)";
        if (ok) { if (!miss) G.sc++; speak(plain(it)); G.i++; later(draw, 900); }
        else { miss++; window.miss(it, GAMES.order.t); later(() => { built.length = 0; $("#built").style.borderColor = ""; redraw(); }, 700); }
      }
    };
    $$(".pool .wd").forEach(b => b.onclick = () => { if (!built.includes(+b.dataset.k) && built.length < w.length) { built.push(+b.dataset.k); redraw(); } });
    $("#clr").onclick = () => { built.length = 0; redraw(); };
    $("#sk").onclick = () => { miss++; window.miss(it, GAMES.order.t); toast(plain(it)); speak(plain(it)); };
  };
  open(() => setTop("Cümle Sırala", true));
  draw();
}

    const fin = ok => { clearInterval(G.tm); G.res.push({it, ok}); if (ok) G.sc++; else miss(it, GAMES.nine.t); speak(it.de); G.i++; later(round, ok ? 600 : 1400); if (!ok) $("#nb").innerHTML = esc(W.split("").join(" ")); };
    const draw = () => {
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.i + 1}/9</span><span class="t" id="gt">${G.left}</span></div>

      });
      $("#nsh").onclick = () => { if (shuf) { shuf--; built = []; L = shuffle(L); draw(); } };
      $("#ndel").onclick = () => { built.pop(); draw(); };
    };
    G.left = 30; draw();
    G.tm = setInterval(() => { if (screen === null) return clearInterval(G.tm); G.left--; const t = $("#gt"); if (t) { t.textContent = G.left; t.classList.toggle("low", G.left <= 10); } if (G.left <= 0) fin(false); }, 1000);
    const tm = G.tm; onLeave = () => clearInterval(tm);
  };
  open(() => setTop("9 Kelime", true));
  round();
}

/* ---------- Almanca Wordle ---------- */
function gWordle(daily){
  const cand = WORDS().filter(w => /^[A-Za-zÄÖÜäöü]{5}$/.test(w.w)).sort((a, b) => a.id.localeCompare(b.id));
  if (!cand.length) return toast("Kelime yok");
  const it = daily === false ? pick(cand) : cand[dayNo() * 7 % cand.length], W = it.w.toUpperCase();
  const rows = [], KEYS = ["QWERTZUIOPÜ", "ASDFGHJKLÖÄ", "YXCVBNM"];
  let cur = "", over = 0;
  const score = g => { const r = Array(5).fill("x"), rest = W.split(""); g.split("").forEach((c, i) => { if (c === W[i]) { r[i] = "g"; rest[i] = null; } }); g.split("").forEach((c, i) => { if (r[i] !== "g") { const j = rest.indexOf(c); if (j >= 0) { r[i] = "y"; rest[j] = null; } } }); return r; };
  const COL = {g:"var(--ok)", y:"var(--acc)", x:"var(--bg4)"};
  const keyState = {};
  const draw = () => {
    const cell = (c, s) => `<div style="width:52px;height:52px;display:grid;place-items:center;border-radius:10px;font-weight:700;font-size:22px;${s ? `background:${COL[s]};color:${s === "x" ? "var(--tx)" : "#fff"}` : "border:2px solid var(--line)"}">${c || ""}</div>`;
    const grid = Array.from({length:6}, (_, r) => `<div style="display:flex;gap:6px;justify-content:center">${rows[r] ? rows[r].g.split("").map((c, i) => cell(c, rows[r].s[i])).join("") : Array.from({length:5}, (_, i) => cell(r === rows.length ? cur[i] : "")).join("")}</div>`).join("");
    $("#view").innerHTML = `<div class="hud"><span class="small muted">${esc(it.tr)}${it.art ? " · " + it.art : ""}?</span><span class="small muted">${rows.length}/6</span></div>
      <div style="display:flex;flex-direction:column;gap:6px;margin:auto 0">${grid}</div>
      <div id="wmsg" style="margin-bottom:10px"></div>
      ${KEYS.map((r, ri) => `<div style="display:flex;gap:4px;justify-content:center;margin-top:5px">${ri === 2 ? '<button class="wd" data-k="ENTER" style="padding:10px 8px;font-size:13px">OK</button>' : ""}${r.split("").map(k => `<button class="wd" data-k="${k}" style="flex:1;max-width:34px;padding:10px 0;font-size:15px;${keyState[k] ? `background:${COL[keyState[k]]};color:${keyState[k] === "x" ? "var(--tx3)" : "#fff"}` : ""}">${k}</button>`).join("")}${ri === 2 ? '<button class="wd" data-k="DEL" style="padding:10px 8px;font-size:13px">⌫</button>' : ""}</div>`).join("")}`;
    $$(".wd[data-k]").forEach(b => b.onclick = () => key(b.dataset.k));
    if (over) {
      $("#wmsg").innerHTML = `<div class="tip"><b>${esc(it.de)}</b> · ${esc(it.tr)}</div><div class="foot"><button class="cta" id="wn">Yeni kelime</button><button class="linkbtn" id="gb">Oyunlara dön</button></div>`;
      $("#wn").onclick = () => gWordle(false); $("#gb").onclick = () => go("games");
    }
  };
  const key = k => {
    if (over) return;
    if (k === "DEL") cur = cur.slice(0, -1);
    else if (k === "ENTER") {
      if (cur.length < 5) return toast("5 harf gerekli");
      const s = score(cur); rows.push({g:cur, s});
      cur.split("").forEach((c, i) => { const o = keyState[c]; if (o !== "g" && !(o === "y" && s[i] === "x")) keyState[c] = s[i]; });
      if (s.every(x => x === "g")) { over = 1; speak(it.de); best("wordle", rows.length, true); toast(rows.length + ". denemede buldun!"); }
      else if (rows.length >= 6) { over = 1; speak(it.de); mark("game"); miss(it, GAMES.wordle.t); }
      cur = "";
    } else if (cur.length < 5) cur += k;
    draw();
  };
  const h = e => { const k = e.key.toUpperCase(); if (k === "ENTER" || k === "BACKSPACE") key(k === "ENTER" ? "ENTER" : "DEL"); else if (/^[A-ZÄÖÜ]$/.test(k)) key(k); };
  open(() => setTop("Almanca Wordle", true));
  document.addEventListener("keydown", h); onLeave = () => document.removeEventListener("keydown", h);
  draw();
}

/* ---------- Eşleştirme Izgarası ---------- */
function gGrid(){
  G = {sc:0, sel:null};
  const board = () => {
    const its = wordPool().filter(w => w.w.length <= 14 && w.tr.length <= 16).slice(0, 8);
    G.cells = shuffle(its.flatMap(it => [{id:it.id, t:it.w, de:1}, {id:it.id, t:it.tr.split(",")[0]}])); G.done = 0; G.sel = null;
    draw();
  };
  const draw = () => {
    $("#view").innerHTML = `<div class="hud"><span><b>${G.sc}</b> <span class="small muted">çift</span></span><span class="small muted">${8 - G.done} kaldı</span><span class="t" id="gt">${G.left}</span></div>
      <p class="hint gpush" style="margin-bottom:10px"><span class="glg de"></span> Almanca &nbsp; <span class="glg"></span> Türkçe · ikisine dokun</p>
      <div class="ggrid">${G.cells.map((c, i) => `<button class="gt ${c.de ? "de" : ""} ${c.gone ? "gone" : ""} ${G.sel === i ? "sel" : ""}" data-i="${i}"><span>${esc(c.t)}</span></button>`).join("")}</div>`;
    $$(".ggrid .gt").forEach(b => b.onclick = () => {
      const i = +b.dataset.i, c = G.cells[i];
      if (c.gone || G.lock) return;
      if (G.sel === null || G.sel === i) { G.sel = G.sel === i ? null : i; if (c.de) speak(BYID[c.id].de); return draw(); }
      const a = G.cells[G.sel];
      if (a.id === c.id && a.de !== c.de) {
        const pb = $$(".ggrid .gt")[G.sel]; b.classList.add("hit"); pb.classList.add("hit"); G.lock = 1;
        a.gone = c.gone = 1; G.sel = null; G.sc++; G.done++;
        return later(() => { G.lock = 0; G.done === 8 ? board() : draw(); }, 280);
      }
      miss(BYID[(c.de ? c : a).id], GAMES.grid.t);
      b.classList.add("bad"); $$(".ggrid .gt")[G.sel].classList.add("bad"); G.lock = 1; G.sel = null;
      later(() => { G.lock = 0; draw(); }, 450);
    });
  };
  open(() => setTop("Eşleştirme Izgarası", true));
  gameTimer(60, () => gameOver("grid", "Eşleştirme Izgarası", G.sc));
  board();
}

/* ---------- Doğru mu Yanlış mı? ---------- */
function gTF(){
  const pool = wordPool("n");
  G = {i:0, sc:0, combo:0};
  const draw = () => {
    const it = pool[G.i++ % pool.length], t = it.pl ? rnd(0, 2) : pick([0, 2]), truth = Math.random() < .5;
    let st, right;
    if (t === 0) { const a = truth ? it.art : pick(["der", "die", "das"].filter(x => x !== it.art)); st = a + " " + it.w; right = it.de; }
    else if (t === 1) { const w = it.w, wr = pick([w + "e", w + "en", w + "s", umlaut(w) + "e", w + "n", w + "er"].filter(x => x !== it.pl)); st = it.de + " → die " + (truth ? it.pl : wr); right = it.de + " → die " + it.pl; }
    else { const tr = truth ? it.tr : kindOther(it, 1, "tr")[0]; st = it.de + " = " + tr; right = it.de + " = " + it.tr; }
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""}</span><span class="t" id="gt">${G.left}</span></div>
      <div class="card flash" style="min-height:160px"><div class="mid">${["Artikel", "Çoğul", "Anlam"][t]}</div><div class="big" style="font-size:24px">${esc(st)}</div><div class="mid" id="tfr" style="visibility:hidden">${esc(right)}</div></div>
      <div class="tfbtn" style="margin-top:14px"><button class="y" data-v="1"><i>${I("check", "ln")}</i>Doğru</button><button class="n" data-v="0"><i>${I("x", "ln")}</i>Yanlış</button></div>`;
    let lock = 0;
    $$(".tfbtn button").forEach(b => b.onclick = () => {
      if (lock++) return;
      const ok = (b.dataset.v === "1") === truth;
      b.classList.add(ok ? "good" : "bad"); $(".tfbtn").classList.add("done");
      if (ok) { G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else { G.combo = 0; $("#tfr").style.visibility = "visible"; speak(it.de); miss(t === 1 ? {de: "die " + it.pl, tr: it.tr + " (çoğul)", note: it.de + " → die " + it.pl} : it, GAMES.tf.t); }
      later(() => G.left > 0 && draw(), ok ? 350 : 1400);
    });
  };
  open(() => setTop("Doğru mu Yanlış mı?", true));
  gameTimer(60, () => gameOver("tf", "Doğru mu Yanlış mı?", G.sc));
  draw();
}

/* ---------- Harf Salatası ---------- */
function gSalad(){
  const pool = wordPool().filter(w => /^[A-Za-zÄÖÜäöüß]{3,9}$/.test(w.w));
  G = {i:0, sc:0};
  const draw = () => {
    const it = pool[G.i++ % pool.length], W = it.w.toUpperCase(), L = shuffle(W.split("")), built = [];
    const pos = L.map((_, k) => ({x: 8 + (k % 4) * 22 + rnd(-4, 4), y: 10 + (k / 4 | 0) * 30 + rnd(-5, 5), r: rnd(-25, 25)}));
    const show = () => {
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${esc(it.tr)}${it.art ? " · " + it.art : ""}</span><span class="t" id="gt">${G.left}</span></div>
        <div class="card flash" style="min-height:80px;padding:14px"><div class="big" style="letter-spacing:.12em">${W.split("").map((c, i) => i < built.length ? L[built[i]] : "_").join(" ")}</div></div>
        <div style="position:relative;height:${Math.ceil(L.length / 4) * 30 + 30}%;min-height:200px;margin-top:14px;border-radius:50% 50% 46% 46%/30% 30% 70% 70%;background:var(--acc-d);border:2px solid var(--line)">
          ${L.map((c, k) => `<button class="wd" data-k="${k}" style="position:absolute;left:${pos[k].x}%;top:${pos[k].y}%;transform:rotate(${pos[k].r}deg);width:46px;height:46px;padding:0;font-size:20px;${built.includes(k) ? "visibility:hidden" : ""}">${c}</button>`).join("")}</div>
        <div class="row2" style="margin-top:14px"><button class="btn2" id="sdel">⌫ Sil</button><button class="btn2" id="sskip">Geç</button></div>`;
      $$(".wd[data-k]").forEach(b => b.onclick = () => {
        built.push(+b.dataset.k); show();
        if (built.length === L.length) { if (built.map(k => L[k]).join("") === W) { G.sc++; speak(it.de); later(() => G.left > 0 && draw(), 500); } else { toast("Olmadı"); built.length = 0; later(show, 400); } }
      });
      $("#sdel").onclick = () => { built.pop(); show(); };
      $("#sskip").onclick = () => { miss(it, GAMES.salad.t); toast(it.de); speak(it.de); draw(); };
    };
    show();
  };
  open(() => setTop("Harf Salatası", true));
  gameTimer(60, () => gameOver("salad", "Harf Salatası", G.sc));
  draw();
}

    const its = all.slice(G.r * 5, G.r * 5 + 5);

          <div style="display:flex;flex-direction:column;gap:8px">${R.map(w => `<button class="mc ${gone.has(w.id) ? "done" : ""}" data-r="${w.id}" style="min-height:62px;color:var(--tx2)">${esc(w.tr)}</button>`).join("")}</div></div>`;
      $$("[data-l]").forEach(b => b.onclick = () => { sel = b.dataset.l; speak(BYID[sel].de); draw(); });
      $$("[data-r]").forEach(b => b.onclick = () => {
        if (!sel) return toast("Önce soldan seç");
        if (b.dataset.r === sel) { gone.add(sel); sel = null; if (gone.size === 5) { G.r++; return later(round, 300); } draw(); }
        else { G.pen += 3; miss(BYID[sel], GAMES.match.t); b.classList.add("bad"); later(() => b.classList.remove("bad"), 400); }
      });
    };
    draw();
  };
  open(() => setTop("Kelime Eşle", true));
  round();
}

        <div class="card flash" style="min-height:150px"><div class="mid">${esc(it.tr)} · ${it.kind === "v" ? "fiil" : "sıfat"}</div>
          <div class="big" style="letter-spacing:.12em;font-size:28px">${W.split("").map(c => got.has(c) ? c : "_").join(" ")}</div></div>
        <div class="pool" style="gap:6px">${KEYS.map(k => `<button class="wd" data-k="${k}" style="min-width:34px;padding:9px 8px;${got.has(k) ? "background:var(--ok-d)" : miss.has(k) ? "opacity:.3" : ""}" ${got.has(k) || miss.has(k) ? "disabled" : ""}>${k}</button>`).join("")}</div>`;
      $$(".pool .wd").forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        if (G.lives <= 0 || W.split("").every(c => got.has(c))) return;
        if (W.includes(k)) got.add(k); else { miss.add(k); G.lives--; }
        if (W.split("").every(c => got.has(c))) { G.sc++; speak(it.w); toast("✓ " + it.w); G.i++; later(round, 900); }
        else if (G.lives <= 0) { window.miss(it, GAMES.guess.t); speak(it.w); toast(it.w); later(() => gameOver("guess", "Kelime Tahmini", G.sc), 1200); }
        draw();
      });
    };
    draw();
  };
  open(() => setTop("Kelime Tahmini", true));
  round();
}

function gConj4(){
  quiz("conj4", "Çekim Seçmeli", wordPool("v"), it => {

function gPlural4(){

}

const ERR = {
  not_granted: "Claude'a izin verilmedi. Sayfayı yenileyip izin verirsen düzeltme açılır.",
  rate_limited: "Şu an çok istek var. Biraz sonra tekrar dene.",

};
const errText = e => ERR[e && e.code] || "Claude'a ulaşılamadı. Biraz sonra tekrar dene.";

function correctionPrompt(topic, text){
  return `Sen Atakan'ın Almanca öğretmenisin. Atakan Türk, Almanya'da yaşıyor, seviyesi A2 civarı. Hedefi sınav Almancası değil, günlük hayatta doğal konuşmak ve yazmak.
Aşağıdaki günlük yazısını düzelt.

Kurallar:
- "natural": metnin bir Almanın günlük hayatta yazacağı doğal hâli. Anlamı ve kişisel içeriği koru, gereksiz süsleme yapma, A2-B1 seviyesinde tut.
- "mistakes": gerçek hatalar (dilbilgisi, kelime seçimi, doğal olmayan ifade). Her biri için "wrong" (Atakan'ın yazdığı kısa parça), "right" (doğrusu), "rule" (Türkçe, tek kısa cümle, ezber kural değil pratik ipucu). En fazla 8 tane, en önemlileri.
- "note": Türkçe, tek cümle, samimi bir geri bildirim (neyi iyi yaptı ya da bir sonraki adım).
Sadece şu biçimde JSON döndür: {"natural":"...","mistakes":[{"wrong":"...","right":"...","rule":"..."}],"note":"..."}

Konu: ${topic}
Metin:
${text}`;
}

      const w = {date: TODAY, at: new Date().toISOString().slice(11, 16), title: pr.tr, mine: text,
                 natural: String(r.natural || ""), note: String(r.note || ""),

      WRITINGS.push(w); mark("write");

/* ---------- senaryo: Claude ile canlı sohbet ---------- */
let C = null;
function chatRules(src){
  const other = Object.entries(src.roles).find(([k]) => k !== "U")[1];
  return `Rol yapma pratiği. Sen "${other}" rolündesin, karşındaki Atakan (Türk, Almanya'da yaşıyor, A2 seviyesi).
Durum: ${src.desc}
Örnek diyalog (aynen tekrar etme, doğal ve biraz farklı ilerlet):
${src.lines.map(l => (src.roles[l[0]] || l[0]) + ": " + l[1]).join("\n")}

Kurallar:
- Sadece rolündeki kişi olarak, kısa (1-2 cümle), günlük, doğal Almanca konuş. A2 seviyesinde kal.
- Her cevabında sohbeti ilerletecek basit bir soru ya da tepki ver.
- Atakan'ın son mesajında hata varsa "fix" alanına Türkçe tek satırla doğru hâlini yaz (örn. "Ich hätte gern einen Kaffee" daha doğal). Hata yoksa "fix" boş olsun.
- Her cevapta JSON döndür: {"de":"senin Almanca replikin","tr":"Türkçe çevirisi","fix":""}`;
}
function openChat(src){
  C = {src, turns: [], items: [], busy: false};
  open(renderChat);
  ask();
}
function renderChat(){
  const {src} = C;
  setTop(src.title, true);
  $("#view").innerHTML = `
    <div class="card desc">${esc(src.desc)}<br><span class="ai" style="margin-top:6px">Claude: ${esc(Object.entries(src.roles).find(([k]) => k !== "U")[1])}</span></div>
    <div class="chat" id="chat">${C.items.map((m, i) => m.fix ? `<div class="fix">✎ ${esc(m.fix)}</div>` :
      `<button class="msg ${m.me ? "me" : ""}" data-i="${i}"><div class="de">${esc(m.de)}</div>${m.tr ? `<div class="tr">${esc(m.tr)}</div>` : ""}</button>`).join("")}
      ${C.busy ? `<div class="msg"><span class="thinking">yazıyor…</span></div>` : ""}</div>
    <p class="hint">Claude'un mesajına dokun: Türkçesi açılır ve okunur.</p>
    <div class="foot"><div class="chatin"><textarea id="cin" rows="1" placeholder="Almanca cevap yaz…" lang="de" spellcheck="false"></textarea><button class="cta" id="csend" ${C.busy ? "disabled" : ""}>Gönder</button></div>
      <button class="linkbtn" id="cdone">Bitirdim ✓</button></div>`;
  document.querySelectorAll("#chat .msg[data-i]").forEach(b => b.onclick = () => { const m = C.items[+b.dataset.i]; b.classList.toggle("showtr"); speak(m.de, m.me ? 0 : 1); });
  const send = () => {
    const t = $("#cin").value.trim();
    if (!t || C.busy) return;
    C.items.push({me: true, de: t}); C.turns.push({role: "user", content: t});
    ask();
  };
  $("#csend").onclick = send;
  $("#cin").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  $("#cdone").onclick = () => { S.scen.done = S.scen.done || {}; S.scen.done[src.id] = (S.scen.done[src.id] || 0) + 1; mark("scen"); toast("Kaydedildi ✓"); go(tab); };
  const last = $("#chat").lastElementChild; if (last) last.scrollIntoView({block: "end"});
}
async function ask(){
  if (!SAMPLE) { toast("Claude bağlı değil"); return; }
  C.busy = true; renderChat();
  const input = [{role: "user", content: chatRules(C.src) + "\n\nSohbeti sen başlat."}];
  // geçmiş: Claude'un cevapları JSON olarak, Atakan'ın mesajları düz metin
  C.turns.forEach(t => input.push(t));
  if (input[input.length - 1].role !== "user") input.push({role: "user", content: "(devam)"});
  try {
    const r = await SAMPLE.json(input, {modelTier: "quick", cache: false});
    const de = String(r.de || "").trim(), tr = String(r.tr || ""), fix = String(r.fix || "").trim();
    if (fix && C.items.length) C.items.push({fix});
    C.items.push({me: false, de, tr});
    C.turns.push({role: "assistant", content: JSON.stringify({de, tr, fix})});
    C.busy = false; renderChat();
    speak(de, 1);
  } catch(e) {
    C.busy = false; renderChat(); toast(errText(e));
    // gönderilemeyen mesajı kutuya geri koy
    const lu = C.turns[C.turns.length - 1];
    if (lu && lu.role === "user") { C.turns.pop(); C.items.pop(); renderChat(); $("#cin").value = lu.content; }
  }
}

function renderGrammarList(el){
  const g = S.gram = S.gram || {};
  el.innerHTML = `<p class="hint" style="text-align:left;margin:12px 2px">Ezber değil: her kartta bir kural, örnekler ve 2 soruluk mini test.</p>
    <div class="card">${GRAMMAR.map(c => `
      <button class="chap ${g[c.id] ? "read" : ""}" data-id="${c.id}"><span class="no">${g[c.id] ? "✓" : I(c.ic)}</span>
        <span class="tx"><b>${esc(c.t)}</b><span>${esc(c.s)}</span></span></button>`).join("")}</div><div style="height:16px"></div>`;
  $$(".chap").forEach(b => b.onclick = () => openGrammar(b.dataset.id));
}
function openGrammar(id){
  const c = GRAMMAR.find(x => x.id === id);
  open(() => {
    setTop(c.t, true);
    let ok = 0, done = 0;
    $("#view").innerHTML = `
      <div class="card prompt"><div class="k">${I(c.ic)} Kural</div><div style="font-size:16.5px;line-height:1.55;margin-top:6px">${esc(c.r)}</div></div>
      <div class="sec">Örnekler</div>
      <div class="card plist">${c.ex.map((e, i) => `<button class="pi" data-i="${i}"><span style="flex:none">${ICON_SPK}</span><span><div class="de">${esc(e[0])}</div><div class="tr">${esc(e[1])}</div></span></button>`).join("")}</div>
      <div class="sec">Mini test</div>
      ${c.q.map((q, qi) => { const opts = shuffle(q.slice(1)); return `<div class="card" style="padding:14px;margin-bottom:10px"><div class="muted" style="margin-bottom:8px">${esc(q[0])}</div>
        <div class="opts" style="margin-top:0">${opts.map(o => `<button class="opt gq" data-q="${qi}" data-ok="${o === q[1] ? 1 : 0}">${esc(o)}</button>`).join("")}</div></div>`; }).join("")}
      <div id="gres"></div>
      ${c.mode ? `<button class="btn2" id="gm" style="width:100%;margin-top:6px">${I(MODES[c.mode].ic)} ${MODES[c.mode].t} alıştırması · kelimelerle</button>` : ""}
      <div style="height:20px"></div>`;
    $$(".pi").forEach(b => b.onclick = () => speak(c.ex[+b.dataset.i][0].replace(" → ", ". ")));
    $$(".gq").forEach(b => b.onclick = () => {
      const qi = b.dataset.q; if ($(`.gq[data-q="${qi}"].good, .gq[data-q="${qi}"].bad`)) return;
      const good = b.dataset.ok === "1";
      b.classList.add(good ? "good" : "bad"); if (!good) { $(`.gq[data-q="${qi}"][data-ok="1"]`).classList.add("good"); miss({de: c.q[qi][1], tr: c.q[qi][0], note: c.t}, "Kurallar"); }
      speak($(`.gq[data-q="${qi}"][data-ok="1"]`).textContent);
      done++; if (good) ok++;
      if (done === c.q.length) {
        S.gram = S.gram || {}; S.gram[c.id] = Math.max(S.gram[c.id] || 0, ok); mark("gram"); save();
        $("#gres").innerHTML = `<div class="verdict ${ok === done ? "good" : "bad"}">${ok === done ? "Hepsi doğru, bu kural oturdu 👏" : ok + "/" + done + " doğru. Örneklere bir daha bak, sonra tekrar dene."}</div>`;
      }
    });
    if ($("#gm")) $("#gm").onclick = () => startSession({items: srcItems("wd").filter(it => can(c.mode, it)).slice(0, 10), mode:c.mode, title:MODES[c.mode].t});
  });
}

  open(renderReader);
}

function clearCur(){ $$(".msg").forEach(m => m.classList.remove("cur", "wait")); }
function playStep(){
  if (!R || R.play < 0 || screen !== renderReader) return;
  clearCur();
  const i = R.play, l = R.src.lines[i];
  if (!l) { R.play = -1; const b = $("#play"); if (b) b.textContent = "▶ Sesli oynat"; return; }
  const el = document.querySelector(`.msg[data-i="${i}"]`);
  el.scrollIntoView({block:"center", behavior:"smooth"});
  if (R.me && l[0] === R.me) { el.classList.add("wait"); R.waiting = true; return; }  // sıra sende: söyle, sonra balona dokun
  el.classList.add("cur");
  speak(l[1], R.keys.indexOf(l[0]), () => { if (R && R.play === i) { R.play++; setTimeout(playStep, 350); } });
}
function readerDone(){
  const {kind, src} = R;
  if (kind === "book") { S.book.read = S.book.read || {}; S.book.read[src.n] = (S.book.read[src.n] || 0) + 1; S.book.last = src.n; mark("book"); }
  else { S.scen.done = S.scen.done || {}; S.scen.done[src.id] = (S.scen.done[src.id] || 0) + 1; mark("scen"); }
  save(); checkBadges();
}

/* ---------- sohbet gibi oyna: replikler tek tek gelir, sıra sende olunca doğru cümleyi seç ---------- */
function renderChatPlay(){
  const {kind, src, roles, keys} = R, me = R.me || (kind === "book" ? "A" : "U");
  const C = R.chat = {i:0, ok:0, n:0, t0:Date.now(), xp0:S.xp || 0};
  setTop(kind === "book" ? src.n + ". bölüm" : src.title, true);
  document.body.classList.add("sess");
  const mine = src.lines.filter(l => l[0] === me).length || 1;
  $("#view").innerHTML = `
    <div class="ptop"><button class="ib px" id="px" aria-label="Kapat">${I("x")}</button><div class="pbar"><i id="cbar" style="width:4%"></i></div><span class="pcnt" id="ccnt">0/${mine}</span></div>
    <div class="chatlog" id="clog"></div><div class="chatch" id="cch"></div>`;
  $("#px").onclick = () => { stopSpeak(); R.chat = null; open(renderReader); };
  const log = $("#clog"), live = () => R && R.chat === C && screen === renderChatPlay;
  const name = k => roles[k] || k;
  const bubble = (l, who) => {
    const el = document.createElement("div");
    el.className = "cmsg " + (who === me ? "me" : "");
    el.innerHTML = (who === me ? "" : `<span class="cav">${avatar(name(who), 38)}</span>`) + `<div class="cb"><small>${esc(name(who))}</small><span class="de">${esc(l[1])}</span><span class="tr">${esc(l[2])}</span></div>`;
    el.querySelector(".cb").onclick = () => { el.classList.toggle("showtr"); speak(l[1], keys.indexOf(who)); };
    log.appendChild(el); el.scrollIntoView({block:"end", behavior:"smooth"});
    return el;
  };
  const step = () => {
    if (!live()) return;
    const l = src.lines[C.i];
    if (!l) return finish();
    if (l[0] !== me) {
      const typing = document.createElement("div");
      typing.className = "cmsg"; typing.innerHTML = `<span class="cav">${avatar(name(l[0]), 38)}</span><div class="cb typing"><i></i><i></i><i></i></div>`;
      log.appendChild(typing); typing.scrollIntoView({block:"end", behavior:"smooth"});
      setTimeout(() => {
        if (!live()) return; typing.remove(); bubble(l, l[0]);
        let moved = 0; const go2 = () => { if (moved++) return; C.i++; setTimeout(step, 300); };
        speak(l[1], keys.indexOf(l[0]), go2); setTimeout(go2, 2600 + l[1].length * 110);
      }, 650 + Math.min(900, l[1].length * 15));
      return;
    }
    // sıra sende
    const pool = src.lines.filter((x, j) => j !== C.i && norm(x[1]) !== norm(l[1]));
    const others = (D.scenarios || []).flatMap(s => s.lines).concat(D.book.chapters.flatMap(c => c.lines)).filter(x => norm(x[1]) !== norm(l[1]));
    const dis = shuffle(pool.filter(x => x[0] === me)).concat(shuffle(pool), shuffle(others).slice(0, 6));
    const ch = [l[1]]; for (const x of dis) { if (ch.length >= 3) break; if (!ch.some(c => norm(c) === norm(x[1]))) ch.push(x[1]); }
    const opts = shuffle(ch);
    $("#cch").innerHTML = `<div class="chq"><small>Sıra sende. Şunu söyle:</small><b>${esc(l[2])}</b></div>${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}`;
    $("#cch").scrollIntoView({block:"end", behavior:"smooth"});
    let lock = 0;
    $$("#cch .opt").forEach(b => b.onclick = () => {
      if (lock) return; lock = 1;
      const ok = opts[+b.dataset.k] === l[1];
      C.n++; if (ok) C.ok++;
      b.classList.add(ok ? "good" : "bad"); if (!ok) $(`#cch .opt[data-k="${opts.indexOf(l[1])}"]`).classList.add("good");
      sfx(ok ? "ok" : "bad"); buzz(ok ? 12 : [30, 40, 30]); if (ok) addXP(5);
      $("#cbar").style.width = Math.max(4, C.n / mine * 100) + "%"; $("#ccnt").textContent = C.n + "/" + mine;
      setTimeout(() => {
        if (!live()) return; $("#cch").innerHTML = ""; bubble(l, me);
        let moved = 0; const go2 = () => { if (moved++) return; C.i++; setTimeout(step, 300); };
        speak(l[1], keys.indexOf(me), go2); setTimeout(go2, 2600 + l[1].length * 110);
      }, ok ? 450 : 1300);
    });
  };
  const finish = () => {
    readerDone();
    if (C.n && C.ok === C.n) addXP(10);
    celebrate({title:"Sohbet bitti!", sub: kind === "book" ? `${src.n}. bölüm: ${src.de}` : src.title, xp:(S.xp || 0) - C.xp0, pct: C.n ? Math.round(C.ok / C.n * 100) : undefined,
      time: mmss(Date.now() - C.t0), icon:"chat", btn:"Kitaplığa dön", fn: () => go("library")});
  };
  setTimeout(step, 300);
}

function sayPrompt(lines){
  return `Sen Atakan'ın Almanca öğretmenisin. Atakan Türk, Almanya'da yaşıyor, seviyesi A2 civarı. Eşi Nisa, 2 yaşında kızı Gece. Hedefi günlük hayatta doğal konuşmak.

Her cümle için bir Almanın günlük konuşmada gerçekten söyleyeceği doğal, kısa Almancayı ver. Ders kitabı dili değil, gereksiz resmi değil; aksi gerekmedikçe "du" kullan. A2-B1 seviyesinde tut.
Sadece şu biçimde JSON döndür, cümlelerle aynı sırada ve aynı sayıda:
{"items":[{"de":"en doğal tek cümle","tr":"cümlenin kısa Türkçe anlamı","alt":"aynı şeyi söylemenin başka yaygın yolu, yoksa boş","ex":"aynı kalıpla başka kısa bir Almanca örnek cümle","note":"Türkçe tek cümle pratik ipucu (kalıp, artikel, kelime sırası). Atakan Almanca yazdıysa hatasını kısaca söyle."}]}

Atakan'ın cümleleri:
${lines.map((l, i) => (i + 1) + ". " + l).join("\n")}`;
}

async function askClaude(lines, done){
  const r = await SAMPLE.json(sayPrompt(lines), {modelTier: "default", cache: false});

  const added = [];

    added.push(addMine({de, tr: String(x.tr || lines[i] || "").trim(), ex: String(x.ex || "").trim(), note: String(x.note || "").trim(), alt: String(x.alt || "").trim()}));

    <div class="seg" id="shs" style="margin-top:6px"><button data-v="0" class="${slow ? "" : "on"}">Normal hız</button><button data-v="1" class="${slow ? "on" : ""}">Yavaş</button></div>
    <div class="ptop"><div class="pbar"><i style="width:${SH.i/SH.items.length*100}%"></i></div><span class="small muted">${SH.i+1}/${SH.items.length}</span></div>
    <div class="card player">
      <div class="phase2" id="ph">Hazır ol</div>
      <div class="de" id="q">${it ? plain(it).split(" ").map(w => `<span>${esc(w)}</span>`).join(" ") : ""}</div>
      <div class="tr">${it ? esc(it.tr) : ""}</div>
      <div id="vd"></div>
    </div>
    <div class="ctrl"><button id="sp" aria-label="Duraklat">${SH.run ? "❚❚" : "▶"}</button><button id="sr" aria-label="Tekrar">🔁</button><button id="sn" aria-label="Sonraki">⏭</button></div>
    <p class="hint">${SR ? "Cümleyi duy, bitince hemen aynı ritimle tekrar et. Uygulama dinler ve hangi kelimeleri doğru söylediğini gösterir." : "Cümleyi duy, bitince hemen aynı ritim ve tonla yüksek sesle tekrar et. Her cümle iki kez gelir."}</p>`;
  const restart = () => { SH.tok++; stopSpeak(); if (SH.rec) try { SH.rec.abort(); } catch(e) {} };
  $$("#shs button").forEach(b => b.onclick = () => { S.opt.shslow = b.dataset.v === "1"; save(); restart(); renderShadow(); if (SH.run) setTimeout(shadowStep, 300); });
  $("#sp").onclick = () => { SH.run = !SH.run; restart(); renderShadow(); if (SH.run) setTimeout(shadowStep, 300); };
  $("#sr").onclick = () => { restart(); SH.run = true; renderShadow(); setTimeout(shadowStep, 300); };
  $("#sn").onclick = () => { restart(); SH.i++; SH.tries = 0; renderShadow(); if (SH.run) setTimeout(shadowStep, 300); };
}
function shadowStep(){
  if (!SH || !SH.run || screen !== renderShadow) return;
  const it = SH.items[SH.i], tok = ++SH.tok, live = () => SH && SH.run && SH.tok === tok && screen === renderShadow;
  if (!it) {
    const n = SH.scores.length, avg = n ? Math.round(SH.scores.reduce((a, b) => a + b, 0) / n) : 0;
    stopShadow(); setTop("Gölgeleme", true);
    endCard("🗣️", "Gölgeleme bitti", n ? `${SH.items.length} cümle · ortalama söyleyiş %${avg}` : SH.items.length + " cümle", "Tamam");
    return;
  }
  renderShadow();
  const ph = t => { const e = $("#ph"); if (e) e.textContent = t; };
  const text = plain(it), rate = S.opt.shslow ? 0.7 : undefined, nw = text.split(" ").length;
  const nextIt = ms => setTimeout(() => { if (live()) { SH.i++; SH.tries = 0; shadowStep(); } }, ms);
  const gap = Math.max(1800, nw * 520 * (S.opt.shslow ? 1.3 : 1));
  ph("Dinle");
  speak(text, 0, () => {
    if (!live()) return;
    if (SR) {
      ph("Şimdi sen");
      SH.rec = listen(alts => {
        if (!live()) return;
        const said = alts.sort((a, b) => similar(text, b) - similar(text, a))[0] || "";
        const score = Math.round(similar(text, said) * 100), ok = score >= 80, got = new Set(norm(said).split(" "));
        $$("#q span").forEach(s => s.style.color = norm(s.textContent).split(" ").every(x => !x || got.has(x)) ? "var(--ok)" : "var(--bad)");
        SH.scores.push(score);
        if (SH.res[it.id] === undefined) SH.res[it.id] = ok;
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}" style="margin-top:8px">${score >= 90 ? "Mükemmel" : ok ? "Çok iyi" : score >= 60 ? "Az kaldı" : "Bir daha dinle"} · %${score} <span class="muted small">“${esc(said)}”</span></div>`;
        if (!ok && SH.tries < 1) { SH.tries++; ph("Bir daha"); setTimeout(() => live() && shadowStep(), 1600); }
        else { ph(ok ? "Güzel" : "Sonrakine geçiyoruz"); nextIt(1500); }
      }, () => {
        if (!live()) return;
        if (SH.tries < 1) { SH.tries++; ph("Duyamadım, bir daha"); setTimeout(() => live() && shadowStep(), 1200); }
        else nextIt(800);
      });
    } else {
      ph("Şimdi sen tekrar et");
      setTimeout(() => {
        if (!live()) return;
        ph("Bir daha dinle");
        speak(text, 0, () => { if (!live()) return; ph("Tekrar et"); nextIt(gap); }, {rate});
      }, gap);
    }
  }, {rate});
}

/* ================= HAFTALIK KONTROL ================= */
function weekKey(d){ d = d ? new Date(d) : new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); }
function weekItems(){
  const from = addDays(-6);
  const L = ITEMS.filter(i => { const r = S.prog[i.id]; return r && ((r.f || r.last || "") >= from || (r.last || "") >= from); });
  const sent = shuffle(L.filter(i => i.src !== "wd")), wd = shuffle(L.filter(i => i.src === "wd"));
  const out = sent.slice(0, 10).concat(wd.slice(0, 5));
  return out.concat(sent.slice(10), wd.slice(5)).slice(0, 15);
}
const weekDue = () => new Date().getDay() === 0 && !S.weeks[weekKey()] && weekItems().length >= 5;
function weekSummary(){
  let days = 0, fresh = 0, ans = 0;
  for (let i = 0; i < 7; i++) { const r = S.days[addDays(-i)] || {}; if (Object.keys(r).length) days++; fresh += (r.newSeen || 0) + (r.newW || 0); ans += r.n || 0; }
  return {days, fresh, ans};
}
function startWeekly(){
  const items = weekItems();
  if (items.length < 5) { toast("Bu hafta en az 5 kart çalışınca açılır"); return; }
  startSession({items, mode:"week", title:"Haftalık kontrol", stepKey:"week", done: () => {
    const n = items.length, ok = n - P.redo.size;
    const pct = n ? Math.round(ok / n * 100) : 0, key = weekKey(), wrong = Array.from(P.redo).map(id => BYID[id]).filter(Boolean);
    S.weeks[key] = {ok, n, pct, d:TODAY}; save();
    const w = weekSummary();
    resultScreen({cos: pct >= 85 ? "crown" : pct >= 65 ? "flag" : "glasses", top: "Haftalık kontrol", title: pct >= 85 ? "Harika bir hafta!" : pct >= 65 ? "İyi gidiyor" : "Tekrar zamanı", icon: pct >= 85 ? "trophy" : pct >= 65 ? "bolt" : "sun", pct,
      sub: `${ok} / ${n} doğru`, msg: pct >= 85 ? "Bu haftanın kartları oturuyor." : pct >= 65 ? "Yanlışları bir kez daha çalışırsan tamam." : "Bu hafta biraz yavaşla, tekrarlara ağırlık ver.",
      stats: [["calendar", w.days + "/7", "gün"], ["cards", w.fresh, "yeni kart"], ["checksq", w.ans, "soru"]],
      extra: wrong.length ? `<div class="sec">Yanlışların</div><div class="rwrong">${wrong.map(i => `<span><b>${esc(i.de)}</b>${esc(i.tr)}</span>`).join("")}</div>` : "",
      btn: wrong.length ? "Yanlışları çalış" : "Tamam", fn: wrong.length ? () => startSession({items: wrong, mode:"mix", title:"Haftanın yanlışları"}) : null,
      btn2: wrong.length ? "Sonra" : "", fn2: null});
  }});
}
function weekBox(){
  const ks = Object.keys(S.weeks).sort().reverse().slice(0, 6), can = weekItems().length >= 5, done = S.weeks[weekKey()];
  return `<div class="sec">Haftalık kontrol</div>
    <div class="card klist">${ks.length ? ks.map(k => `<div><b>${trDate(k)} haftası</b><span>%${S.weeks[k].pct} · ${S.weeks[k].ok}/${S.weeks[k].n}</span></div>`).join("") : `<div><b>Henüz yok</b><span>Her pazar Bugün ekranına gelir</span></div>`}</div>
    ${can ? `<button class="btn2" id="wkt" style="width:100%;margin-top:10px">${done ? "Bu haftanınkini tekrar yap" : "Şimdi yap"}</button>` : ""}`;
}

const QUIET_T = {nl: ["🔇", "Şu an dinleyemem", "Dinleyemem"], ns: ["🤐", "Şu an konuşamam", "Konuşamam"]};
function quietLeft(k){
  const ms = quietUntil(k) - Date.now(); if (ms <= 0) return "";
  const h = Math.floor(ms / 36e5), m = Math.ceil(ms % 36e5 / 6e4);
  return h ? `${h} sa${m ? " " + m + " dk" : ""}` : `${m} dk`;
}
function quietRow(){

function quietPick(k, after){

  $("#qx").onclick = () => $("#sheet").classList.remove("show");
}
function bindQuiet(){

function quietBar(m){

function qaPrompt(qs){
  return `Sen Atakan'ın Almanca öğretmenisin. Atakan Türk, Almanya'da yaşıyor, seviyesi A2 civarı. Eşi Nisa, 2 yaşında kızı Gece. Hedefi günlük hayatta doğal konuşmak; sınav Almancası değil.
Atakan sana ${qs.length} soru soruyor (sesle girilmiş olabilir; küçük yazım hatalarını anlamına göre düzelt).
Her soru için:
- "a": Türkçe, kısa ve net cevap (2-6 cümle). Günlük konuşmada gerçekten nasıl kullanıldığını öne çıkar; gerekiyorsa 1-2 kısa Almanca örnek ver. Ders kitabı terimlerini az kullan, kullanırsan kısaca açıkla.
- "de": sorunun konusunu en iyi gösteren, günlük hayatta kullanılan doğal tek bir Almanca örnek cümle (Atakan'ın hayatına uygunsa daha iyi).
- "tr": bu örnek cümlenin Türkçesi.
- "note": Türkçe tek cümle, bu kartın altında duracak pratik ipucu (en fazla 120 karakter).
Sadece şu biçimde JSON döndür, sorularla aynı sırada: {"items":[{"a":"...","de":"...","tr":"...","note":"..."}]}

Sorular:
${qs.map((q, i) => (i + 1) + ". " + q).join("\n")}`;
}
async function answerQs(list){
  const r = await SAMPLE.json(qaPrompt(list.map(x => x.ctx ? `(Çalıştığım kart: "${x.ctx}") ${x.q}` : x.q)), {modelTier: "default", cache: false});
  const arr = Array.isArray(r) ? r : Array.isArray(r.items) ? r.items : [r];
  let n = 0;
  list.forEach((x, i) => {
    const y = arr[i]; if (!y || !y.a) return;
    x.a = String(y.a).trim(); x.ad = TODAY;
    const de = String(y.de || "").trim();
    if (de) { const m = addMine({de, tr: String(y.tr || "").trim(), ex:"", note: String(y.note || "").trim(), alt:""}); x.card = m.id; }
    if (!S.qa.includes(x)) S.qa.push(x);
    n++;
  });
  if (!n) throw {};
  buildItems(); save();
  return list.filter(x => x.a);
}

/* ================= FLEDİ: asistan sohbeti (soru sor + durum + kart isteme) ================= */
// S.fchat: [{id, r:"u"|"f", t, d, cards?:[id], act?:"ms"|"due"|"deck", p?:1 (cevap bekliyor)}]
const fid = () => "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function fchat(){ S.fchat = S.fchat || []; return S.fchat; }

// eski "Soru sor" kayıtlarını bir kez sohbete taşı
function fMigrate(){
  if (S.fmig) return; S.fmig = 1;
  (S.qa || []).forEach(x => {
    fchat().push({id: x.id + "0", r: "u", t: x.ctx ? `(${x.ctx}) ${x.q}` : x.q, d: x.d, p: x.a ? 0 : 1});
    if (x.a) fchat().push({id: x.id + "1", r: "f", t: x.a, d: x.ad || x.d, cards: x.card ? [x.card] : []});
  });
}

// Gedsche'nin bildiği her şey: ilerleme özeti
function fContext(){
  const lv = cefr(), lg = league(), st = steps();
  const last7 = Array.from({length: 7}, (_, k) => { const d = new Date(); d.setDate(d.getDate() - k); return S.days[ymd(d)] || {}; });
  const n7 = last7.reduce((a, r) => a + (r.n || 0), 0), ok7 = last7.reduce((a, r) => a + (r.ok || 0), 0);
  const prog = Object.values(S.prog);
  const weak = ITEMS.filter(i => (S.prog[i.id] || {}).x).sort((a, b) => S.prog[b.id].x - S.prog[a.id].x).slice(0, 6).map(i => `${i.de} (${i.tr}) ${S.prog[i.id].x}× yanlış`);
  const ms = missActive().sort((a, b) => b[1].n - a[1].n).slice(0, 10).map(([, r]) => `${r.de}${r.tr ? " (" + r.tr + ")" : ""} · ${r.src || ""} · ${r.n}×`);
  const wm = allMistakes().slice(-5).map(m => `${m.wrong} → ${m.right}`);
  return [
    `Bugün: ${trDate(TODAY)}, ${GUNLER[new Date().getDay()]}, saat ${new Date().getHours()}:${pad(new Date().getMinutes())}.`,
    `Seri: ${streak()} gün. Toplam puan: ${S.xp || 0}. Bugünkü puan: ${dayRec().xp || 0}. Günlük hedef: ${S.opt.goal || 20} dk.`,
    `Bugünün adımları: ${st.map(s => s.t + (s.done ? " ✓" : " (yapılmadı)")).join("; ")}.`,
    `Son 7 gün: ${last7.filter(r => Object.keys(r).length).length} gün çalıştı, ${n7} cevap, doğru oranı ${n7 ? Math.round(ok7 / n7 * 100) + "%" : "–"}.`,
    `Bu hafta ${lg.now} puan, geçen hafta ${lg.last}, rekor hafta ${lg.best}.`,
    `Tahmini seviye: ${lv.lv}, ${lv.next}'ye %${lv.pct}.`,
    `Kartlar: ${prog.length} başladı, ${prog.filter(r => r.b >= 4).length} oturdu. Kitap: ${Object.keys(S.book.read || {}).length}/${D.book.chapters.length} bölüm. Senaryo: ${Object.keys(S.scen.done || {}).length}/${D.scenarios.length}. Düzeltilmiş yazı: ${allWritings().length}.`,
    `Hata defteri (${missCount()} aktif): ${ms.join("; ") || "boş"}.`,
    `En çok zorlandığı kartlar: ${weak.join("; ") || "yok"}.`,
    `Son yazı hataları: ${wm.join("; ") || "yok"}.`,
  ].join("\n");
}
function fRules(){
  return `Sen Gedsche'sin: Atakan'ın Almanca uygulamasındaki sevimli yarasa maskot ve kişisel asistan. Atakan Türk, Almanya'da yaşıyor, seviyesi A2 civarı; eşi Nisa, 2 yaşında kızı Gece. Hedefi sınav Almancası değil, günlük hayatta doğal konuşmak.
Türkçe konuş: sıcak, kısa, samimi (2-6 cümle; liste gerekiyorsa kısa madde). Ara sıra küçük bir yarasa esprisi olabilir ama abartma.
Yapabildiklerin:
1) Almanca sorularını cevapla: günlük konuşmada gerçekten nasıl kullanıldığını öne çıkar, 1-2 kısa Almanca örnek ver.
2) Durumunu konuş: aşağıdaki ilerleme bilgisine dayan; somut ol (sayılar, hata defterindeki örnekler), ne çalışması gerektiğini öner. Bilgide olmayan şeyi uydurma.
3) Kart iste: "restoranda 5 kart ver", "doktor için kelimeler" gibi isteklerde "cards" listesine doğal, günlük hayattan, A2-B1 seviyesinde kartlar koy (istenen sayı, verilmediyse 5; en fazla 10). Kelime istenirse isimlerde artikeliyle yaz. Kartlar destesine eklenir.
4) Soru cevabında konuyu gösteren tek bir örnek kart ekleyebilirsin (cards içinde 1 kart). Sohbet/durum konuşmasında kart ekleme, istenmedikçe.
"act": konuşma şunlardan birine yönlendiriyorsa koy: "ms" (hata defterini çalış), "due" (tekrarı gelen kartlar), "deck" (günün destesi); yoksa boş bırak.
Sadece şu JSON'u döndür: {"reply":"...","cards":[{"de":"...","tr":"...","note":"Türkçe kısa ipucu (en fazla 110 karakter)"}],"act":""}

Atakan'ın şu anki durumu:
${fContext()}`;
}

async function fAsk(){
  const L = fchat(), pend = L.filter(m => m.r === "u" && m.p);
  if (!pend.length || !SAMPLE || renderQA.busy) return;
  renderQA.busy = true; renderQA();
  const input = [{role: "user", content: fRules() + "\n\n(Sohbet başlıyor.)"}, {role: "assistant", content: JSON.stringify({reply: "Merhaba Atakan!", cards: [], act: ""})}];
  L.filter(m => !m.p).slice(-16).forEach(m => input.push(m.r === "u" ? {role: "user", content: m.t} : {role: "assistant", content: JSON.stringify({reply: m.t, cards: [], act: m.act || ""})}));
  input.push({role: "user", content: pend.map(m => m.t).join("\n")});
  // aynı rolden arka arkaya gelen mesajları birleştir
  const msgs = input.reduce((a, m) => { const l = a[a.length - 1]; if (l && l.role === m.role) l.content += "\n" + m.content; else a.push(Object.assign({}, m)); return a; }, []);
  try {
    const r = await SAMPLE.json(msgs, {modelTier: "default", cache: false});

    const cards = (Array.isArray(r.cards) ? r.cards : []).slice(0, 10).filter(c => c && c.de).map(c => addMine({de: String(c.de).trim(), tr: String(c.tr || "").trim(), ex: "", note: String(c.note || "").trim(), alt: ""}).id);

    L.push({id: fid(), r: "f", t: reply, d: TODAY, cards, act: ["ms", "due", "deck"].includes(r.act) ? r.act : ""});

  if (screen === renderQA) renderQA();
}

// telefondaki sürüm: Claude yok; durum sorularını kendi cevaplar, diğerlerini Claude sürümüne bırakır
function fLocal(t){
  const s = norm(t);
  if (/durum|nasil gidiyor|ilerle|seviye|seri|puan|ne yapmaliyim|ne calis/.test(s)) {
    const lv = cefr(), lg = league(), mc = missCount(), st = steps(), left = st.filter(x => !x.done);
    return {t: `${streak()} gündür aralıksız çalışıyorsun. Bu hafta ${lg.now} puan topladın${lg.last ? `, geçen hafta ${lg.last}` : ""}. Tahmini seviyen ${lv.lv}, ${lv.next}'ye %${lv.pct} yol aldın.\n${left.length ? `Bugün ${left.length} adım kaldı: ${left.map(x => x.t).join(", ")}.` : "Bugünün bütün adımları bitti, süpersin!"}${mc ? `\nHata defterinde ${mc} hata bekliyor; onları çalışmak en hızlı ilerleme.` : ""}`, act: mc ? "ms" : left.length ? "deck" : ""};
  }
  if (/hata/.test(s)) {
    const ms = missActive().sort((a, b) => b[1].n - a[1].n).slice(0, 5);
    return {t: ms.length ? `Hata defterinde ${missCount()} hata var. En çok takıldıkların:\n${ms.map(([, r]) => `• ${r.de}${r.tr ? " = " + r.tr : ""} (${r.n}×)`).join("\n")}\nİstersen hemen çalışalım.` : "Hata defterin boş, harika! Yanlış yaptığın her şey otomatik oraya gelir.", act: ms.length ? "ms" : ""};
  }
  return null;
}

/* ================= SÜRÜM 3: pano kutuları, seri kutlaması, sandık, lig, seviye, rapor, tur ================= */
const sheetOpen = html => { $("#sheetIn").innerHTML = html; $("#sheet").classList.add("show"); };
const sheetClose = () => $("#sheet").classList.remove("show");
const mondayOf = k => { const d = new Date(k + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
// eski günlerde puan tutulmuyordu: doğru cevap başına 10 say
const dayXP = r => r ? (r.xp !== undefined ? r.xp : (r.ok || 0) * 10) : 0;

/* ---------- E12: günün kelimesi (sık kelimelerden, her gün başka) ---------- */
function wordOfDay(){

  if (!L.length) return null;
  let h = 0; for (const ch of TODAY) h = (h * 33 + ch.charCodeAt(0)) >>> 0;
  return L[h % L.length];
}

/* ---------- E6: tahmini seviye (A1 → B2) ---------- */
const CEFR = [["A1", 0], ["A2", 450], ["B1", 1200], ["B2", 2400], ["C1", 4000]];
function cefr(){
  const P = S.prog;
  let pts = 0;
  ITEMS.forEach(i => { const r = P[i.id]; if (!r) return; const w = r.b >= 4 ? 1 : r.b >= 2 ? .6 : .25; pts += w * (i.src === "wd" ? 1 : 1.4); });
  pts += Object.keys(S.book.read || {}).length * 12 + Object.keys(S.scen.done || {}).length * 8 + allWritings().length * 5;
  let k = 0; while (k < CEFR.length - 2 && pts >= CEFR[k + 1][1]) k++;
  const lo = CEFR[k][1], hi = CEFR[k + 1][1];
  return {lv: CEFR[k][0], next: CEFR[k + 1][0], pct: Math.max(2, Math.min(99, Math.round((pts - lo) / (hi - lo) * 100))), pts: Math.round(pts)};
}

/* ---------- E4: kendinle lig (haftalık puan) ---------- */
function league(){
  const W = {};
  Object.entries(S.days).forEach(([k, r]) => { const m = mondayOf(k); W[m] = (W[m] || 0) + dayXP(r); });
  const cur = mondayOf(TODAY), now = W[cur] || 0;
  const past = Object.keys(W).filter(k => k < cur).sort();
  const best = past.length ? Math.max(...past.map(k => W[k])) : 0;
  const last = past.length ? W[past[past.length - 1]] : 0;
  const rank = 1 + past.slice(-4).filter(k => W[k] > now).length;
  return {now, best, last, rank, of: Math.min(5, past.length + 1), weeks: past.slice(-5).map(k => [k, W[k]]).concat([[cur, now]])};
}

/* ---------- E5: günlük sandık ---------- */
function chestState(){ const st = steps(); return dayRec().chest ? "open" : st.every(s => s.done) ? "ready" : "locked"; }
function openChest(){

  if (s === "open") { toast("Bugünün sandığını açtın. Yarın yenisi gelir."); return; }

    <button class="cta" id="chx" style="width:100%;margin-top:12px">Süper</button>`);
  $("#chx").onclick = () => { sheetClose(); if (tab === "today") renderToday(); };

/* ---------- D4: art arda doğru = köşeden kısa yarasa selamı (akışı durdurmaz) ---------- */
const COMBO_AT = {3: ["3 üst üste!", 5], 5: ["5'te 5!", 10], 10: ["10 seri!", 20], 15: ["15! Efsane", 25]};
function comboCheck(ok){
  if (!P) return;
  P.combo = ok ? (P.combo || 0) + 1 : 0;
  const c = COMBO_AT[P.combo];
  if (!c) return;
  addXP(c[1]);
  setTimeout(() => {
    $$(".bpeek").forEach(x => x.remove());
    const el = document.createElement("div");
    el.className = "bpeek" + (P.combo >= 10 ? " big" : "");
    el.setAttribute("aria-live", "polite");
    el.innerHTML = `<span class="bpb"><b>${c[0]}</b><i>+${c[1]}</i></span>${typeof bat === "function" ? bat("wow", 64, P.combo >= 15 ? "crown" : P.combo >= 10 ? "party" : "") : I("flame")}`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1700);
  }, 250);
}

/* ---------- E10: haftalık rapor ---------- */
function renderReport(){
  setTop("Haftalık rapor", true);
  const cur = mondayOf(TODAY), lg = league();
  const days = Object.entries(S.days).filter(([k]) => mondayOf(k) === cur);
  const n = days.reduce((a, [, r]) => a + (r.n || 0), 0), ok = days.reduce((a, [, r]) => a + (r.ok || 0), 0);
  const bestDay = days.slice().sort((a, b) => dayXP(b[1]) - dayXP(a[1]))[0];
  const weak = ITEMS.filter(i => (S.prog[i.id] || {}).x).sort((a, b) => S.prog[b.id].x - S.prog[a.id].x).slice(0, 5);
  const mx = Math.max(10, ...lg.weeks.map(w => w[1]));
