/* ---------- senaryo: Claude ile canlı sohbet ---------- */
let C = null;
function chatRules(src){
  const other = Object.entries(src.roles).find(([k]) => k !== "U")[1];
  return `Rol yapma pratiği. Sen "${other}" rolündesin, karşındaki Atakan (Türk, Almanya'da yaşıyor, A2 seviyesi).
Durum: ${src.desc}
Örnek diyalog (aynen tekrar etme, doğal ve biraz farklı ilerlet):
${src.lines.map(l => (src.roles[l[0]] || l[0]) + ": " + l[1]).join("\n")}

Kurallar:
- Sadece rolündeki kişi olarak, kısa (1-2 cümle), günlük, doğal Almanca konuş. A2 seviyesinde kal.
- Her cevabında sohbeti ilerletecek basit bir soru ya da tepki ver.
- Atakan'ın son mesajında hata varsa "fix" alanına Türkçe tek satırla doğru hâlini yaz (örn. "Ich hätte gern einen Kaffee" daha doğal). Hata yoksa "fix" boş olsun.
- Her cevapta JSON döndür: {"de":"senin Almanca replikin","tr":"Türkçe çevirisi","fix":""}`;
}
function openChat(src){
  C = {src, turns: [], items: [], busy: false};
  open(renderChat);
  ask();
}
function renderChat(){
  const {src} = C;
  setTop(src.title, true);
  $("#view").innerHTML = `
    <div class="card desc">${esc(src.desc)}<br><span class="ai" style="margin-top:6px">Claude: ${esc(Object.entries(src.roles).find(([k]) => k !== "U")[1])}</span></div>
    <div class="chat" id="chat">${C.items.map((m, i) => m.fix ? `<div class="fix">✎ ${esc(m.fix)}</div>` :
      `<button class="msg ${m.me ? "me" : ""}" data-i="${i}"><div class="de">${esc(m.de)}</div>${m.tr ? `<div class="tr">${esc(m.tr)}</div>` : ""}</button>`).join("")}
      ${C.busy ? `<div class="msg"><span class="thinking">yazıyor…</span></div>` : ""}</div>
    <p class="hint">Claude'un mesajına dokun: Türkçesi açılır ve okunur.</p>
    <div class="foot"><div class="chatin"><textarea id="cin" rows="1" placeholder="Almanca cevap yaz…" lang="de" spellcheck="false"></textarea><button class="cta" id="csend" ${C.busy ? "disabled" : ""}>Gönder</button></div>
      <button class="linkbtn" id="cdone">Bitirdim ✓</button></div>`;
  document.querySelectorAll("#chat .msg[data-i]").forEach(b => b.onclick = () => { const m = C.items[+b.dataset.i]; b.classList.toggle("showtr"); speak(m.de, m.me ? 0 : 1); });
  const send = () => {
    const t = $("#cin").value.trim();
    if (!t || C.busy) return;
    C.items.push({me: true, de: t}); C.turns.push({role: "user", content: t});
    ask();
  };
  $("#csend").onclick = send;
  $("#cin").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  $("#cdone").onclick = () => { S.scen.done = S.scen.done || {}; S.scen.done[src.id] = (S.scen.done[src.id] || 0) + 1; mark("scen"); toast("Kaydedildi ✓"); go(tab); };
  const last = $("#chat").lastElementChild; if (last) last.scrollIntoView({block: "end"});
}
async function ask(){
  if (!SAMPLE) { toast("Claude bağlı değil"); return; }
  C.busy = true; renderChat();
  const input = [{role: "user", content: chatRules(C.src) + "\n\nSohbeti sen başlat."}];
  // geçmiş: Claude'un cevapları JSON olarak, Atakan'ın mesajları düz metin
  C.turns.forEach(t => input.push(t));
  if (input[input.length - 1].role !== "user") input.push({role: "user", content: "(devam)"});
  try {
    const r = await SAMPLE.json(input, {modelTier: "quick", cache: false});
    const de = String(r.de || "").trim(), tr = String(r.tr || ""), fix = String(r.fix || "").trim();
    if (fix && C.items.length) C.items.push({fix});
    C.items.push({me: false, de, tr});
    C.turns.push({role: "assistant", content: JSON.stringify({de, tr, fix})});
    C.busy = false; renderChat();
    speak(de, 1);
  } catch(e) {
    C.busy = false; renderChat(); toast(errText(e));
    // gönderilemeyen mesajı kutuya geri koy
    const lu = C.turns[C.turns.length - 1];
    if (lu && lu.role === "user") { C.turns.pop(); C.items.pop(); renderChat(); $("#cin").value = lu.content; }
  }
}

function openGrammar(id){

    let ok = 0, done = 0;

      <div class="sec">Mini test</div>
      ${c.q.map((q, qi) => { const opts = shuffle(q.slice(1)); return `<div class="card" style="padding:14px;margin-bottom:10px"><div class="muted" style="margin-bottom:8px">${esc(q[0])}</div>

    $$(".pi").forEach(b => b.onclick = () => speak(c.ex[+b.dataset.i][0].replace(" → ", ". ")));
    $$(".gq").forEach(b => b.onclick = () => {
      const qi = b.dataset.q; if ($(`.gq[data-q="${qi}"].good, .gq[data-q="${qi}"].bad`)) return;
      const good = b.dataset.ok === "1";
      b.classList.add(good ? "good" : "bad"); if (!good) { $(`.gq[data-q="${qi}"][data-ok="1"]`).classList.add("good"); miss({de: c.q[qi][1], tr: c.q[qi][0], note: c.t}, "Kurallar"); }
      speak($(`.gq[data-q="${qi}"][data-ok="1"]`).textContent);
      done++; if (good) ok++;
      if (done === c.q.length) {
        S.gram = S.gram || {}; S.gram[c.id] = Math.max(S.gram[c.id] || 0, ok); mark("gram"); save();
        $("#gres").innerHTML = `<div class="verdict ${ok === done ? "good" : "bad"}">${ok === done ? "Hepsi doğru, bu kural oturdu 👏" : ok + "/" + done + " doğru. Örneklere bir daha bak, sonra tekrar dene."}</div>`;
      }
    });
    if ($("#gm")) $("#gm").onclick = () => startSession({items: srcItems("wd").filter(it => can(c.mode, it)).slice(0, 10), mode:c.mode, title:MODES[c.mode].t});
  });
}

        <div class="who">${avatar(roles[l[0]] || l[0], 22)}${esc(roles[l[0]] || l[0])}</div><div class="de">${esc(l[1])}</div><div class="tr">${esc(l[2])}</div>${(BYID[(kind === "book" ? "b" + src.n + "." : src.id + ".") + i] || {}).note ? `<div class="tr">💡 ${esc(BYID[(kind === "book" ? "b" + src.n + "." : src.id + ".") + i].note)}</div>` : ""}</button>`).join("")}</div>
    ${src.k && src.k.length ? `<div class="sec">Bu bölümün kalıpları</div><div class="card klist">${src.k.map(k => `<div><b>${esc(k[0])}</b><span>${esc(k[1])}</span></div>`).join("")}</div>

    <div class="foot ffoot"><div class="row2"><button class="btn2" id="play">▶ Sesli oynat</button><button class="cta" id="fin">Bitirdim ✓</button></div></div>`;
  const recStop = () => { R.tok = (R.tok || 0) + 1; if (R.rec) try { R.rec.abort(); } catch(e) {} };
  onLeave = recStop;
  $$("#roles button").forEach(b => b.onclick = () => { stopSpeak(); recStop(); R.me = b.dataset.r || null; R.play = -1; renderReader(); });
  $$(".msg").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, l = src.lines[i];
    if (R.waiting && i === R.play) { recStop(); b.classList.remove("hide", "wait", "mic"); speak(l[1], keys.indexOf(l[0]), () => { R.waiting = false; R.play++; playStep(); }); return; }
    if (b.classList.contains("hide")) { b.classList.remove("hide"); b.classList.add("showtr"); }
    else b.classList.toggle("showtr");
    speak(l[1], keys.indexOf(l[0]));
  });
  $("#play").onclick = () => {
    if (R.play >= 0) { stopSpeak(); recStop(); R.play = -1; R.waiting = false; $("#play").textContent = "▶ Sesli oynat"; clearCur(); return; }
    R.play = 0; $("#play").textContent = "■ Durdur"; playStep();
  };
  $("#fin").onclick = () => { stopSpeak(); readerDone(); toast("Kaydedildi ✓"); go(tab); };
  $("#cplay").onclick = () => { stopSpeak(); R.play = -1; open(renderChatPlay); };
  if ($("#kq")) $("#kq").onclick = () => startSession({items: kind === "book" ? ITEMS.filter(i => i.src === "bk" && i.ch === src.n) : ITEMS.filter(i => i.sc === src.id), mode:"mix", title:"Bölüm kalıpları"});

function clearCur(){ $$(".msg").forEach(m => m.classList.remove("cur", "wait")); }
function playStep(){
  if (!R || R.play < 0 || screen !== renderReader) return;
  clearCur();
  const i = R.play, l = R.src.lines[i];
  if (!l) { R.play = -1; const b = $("#play"); if (b) b.textContent = "▶ Sesli oynat"; return; }
  const el = document.querySelector(`.msg[data-i="${i}"]`);
  el.scrollIntoView({block:"center", behavior:"smooth"});
  if (R.me && l[0] === R.me) { el.classList.add("wait"); R.waiting = true; if (SR && !noSpeak()) readerListen(el, i); return; }  // sıra sende: söyle, sonra balona dokun
  el.classList.add("cur");
  speak(l[1], R.keys.indexOf(l[0]), () => { if (R && R.play === i) { R.play++; setTimeout(playStep, 350); } });
}
function readerDone(){
  const {kind, src} = R;
  if (kind === "book") { S.book.read = S.book.read || {}; S.book.read[src.n] = (S.book.read[src.n] || 0) + 1; S.book.last = src.n; mark("book"); }
  else { S.scen.done = S.scen.done || {}; S.scen.done[src.id] = (S.scen.done[src.id] || 0) + 1; mark("scen"); }
  save(); checkBadges();
}

/* ---------- sohbet gibi oyna: replikler tek tek gelir, sıra sende olunca doğru cümleyi seç ---------- */
function renderChatPlay(){
  const {kind, src, roles, keys} = R, me = R.me || (kind === "book" ? "A" : "U");
  const C = R.chat = {i:0, ok:0, n:0, t0:Date.now(), xp0:S.xp || 0};
  setTop(kind === "book" ? src.n + ". bölüm" : src.title, true);
  document.body.classList.add("sess");
  const mine = src.lines.filter(l => l[0] === me).length || 1;
  $("#view").innerHTML = `
    <div class="ptop"><button class="ib px" id="px" aria-label="Kapat">${I("x")}</button><div class="pbar"><i id="cbar" style="width:4%"></i></div><span class="pcnt" id="ccnt">0/${mine}</span></div>
    <div class="chatlog" id="clog"></div><div class="chatch" id="cch"></div>`;
  $("#px").onclick = () => { stopSpeak(); R.chat = null; open(renderReader); };
  const log = $("#clog"), live = () => R && R.chat === C && screen === renderChatPlay;
  const name = k => roles[k] || k;
  const bubble = (l, who) => {
    const el = document.createElement("div");
    el.className = "cmsg " + (who === me ? "me" : "");
    el.innerHTML = (who === me ? "" : `<span class="cav">${avatar(name(who), 38)}</span>`) + `<div class="cb"><small>${esc(name(who))}</small><span class="de">${esc(l[1])}</span><span class="tr">${esc(l[2])}</span></div>`;
    el.querySelector(".cb").onclick = () => { el.classList.toggle("showtr"); speak(l[1], keys.indexOf(who)); };
    log.appendChild(el); el.scrollIntoView({block:"end", behavior:"smooth"});
    return el;
  };
  const step = () => {
    if (!live()) return;
    const l = src.lines[C.i];
    if (!l) return finish();
    if (l[0] !== me) {
      const typing = document.createElement("div");
      typing.className = "cmsg"; typing.innerHTML = `<span class="cav">${avatar(name(l[0]), 38)}</span><div class="cb typing"><i></i><i></i><i></i></div>`;
      log.appendChild(typing); typing.scrollIntoView({block:"end", behavior:"smooth"});
      setTimeout(() => {
        if (!live()) return; typing.remove(); bubble(l, l[0]);
        let moved = 0; const go2 = () => { if (moved++) return; C.i++; setTimeout(step, 300); };
        speak(l[1], keys.indexOf(l[0]), go2); setTimeout(go2, 2600 + l[1].length * 110);
      }, 650 + Math.min(900, l[1].length * 15));
      return;
    }
    // sıra sende
    const pool = src.lines.filter((x, j) => j !== C.i && norm(x[1]) !== norm(l[1]));
    const others = (D.scenarios || []).flatMap(s => s.lines).concat(D.book.chapters.flatMap(c => c.lines)).filter(x => norm(x[1]) !== norm(l[1]));
    const dis = shuffle(pool.filter(x => x[0] === me)).concat(shuffle(pool), shuffle(others).slice(0, 6));
    const ch = [l[1]]; for (const x of dis) { if (ch.length >= 3) break; if (!ch.some(c => norm(c) === norm(x[1]))) ch.push(x[1]); }
    const opts = shuffle(ch);
    $("#cch").innerHTML = `<div class="chq"><small>Sıra sende. Şunu söyle:</small><b>${esc(l[2])}</b></div>${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}`;
    $("#cch").scrollIntoView({block:"end", behavior:"smooth"});
    let lock = 0;
    $$("#cch .opt").forEach(b => b.onclick = () => {
      if (lock) return; lock = 1;
      const ok = opts[+b.dataset.k] === l[1];
      C.n++; if (ok) C.ok++;
      b.classList.add(ok ? "good" : "bad"); if (!ok) $(`#cch .opt[data-k="${opts.indexOf(l[1])}"]`).classList.add("good");
      sfx(ok ? "ok" : "bad"); buzz(ok ? 12 : [30, 40, 30]); if (ok) addXP(5);
      $("#cbar").style.width = Math.max(4, C.n / mine * 100) + "%"; $("#ccnt").textContent = C.n + "/" + mine;
      setTimeout(() => {
        if (!live()) return; $("#cch").innerHTML = ""; bubble(l, me);
        let moved = 0; const go2 = () => { if (moved++) return; C.i++; setTimeout(step, 300); };
        speak(l[1], keys.indexOf(me), go2); setTimeout(go2, 2600 + l[1].length * 110);
      }, ok ? 450 : 1300);
    });
  };
  const finish = () => {
    readerDone();
    if (C.n && C.ok === C.n) addXP(10);
    celebrate({title:"Sohbet bitti!", sub: kind === "book" ? `${src.n}. bölüm: ${src.de}` : src.title, xp:(S.xp || 0) - C.xp0, pct: C.n ? Math.round(C.ok / C.n * 100) : undefined,
      time: mmss(Date.now() - C.t0), icon:"chat", btn:"Kitaplığa dön", fn: () => go("library")});
  };
  setTimeout(step, 300);
}

/* ================= GÖLGELEME: duy, hemen tekrar et ================= */
let SH = null;
function startShadow(src){
  if (noListen() || noSpeak()) return toast("Gölgeleme için hem dinlemen hem konuşman gerekiyor. Bugün ekranından sessiz modu kapatabilirsin.");
  let items = srcItems(src, 15);
  if (src !== "wd") items = items.filter(it => it.src !== "wd");
  if (!items.length) items = srcItems("ph", 15);
  if (!items.length) { toast("Bu kaynakta cümle yok"); return; }
  SH = {items, i:0, run:true, tok:0, tries:0, res:{}, scores:[]};
  open(renderShadow);
  onLeave = stopShadow;
  wake(true);
  setTimeout(shadowStep, 400);
}
function stopShadow(){
  if (!SH) return; SH.run = false; SH.tok++; stopSpeak(); wake(false);
  if (SH.rec) try { SH.rec.abort(); } catch(e) {}
  Object.entries(SH.res).forEach(([id, ok]) => { if (BYID[id]) { seen(BYID[id]); grade(BYID[id], ok); } }); SH.res = {};
  if (SH.scores.length) mark("shadow"); else save();
}
function renderShadow(){
  setTop("Gölgeleme", true);
  const it = SH.items[SH.i], slow = !!S.opt.shslow;
  $("#view").innerHTML = `
    <div class="seg" id="shs" style="margin-top:6px"><button data-v="0" class="${slow ? "" : "on"}">Normal hız</button><button data-v="1" class="${slow ? "on" : ""}">Yavaş</button></div>
    <div class="ptop"><div class="pbar"><i style="width:${SH.i/SH.items.length*100}%"></i></div><span class="small muted">${SH.i+1}/${SH.items.length}</span></div>
    <div class="card player">
      <div class="phase2" id="ph">Hazır ol</div>
      <div class="de" id="q">${it ? plain(it).split(" ").map(w => `<span>${esc(w)}</span>`).join(" ") : ""}</div>
      <div class="tr">${it ? esc(it.tr) : ""}</div>
      <div id="vd"></div>
    </div>
    <div class="ctrl"><button id="sp" aria-label="Duraklat">${SH.run ? "❚❚" : "▶"}</button><button id="sr" aria-label="Tekrar">🔁</button><button id="sn" aria-label="Sonraki">⏭</button></div>
    <p class="hint">${SR ? "Cümleyi duy, bitince hemen aynı ritimle tekrar et. Uygulama dinler ve hangi kelimeleri doğru söylediğini gösterir." : "Cümleyi duy, bitince hemen aynı ritim ve tonla yüksek sesle tekrar et. Her cümle iki kez gelir."}</p>`;
  const restart = () => { SH.tok++; stopSpeak(); if (SH.rec) try { SH.rec.abort(); } catch(e) {} };
  $$("#shs button").forEach(b => b.onclick = () => { S.opt.shslow = b.dataset.v === "1"; save(); restart(); renderShadow(); if (SH.run) setTimeout(shadowStep, 300); });
  $("#sp").onclick = () => { SH.run = !SH.run; restart(); renderShadow(); if (SH.run) setTimeout(shadowStep, 300); };
  $("#sr").onclick = () => { restart(); SH.run = true; renderShadow(); setTimeout(shadowStep, 300); };
  $("#sn").onclick = () => { restart(); SH.i++; SH.tries = 0; renderShadow(); if (SH.run) setTimeout(shadowStep, 300); };
}
function shadowStep(){
  if (!SH || !SH.run || screen !== renderShadow) return;
  const it = SH.items[SH.i], tok = ++SH.tok, live = () => SH && SH.run && SH.tok === tok && screen === renderShadow;
  if (!it) {
    const n = SH.scores.length, avg = n ? Math.round(SH.scores.reduce((a, b) => a + b, 0) / n) : 0;
    stopShadow(); setTop("Gölgeleme", true);
    endCard("🗣️", "Gölgeleme bitti", n ? `${SH.items.length} cümle · ortalama söyleyiş %${avg}` : SH.items.length + " cümle", "Tamam");
    return;
  }
  renderShadow();
  const ph = t => { const e = $("#ph"); if (e) e.textContent = t; };
  const text = plain(it), rate = S.opt.shslow ? 0.7 : undefined, nw = text.split(" ").length;
  const nextIt = ms => setTimeout(() => { if (live()) { SH.i++; SH.tries = 0; shadowStep(); } }, ms);
  const gap = Math.max(1800, nw * 520 * (S.opt.shslow ? 1.3 : 1));
  ph("Dinle");
  speak(text, 0, () => {
    if (!live()) return;
    if (SR) {
      ph("Şimdi sen");
      SH.rec = listen(alts => {
        if (!live()) return;
        const said = alts.sort((a, b) => similar(text, b) - similar(text, a))[0] || "";
        const score = Math.round(similar(text, said) * 100), ok = score >= 80, got = new Set(norm(said).split(" "));
        $$("#q span").forEach(s => s.style.color = norm(s.textContent).split(" ").every(x => !x || got.has(x)) ? "var(--ok)" : "var(--bad)");
        SH.scores.push(score);
        if (SH.res[it.id] === undefined) SH.res[it.id] = ok;
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}" style="margin-top:8px">${score >= 90 ? "Mükemmel" : ok ? "Çok iyi" : score >= 60 ? "Az kaldı" : "Bir daha dinle"} · %${score} <span class="muted small">“${esc(said)}”</span></div>`;
        if (!ok && SH.tries < 1) { SH.tries++; ph("Bir daha"); setTimeout(() => live() && shadowStep(), 1600); }
        else { ph(ok ? "Güzel" : "Sonrakine geçiyoruz"); nextIt(1500); }
      }, () => {
        if (!live()) return;
        if (SH.tries < 1) { SH.tries++; ph("Duyamadım, bir daha"); setTimeout(() => live() && shadowStep(), 1200); }
        else nextIt(800);
      });
    } else {
      ph("Şimdi sen tekrar et");
      setTimeout(() => {
        if (!live()) return;
        ph("Bir daha dinle");
        speak(text, 0, () => { if (!live()) return; ph("Tekrar et"); nextIt(gap); }, {rate});
      }, gap);
    }
  }, {rate});
}

function weekKey(d){ d = d ? new Date(d) : new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); }

function qaPrompt(qs){
  return `Sen Atakan'ın Almanca öğretmenisin. Atakan Türk, Almanya'da yaşıyor, seviyesi A2 civarı. Eşi Nisa, 2 yaşında kızı Gece. Hedefi günlük hayatta doğal konuşmak; sınav Almancası değil.
Atakan sana ${qs.length} soru soruyor (sesle girilmiş olabilir; küçük yazım hatalarını anlamına göre düzelt).
Her soru için:
- "a": Türkçe, kısa ve net cevap (2-6 cümle). Günlük konuşmada gerçekten nasıl kullanıldığını öne çıkar; gerekiyorsa 1-2 kısa Almanca örnek ver. Ders kitabı terimlerini az kullan, kullanırsan kısaca açıkla.
- "de": sorunun konusunu en iyi gösteren, günlük hayatta kullanılan doğal tek bir Almanca örnek cümle (Atakan'ın hayatına uygunsa daha iyi).
- "tr": bu örnek cümlenin Türkçesi.
- "note": Türkçe tek cümle, bu kartın altında duracak pratik ipucu (en fazla 120 karakter).
Sadece şu biçimde JSON döndür, sorularla aynı sırada: {"items":[{"a":"...","de":"...","tr":"...","note":"..."}]}

Sorular:
${qs.map((q, i) => (i + 1) + ". " + q).join("\n")}`;
}
async function answerQs(list){
  const r = await SAMPLE.json(qaPrompt(list.map(x => x.ctx ? `(Çalıştığım kart: "${x.ctx}") ${x.q}` : x.q)), {modelTier: "default", cache: false});
  const arr = Array.isArray(r) ? r : Array.isArray(r.items) ? r.items : [r];
  let n = 0;
  list.forEach((x, i) => {
    const y = arr[i]; if (!y || !y.a) return;
    x.a = String(y.a).trim(); x.ad = TODAY;
    const de = String(y.de || "").trim();
    if (de) { const m = addMine({de, tr: String(y.tr || "").trim(), ex:"", note: String(y.note || "").trim(), alt:""}); x.card = m.id; }
    if (!S.qa.includes(x)) S.qa.push(x);
    n++;
  });
  if (!n) throw {};
  buildItems(); save();
  return list.filter(x => x.a);
}

// S.fchat: [{id, r:"u"|"f", t, d, cards?:[id], act?:"ms"|"due"|"deck", p?:1 (cevap bekliyor)}]
const fid = () => "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function fchat(){ S.fchat = S.fchat || []; return S.fchat; }

// eski "Soru sor" kayıtlarını bir kez sohbete taşı
function fMigrate(){
  if (S.fmig) return; S.fmig = 1;
  (S.qa || []).forEach(x => {
    fchat().push({id: x.id + "0", r: "u", t: x.ctx ? `(${x.ctx}) ${x.q}` : x.q, d: x.d, p: x.a ? 0 : 1});
    if (x.a) fchat().push({id: x.id + "1", r: "f", t: x.a, d: x.ad || x.d, cards: x.card ? [x.card] : []});
  });
}

// Gedsche'nin bildiği her şey: ilerleme özeti
function fContext(){
  const lv = cefr(), lg = league(), st = steps();
  const last7 = Array.from({length: 7}, (_, k) => { const d = new Date(); d.setDate(d.getDate() - k); return S.days[ymd(d)] || {}; });
  const n7 = last7.reduce((a, r) => a + (r.n || 0), 0), ok7 = last7.reduce((a, r) => a + (r.ok || 0), 0);
  const prog = Object.values(S.prog);
  const weak = ITEMS.filter(i => (S.prog[i.id] || {}).x).sort((a, b) => S.prog[b.id].x - S.prog[a.id].x).slice(0, 6).map(i => `${i.de} (${i.tr}) ${S.prog[i.id].x}× yanlış`);
  const ms = missActive().sort((a, b) => b[1].n - a[1].n).slice(0, 10).map(([, r]) => `${r.de}${r.tr ? " (" + r.tr + ")" : ""} · ${r.src || ""} · ${r.n}×`);
  const wm = allMistakes().slice(-5).map(m => `${m.wrong} → ${m.right}`);
  return [
    `Bugün: ${trDate(TODAY)}, ${GUNLER[new Date().getDay()]}, saat ${new Date().getHours()}:${pad(new Date().getMinutes())}.`,
    `Seri: ${streak()} gün. Toplam puan: ${S.xp || 0}. Bugünkü puan: ${dayRec().xp || 0}. Günlük hedef: ${S.opt.goal || 20} dk.`,
    `Bugünün adımları: ${st.map(s => s.t + (s.done ? " ✓" : " (yapılmadı)")).join("; ")}.`,
    `Son 7 gün: ${last7.filter(r => Object.keys(r).length).length} gün çalıştı, ${n7} cevap, doğru oranı ${n7 ? Math.round(ok7 / n7 * 100) + "%" : "–"}.`,
    `Bu hafta ${lg.now} puan, geçen hafta ${lg.last}, rekor hafta ${lg.best}.`,
    `Tahmini seviye: ${lv.lv}, ${lv.next}'ye %${lv.pct}.`,
    `Kartlar: ${prog.length} başladı, ${prog.filter(r => r.b >= 4).length} oturdu. Kitap: ${Object.keys(S.book.read || {}).length}/${D.book.chapters.length} bölüm. Senaryo: ${Object.keys(S.scen.done || {}).length}/${D.scenarios.length}. Düzeltilmiş yazı: ${allWritings().length}.`,
    `Hata defteri (${missCount()} aktif): ${ms.join("; ") || "boş"}.`,
    `En çok zorlandığı kartlar: ${weak.join("; ") || "yok"}.`,
    `Son yazı hataları: ${wm.join("; ") || "yok"}.`,
  ].join("\n");
}
function fRules(){
  return `Sen Gedsche'sin: Atakan'ın Almanca uygulamasındaki sevimli yarasa maskot ve kişisel asistan. Atakan Türk, Almanya'da yaşıyor, seviyesi A2 civarı; eşi Nisa, 2 yaşında kızı Gece. Hedefi sınav Almancası değil, günlük hayatta doğal konuşmak.
Türkçe konuş: sıcak, kısa, samimi (2-6 cümle; liste gerekiyorsa kısa madde). Ara sıra küçük bir yarasa esprisi olabilir ama abartma.
Yapabildiklerin:
1) Almanca sorularını cevapla: günlük konuşmada gerçekten nasıl kullanıldığını öne çıkar, 1-2 kısa Almanca örnek ver.
2) Durumunu konuş: aşağıdaki ilerleme bilgisine dayan; somut ol (sayılar, hata defterindeki örnekler), ne çalışması gerektiğini öner. Bilgide olmayan şeyi uydurma.
3) Kart iste: "restoranda 5 kart ver", "doktor için kelimeler" gibi isteklerde "cards" listesine doğal, günlük hayattan, A2-B1 seviyesinde kartlar koy (istenen sayı, verilmediyse 5; en fazla 10). Kelime istenirse isimlerde artikeliyle yaz. Kartlar destesine eklenir.
4) Soru cevabında konuyu gösteren tek bir örnek kart ekleyebilirsin (cards içinde 1 kart). Sohbet/durum konuşmasında kart ekleme, istenmedikçe.
"act": konuşma şunlardan birine yönlendiriyorsa koy: "ms" (hata defterini çalış), "due" (tekrarı gelen kartlar), "deck" (günün destesi); yoksa boş bırak.
Sadece şu JSON'u döndür: {"reply":"...","cards":[{"de":"...","tr":"...","note":"Türkçe kısa ipucu (en fazla 110 karakter)"}],"act":""}

Atakan'ın şu anki durumu:
${fContext()}`;
}

async function fAsk(){
  const L = fchat(), pend = L.filter(m => m.r === "u" && m.p);
  if (!pend.length || !SAMPLE || renderQA.busy) return;
  renderQA.busy = true; renderQA();
  const input = [{role: "user", content: fRules() + "\n\n(Sohbet başlıyor.)"}, {role: "assistant", content: JSON.stringify({reply: "Merhaba Atakan!", cards: [], act: ""})}];
  L.filter(m => !m.p).slice(-16).forEach(m => input.push(m.r === "u" ? {role: "user", content: m.t} : {role: "assistant", content: JSON.stringify({reply: m.t, cards: [], act: m.act || ""})}));
  input.push({role: "user", content: pend.map(m => m.t).join("\n")});
  // aynı rolden arka arkaya gelen mesajları birleştir
  const msgs = input.reduce((a, m) => { const l = a[a.length - 1]; if (l && l.role === m.role) l.content += "\n" + m.content; else a.push(Object.assign({}, m)); return a; }, []);
  try {
    const r = await SAMPLE.json(msgs, {modelTier: "default", cache: false});
    const reply = String(r.reply || r.a || "").trim() || "Hmm, bunu anlayamadım. Bir daha sorar mısın?";
    const cards = (Array.isArray(r.cards) ? r.cards : []).slice(0, 10).filter(c => c && c.de).map(c => addMine({de: String(c.de).trim(), tr: String(c.tr || "").trim(), ex: "", note: String(c.note || "").trim(), alt: ""}).id);
    pend.forEach(m => delete m.p);
    L.push({id: fid(), r: "f", t: reply, d: TODAY, cards, act: ["ms", "due", "deck"].includes(r.act) ? r.act : ""});
    if (cards.length) buildItems();
    save(); sfx("ok");
  } catch(e) { toast(errText(e)); }
  renderQA.busy = false;
  if (screen === renderQA) renderQA();
}

// telefondaki sürüm: Claude yok; durum sorularını kendi cevaplar, diğerlerini Claude sürümüne bırakır
function fLocal(t){
  const s = norm(t);
  if (/durum|nasil gidiyor|ilerle|seviye|seri|puan|ne yapmaliyim|ne calis/.test(s)) {
    const lv = cefr(), lg = league(), mc = missCount(), st = steps(), left = st.filter(x => !x.done);
    return {t: `${streak()} gündür aralıksız çalışıyorsun. Bu hafta ${lg.now} puan topladın${lg.last ? `, geçen hafta ${lg.last}` : ""}. Tahmini seviyen ${lv.lv}, ${lv.next}'ye %${lv.pct} yol aldın.\n${left.length ? `Bugün ${left.length} adım kaldı: ${left.map(x => x.t).join(", ")}.` : "Bugünün bütün adımları bitti, süpersin!"}${mc ? `\nHata defterinde ${mc} hata bekliyor; onları çalışmak en hızlı ilerleme.` : ""}`, act: mc ? "ms" : left.length ? "deck" : ""};
  }
  if (/hata/.test(s)) {
    const ms = missActive().sort((a, b) => b[1].n - a[1].n).slice(0, 5);
    return {t: ms.length ? `Hata defterinde ${missCount()} hata var. En çok takıldıkların:\n${ms.map(([, r]) => `• ${r.de}${r.tr ? " = " + r.tr : ""} (${r.n}×)`).join("\n")}\nİstersen hemen çalışalım.` : "Hata defterin boş, harika! Yanlış yaptığın her şey otomatik oraya gelir.", act: ms.length ? "ms" : ""};
  }
  return null;
}

function renderQA(){

/* ================= SÜRÜM 3: pano kutuları, seri kutlaması, sandık, lig, seviye, rapor, tur ================= */
const sheetOpen = html => { $("#sheetIn").innerHTML = html; $("#sheet").classList.add("show"); };
const sheetClose = () => $("#sheet").classList.remove("show");
const mondayOf = k => { const d = new Date(k + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
// eski günlerde puan tutulmuyordu: doğru cevap başına 10 say
const dayXP = r => r ? (r.xp !== undefined ? r.xp : (r.ok || 0) * 10) : 0;

/* ---------- E12: günün kelimesi (sık kelimelerden, her gün başka) ---------- */
function wordOfDay(){
  const L = ITEMS.filter(i => i.src === "wd" && i.ex).sort((a, b) => a.o - b.o).slice(0, 400);
  if (!L.length) return null;
  let h = 0; for (const ch of TODAY) h = (h * 33 + ch.charCodeAt(0)) >>> 0;
  return L[h % L.length];
}

/* ---------- E6: tahmini seviye (A1 → B2) ---------- */
const CEFR = [["A1", 0], ["A2", 450], ["B1", 1200], ["B2", 2400], ["C1", 4000]];
function cefr(){
  const P = S.prog;
  let pts = 0;
  ITEMS.forEach(i => { const r = P[i.id]; if (!r) return; const w = r.b >= 4 ? 1 : r.b >= 2 ? .6 : .25; pts += w * (i.src === "wd" ? 1 : 1.4); });
  pts += Object.keys(S.book.read || {}).length * 12 + Object.keys(S.scen.done || {}).length * 8 + allWritings().length * 5;
  let k = 0; while (k < CEFR.length - 2 && pts >= CEFR[k + 1][1]) k++;
  const lo = CEFR[k][1], hi = CEFR[k + 1][1];
  return {lv: CEFR[k][0], next: CEFR[k + 1][0], pct: Math.max(2, Math.min(99, Math.round((pts - lo) / (hi - lo) * 100))), pts: Math.round(pts)};
}

/* ---------- E4: kendinle lig (haftalık puan) ---------- */
function league(){
  const W = {};
  Object.entries(S.days).forEach(([k, r]) => { const m = mondayOf(k); W[m] = (W[m] || 0) + dayXP(r); });
  const cur = mondayOf(TODAY), now = W[cur] || 0;
  const past = Object.keys(W).filter(k => k < cur).sort();
  const best = past.length ? Math.max(...past.map(k => W[k])) : 0;
  const last = past.length ? W[past[past.length - 1]] : 0;
  const rank = 1 + past.slice(-4).filter(k => W[k] > now).length;
  return {now, best, last, rank, of: Math.min(5, past.length + 1), weeks: past.slice(-5).map(k => [k, W[k]]).concat([[cur, now]])};
}

/* ===== Oyun efektleri: ışık, patlama, yıldırım (sadece oyunlarda) ===== */
const FX = {last: 0, streak: 0};
const fxOn = () => document.body.classList.contains("arcade") && !document.body.classList.contains("sess") && !matchMedia("(prefers-reduced-motion: reduce)").matches;
function fxLayer(){ let l = $("#fx"); if (!l) { l = document.createElement("div"); l.id = "fx"; document.body.appendChild(l); } return l; }
function fxBurst(x, y, big){
  const l = fxLayer(), cs = getComputedStyle(document.body);
  const cols = [cs.getPropertyValue("--c1").trim() || "#FFD23F", "#FFD23F", "#fff", "#3DDC84", "#FF4F8B", "#4F9BFF"];
  const n = big ? 26 : 16, frag = document.createDocumentFragment();
  const ring = document.createElement("i"); ring.className = "fxring"; ring.style.cssText = `left:${x}px;top:${y}px`; frag.appendChild(ring);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * .4, d = (big ? 120 : 70) + Math.random() * (big ? 90 : 50);
    const p = document.createElement("i"); p.className = Math.random() < .35 ? "fxp star" : "fxp";
    p.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;--c:${cols[i % cols.length]};--s:${4 + Math.random() * 6}px;animation-duration:${520 + Math.random() * 300}ms`;
    frag.appendChild(p);
  }
  l.appendChild(frag); setTimeout(() => l.querySelectorAll(".fxring,.fxp").forEach((e, i) => i < n + 1 && e.remove()), 950);
}
function fxBolt(){
  const l = fxLayer(), W = innerWidth, H = innerHeight;
  const bolt = (x0) => { let x = x0, y = -10, pts = [`${x},${y}`]; while (y < H * .55) { y += 30 + Math.random() * 40; x += (Math.random() - .5) * 70; pts.push(`${x.toFixed(0)},${y.toFixed(0)}`); } return pts.join(" "); };
  const s = document.createElement("div"); s.className = "fxbolt";
  s.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><polyline points="${bolt(W * (.15 + Math.random() * .25))}"/><polyline points="${bolt(W * (.6 + Math.random() * .25))}"/></svg>`;
  l.appendChild(s); setTimeout(() => s.remove(), 650);
}
function fxBanner(t){
  const l = fxLayer(), b = document.createElement("div"); b.className = "fxban"; b.textContent = t;
  l.appendChild(b); setTimeout(() => b.remove(), 1100);
}
function fxBad(){ const l = fxLayer(), e = document.createElement("div"); e.className = "fxbad"; l.appendChild(e); setTimeout(() => e.remove(), 450); }
function fxFireworks(){
  if (!fxOn() && !document.body.classList.contains("arcade")) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < 6; i++) setTimeout(() => fxBurst(innerWidth * (.15 + Math.random() * .7), innerHeight * (.12 + Math.random() * .4), true), i * 260);
  setTimeout(fxBolt, 200);
}
function fxGood(el){
  if (!fxOn()) return;
  FX.last = Date.now(); FX.streak++;
  const r = el ? el.getBoundingClientRect() : null;

function levelMap(){
  const P = S.prog, lv = {1:{t:0, s:0, ok:0}, 2:{t:0, s:0, ok:0}}, top = {};
  ITEMS.forEach(i => {
    if (i.src !== "wd" && i.src !== "ph") return;
    const a = A2IDS.has(i.id) ? 2 : 1, r = P[i.id];
    const key = i.src === "wd" ? (i.kind === "n" ? "w:" + (i.cat || "H") : i.kind === "v" ? "w:v" : "w:a") : "p:" + (i.cat || "Diğer");
    const tp = top[key] = top[key] || {key, t:0, s:0, ok:0, x:0, items:[]};
    [lv[a], tp].forEach(o => { o.t++; if (r) { o.s++; if (r.b >= 4) o.ok++; } });
    if (r && r.x) tp.x += r.x;
    tp.items.push(i);
  });
  const name = k => k === "w:v" ? "Fiiller" : k === "w:a" ? "Sıfat & küçük kelimeler" : k[0] === "w" ? "Kelime: " + (W_CATS[k.slice(2)] || "Diğer") : "Kalıp: " + k.slice(2);
  const L = Object.values(top).filter(t => t.t >= 6).map(t => Object.assign(t, {name: name(t.key), pct: Math.round((t.ok + (t.s - t.ok) * .4) / t.t * 100)}));
  const started = L.filter(t => t.s >= 3);
  const weak = started.slice().sort((a, b) => (a.ok / a.s - b.ok / b.s) || b.x - a.x).slice(0, 3);
  const strong = started.filter(t => !weak.includes(t)).sort((a, b) => b.pct - a.pct).slice(0, 3);

}

/* ================= AKILLI HATA TEKRARI: hataları türüne göre grupla ================= */
const MTYPE = {art:["Artikel & çoğul", "artikel"], verb:["Fiil çekimi", "conj"], sent:["Cümle kurma", "order"], spell:["Yazım & dinleme", "write"], mean:["Anlam", "quiz"]};
function missType(k, r){
  const m = r.m || "", s = r.src || "", it = BYID[k];
  if (/artikel|plural/.test(m) || /artikel|çoğul|der die das/i.test(s)) return "art";
  if (/conj|perfekt|prat/.test(m) || /çekim|perfekt|präteritum|fiil/i.test(s)) return "verb";
  if (/order|finish|^gap$/.test(m) || /cümle|sırala/i.test(s)) return "sent";
  if (/write|dictate|scramble|gapw|speak/.test(m) || /dikte|harf|turbo|yaz/i.test(s)) return "spell";
  if (!m && it && it.kind === "n" && /düş|artikel/i.test(s)) return "art";
  return "mean";
}
function smartGroups(){
  const G = {};
  missActive().forEach(([k, r]) => { const it = BYID[k]; if (!it) return; const t = missType(k, r); (G[t] = G[t] || []).push({it, r}); });
  Object.values(G).forEach(a => a.sort((x, y) => (y.r.n || 0) - (x.r.n || 0)));
  return G;
}
function startSmartMiss(){
  const G = smartGroups(), plan = [];
  const per = Math.max(3, Math.ceil(14 / Math.max(1, Object.keys(G).length)));
  Object.entries(G).sort((a, b) => b[1].length - a[1].length).forEach(([t, a]) => a.slice(0, per).forEach(({it, r}) => {
    let m = t === "art" && r.m === "plural" ? "plural" : t === "verb" && /perfekt|prat/.test(r.m || "") ? r.m : MTYPE[t][1];
    if (!can(m, it) || (MODES[m].k === "w" && !it.kind) || (MODES[m].k === "s" && it.kind)) m = it.kind ? (can("write", it) ? "write" : "quiz") : (can("order", it) && t !== "mean" ? "order" : "quiz");
    plan.push({m, it});
  }));
  if (!plan.length) return toast("Hata defterin boş 👏");
  startSession({items: plan.slice(0, 14).map(p => p.it), plan: plan.slice(0, 14), title: "Akıllı tekrar", stepKey: "mist"});
}
function smartCardHtml(){
  const G = smartGroups(), ks = Object.keys(G);

/* ================= EŞİTLEME: iki sürüm arasında kodla taşı, birleştir ================= */
const SYNC_TAG = "ALMANCA1:";
async function syncCode(){
  const json = JSON.stringify(Object.assign({}, S, {drafts: {}}));
  try {
    const st = new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));
    const buf = new Uint8Array(await new Response(st).arrayBuffer());
    let bin = ""; for (let i = 0; i < buf.length; i += 8192) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));
    return SYNC_TAG + "z" + btoa(bin);
  } catch(e) { return SYNC_TAG + "j" + btoa(unescape(encodeURIComponent(json))); }
}
async function readCode(txt){
  txt = (txt || "").trim();
  if (txt[0] === "{") return JSON.parse(txt);  // eski düz yedek
  const i = txt.indexOf(SYNC_TAG); if (i < 0) throw 0;
  const body = txt.slice(i + SYNC_TAG.length).replace(/\s+/g, ""), kind = body[0], b64 = body.slice(1);
  const bin = atob(b64);
  if (kind === "j") return JSON.parse(decodeURIComponent(escape(bin)));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
// iki ilerlemeyi birleştir: her kartta daha çok çalışılmış kayıt kazanır, sayılar en yükseği alır
function mergeState(a, b){
  const m = load(JSON.parse(JSON.stringify(a)));
  b = load(JSON.parse(JSON.stringify(b)));
  const pick = (x, y) => !x ? y : !y ? x : ((y.n || 0) > (x.n || 0) || ((y.n || 0) === (x.n || 0) && (y.last || "") > (x.last || ""))) ? y : x;
  Object.keys(b.prog).forEach(k => m.prog[k] = pick(m.prog[k], b.prog[k]));
  const maxObj = (x, y) => { Object.keys(y || {}).forEach(k => { const v = y[k]; x[k] = typeof v === "number" ? Math.max(x[k] || 0, v) : (x[k] === undefined ? v : x[k]); }); return x; };
  Object.keys(b.days).forEach(d => m.days[d] = maxObj(m.days[d] || {}, b.days[d]));
  m.book.read = maxObj(m.book.read || {}, b.book.read); m.book.last = m.book.last || b.book.last;
  m.scen.done = maxObj(m.scen.done || {}, b.scen.done);
  maxObj(m.gram, b.gram);
  m.askDone = uniq(m.askDone.concat(b.askDone));
  b.ask.forEach(x => { if (!m.ask.some(y => y.id === x.id)) m.ask.push(x); });
  m.ask = m.ask.filter(x => !m.askDone.includes(x.id));
  b.qa.forEach(x => { const i = m.qa.findIndex(y => y.id === x.id); if (i < 0) m.qa.push(x); else if (x.a && !m.qa[i].a) m.qa[i] = x; });
  b.mine.forEach(x => { if (!m.mine.some(y => y.id === x.id)) m.mine.push(x); });
  Object.keys(b.weeks).forEach(k => { if (!m.weeks[k] || (b.weeks[k].n || 0) > (m.weeks[k].n || 0)) m.weeks[k] = b.weeks[k]; });
  const mm = m.miss = m.miss || {}; Object.entries(b.miss || {}).forEach(([k, r]) => { const x = mm[k]; if (!x || (r.last || "") > (x.last || "") || ((r.last || "") === (x.last || "") && (r.n || 0) > (x.n || 0))) mm[k] = r; });
  const fc = m.fchat = m.fchat || []; (b.fchat || []).forEach(x => { const i = fc.findIndex(y => y.id === x.id); if (i < 0) fc.push(x); else if (fc[i].p && !x.p) fc[i] = x; });
  fc.sort((a, b) => a.id.localeCompare(b.id)); m.fmig = m.fmig || b.fmig;
  ["skip", "pin"].forEach(k => Object.entries(b[k] || {}).forEach(([id, t]) => { if (Math.abs(t) > Math.abs(m[k][id] || 0)) m[k][id] = t; }));
  const mi = m.mis = m.mis || {}; Object.entries(b.mis || {}).forEach(([d, r]) => { if (!mi[d] || (r.st && !mi[d].st)) mi[d] = r; });
  m.xp = Math.max(m.xp || 0, b.xp || 0); m.badges = Object.assign({}, b.badges || {}, m.badges || {});
  Object.keys(b.games).forEach(k => { const x = m.games[k], y = b.games[k], low = GAMES[k] && GAMES[k].low; m.games[k] = x === undefined ? y : low ? Math.min(x, y) : Math.max(x, y); });
  return m;
}
async function importCode(txt, stay){
  try { const other = await readCode(txt); if (!other || !other.prog) throw 0; S = mergeState(S, other); buildItems(); save(); if (stay) return true; toast("İlerleme birleştirildi ✓"); $("#sheet").classList.remove("show"); go("today"); return true; }
  catch(e) { toast("Bu bir eşitleme kodu değil"); return false; }
}

applyTheme(); setInterval(applyTheme, 5 * 60 * 1000);
$("#gear").onclick = () => {
  const o = S.opt;
  const seen = Object.keys(S.prog).length, sat = Object.values(S.prog).filter(r => r.b >= 4).length;
  $("#sheetIn").innerHTML = `<h2>Ayarlar</h2>
    ${IN_CLAUDE ? "" : `<div class="lbl">Görünüm</div>
    <div class="seg" id="th">${[["auto","Otomatik"],["light","Açık"],["dark","Koyu"]].map(([k, t]) => `<button data-v="${k}" class="${o.theme===k?"on":""}">${t}</button>`).join("")}</div>`}
${IN_CLAUDE ? "" : `<p class="small muted" style="margin:4px 2px">Otomatik: gündüz açık, 21:00'den sonra koyu.</p>`}
    <div class="lbl">Ses ve titreşim</div>
    <div class="seg" id="snd">${[[1,"Açık"],[0,"Kapalı"]].map(([k, t]) => `<button data-v="${k}" class="${(o.sound !== false) == !!k ? "on" : ""}">${t}</button>`).join("")}</div>
    <div class="lbl">Oyun modu</div>
    <div class="seg" id="gmd">${[["fx","Efektli"],["plain","Sade"]].map(([k, t]) => `<button data-v="${k}" class="${(o.gmode || "fx") === k ? "on" : ""}">${t}</button>`).join("")}</div>
    <p class="small muted" style="margin:4px 2px">Efektli: renkli oyun kartları, patlamalar, yıldırımlar. Sade: sakin, efektsiz.</p>
    <div class="lbl">Okuma hızı</div>
    <div class="seg" id="rt">${[[0.75,"Yavaş"],[0.9,"Normal"],[1.05,"Hızlı"]].map(([k, t]) => `<button data-v="${k}" class="${o.rate==k?"on":""}">${t}</button>`).join("")}</div>
    <div class="lbl">Günlük hedef</div>
    <div class="seg" id="gl">${[10,20,30].map(k => `<button data-v="${k}" class="${(o.goal||20)==k?"on":""}">${k} dk</button>`).join("")}</div>
    <p class="small muted" style="margin:4px 2px">Hedefi seçince günde yeni kart sayısı da ona göre ayarlanır.</p>
    <div class="lbl">Günde yeni kart</div>
    <div class="seg" id="pc">${[5,10,15,20].map(k => `<button data-v="${k}" class="${o.pace==k?"on":""}">${k}</button>`).join("")}</div>
    <p class="small muted" style="margin:4px 2px">Günün 10 kalıbı her zaman gelir; bu sayı kitap kalıplarından ne kadar ekleneceğini belirler.</p>
    <div class="lbl">Günde yeni kelime</div>
    <div class="seg" id="wp">${[0,5,10,15].map(k => `<button data-v="${k}" class="${o.wpace==k?"on":""}">${k || "Yok"}</button>`).join("")}</div>
    <div class="lbl">İlerleme</div>
    <p class="small muted" style="margin:4px 2px">${seen} kart başladı · ${sat} kart oturdu · ${Object.values(S.days).filter(d => Object.keys(d).length).length} gün çalıştın</p>
    <p class="small muted" style="margin:4px 2px">${DB ? "İlerlemen Claude hesabına kaydediliyor." : "İlerlemen bu cihazda duruyor."}</p>
    <div class="lbl">Diğer sürümle eşitle</div>
    <p class="small muted" style="margin:4px 2px">${IN_CLAUDE ? "Mikrofonlu uygulamada çalıştıysan: orada Ayarlar → Kodu kopyala, sonra burada Kodu yapıştır." : "Claude sürümünde çalıştıysan: orada Ayarlar → Kodu kopyala, sonra burada Kodu yapıştır."} İki taraftaki çalışma birleşir, hiçbiri silinmez. Bitince aynısını ters yönde yap.</p>
    <div class="row2"><button class="btn2" id="exp">Kodu kopyala</button><button class="btn2" id="imp">Kodu yapıştır</button></div>
    <div id="impbox" hidden><textarea class="imp" id="impt" placeholder="Kodu buraya yapıştır"></textarea><button class="btn2" id="impgo" style="width:100%;margin-top:8px">Birleştir</button></div>
    ${IN_CLAUDE ? `<div class="lbl">Claude</div>
    <p class="small muted" style="margin:4px 2px">${SAMPLE ? "Bağlı: yazı düzeltme ve canlı konuşma açık." : "Bağlı değil: düzeltme için yazını kopyalayıp gönderebilirsin."}</p>` : ""}
    <div class="lbl">Mikrofon</div>
    <p class="small muted" style="margin:4px 2px">${SR ? "Açık: Konuş modu ve Turbo söylediğini dinleyip düzeltir. İlk kullanımda izin isterse İzin ver de." : SR_CTOR ? (IN_CLAUDE ? "Bu ekran mikrofona izin vermiyor. Mikrofonlu sürüm: aukreg.github.io/DE4 (Safari/Chrome)." : "Kapalı: bu ekranda mikrofon açılmadı.") : "Bu tarayıcı konuşma tanımayı desteklemiyor."}</p>
    ${!SR && SR_CTOR ? `<button class="btn2" id="mic" style="width:100%">Mikrofonu tekrar dene</button>` : ""}
    <button class="btn2" id="onbx" style="width:100%;margin-top:14px">Tanıtımı tekrar göster</button>
    <button class="btn2" id="cman" style="width:100%;margin-top:10px">📋 İçerik listesi</button>
    <div class="lbl">İçerik</div>
    <p class="small muted" style="margin:4px 2px">${D.phrases.length} kalıp · ${D.book.chapters.length} kitap bölümü · ${D.scenarios.length} senaryo · ${ITEMS.length} çalışılabilir cümle · ${allWritings().length} düzeltilmiş yazı</p>
    <button class="btn2" id="cls" style="width:100%;margin-top:14px">Kapat</button>`;
  $("#sheet").classList.add("show");
  $$("#th button").forEach(b => b.onclick = () => { o.theme = b.dataset.v; save(); applyTheme(); $("#gear").onclick(); });
  $$("#snd button").forEach(b => b.onclick = () => { o.sound = o.vib = !!+b.dataset.v; save(); sfx("ok"); $("#gear").onclick(); });
  $$("#gmd button").forEach(b => b.onclick = () => { o.gmode = b.dataset.v; save(); gmodeApply(); $("#gear").onclick(); });
  $$("#rt button").forEach(b => b.onclick = () => { o.rate = +b.dataset.v; save(); speak("Das ist die neue Geschwindigkeit."); $("#gear").onclick(); });
  $$("#pc button").forEach(b => b.onclick = () => { o.pace = +b.dataset.v; save(); $("#gear").onclick(); });
  $$("#wp button").forEach(b => b.onclick = () => { o.wpace = +b.dataset.v; save(); $("#gear").onclick(); });
  $("#exp").onclick = async () => copy(await syncCode(), IN_CLAUDE ? "Kod kopyalandı. Mikrofonlu uygulamada Kodu yapıştır'a dokun." : "Kod kopyalandı. Claude sürümünde Kodu yapıştır'a dokun.");
  $("#imp").onclick = async () => {
    try { const t = await navigator.clipboard.readText(); if (t && t.includes(SYNC_TAG) && await importCode(t)) return; } catch(e) {}
    $("#impbox").hidden = false; $("#impt").focus();
  };
  $("#impgo").onclick = () => importCode($("#impt").value);
  if ($("#mic")) $("#mic").onclick = () => { toast(micRetry() ? "Mikrofon açık. Konuş modunda dene." : "Bu ekran mikrofona izin vermiyor."); $("#gear").onclick(); };
  $("#cls").onclick = () => $("#sheet").classList.remove("show");
  $$("#gl button").forEach(b => b.onclick = () => { o.goal = +b.dataset.v; o.pace = {10:5, 20:10, 30:15}[o.goal]; save(); $("#gear").onclick(); });
  $("#cman").onclick = () => { $("#sheet").classList.remove("show"); open(renderContentList); };
  $("#onbx").onclick = () => { $("#sheet").classList.remove("show"); onboarding(true); };
};
$("#streak").onclick = () => open(renderStats);
$("#sheet").onclick = e => { if (e.target.id === "sheet") $("#sheet").classList.remove("show"); };

/* ================= AÇILIŞ ================= */
Object.assign(TABS, {today:renderToday, practice:renderPracticeTab, games:renderGames, listen:renderListen, library:renderLibrary});
go("today");
if (!IN_CLAUDE) onboarding();
const rerender = () => { if (!screen) go(tab); };
if (IN_CLAUDE) (async () => {
  // Claude: yazı düzeltme ve canlı konuşma; hesap: ilerleme, yazılar, yeni kalıplar
  claude.use("sample").then(fn => { if (fn) { SAMPLE = fn; rerender(); } });
  const db = await claude.use("db");
  if (!db) return onboarding();
  DB = db;
  try {
    const ps = await db.collection("phrases").get();
    ps.docs.forEach(d => { const p = Object.assign({id: d.id}, d.data()); const i = D.phrases.findIndex(x => x.id === p.id); if (i >= 0) D.phrases[i] = p; else D.phrases.push(p); });
    D.phrases.sort((a, b) => a.d.localeCompare(b.d));
    buildItems();
    const ws = await db.collection("writings").get();
    WRITINGS = ws.docs.map(d => Object.assign({id: d.id}, d.data()));
    const st = await db.doc("state/progress").get();
    if (st.exists) {
      const remote = JSON.parse(st.data().json || "{}");
      if ((remote.ts || 0) > (S.ts || 0)) { try { localStorage.setItem(KEY, JSON.stringify(remote)); } catch(e) {} S = load(remote); buildItems(); }
      else if ((S.ts || 0) > (remote.ts || 0)) save();
    } else if (S.ts) save();
  } catch(e) {}
  rerender(); onboarding();
})();
else if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
