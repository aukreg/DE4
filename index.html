// Gedsche — uygulamanın maskotu, sevimli bir yarasa (Fledermaus).
// bat(mood, size, cos): cos = kostüm (flag, party, grad, phones, glasses, crown).
// bat(mood, size) satır içi SVG döndürür. defs/id/text yok: aynı sayfada çok kopya sorun olmaz.
const BAT_COS = ["flag", "party", "grad", "phones", "glasses", "crown"];
const BAT_MOODS = ["happy", "cheer", "think", "sad", "sleep", "wave", "wow"];

function bat(mood, size, cos) {
  mood = BAT_MOODS.indexOf(mood) >= 0 ? mood : "happy";
  size = size || 96;
  const C = {
    body: "#7C5CFF", shade: "#5B3FD9", deep: "#4A2FC2", belly: "#C9B8FF", hi: "#9A80FF",
    cheek: "#FF8FB1", ear: "#FFB3CB", ink: "#1F1A4D", white: "#FFFFFF",
    scarf: "#3654F4", scarfD: "#2440C9", gold: "#FFC93C", moon: "#FFD66B", tongue: "#FF6F9C"
  };
  const P = (d, f, x) => '<path d="' + d + '" fill="' + f + '"' + (x || "") + "/>";
  const S = (d, c, w) => '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round"/>';
  const E = (cx, cy, rx, ry, f) => '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + f + '"/>';
  const O = (cx, cy, r, f) => '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + f + '"/>';
  const G = (t, inner) => '<g transform="' + t + '">' + inner + "</g>";
  const star = (x, y, r, f) => P("M" + x + "," + (y - r) + "Q" + x + "," + y + " " + (x + r) + "," + y + "Q" + x + "," + y + " " + x + "," + (y + r) +
    "Q" + x + "," + y + " " + (x - r) + "," + y + "Q" + x + "," + y + " " + x + "," + (y - r) + "Z", f);

  // Kanat: omuz (0,0) noktasında, sola uzanır; alt kenar tırtıklı.
  const wingShape =
    P("M4,-7C-6,-17 -22,-23 -34,-18Q-37,-16 -35,-12Q-30,-3 -31,8Q-24,2 -18,11Q-12,5 -5,13Q-1,6 5,5Z", C.shade) +
    S("M2,-4L-31,-14M0,-2L-28,4M1,0L-17,8M2,2L-6,10", C.body, 2.2) +
    O(-33, -16, 2.6, C.shade);
  const leftWing = (deg) => G("translate(40,80) rotate(" + deg + ") scale(0.94)", wingShape);
  const rightWing = (deg) => G("translate(120,0) scale(-1,1)", leftWing(deg));

  // Kulak: taban ortası (bx,by) etrafında döner.
  const earL = (deg) => G("rotate(" + deg + " 40 34)",
    P("M27,44Q21,22 26,9Q29,4 34,8Q46,18 55,30Z", C.body) +
    P("M31,38Q27,24 29,15Q31,12 34,15Q42,22 48,30Z", C.ear));
  const earR = (deg) => G("translate(120,0) scale(-1,1)", earL(deg));

  const sad = mood === "sad", sleep = mood === "sleep";
  let back = "", front = "", extra = "";

  // Kanat pozisyonları
  const wings = {
    happy: [-30, -30], cheer: [24, 24], think: [-30, null], sad: [-46, -46],
    sleep: [-38, -38], wave: [-30, null], wow: [6, 6]
  }[mood];
  back += '<g class="bwl">' + leftWing(wings[0]) + "</g>";
  if (wings[1] !== null) back += '<g class="bwr">' + rightWing(wings[1]) + "</g>";
  if (mood === "wave") {
    back += G("translate(120,0) scale(-1,1)", G("translate(34,78) rotate(26) scale(0.95)", wingShape));
    extra += S("M114,46Q118,38 116,30", C.gold, 3) + S("M112,22Q109,15 102,13", C.gold, 3);
  }
  if (mood === "think") {
    // sağ kanat çeneye
    front += G("translate(120,0) scale(-1,1)", G("translate(34,92) rotate(115) scale(0.68)", wingShape));
  }

  // Kulaklar
  const ed = sad ? 26 : mood === "wow" ? -6 : 0;
  if (!sleep) back += earL(-ed) + earR(-ed);

  // Gövde + baş
  let body =
    E(49, 110, 7, 4, C.deep) + E(71, 110, 7, 4, C.deep) +
    E(60, 88, 26, 22, C.body) +
    E(60, 92, 16, 14, C.belly) +
    P("M52,86Q54,89 56,86M58,92Q60,95 62,92M64,86Q66,89 68,86", "none", ' stroke="' + C.hi + '" stroke-width="2" stroke-linecap="round"') +
    E(60, 54, 36, 32, C.body) +
    P("M32,40Q40,26 56,24Q44,30 38,42Z", C.hi);
  // Atkı
  body += P("M34,76Q60,88 86,76Q88,82 84,85Q60,95 36,85Q32,82 34,76Z", C.scarf) +
    P("M72,84Q80,86 82,98Q78,101 74,99Q74,90 68,86Z", C.scarfD) +
    P("M36,82Q60,92 84,82", "none", ' stroke="' + C.scarfD + '" stroke-width="1.6"');

  // Yüz
  let face = E(33, 66, 6.5, 4.2, C.cheek) + E(87, 66, 6.5, 4.2, C.cheek);
  const eye = (cx, cy, rx, ry, px, py, pr) =>
    E(cx, cy, rx, ry, C.white) + O(cx + px, cy + py, pr, C.ink) +
    O(cx + px + pr * 0.38, cy + py - pr * 0.42, pr * 0.38, C.white) + O(cx + px - pr * 0.35, cy + py + pr * 0.4, pr * 0.17, C.white);
  const fangs = (y) => P("M53.5," + y + "l2.4,4.2l2.4,-4.2Z", C.white) + P("M61.7," + y + "l2.4,4.2l2.4,-4.2Z", C.white);
  const closedHappy = (cx, cy) => S("M" + (cx - 7) + "," + (cy + 3) + "Q" + cx + "," + (cy - 7) + " " + (cx + 7) + "," + (cy + 3), C.ink, 3.6);
  const closedSleep = (cx, cy) => S("M" + (cx - 7) + "," + cy + "Q" + cx + "," + (cy + 6) + " " + (cx + 7) + "," + cy, C.ink, 3.4);

  if (mood === "happy") {
    face += '<g class="beye">' + eye(46, 52, 10.5, 12, 0.5, 1.5, 7) + eye(74, 52, 10.5, 12, -0.5, 1.5, 7) + "</g>";
    face += P("M51,67Q60,77 69,67Q60,70.5 51,67Z", C.ink, ' stroke="' + C.ink + '" stroke-width="2" stroke-linejoin="round"') + fangs(68.4);
  } else if (mood === "wave") {
    face += '<g class="beye">' + eye(46, 52, 10.5, 12, 1.5, 1, 7) + eye(74, 52, 10.5, 12, 1.5, 1, 7) + "</g>";
    face += P("M50,66Q60,79 70,66Q60,70 50,66Z", C.ink, ' stroke="' + C.ink + '" stroke-width="2" stroke-linejoin="round"') + fangs(67.6);
  } else if (mood === "cheer") {
    face += closedHappy(46, 53) + closedHappy(74, 53);
    face += P("M48,64Q60,63 72,64Q71,80 60,80Q49,80 48,64Z", C.ink) +
      P("M53,75Q60,70 67,75Q64,79.5 60,79.5Q56,79.5 53,75Z", C.tongue) + fangs(64.2);
    extra += star(16, 22, 6, C.gold) + star(104, 20, 5, C.gold) + star(10, 44, 3.5, C.gold) + star(110, 42, 3.5, C.gold);
  } else if (mood === "think") {
    face += '<g class="beye">' + eye(46, 51, 10.5, 12, 3, -4, 6.5) + eye(74, 51, 10.5, 12, 3, -4, 6.5) + "</g>";
    face += S("M38,36Q45,33 52,36", C.deep, 3) + S("M68,34Q75,30 82,33", C.deep, 3);
    face += S("M53,70Q58,68 66,69", C.ink, 3.2);
    extra += O(100, 30, 3, C.belly) + O(107, 20, 4.2, C.belly) + O(113, 8, 5.4, C.belly);
  } else if (mood === "sad") {
    face += '<g class="beye">' + eye(46, 53, 10.5, 11.5, 0, 3, 7) + eye(74, 53, 10.5, 11.5, 0, 3, 7) + "</g>";
    face += S("M38,40Q45,35 52,35", C.deep, 3) +
      S("M68,35Q75,35 82,40", C.deep, 3);
    face += S("M53,72Q60,67 67,72", C.ink, 3.2);
  } else if (mood === "sleep") {
    face += closedSleep(46, 54) + closedSleep(74, 54);

/* ---------- ses ve titreşim ---------- */
let AC = null;
function sfx(kind){
  if (S.opt.sound === false || (typeof noListen === "function" && noListen())) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime;
    const N = (f, d, s, type, v) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + s);
      g.gain.exponentialRampToValueAtTime(v || 0.16, t + s + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + s + d);
      o.connect(g); g.connect(AC.destination); o.start(t + s); o.stop(t + s + d + 0.03);
    };
    if (kind === "ok") { N(784, .12, 0); N(1175, .2, .08); }
    else if (kind === "bad") { N(220, .2, 0, "triangle", .2); N(174, .26, .09, "triangle", .16); }
    else if (kind === "win") [523, 659, 784, 1047].forEach((f, i) => N(f, .26, i * .11, "sine", .15));
    else if (kind === "tap") N(660, .05, 0, "sine", .05);
  } catch(e) {}
}
const buzz = p => { try { if (S.opt.vib !== false && navigator.vibrate) navigator.vibrate(p); } catch(e) {} };

const fmtN = n => n >= 10000 ? (n / 1000).toFixed(1).replace(".", ",") + "b" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
function paintXP(bump){
  const el = $("#xp"); if (!el) return;
  el.innerHTML = I("bolt") + fmtN(S.xp || 0);
  if (bump) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}
function addXP(n){
  if (!n) return;
  S.xp = (S.xp || 0) + n; const d = dayRec(); d.xp = (d.xp || 0) + n;
  paintXP(true);
}

const CHAR_POOL = [{c:"#8B5CF6", h:"#3B2A1A", f:1}, {c:"#14B8A6", h:"#1F1A17", f:0}, {c:"#F59E0B", h:"#6B4423", f:1}, {c:"#0E8FD6", h:"#3A2A20", f:0}];
function charOf(name){
  if (CHAR[name]) return CHAR[name];

// miss(x, src): x bir kart (ITEMS'tan, id'li) ya da {de, tr, note}; src nerede yanlış yapıldığı ("Alıştırma", oyun adı…)
// Kartlı hatalar kendi kartına bağlanır; kartsızlar (sayılar, çekimler, oyun cümleleri) "m:" kartı olarak desteye girer.
function missKey(de){ let h = 0; for (const ch of norm(de)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return "m:" + h.toString(36); }
function miss(x, src, m){
  try {
    if (!x) return;
    const it = x.id && BYID[x.id] && !/^m:/.test(x.id) ? BYID[x.id] : null;
    const de = String(it ? it.de : x.de || "").trim();
    if (!de) return;
    const key = it ? it.id : missKey(de);
    S.miss = S.miss || {};
    const r = S.miss[key] || (S.miss[key] = {de, tr: String(it ? it.tr : x.tr || "").trim(), n: 0, f: TODAY});
    if (!it && x.note) r.note = String(x.note);
    if (!it && x.tr && !r.tr) r.tr = String(x.tr);
    if (typeof hostReact === "function" && Date.now() - HOST.t > 300) hostReact(false);
    r.n++; r.last = TODAY; r.src = src || r.src || ""; if (m) r.m = m; r.ok = 0; delete r.done;
    if (!it && !BYID[key]) buildItems();
    clearTimeout(miss.t); miss.t = setTimeout(save, 400);
  } catch(e) {}
}
// doğru cevap: iki kez üst üste doğru → hata defterinden "öğrendim"e geçer
function missOk(it){
  const r = S.miss && S.miss[it.id];
  if (!r || r.done) return;
  r.ok = (r.ok || 0) + 1;
  if (r.ok >= 2) r.done = TODAY;
}
const missActive = () => Object.entries(S.miss || {}).filter(([, r]) => !r.done);
const missItems = () => missActive().map(([k]) => BYID[k]).filter(Boolean);
const missCount = () => missActive().length;

function gapCands(it){ return words(it).map((w, i) => ({w: w.replace(/[.,!?;:"„“]/g, ""), i})).filter(x => x.w.length >= 3 && /^[A-Za-zÄÖÜäöüß]+$/.test(x.w)); }
const MODES = {

  match:  {t:"Eşleştir",    ic:"🧩", g:0, d:"Almanca ve Türkçeyi eşle", group:true},

  gap:    {t:"Boşluk",      ic:"⬜", g:1, k:"s", d:"Eksik kelimeyi seç", need: it => !it.kind && gapCands(it).length > 0 && words(it).length >= 2},
  order:  {t:"Sırala",      ic:"🔀", g:1, k:"s", d:"Kelimeleri sıraya koy", need: it => { const n = words(it).length; return !it.kind && n >= 3 && n <= 11; }},
  artikel:{t:"Artikel",     ic:"🎯", g:1, k:"w", d:"der, die ya da das", need: it => it.kind === "n"},
  plural: {t:"Çoğul",       ic:"👥", g:1, k:"w", d:"Çoğul hâlini seç", need: it => it.kind === "n" && !!it.pl},
  conj:   {t:"Çekim",       ic:"🔧", g:1, k:"w", d:"Fiili kişiye göre çek", need: it => it.kind === "v"},

  opp:    {t:"Zıt anlam",   ic:"↔️", g:1, k:"w", d:"Sıfatın zıttını bul", need: it => it.kind === "a" && !!it.opp},
  gapw:   {t:"Boşluğu yaz", ic:"✏️", g:2, k:"s", d:"Eksik kelimeyi yaz", need: it => !it.kind && gapCands(it).length > 0 && words(it).length >= 2},
  scramble:{t:"Harfler",    ic:"🔠", g:2, k:"w", d:"Harflerden kelimeyi kur", need: it => !!it.kind && !/\s/.test(it.w) && it.w.length >= 3 && it.w.length <= 13},
  dictate:{t:"Dikte",       ic:"🎧", g:2, d:"Duyduğunu yaz", need: () => !noListen()},
  write:  {t:"Yaz",         ic:"⌨️", g:2, d:"Türkçeden Almancayı yaz"},
  speak:  {t:"Konuş",       ic:"🎙️", g:2, d:"Türkçeden Almanca söyle", need: () => !!SR && !noSpeak()},
};
const GROUPS = ["Tanı", "Hatırla", "Üret"];
const can = (m, it) => !MODES[m].need || MODES[m].need(it);
const GRADED = Object.keys(MODES).filter(m => m !== "learn" && m !== "match");
function modeFor(it){
  // kutu küçükse tanıma, büyüdükçe üretme
  const b = (S.prog[it.id] || {}).b || 0;
  if (it.kind) {
    const wp = {n: b <= 1 ? ["rquiz","quiz","artikel","hear","swipe"] : ["artikel","plural","write","scramble","dictate"],
                v: b <= 1 ? ["rquiz","quiz","conj","swipe"] : ["conj","perfekt","prat","write"],
                a: b <= 1 ? ["rquiz","quiz","opp","swipe"] : ["opp","write","scramble"]}[it.kind];
    return pick(wp.filter(m => m !== "match" && can(m, it))) || "quiz";
  }
  const pool = b <= 1 ? ["quiz","rquiz","tf","hear","order","gap","swipe"] : b <= 3 ? ["quiz","order","gap","finish","gapw","dictate","write"] : ["write","gapw","dictate","order","speak"];
  return pick(pool.filter(m => can(m, it))) || "quiz";
}

let P = null;
// opts: {items, mode: "deck"|"mix"|<mod>, title, stepKey, done}
function startSession(o){
  let items = o.items.filter((x, i, a) => a.findIndex(y => y.id === x.id) === i);
  if (!items.length) { toast("Burada çalışılacak cümle yok"); return; }
  const q = [];
  if (o.plan) o.plan.forEach(p => q.push({m: p.m, it: p.it}));
  else if (o.mode === "deck") {
    const fresh = items.filter(it => !S.prog[it.id]), old = items.filter(it => S.prog[it.id]);
    fresh.forEach(it => q.push({m:"learn", it}));
    shuffle(fresh).forEach(it => q.push({m:"quiz", it}));
    shuffle(old).forEach(it => q.push({m:modeFor(it), it}));
    shuffle(fresh).forEach(it => q.push({m: can("order", it) ? "order" : "write", it}));
  } else if (o.mode === "mix") {
    shuffle(items).forEach(it => q.push({m: S.prog[it.id] ? modeFor(it) : "learn", it}));
    shuffle(items).filter(it => !S.prog[it.id]).forEach(it => q.push({m:"quiz", it}));
  } else if (o.mode === "week") {
    // haftalık kontrol: öğretme yok, her kart bir kez sorulur
    shuffle(items).forEach(it => { const ms = ["quiz","rquiz","order","gapw","write","artikel","conj","plural"].filter(m => MODES[m] && can(m, it) && (it.src === "wd" ? MODES[m].k !== "s" : MODES[m].k !== "w")); q.push({m: ms.length ? pick(ms) : "quiz", it}); });
  } else if (o.mode === "match") {
    const L = shuffle(items);
    for (let i = 0; i < L.length; i += 5) { const g = L.slice(i, i + 5); if (g.length >= 3 || !q.length) q.push({m:"match", its:g}); }
  } else {
    items.forEach(it => q.push({m: can(o.mode, it) ? o.mode : "write", it}));
  }
  P = {q, i:0, n0:q.length, ok:0, total:0, res:{}, redo:new Set(), redoN:{}, hint:new Set(), o, t0:Date.now(), xp0:S.xp || 0};
  open(renderSession);
  onLeave = flushSession;
}
function flushSession(){
  if (!P) return;
  Object.entries(P.res).forEach(([id, ok]) => {
    if (!BYID[id]) return;
    // ipucuyla doğru: kutu ilerlemez, yarın yine gelir
    if (ok && P.hint.has(id)) { const r = S.prog[id] || (S.prog[id] = {b:0}); r.due = addDays(1); r.last = TODAY; r.n = (r.n || 0) + 1; const d = dayRec(); d.n = (d.n || 0) + 1; d.ok = (d.ok || 0) + 1; }
    else grade(BYID[id], ok);
  });
  P.res = {}; save();
}
function answer(it, ok){
  P.total++; if (ok) P.ok++;
  sfx(ok ? "ok" : "bad"); buzz(ok ? 12 : [30, 40, 30]); comboCheck(ok);
  if (ok) missOk(it); else miss(it, "Alıştırma", (P.q[P.i] || {}).m);
  if (ok) addXP(P.hint && P.hint.has(it.id) ? 5 : 10);
  if (ok) P.okI = P.i; else P.badI = P.i;
  hostReact(ok);
  seen(it);
  P.res[it.id] = (P.res[it.id] === undefined ? true : P.res[it.id]) && ok;
  const cur = P.q[P.i];
  // yanlış kart kolaydan zora basamaklarla geri gelir: seç → sırala → boşluğu yaz → asıl soru
  if (!ok) {
    const first = !P.redo.has(it.id), n = P.redoN[it.id] = (P.redoN[it.id] || 0) + 1;
    P.redo.add(it.id);
    if (n > 4) return;
    if (cur.st) { P.q.push(Object.assign({}, cur)); return; }
    const steps = ladder(it, cur.m);
    // oturum çok uzamasın: kuyruk ilk hâlinin iki katını geçince basamak yok, tek tekrar
    if (steps.length > 1 && P.q.length + steps.length <= P.n0 * 2 + 4) P.q.push({m: steps[0], it, lad: steps.slice(1), st: 1, of: steps.length});
    else if (first) P.q.push({m: cur.m === "match" ? "quiz" : cur.m, it});
  } else if (cur.st && cur.lad.length && P.q.length < P.n0 * 2 + 8) {
    P.q.splice(Math.min(P.q.length, P.i + 3), 0, {m: cur.lad[0], it, lad: cur.lad.slice(1), st: cur.st + 1, of: cur.of});
  }
}

/* ---------- hata kartları: önce doğrusunu seç, sonra kelimelerle kur ---------- */
function startMistakes(){
  const L = shuffle(allMistakes()).slice(0, 15);
  if (!L.length) { toast("Henüz hata kartı yok"); return; }
  const q = [];
  L.forEach(m => q.push({m, k:"pick"}));
  L.forEach(m => { const n = m.right.split(" ").filter(Boolean).length; if (n >= 2 && n <= 12 && norm(m.right) !== norm(m.wrong)) q.push({m, k:"build"}); });
  let i = 0, lock = 0, okN = 0; const again = new Set();
  const fin = (ok, cur) => { if (ok) okN++; else if (!again.has(cur.k + cur.m.right)) { again.add(cur.k + cur.m.right); q.push(cur); } };
  const r = () => {
    setTop("Hatalarım", true); lock = 0;
    const cur = q[i];
    if (!cur) { mark("mist"); endCard("✅", "Hatalar tekrarlandı", L.length + " hata · " + okN + " doğru cevap", "Tamam"); return; }
    const m = cur.m, top = `<div class="ptop"><div class="pbar"><i style="width:${i/q.length*100}%"></i></div><span class="small muted">${i+1}/${q.length}</span></div>`;
    const rule = m.rule ? `<span class="small" style="display:block;margin-top:6px;color:var(--tx2)">💡 ${esc(m.rule)}</span>` : "";
    const foot = () => { $(".foot").innerHTML = `<button class="cta" id="nx">Devam</button>`; $(".foot").hidden = false; $("#nx").onclick = () => { i++; r(); }; };
    if (cur.k === "pick") {
      const opts = shuffle([m.right, m.wrong]);
      $("#view").innerHTML = top + `<div class="phase">🩹 Hangisi doğru?</div>
        <div class="opts">${opts.map((o, j) => `<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div>
        <div id="vd"></div><div class="foot" hidden></div>`;
      $$(".opt").forEach(b => b.onclick = () => {
        if (lock) return; lock = 1;
        const ok = opts[+b.dataset.j] === m.right;
        $$(".opt").forEach(x => x.classList.add(opts[+x.dataset.j] === m.right ? "good" : "bad"));
        fin(ok, cur); speak(m.right);
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Doğru!" : "Doğrusu:"}<b>${esc(m.right)}</b>${rule}</div>`;
        foot();
      });
    } else {
      const w = m.right.split(" ").filter(Boolean), pool = shuffle(w.map((x, k) => ({x, k}))), built = [];
      if (pool.every((p, k) => p.k === k) && w.length > 1) pool.reverse();
      $("#view").innerHTML = top + `<div class="phase">🧱 Doğrusunu kur</div>
        <div class="card flash" style="min-height:90px"><div class="mid">Senin yazdığın</div><div class="big" style="font-size:19px;color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px">${esc(m.wrong)}</div></div>
        <div class="built" id="built"></div>
        <div class="pool" id="pool">${pool.map((p, k) => `<button class="wd" data-k="${k}">${esc(p.x)}</button>`).join("")}</div>
        <div id="vd"></div>
        <div class="foot"><div class="row2"><button class="btn2" id="clr">Temizle</button><button class="cta" id="ck" disabled>Kontrol et</button></div></div>`;
      const draw = () => {
        $("#built").innerHTML = built.map((k, j) => `<button class="wd" data-j="${j}">${esc(pool[k].x)}</button>`).join("");
        $$("#pool .wd").forEach(b => b.classList.toggle("used", built.includes(+b.dataset.k)));
        $$("#built .wd").forEach(b => b.onclick = () => { if (lock) return; built.splice(+b.dataset.j, 1); draw(); });
        $("#ck").disabled = built.length !== w.length;
      };
      $$("#pool .wd").forEach(b => b.onclick = () => { if (lock || built.includes(+b.dataset.k)) return; built.push(+b.dataset.k); draw(); });
      $("#clr").onclick = () => { if (lock) return; built.length = 0; draw(); };
      $("#ck").onclick = () => {
        if (lock) return; lock = 1;
        const ok = norm(built.map(k => pool[k].x).join(" ")) === norm(m.right);
        fin(ok, cur); speak(m.right);
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Harika!" : "Doğrusu:"}<b>${esc(m.right)}</b>${rule}</div>`;
        foot();
      };
    }
  };
  open(r);
}

const PERS = ["ich", "du", "er/sie", "wir", "ihr", "sie/Sie"];

const uniq = a => a.filter((x, i) => x && a.indexOf(x) === i);

Object.assign(R_MODE, {
  artikel(it){
    choose(it, "artikel", `<div class="mid">${esc(it.tr)}</div><div class="big">___ ${esc(it.w)}</div>`, ["der", "die", "das"], it.art, 3);
  },
  plural(it){
    const w = it.w, cand = [w + "e", w + "en", w + "n", w + "s", umlaut(w) + "e", w, w + "er", umlaut(w) + "er", umlaut(w)].filter(x => x !== it.pl);
    choose(it, "plural", `<div class="mid">${esc(it.tr)}</div><div class="big">${esc(it.de)}</div><div class="mid">→ die ?</div>`, shuffle(cand).slice(0, 3).map(x => x), it.pl, 2, "die " + it.pl);
    $$(".opt").forEach(b => b.textContent = "die " + b.textContent);
  },
  conj(it){
    const p = Math.random() * 6 | 0, right = it.pr[p];
    const stem = it.w.replace(/e?n$/, "");
    const reg = [stem + "e", stem + "st", stem + "t", it.w, stem + "en"].map(f => it.pr[0].includes(" ") ? f + " " + it.pr[0].split(" ")[1] : f);
    choose(it, "conj", `<div class="mid">${esc(it.w)} · ${esc(it.tr)}</div><div class="big">${PERS[p]} ___</div>`, shuffle(uniq(it.pr.concat(reg))).filter(f => f !== right).slice(0, 3), right, 2, PERS[p] + " " + right);
  },
  perfekt(it){
    const [aux, part] = [it.pf.split(" ")[0], it.pf.split(" ").slice(1).join(" ")];
    const alt = aux === "hat" ? "ist" : "hat", stem = it.w.replace(/^sich /, "").replace(/ \S+$/, "").replace(/e?n$/, "");
    const reg = (/^(be|ver|er|ent|zer|ge)/.test(it.w) ? "" : "ge") + stem + "t";
    choose(it, "perfekt", `<div class="mid">${esc(it.w)} · ${esc(it.tr)}</div><div class="big">er ___</div><div class="mid">Perfekt (gestern)</div>`,
      shuffle([alt + " " + part, aux + " " + reg, alt + " " + reg, aux + " ge" + it.w.replace(/^sich /, "")]), it.pf, 2, "er " + it.pf);
  },
  prat(it){
    const stem = it.w.replace(/e?n$/, ""), sep = it.pt.includes(" ") ? " " + it.pt.split(" ")[1] : "";
    const other = pick(WORDS().filter(x => x.kind === "v" && x.id !== it.id)).pt;

      shuffle([stem.replace(sep.trim(), "") + "te" + sep, it.pr[2], other, stem + "ete" + sep]), it.pt, 2, "er " + it.pt);

  scramble(it){
    const L = it.w.split(""), sh = shuffle(L.map((c, i) => ({c, i}))), built = [];

    const draw = () => {
      $("#built").innerHTML = built.map(k => `<span class="wd">${esc(sh[k].c)}</span>`).join("");
      $$("#pool .wd").forEach(b => b.classList.toggle("used", built.includes(+b.dataset.k)));

const KB_ROWS = ["qwertzuiopü", "asdfghjklöä", "⇧yxcvbnmß⌫"];
function appKbd(){
  const inp = $("#typed"), foot = $(".foot");
  if (!inp || !foot) return;

  if (S.opt.syskb) {
    foot.insertAdjacentHTML("afterbegin", `<button class="kbsw" id="kbsw">${I("keyboard")} Uygulama klavyesini kullan</button>`);

    return;
  }
  inp.readOnly = true; inp.setAttribute("inputmode", "none"); inp.classList.add("kbin"); inp.blur();
  let up = false;
  const key = k => `<button class="kk${k === "⇧" ? " ksh" : k === "⌫" ? " kbs" : ""}" data-k="${k}">${k}</button>`;
  foot.insertAdjacentHTML("afterbegin", `<div class="kbd" id="kbd">${KB_ROWS.map(r => `<div class="kr">${[...r].map(key).join("")}</div>`).join("")}

  const kb = $("#kbd");
  const paint = () => { kb.classList.toggle("up", up); };
  const put = k => {
    if (P && P.lock) return;
    if (k === "⇧") { up = !up; return paint(); }
    if (k === "⌫") inp.value = inp.value.slice(0, -1);
    else if (k === "sys") { S.opt.syskb = 1; save(); kb.remove(); inp.readOnly = false; inp.removeAttribute("inputmode"); inp.classList.remove("kbin"); appKbd(); inp.focus(); return; }
    else { inp.value += up ? k.toUpperCase() : k; if (up) { up = false; paint(); } }
    buzz(6);
  };
  let rep;
  kb.querySelectorAll(".kk").forEach(b => {
    b.onpointerdown = e => { e.preventDefault(); b.classList.add("on"); put(b.dataset.k); if (b.dataset.k === "⌫") rep = setTimeout(function r(){ put("⌫"); rep = setTimeout(r, 70); }, 420); };
    b.onpointerup = b.onpointerleave = b.onpointercancel = () => { b.classList.remove("on"); clearTimeout(rep); };
  });
  // fiziksel klavye (bilgisayar) yine çalışsın
  onKbdKey.inp = inp;
}
function onKbdKey(e){
  const inp = onKbdKey.inp;
  if (!inp || !document.body.contains(inp) || !inp.readOnly || (P && P.lock)) return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target !== inp) return;
  if (e.key === "Enter") { if (document.activeElement !== inp && $("#ck")) { $("#ck").click(); e.preventDefault(); } }
  else if (e.key === "Backspace") { inp.value = inp.value.slice(0, -1); e.preventDefault(); }
  else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) { inp.value += e.key; e.preventDefault(); }
}
document.addEventListener("keydown", onKbdKey);

  const pool = poolFor(src);
  const rank = it => { const r = S.prog[it.id]; return !r ? 1 : r.due <= TODAY ? 0 : 2 + r.b; };

/* ================= TURBO: duy, söyle, düzelt ================= */
let T = null;
function startTurbo(src){
  if (noListen()) return toast("Şu an dinleyemem açık. Bugün ekranından kapatabilirsin.");
  const items = srcItems(src, 20);
  if (!items.length) { toast("Bu kaynakta cümle yok"); return; }
  T = {items, i:0, dir: S.opt.tdir || "trde", run:true, tok:0, ok:0, n:0, res:{}};
  open(renderTurbo);
  onLeave = stopTurbo;
  wake(true);
  setTimeout(turboStep, 400);
}
function stopTurbo(){
  if (!T) return; T.run = false; T.tok++; stopSpeak(); wake(false);
  Object.entries(T.res).forEach(([id, ok]) => { seen(BYID[id]); grade(BYID[id], ok); }); T.res = {}; save();
  if (T.rec) try { T.rec.abort(); } catch(e) {}
}
function renderTurbo(){
  setTop("Turbo", true);
  const it = T.items[T.i];
  $("#view").innerHTML = `
    <div class="seg" id="tdir" style="margin-top:6px"><button data-v="trde" class="${T.dir === "trde" ? "on" : ""}">Türkçe → Almanca</button><button data-v="detr" class="${T.dir === "detr" ? "on" : ""}">Almanca → Türkçe</button></div>
    <div class="ptop"><div class="pbar"><i style="width:${T.i/T.items.length*100}%"></i></div><span class="small muted">${T.i+1}/${T.items.length}</span></div>
    <div class="card player">
      <div class="phase2" id="ph">Hazır ol</div>
      <div class="${T.dir === "trde" ? "tr" : "de"}" id="q">${it ? esc(T.dir === "trde" ? it.tr : it.de) : ""}</div>
      <div class="${T.dir === "trde" ? "de" : "tr"}" id="a" style="visibility:hidden">${it ? esc(T.dir === "trde" ? it.de : it.tr) : ""}</div>
      <div id="vd"></div>
    </div>
    <div class="tfbtn" id="self" style="margin-top:14px;visibility:hidden"><button class="y" data-v="1">✓ Bildim</button><button class="n" data-v="0">✗ Bilemedim</button></div>
    <div class="ctrl"><button id="tp" aria-label="Duraklat">${T.run ? "❚❚" : "▶"}</button><button id="tn" aria-label="Sonraki">⏭</button></div>
    <p class="hint">${SR && T.dir === "trde" ? "Bip sesi yok: Türkçeyi duyunca hemen Almancasını söyle." : "Türkçeyi duy, Almancasını yüksek sesle söyle; sonra doğrusunu duyarsın. İstersen Bildim/Bilemedim'e dokun."}</p>`;
  $$("#tdir button").forEach(b => b.onclick = () => { T.dir = S.opt.tdir = b.dataset.v; save(); T.tok++; stopSpeak(); renderTurbo(); if (T.run) setTimeout(turboStep, 300); });
  $("#tp").onclick = () => { T.run = !T.run; T.tok++; stopSpeak(); if (T.rec) try { T.rec.abort(); } catch(e) {} renderTurbo(); if (T.run) setTimeout(turboStep, 300); };
  $("#tn").onclick = () => { T.tok++; stopSpeak(); T.i++; renderTurbo(); if (T.run) setTimeout(turboStep, 300); };
  $$("#self button").forEach(b => b.onclick = () => { const it = T.items[T.i]; if (it) { T.res[it.id] = b.dataset.v === "1"; if (b.dataset.v !== "1") miss(it, "Turbo"); $("#self").style.visibility = "hidden"; toast(b.dataset.v === "1" ? "👍" : "Tekrar gelecek"); } });
}
function turboStep(){
  if (!T || !T.run || screen !== renderTurbo) return;
  const it = T.items[T.i], tok = ++T.tok, live = () => T && T.run && T.tok === tok;
  if (!it) { stopTurbo(); setTop("Turbo", true); endCard("⚡", "Turbo bitti", T.items.length + " cümle", "Tamam"); return; }
  renderTurbo();
  const ph = t => { const e = $("#ph"); if (e) e.textContent = t; };
  const reveal = () => { const a = $("#a"); if (a) a.style.visibility = "visible"; };
  const nextIt = (ms) => setTimeout(() => { if (live()) { T.i++; turboStep(); } }, ms);
  const think = Math.max(2500, plain(it).length * 90);
  if (T.dir === "detr") {
    ph("Dinle");
    speak(it.de, 0, () => { if (!live()) return; ph("Anlamı ne?"); setTimeout(() => { if (!live()) return; reveal(); $("#self").style.visibility = "visible"; speakTR(it.tr, () => live() && nextIt(1600)); }, think); });
    return;
  }
  ph("Türkçesi");
  speakTR(it.tr, () => {
    if (!live()) return;
    if (SR && !noSpeak()) {
      ph("Söyle…");
      T.rec = listen(alts => {
        if (!live()) return;
        const said = alts.sort((a, b) => bestVariant(it, b) - bestVariant(it, a))[0], ok = bestVariant(it, said) >= 0.72;
        T.res[it.id] = ok; reveal(); if (!ok) miss(it, "Turbo");
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}" style="margin-top:8px">${ok ? "Doğru!" : "Sen: “" + esc(said) + "”"}</div>`;
        ph(ok ? "Doğru" : "Doğrusu");
        speak(it.de, 0, () => live() && nextIt(900));
      }, () => { if (!live()) return; miss(it, "Turbo"); reveal(); ph("Doğrusu"); speak(it.de, 0, () => live() && nextIt(1200)); });
    } else {
      ph("Şimdi sen söyle");
      setTimeout(() => { if (!live()) return; reveal(); ph("Doğrusu"); $("#self").style.visibility = "visible"; speak(it.de, 0, () => { if (!live()) return; setTimeout(() => live() && speak(it.de, 0, () => live() && nextIt(1800)), 700); }); }, think);
    }
  });
}
// ekran kararmasın (destekleyen tarayıcılarda)
let WL = null;
function wake(on){
  try {
    if (on && navigator.wakeLock) navigator.wakeLock.request("screen").then(w => WL = w, () => {});
    else if (WL) { WL.release(); WL = null; }
  } catch(e) {}
}

function playCur(){
  if (!L || !L.playing || screen !== renderPlayer) return;

}

    const it = pool[G.i % pool.length], other = distractors(it, 1, "de")[0];

    $$(".opt").forEach(b => b.onclick = () => {
      const ok = b.dataset.id === it.id;
      b.classList.add(ok ? "good" : "bad");
      hostReact(ok);
      if (ok) { G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else { G.combo = 0; miss(it, GAMES.blitz.t); }
      G.i++; later(() => G.left > 0 && draw(), ok ? 180 : 600);
    });
  };
  open(() => { setTop("Blitz 60", true); });
  gameTimer(60, () => gameOver("blitz", "Blitz 60", G.sc, "puan"));
  draw();
}

  const cards = shuffle(its.flatMap(it => [{id:it.id, t:plain(it), k:"de"}, {id:it.id, t:it.tr, k:"tr"}]));
  G = {open:[], done:0, moves:0, peek:true};
  open(() => setTop("Hafıza", true));
  const say = (t, mood) => { const st = $("#mst"); if (!st) return; st.querySelector(".mbat").innerHTML = bat(mood, 124, mood === "cheer" ? "party" : ""); st.querySelector(".msay").textContent = t; st.classList.remove("pop"); void st.offsetWidth; st.classList.add("pop"); };
  $("#view").innerHTML = `<div class="hud"><span class="small muted">Eşleşen: <b id="gd" style="font-size:16px">0</b>/${N}</span><span class="small muted">Hamle: <b id="gm" style="font-size:16px">0</b></span></div>
    <div class="mstage" id="mst"><span class="mbat"></span><span class="msay"></span></div>
    <div class="mgrid gpush mem" style="grid-template-columns:repeat(4,1fr)">${cards.map((c, i) => `<button class="mc ${c.k}" data-i="${i}"><span>${esc(c.t)}</span></button>`).join("")}</div>`;
  // ezber: kartlar açık, 3-2-1 sonra kapanır
  let n = 3; say("Ezberle! " + n, "think");
  const tick = () => { n--; if (n > 0) { say("Ezberle! " + n, "think"); later(tick, 1000); return; }
    $$(".mem .mc").forEach((b, i) => setTimeout(() => b.classList.add("back"), i * 25));
    later(() => { G.peek = false; say("Hadi, eşlerini bul!", "happy"); }, 450); };

  $$(".mc").forEach(b => b.onclick = () => {
    const c = cards[+b.dataset.i];
    if (G.peek || !b.classList.contains("back") || G.open.length >= 2) return;
    b.classList.remove("back"); if (c.k === "de") speak(BYID[c.id].de);
    G.open.push(b);

      G.moves++; $("#gm").textContent = G.moves;
      const [a, x] = G.open, ca = cards[+a.dataset.i], cx = cards[+x.dataset.i];
      if (ca.id === cx.id && ca.k !== cx.k) {
        later(() => { a.classList.add("done"); x.classList.add("done"); G.open = []; G.done++; $("#gd").textContent = G.done;
          say(G.done === N ? "Hepsi tamam!" : HOST_OK[G.done % HOST_OK.length], "cheer");
          if (G.done === N) later(() => gameOver("memory", "Hafıza", G.moves, "hamle", true), 700); }, 350);

    }
  });
}

// önce gördüğün kelimeler, azsa listenin başındakiler
function wordPool(kind, n){
  const all = WORDS().filter(w => !kind || w.kind === kind);
  const seenW = all.filter(w => S.prog[w.id]);
  return shuffle(seenW.length >= (n || 12) ? seenW : seenW.concat(all.filter(w => !S.prog[w.id]).sort((a, b) => a.o - b.o).slice(0, 40)));
}
// 60 saniyelik seçmeli oyun iskeleti
function timedChoice(id, title, pool, make){
  G = {i:0, sc:0, combo:0};
  const draw = () => {
    const it = pool[G.i % pool.length], q = make(it);
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""}</span><span class="t" id="gt">${G.left}</span></div>
      <div class="card flash" style="min-height:150px">${q.top}</div>
      <div class="opts2" ${q.opts.length === 3 ? 'style="grid-template-columns:repeat(3,1fr)"' : ""}>${q.opts.map((o, i) => `<button class="opt" data-i="${i}" style="min-height:62px">${esc(o)}</button>`).join("")}</div>
      <div id="vd" class="hint"></div>`;
    $$(".opt").forEach(b => b.onclick = () => {
      if (G.lock) return; G.lock = 1;
      const ok = q.opts[+b.dataset.i] === q.right;
      b.classList.add(ok ? "good" : "bad");
      hostReact(ok);
      if (ok) { G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else { G.combo = 0; $(`.opt[data-i="${q.opts.indexOf(q.right)}"]`).classList.add("good"); miss(q.m || it, GAMES[id].t); }
      speak(q.say || it.de);
      G.i++; later(() => { G.lock = 0; if (G.left > 0) draw(); }, ok ? 300 : 1100);
    });
  };
  open(() => setTop(title, true));
  gameTimer(60, () => gameOver(id, title, G.sc));
  draw();
}

}

/* Adam Asmaca */
function gHang(){
  const pool = wordPool("n").filter(w => w.w.length >= 4 && w.w.length <= 11);
  G = {i:0, sc:0, lives:6};
  const KEYS = "QWERTZUIOPÜASDFGHJKLÖÄYXCVBNM".split("");
  const round = () => {
    const it = pool[G.i % pool.length], W = it.w.toUpperCase(), got = new Set(), miss = new Set();
    const draw = () => {
      const shown = W.split("").map(c => got.has(c) ? c : "_").join(" ");
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span>${"❤️".repeat(Math.max(0, G.lives))}${"🤍".repeat(6 - Math.max(0, G.lives))}</span></div>
        <div class="card flash" style="min-height:150px"><div class="mid">${esc(it.tr)} · ${esc(it.art)} …</div>
          <div class="big" style="letter-spacing:.12em;font-size:28px">${shown}</div></div>
        <div class="pool" style="gap:6px">${KEYS.map(k => `<button class="wd" data-k="${k}" style="min-width:34px;padding:9px 8px;${got.has(k) ? "background:var(--ok-d)" : miss.has(k) ? "opacity:.3" : ""}" ${got.has(k) || miss.has(k) ? "disabled" : ""}>${k}</button>`).join("")}</div>`;
      $$(".pool .wd").forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        if (G.lives <= 0 || W.split("").every(c => got.has(c))) return;
        if (W.includes(k)) got.add(k); else { miss.add(k); G.lives--; }
        const won = W.split("").every(c => got.has(c));
        if (won) { G.sc++; speak(it.de); toast("✓ " + it.de); G.i++; later(round, 900); draw(); return; }
        if (G.lives <= 0) { window.miss(it, GAMES.hang.t); speak(it.de); toast(it.de); later(() => gameOver("hang", "Adam Asmaca", G.sc), 1200); }
        draw();
      });
    };
    draw();
  };

}

/* Kelime Avı: 8x8 tablo, 5 kelime */
function gHunt(){
  const N = 8, AB = "ABDEFGHIKLMNORSTUWZ";
  const words5 = wordPool("n").filter(w => w.w.length >= 3 && w.w.length <= 8 && /^[A-Za-z]+$/.test(w.w)).slice(0, 5);
  const grid = Array.from({length:N}, () => Array(N).fill(""));
  const placed = [];
  words5.forEach(it => {
    const W = it.w.toUpperCase();
    for (let t = 0; t < 200; t++) {
      const dir = pick([[0,1],[1,0],[1,1]]), r = Math.random() * N | 0, c = Math.random() * N | 0;
      const cells = W.split("").map((ch, i) => [r + dir[0] * i, c + dir[1] * i, ch]);
      if (cells.every(([y, x, ch]) => y < N && x < N && (!grid[y][x] || grid[y][x] === ch))) { cells.forEach(([y, x, ch]) => grid[y][x] = ch); placed.push({it, cells}); break; }
    }
  });
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!grid[y][x]) grid[y][x] = pick(AB.split(""));
  G = {found:new Set(), sel:null, t0:Date.now()};
  const draw = () => {
    const hit = new Set(placed.filter(p => G.found.has(p.it.id)).flatMap(p => p.cells.map(([y, x]) => y + "," + x)));
    $("#view").innerHTML = `<div class="hud"><span class="small muted">Bulunan: <b style="font-size:16px">${G.found.size}/${placed.length}</b></span><span class="small muted">İlk ve son harfe dokun</span></div>
      <div class="gpush" style="display:grid;grid-template-columns:repeat(${N},1fr);gap:4px">${grid.map((row, y) => row.map((ch, x) => `<button class="mc" data-y="${y}" data-x="${x}" style="min-height:40px;padding:0;font-size:17px;${hit.has(y + "," + x) ? "background:var(--ok-d);border-color:var(--ok)" : ""}${G.sel && G.sel[0] === y && G.sel[1] === x ? "border-color:var(--acc);background:var(--acc-d)" : ""}">${ch}</button>`).join("")).join("")}</div>
      <div class="sec">Bul</div>
      <div class="chips">${placed.map(p => `<span class="chip ${G.found.has(p.it.id) ? "on" : ""}" style="display:inline-flex;align-items:center">${G.found.has(p.it.id) ? esc(p.it.de) : esc(p.it.tr)}</span>`).join("")}</div>`;
    $$(".mc").forEach(b => b.onclick = () => {
      const y = +b.dataset.y, x = +b.dataset.x;
      if (!G.sel) { G.sel = [y, x]; return draw(); }
      const [y0, x0] = G.sel; G.sel = null;
      const p = placed.find(p => !G.found.has(p.it.id) && ((p.cells[0][0] === y0 && p.cells[0][1] === x0 && p.cells.at(-1)[0] === y && p.cells.at(-1)[1] === x) || (p.cells[0][0] === y && p.cells[0][1] === x && p.cells.at(-1)[0] === y0 && p.cells.at(-1)[1] === x0)));
      if (p) { G.found.add(p.it.id); speak(p.it.de); }
      else { const q = placed.find(q => !G.found.has(q.it.id) && [[y0, x0], [y, x]].some(([a, b]) => q.cells[0][0] === a && q.cells[0][1] === b)); if (q) miss(q.it, GAMES.hunt.t); }
      draw();
      if (G.found.size === placed.length) later(() => gameOver("hunt", "Kelime Avı", Math.round((Date.now() - G.t0) / 1000)), 700);
    });
  };
  open(() => setTop("Kelime Avı", true));
  draw();
}

/* Harf Çarkı: 8 kelime */
function gWheel(){
  const pool = wordPool().filter(w => !/\s/.test(w.w) && w.w.length >= 3 && w.w.length <= 8).slice(0, 8);
  G = {i:0, sc:0};
  const round = () => {
    const it = pool[G.i];
    if (!it) return gameOver("wheel", "Harf Çarkı", G.sc);
    let L = shuffle(it.w.toUpperCase().split("").map((c, i) => ({c, i}))), built = [], hint = 0;
    const draw = () => {
      const R = 108, n = L.length;
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.i + 1}/${pool.length}</span></div>
        <div class="card flash" style="min-height:96px;padding:16px"><div class="mid">${esc(it.tr)}${it.art ? " · " + it.art : ""}</div>
          <div class="big" style="letter-spacing:.1em">${it.w.toUpperCase().split("").map((c, i) => i < built.length ? L[built[i]].c : i < hint ? `<span style="color:var(--tx3)">${c}</span>` : "_").join(" ")}</div></div>
        <div style="position:relative;width:${R * 2 + 64}px;height:${R * 2 + 64}px;margin:18px auto 0;border-radius:50%;background:var(--bg2);border:1px solid var(--line)">
          ${L.map((x, k) => { const a = k / n * 2 * Math.PI - Math.PI / 2; return `<button class="wd" data-k="${k}" style="position:absolute;left:${R + 32 + Math.cos(a) * R - 24}px;top:${R + 32 + Math.sin(a) * R - 24}px;width:48px;height:48px;padding:0;border-radius:50%;font-size:19px;${built.includes(k) ? "visibility:hidden" : ""}">${x.c}</button>`; }).join("")}
        </div>
        <div class="row2" style="margin-top:14px"><button class="btn2" id="wsh">🔀 Karıştır</button><button class="btn2" id="whn">💡 İpucu</button></div>
        <button class="linkbtn" id="wcl">Sil</button>`;
      $$(".wd[data-k]").forEach(b => b.onclick = () => {
        built.push(+b.dataset.k); draw();
        if (built.length === L.length) {
          const ok = built.map(k => L[k].c).join("") === it.w.toUpperCase();
          if (ok) { G.sc += hint ? 1 : 2; speak(it.de); G.i++; later(round, 800); }
          else { miss(it, GAMES.wheel.t); toast("Olmadı, tekrar dene"); built = []; later(draw, 500); }
        }
      });
      $("#wsh").onclick = () => { built = []; L = shuffle(L); draw(); };
      $("#whn").onclick = () => { hint = Math.min(it.w.length - 1, hint + 1); built = []; draw(); };
      $("#wcl").onclick = () => { built.pop(); draw(); };
    };
    draw();
  };
  open(() => setTop("Harf Çarkı", true));
  round();
}

/* Kelime Solitaire: masada 6 Almanca kart, desteden Türkçe gelir */
function gSoli(){
  const all = wordPool().slice(0, 18);
  const table = all.slice(0, 6), stock = all.slice(6);
  let deck = shuffle(all.map(w => w.id)), top = null;
  G = {draws:0, cleared:0};
  const nextTop = () => { deck = deck.filter(id => !G.gone || !G.gone.has(id)); top = deck.shift(); if (top) deck.push(top); };
  G.gone = new Set();
  nextTop();
  const draw = () => {
    const t = BYID[top];
    $("#view").innerHTML = `<div class="hud"><span class="small muted">Toplanan: <b style="font-size:16px">${G.cleared}/${all.length}</b></span><span class="small muted">Çekiş: <b id="sdr" style="font-size:16px">${G.draws}</b></span></div>
      <div class="card flash" style="min-height:110px;border-color:var(--acc)"><div class="mid">Destedeki kart</div><div class="big" style="font-size:22px">${t ? esc(t.tr) : ""}</div></div>
      <div class="mgrid" style="grid-template-columns:repeat(3,1fr)">${table.map((w, i) => w ? `<button class="mc" data-i="${i}" style="min-height:74px">${esc(w.de)}</button>` : `<span></span>`).join("")}</div>
      <button class="btn2" id="sdraw" style="width:100%;margin-top:14px">Masada yok · yeni kart çek</button>`;
    $$(".mc").forEach(b => b.onclick = () => {
      const w = table[+b.dataset.i];
      if (w.id === top) {
        speak(w.de); G.gone.add(w.id); G.cleared++;
        table[+b.dataset.i] = stock.shift() || null;
        if (G.cleared === all.length) return gameOver("soli", "Kelime Solitaire", G.draws);
        nextTop(); draw();
      } else { miss(t, GAMES.soli.t); b.classList.add("bad"); later(() => b.classList.remove("bad"), 400); G.draws++; $("#sdr").textContent = G.draws; }
    });
    $("#sdraw").onclick = () => { G.draws++; nextTop(); draw(); };
  };
  open(() => setTop("Kelime Solitaire", true));
  draw();
}

// ortak iskelet: düşme döngüsü, klavye, çıkınca temizlik
function dropLoop(step){
  const me = G; let last = performance.now();
  const tick = now => {
    if (G !== me || G.over || screen === null) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!G.pause) step(dt);
    G.raf = requestAnimationFrame(tick);
  };
  G.raf = requestAnimationFrame(tick);
}
function dropKeys(fn){
  const h = e => { if (fn(e.key)) e.preventDefault(); };
  document.addEventListener("keydown", h);
  const me = G, raf = () => cancelAnimationFrame(me.raf);
  onLeave = () => { me.over = 1; raf(); document.removeEventListener("keydown", h); };
}
function dropEnd(id, title, sc){ G.over = 1; if (onLeave) { const f = onLeave; onLeave = null; f(); } gameOver(id, title, sc); }

/* Artikel Düşüşü: 3 can, her doğruda biraz hızlanır */
function gArtDrop(){
  const pool = wordPool("n");
  G = {i:0, sc:0, combo:0, life:3, ok:0};
  open(() => setTop("Artikel Düşüşü", true));
  const ARTS = ["der", "die", "das"];
  $("#view").innerHTML = `<div class="hud"><b id="ds">0</b><span class="small muted" id="dc"></span><span id="dl"></span></div>
    <div class="drop" id="df"><div class="dw" id="dw"><b></b><span></span></div>
      <div class="gates">${ARTS.map((a, k) => `<button class="gate g${k}" data-k="${k}">${a}</button>`).join("")}</div></div>
    <p class="hint">Kapıya dokun ya da ← ↓ → tuşları</p>`;
  const f = $("#df"), w = $("#dw"), gates = $$(".gate");
  const hud = () => { $("#ds").textContent = G.sc; $("#dc").textContent = G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""; $("#dl").textContent = "❤️".repeat(G.life) + "🤍".repeat(3 - G.life); };
  const next = () => {
    G.it = pool[G.i++ % pool.length]; G.y = 0; G.pick = null; G.x = 50; G.pause = 0;
    G.dur = Math.max(2.4, 7 * Math.pow(0.95, G.ok));            // tüm düşüş saniyesi
    w.className = "dw"; w.style.left = "50%"; w.querySelector("b").textContent = G.it.w; w.querySelector("span").textContent = G.it.tr;
    gates.forEach(g => g.classList.remove("good", "bad"));
  };
  const pick = k => { if (G.pick !== null || G.pause) return; G.pick = k; G.x = (k * 2 + 1) * 100 / 6; w.style.left = G.x + "%"; land(); };
  const land = () => {
    G.pause = 1;
    const right = ARTS.indexOf(G.it.art), ok = G.pick === right;
    gates[right].classList.add("good"); if (G.pick !== null && !ok) gates[G.pick].classList.add("bad");
    w.querySelector("b").textContent = G.it.art + " " + G.it.w; w.classList.add(ok ? "ok" : "no", ok ? "pop" : "x");
    speak(G.it.de);
    if (ok) { G.ok++; G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else { G.combo = 0; G.life--; miss(G.it, GAMES.artdrop.t); }
    hud();
    later(() => G.life > 0 ? next() : dropEnd("artdrop", "Artikel Düşüşü", G.sc), ok ? 260 : 1500);
  };
  gates.forEach(g => g.onclick = () => pick(+g.dataset.k));
  dropKeys(key => { const k = {ArrowLeft:0, ArrowDown:1, ArrowRight:2, 1:0, 2:1, 3:2}[key]; if (k === undefined) return false; pick(k); return true; });
  hud(); next();
  dropLoop(dt => {
    const H = f.clientHeight - gates[0].offsetHeight - w.offsetHeight;
    G.y += dt * H / G.dur;
    if (G.y >= H) { G.y = H; land(); }
    w.style.transform = `translate(-50%, ${G.y}px)`;
  });
}

/* Karşılaştırma Düşüşü: 3 sıra kapı, kelime hepsinden doğru geçmeli */
function gCmpDrop(){
  const pool = shuffle(ADJ_CMP.slice());
  G = {i:0, sc:0, combo:0, ok:0, left:90};
  open(() => setTop("Karşılaştırma Düşüşü", true));
  const ROWS = [0.40, 0.63, 0.86], LBL = ["kelime", "daha …", "en …"];
  $("#view").innerHTML = `<div class="hud"><b id="ds">0</b><span class="small muted" id="dc"></span><span class="t" id="gt">90</span></div>
    <div class="drop" id="df"><div class="dw" id="dw"><b></b><span></span></div>
      ${ROWS.map((r, i) => `<div class="grow" data-r="${i}" style="top:${r * 100}%"><small>${LBL[i]}</small><button class="gate" data-c="0"></button><button class="gate" data-c="1"></button></div>`).join("")}
      <div class="dbreak" id="db" hidden></div></div>
    <p class="hint">Kapıya dokun ya da ← → tuşları</p>`;
  const f = $("#df"), w = $("#dw"), rows = $$(".grow"), db = $("#db");
  const hud = () => { $("#ds").textContent = G.sc; $("#dc").textContent = G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""; };
  const next = () => {
    const a = G.a = pool[G.i++ % pool.length];
    G.opts = [[a.w, a.opp], [a.k, a.xk], [a.s, a.xs]].map(o => shuffle(o));
    G.right = [a.w, a.k, a.s]; G.row = 0; G.pick = null; G.y = 0; G.pause = 0;
    G.dur = Math.max(6, 14 * Math.pow(0.96, G.ok));          // ilk sıraya ~5 sn
    w.className = "dw"; w.style.left = "50%"; w.querySelector("b").textContent = a.tr; w.querySelector("span").textContent = "";
    rows.forEach((r, i) => { r.className = "grow" + (i === 0 ? " on" : ""); r.querySelectorAll(".gate").forEach((g, c) => { g.textContent = G.opts[i][c]; g.className = "gate"; }); });
  };
  const pick = c => { if (G.pick !== null || G.pause) return; G.pick = c; w.style.left = (c ? 75 : 25) + "%"; G.opts[G.row][c] === G.right[G.row] ? pass() : fail(); };
  const fail = () => {
    G.pause = 1; G.combo = 0; hud();
    miss({de: G.right.join(" → "), tr: G.a.tr, note: G.a.exd + " = " + G.a.ext}, GAMES.cmpdrop.t);
    const g = rows[G.row].querySelectorAll(".gate");
    if (G.pick !== null) g[G.pick].classList.add("bad");
    g[G.opts[G.row].indexOf(G.right[G.row])].classList.add("good");
    w.classList.add("no");
    const a = G.a, f3 = G.right.map((x, i) => i === G.row ? `<u>${esc(x)}</u>` : esc(x)).join(" → ");
    db.innerHTML = `<div class="big">${f3}</div><div class="mid">${esc(a.tr)}</div><div class="ex">${esc(a.exd)}<br><span class="muted">${esc(a.ext)}</span></div><button class="cta" id="dn">Devam</button>`;
    db.hidden = false; speak(a.w + ", " + a.k + ", " + a.s + ". " + a.exd);
    $("#dn").onclick = () => { db.hidden = true; stopSpeak(); next(); };
  };
  const pass = () => {
    const r = rows[G.row]; r.querySelectorAll(".gate")[G.pick].classList.add("good"); r.classList.remove("on"); r.classList.add("done");
    w.querySelector("span").textContent = G.a.tr; w.querySelector("b").textContent = G.right[G.row];
    G.row++; G.pick = null;
    if (G.row < 3) { rows[G.row].classList.add("on"); return; }
    G.ok++; G.combo++; G.sc += G.combo >= 4 ? 2 : 1; hud();
    G.pause = 1; w.classList.add("ok"); later(() => w.classList.add("pop"), 150); speak(G.right.join(", "));
    later(() => G.left > 0 && next(), 450);
  };
  rows.forEach((r, i) => r.querySelectorAll(".gate").forEach((g, c) => g.onclick = () => i === G.row && pick(c)));
  dropKeys(key => { const c = {ArrowLeft:0, ArrowRight:1}[key]; if (c === undefined) return false; pick(c); return true; });
  hud(); next();
  let sec = 0;
  dropLoop(dt => {
    sec += dt; if (sec >= 1) { sec -= 1; G.left--; const t = $("#gt"); t.textContent = G.left; t.classList.toggle("low", G.left <= 10); if (G.left <= 0) return dropEnd("cmpdrop", "Karşılaştırma Düşüşü", G.sc); }
    const H = f.clientHeight, ty = ROWS[G.row] * H - w.offsetHeight - 6;
    G.y += dt * H / G.dur;
    if (G.y >= ty) { G.y = ty; fail(); }                          // seçmeden sıraya değdi
    w.style.transform = `translate(-50%, ${G.y}px)`;
  });
}

const N_ONES = ["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
const N_TENS = ["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
function numDE(n){
  if (n < 20) return N_ONES[n];
  if (n < 100) { const o = n % 10, t = N_TENS[n / 10 | 0]; return o ? (o === 1 ? "ein" : N_ONES[o]) + "und" + t : t; }
  if (n < 1000) { const h = n / 100 | 0, r = n % 100; return (h === 1 ? "ein" : N_ONES[h]) + "hundert" + (r ? numDE(r) : ""); }
  return "eintausend";
}
const rnd = (a, b) => a + (Math.random() * (b - a + 1) | 0);
// yakın ama yanlış sayılar: bir eksik/fazla, onluk kayması, rakam takası (einundzwanzig ↔ 12 hatası)
function nearNums(n, k, max){
  const sw = n >= 10 && n < 100 ? (n % 10) * 10 + (n / 10 | 0) : -1;
  const c = uniq([sw, n + 1, n - 1, n + 10, n - 10, n + 2, n - 20, n + 100, n - 100].filter(x => x >= 0 && x <= (max || 1000) && x !== n));
  return shuffle(c.slice(0, 4)).slice(0, k);
}
const priceDE = c => { const e = c / 100 | 0, ct = c % 100; if (!e) return numDE(ct) + " Cent"; return (e === 1 ? "ein" : numDE(e)) + " Euro" + (ct ? " " + numDE(ct) : ""); };
const priceNum = c => (c / 100).toFixed(2).replace(".", ",") + " €";

// süresiz soru dizisi: n soru ya da can bitene kadar; yanlışta açıklama + Devam
function quiz(id, title, pool, make, o){
  o = o || {}; const max = o.lives || 0;
  G = {i:0, sc:0, life:max};
  const end = () => gameOver(id, title, G.sc);
  const draw = () => {
    if ((o.n && G.i >= o.n) || (max && G.life <= 0) || !pool.length) return end();
    const it = pool[G.i % pool.length], q = make(it), short = q.opts.every(x => x.length <= 16);

      <div class="card flash" style="min-height:140px">${q.top}</div>
      <div id="vd"></div>
      <div class="${short ? "opts2" : "opts"}" ${short && q.opts.length === 3 ? 'style="grid-template-columns:repeat(3,1fr)"' : ""}>${q.opts.map((x, i) => `<button class="opt" data-i="${i}" style="min-height:58px">${esc(x)}</button>`).join("")}</div>
      <div id="vdn"></div>`;

  const next = () => {
    const max = G.ok < 8 ? 100 : G.ok < 18 ? 500 : 1000, n = rnd(G.ok < 8 ? 0 : 20, max);

    gates.forEach((g, k) => { g.textContent = G.opts[k]; g.className = "gate"; });
  };

    G.pause = 1; const right = G.opts.indexOf(G.n), ok = G.pick === right;
    gates[right].classList.add("good"); if (G.pick !== null && !ok) gates[G.pick].classList.add("bad");
    w.querySelector("span").textContent = G.n; w.classList.add(ok ? "ok" : "no", ok ? "pop" : "x");
    if (ok) { G.ok++; G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else { G.combo = 0; speak(numDE(G.n)); miss({de: numDE(G.n), tr: String(G.n)}, GAMES.numdrop.t); }
    hud(); later(() => G.left > 0 && next(), ok ? 260 : 1300);
  };
  const pick = k => { if (G.pick !== null || G.pause) return; G.pick = k; w.style.left = (k * 2 + 1) * 100 / 6 + "%"; land(); };
  gates.forEach(g => g.onclick = () => pick(+g.dataset.k));
  dropKeys(key => { const k = {ArrowLeft:0, ArrowDown:1, ArrowRight:2, 1:0, 2:1, 3:2}[key]; if (k === undefined) return false; pick(k); return true; });
  hud(); next();
  let sec = 0;
  dropLoop(dt => {
    sec += dt; if (sec >= 1) { sec -= 1; G.left--; const t = $("#gt"); t.textContent = G.left; t.classList.toggle("low", G.left <= 10); if (G.left <= 0) return dropEnd("numdrop", "Sayı Düşüşü", G.sc); }
    const H = f.clientHeight - gates[0].offsetHeight - w.offsetHeight;
    G.y += dt * H / G.dur;
    if (G.y >= H) { G.y = H; land(); }
    w.style.transform = `translate(-50%, ${G.y}px)`;
  });
}

const MATH_KEYS = ["null","eins","ein","zwei","drei","vier","fünf","sechs","sech","sieben","sieb","acht","neun","zehn","elf","zwölf","und","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig","hundert"];
function gMath(){
  G = {sc:0, b:[]};
  const OPS = [["plus", (a, b) => a + b], ["minus", (a, b) => a - b], ["mal", (a, b) => a * b], ["geteilt durch", (a, b) => a / b]];
  const next = () => {
    const [name, fn] = pick(OPS); let a = rnd(1, 10), b = rnd(1, 10);
    if (name === "minus" && b > a) [a, b] = [b, a];
    if (name === "geteilt durch") a = a * b;
    G.r = fn(a, b); G.b = [];
    G.ok = G.r === 100 ? ["einhundert", "hundert"] : [numDE(G.r)];
    $("#mq").textContent = numDE(a) + " " + name + " " + numDE(b); $("#mn").textContent = a + " " + {plus:"+", minus:"−", mal:"×", "geteilt durch":"÷"}[name] + " " + b + " = ?";
    G.q = {de: numDE(a) + " " + name + " " + numDE(b) + " = " + G.ok[0], tr: $("#mn").textContent.replace("?", G.r)};
    show();
  };
  const show = () => { $("#mb").textContent = G.b.join("") || "…"; $("#mb").style.color = ""; };
  const done = ok => {
    G.lock = 1; $("#mb").style.color = ok ? "var(--ok)" : "var(--bad)";
    if (ok) G.sc++; else { $("#mb").textContent = G.ok[0]; miss(G.q, GAMES.math.t); }
    $("#ms").textContent = G.sc; speak(G.ok[0]);
    later(() => { G.lock = 0; if (G.left > 0) next(); }, ok ? 500 : 1600);
  };

    <div class="card flash" style="min-height:140px;gap:8px"><div class="big" id="mq" style="font-size:23px"></div><div class="mid" id="mn"></div>
      <div class="big" id="mb" style="font-size:22px;color:var(--acc);word-break:break-word">…</div></div>
    <div class="pool" style="gap:6px">${MATH_KEYS.map(k => `<button class="wd" data-k="${k}" style="padding:8px 10px;font-size:15px">${k}</button>`).join("")}</div>
    <div class="row2" style="margin-top:12px"><button class="btn2" id="mdel">⌫ Sil</button><button class="btn2" id="mok">✓ Kontrol</button></div>`;
  $$(".wd[data-k]").forEach(b => b.onclick = () => {
    if (G.lock) return; G.b.push(b.dataset.k); show();

}

/* ---------- Perfekt'e Çevir ---------- */
const HABEN = ["habe", "hast", "hat", "haben", "habt", "haben"], SEIN = ["bin", "bist", "ist", "sind", "seid", "sind"];
const PRON = ["Ich", "Du", "Er", "Wir", "Ihr", "Sie"];

  const pool = wordPool("v").filter(v => !/^(können|müssen|wollen|sollen|dürfen|mögen|möchten)$/.test(v.w) && v.pf);

    const aux = (sein ? SEIN : HABEN)[p], other = (sein ? HABEN : SEIN)[p];
    const stem = v.w.replace(/e?n$/, "");
    const wrongP = uniq(shuffle(["ge" + stem + "t", "ge" + v.w, part.replace(/t$/, "en"), part.replace(/en$/, "t")]).filter(x => x !== part)).slice(0, 2);
    const pres = PRON[p] + " " + v.pr[p] + ".", perf = PRON[p] + " " + aux + " " + part + ".";

          <div class="big" style="font-size:21px;color:var(--acc)">${esc(PRON[p])} ${step ? esc(aux) : "___"} … ___.</div></div>
        <div id="vd"></div><p class="hint">${step ? "Partizip II hangisi?" : "Yardımcı fiil: haben mi sein mi?"}</p>
        <div class="opts2" ${opts.length === 3 ? 'style="grid-template-columns:repeat(3,1fr)"' : ""}>${opts.map(o => `<button class="opt" style="min-height:60px">${esc(o)}</button>`).join("")}</div>`;
      let lock = 0;

        b.classList.add(ok ? "good" : "bad"); if (!ok) $$(".opt").find(x => x.textContent === right).classList.add("good");
        if (!ok) { G.combo = 0; speak(perf); miss({de: perf, tr: v.tr + ", " + PERS_TR[p] + " (geçmiş)", note: pres + " → " + perf}, GAMES.perf.t); $("#vd").innerHTML = `<div class="tip"><b>${esc(perf)}</b></div>`; return later(() => G.left > 0 && draw(), 1700); }

        G.combo++; G.sc += G.combo >= 5 ? 2 : 1; speak(perf); later(() => G.left > 0 && draw(), 700);
      });
    };
    show();
  };
  open(() => setTop("Perfekt'e Çevir", true));

function gNine(){

  G = {i:0, sc:0, res:[]};
  const round = () => {
    clearInterval(G.tm);
    const it = pool[G.i];
    if (!it) {
      best("nine", G.sc); setTop("9 Kelime", true);
      $("#view").innerHTML = `<div class="card flash" style="margin-top:14px;min-height:0"><div class="big">${G.sc}/9 kelime</div></div>
        <div class="card plist" style="margin-top:12px">${G.res.map(r => `<div class="pi"><span class="dot ${r.ok ? "s2" : ""}"></span><div><div class="de">${esc(r.it.de)}</div><div class="tr">${esc(r.it.tr)}</div></div></div>`).join("")}</div>
        <div class="foot"><button class="cta" id="nx">Tekrar oyna</button><button class="linkbtn" id="gb">Oyunlara dön</button></div>`;
      $("#nx").onclick = () => gNine(); $("#gb").onclick = () => go("games"); return;
    }
    const W = it.w.toUpperCase(); let L = shuffle(W.split("").map((c, i) => ({c, i}))), built = [], shuf = 1;
    const fin = ok => { clearInterval(G.tm); G.res.push({it, ok}); if (ok) G.sc++; else miss(it, GAMES.nine.t); speak(it.de); G.i++; later(round, ok ? 600 : 1400); if (!ok) $("#nb").innerHTML = esc(W.split("").join(" ")); };
    const draw = () => {
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.i + 1}/9</span><span class="t" id="gt">${G.left}</span></div>
        <div class="card flash" style="min-height:120px"><div class="mid">${esc(it.tr)}</div><div class="big" id="nb" style="letter-spacing:.12em">${W.split("").map((c, i) => i < built.length ? L[built[i]].c : "_").join(" ")}</div></div>
        <div class="pool">${L.map((x, k) => `<button class="wd" data-k="${k}" style="min-width:44px;font-size:20px;${built.includes(k) ? "visibility:hidden" : ""}">${x.c}</button>`).join("")}</div>
        <div class="row2" style="margin-top:14px"><button class="btn2" id="nsh" ${shuf ? "" : "disabled style=\"opacity:.4\""}>🔀 Karıştır (${shuf})</button><button class="btn2" id="ndel">⌫ Sil</button></div>`;
      $$(".wd[data-k]").forEach(b => b.onclick = () => {
        built.push(+b.dataset.k); draw();
        if (built.length === L.length) { if (built.map(k => L[k].c).join("") === W) fin(true); else { toast("Olmadı"); built = []; later(draw, 400); } }
      });
      $("#nsh").onclick = () => { if (shuf) { shuf--; built = []; L = shuffle(L); draw(); } };
      $("#ndel").onclick = () => { built.pop(); draw(); };
    };
    G.left = 30; draw();
    G.tm = setInterval(() => { if (screen === null) return clearInterval(G.tm); G.left--; const t = $("#gt"); if (t) { t.textContent = G.left; t.classList.toggle("low", G.left <= 10); } if (G.left <= 0) fin(false); }, 1000);
    const tm = G.tm; onLeave = () => clearInterval(tm);
  };
  open(() => setTop("9 Kelime", true));
  round();
}

/* ---------- Almanca Wordle ---------- */
function gWordle(daily){
  const cand = WORDS().filter(w => /^[A-Za-zÄÖÜäöü]{5}$/.test(w.w)).sort((a, b) => a.id.localeCompare(b.id));
  if (!cand.length) return toast("Kelime yok");
  const it = daily === false ? pick(cand) : cand[dayNo() * 7 % cand.length], W = it.w.toUpperCase();
  const rows = [], KEYS = ["QWERTZUIOPÜ", "ASDFGHJKLÖÄ", "YXCVBNM"];
  let cur = "", over = 0;
  const score = g => { const r = Array(5).fill("x"), rest = W.split(""); g.split("").forEach((c, i) => { if (c === W[i]) { r[i] = "g"; rest[i] = null; } }); g.split("").forEach((c, i) => { if (r[i] !== "g") { const j = rest.indexOf(c); if (j >= 0) { r[i] = "y"; rest[j] = null; } } }); return r; };
  const COL = {g:"var(--ok)", y:"var(--acc)", x:"var(--bg4)"};
  const keyState = {};
  const draw = () => {
    const cell = (c, s) => `<div style="width:52px;height:52px;display:grid;place-items:center;border-radius:10px;font-weight:700;font-size:22px;${s ? `background:${COL[s]};color:${s === "x" ? "var(--tx)" : "#fff"}` : "border:2px solid var(--line)"}">${c || ""}</div>`;
    const grid = Array.from({length:6}, (_, r) => `<div style="display:flex;gap:6px;justify-content:center">${rows[r] ? rows[r].g.split("").map((c, i) => cell(c, rows[r].s[i])).join("") : Array.from({length:5}, (_, i) => cell(r === rows.length ? cur[i] : "")).join("")}</div>`).join("");
    $("#view").innerHTML = `<div class="hud"><span class="small muted">${esc(it.tr)}${it.art ? " · " + it.art : ""}?</span><span class="small muted">${rows.length}/6</span></div>
      <div style="display:flex;flex-direction:column;gap:6px;margin:auto 0">${grid}</div>
      <div id="wmsg" style="margin-bottom:10px"></div>
      ${KEYS.map((r, ri) => `<div style="display:flex;gap:4px;justify-content:center;margin-top:5px">${ri === 2 ? '<button class="wd" data-k="ENTER" style="padding:10px 8px;font-size:13px">OK</button>' : ""}${r.split("").map(k => `<button class="wd" data-k="${k}" style="flex:1;max-width:34px;padding:10px 0;font-size:15px;${keyState[k] ? `background:${COL[keyState[k]]};color:${keyState[k] === "x" ? "var(--tx3)" : "#fff"}` : ""}">${k}</button>`).join("")}${ri === 2 ? '<button class="wd" data-k="DEL" style="padding:10px 8px;font-size:13px">⌫</button>' : ""}</div>`).join("")}`;
    $$(".wd[data-k]").forEach(b => b.onclick = () => key(b.dataset.k));
    if (over) {
      $("#wmsg").innerHTML = `<div class="tip"><b>${esc(it.de)}</b> · ${esc(it.tr)}</div><div class="foot"><button class="cta" id="wn">Yeni kelime</button><button class="linkbtn" id="gb">Oyunlara dön</button></div>`;
      $("#wn").onclick = () => gWordle(false); $("#gb").onclick = () => go("games");
    }
  };
  const key = k => {
    if (over) return;
    if (k === "DEL") cur = cur.slice(0, -1);
    else if (k === "ENTER") {
      if (cur.length < 5) return toast("5 harf gerekli");
      const s = score(cur); rows.push({g:cur, s});
      cur.split("").forEach((c, i) => { const o = keyState[c]; if (o !== "g" && !(o === "y" && s[i] === "x")) keyState[c] = s[i]; });
      if (s.every(x => x === "g")) { over = 1; speak(it.de); best("wordle", rows.length, true); toast(rows.length + ". denemede buldun!"); }
      else if (rows.length >= 6) { over = 1; speak(it.de); mark("game"); miss(it, GAMES.wordle.t); }
      cur = "";
    } else if (cur.length < 5) cur += k;
    draw();
  };
  const h = e => { const k = e.key.toUpperCase(); if (k === "ENTER" || k === "BACKSPACE") key(k === "ENTER" ? "ENTER" : "DEL"); else if (/^[A-ZÄÖÜ]$/.test(k)) key(k); };
  open(() => setTop("Almanca Wordle", true));
  document.addEventListener("keydown", h); onLeave = () => document.removeEventListener("keydown", h);
  draw();
}

/* ---------- Eşleştirme Izgarası ---------- */
function gGrid(){
  G = {sc:0, sel:null};
  const board = () => {
    const its = distinctWords(wordPool().filter(w => w.w.length <= 14 && w.tr.length <= 16)).slice(0, 8);
    G.cells = shuffle(its.flatMap(it => [{id:it.id, t:it.w, de:1}, {id:it.id, t:it.tr.split(",")[0]}])); G.done = 0; G.sel = null;
    draw();
  };
  const draw = () => {
    $("#view").innerHTML = `<div class="hud"><span><b>${G.sc}</b> <span class="small muted">çift</span></span><span class="small muted">${8 - G.done} kaldı</span><span class="t" id="gt">${G.left}</span></div>
      <p class="hint gpush" style="margin-bottom:10px"><span class="glg de"></span> Almanca &nbsp; <span class="glg"></span> Türkçe · ikisine dokun</p>
      <div class="ggrid">${G.cells.map((c, i) => `<button class="gt ${c.de ? "de" : ""} ${c.gone ? "gone" : ""} ${G.sel === i ? "sel" : ""}" data-i="${i}"><span>${esc(c.t)}</span></button>`).join("")}</div>`;
    $$(".ggrid .gt").forEach(b => b.onclick = () => {
      const i = +b.dataset.i, c = G.cells[i];
      if (c.gone || G.lock) return;
      if (G.sel === null || G.sel === i) { G.sel = G.sel === i ? null : i; if (c.de) speak(BYID[c.id].de); return draw(); }
      const a = G.cells[G.sel];
      if (a.id === c.id && a.de !== c.de) {
        const pb = $$(".ggrid .gt")[G.sel]; b.classList.add("hit"); pb.classList.add("hit"); G.lock = 1;
        a.gone = c.gone = 1; G.sel = null; G.sc++; G.done++;
        return later(() => { G.lock = 0; G.done === 8 ? board() : draw(); }, 280);
      }
      miss(BYID[(c.de ? c : a).id], GAMES.grid.t);
      b.classList.add("bad"); $$(".ggrid .gt")[G.sel].classList.add("bad"); G.lock = 1; G.sel = null;
      later(() => { G.lock = 0; draw(); }, 450);
    });
  };
  open(() => setTop("Eşleştirme Izgarası", true));
  gameTimer(60, () => gameOver("grid", "Eşleştirme Izgarası", G.sc));
  board();
}

/* ---------- Doğru mu Yanlış mı? ---------- */
function gTF(){
  const pool = wordPool("n");
  G = {i:0, sc:0, combo:0};
  const draw = () => {
    const it = pool[G.i++ % pool.length], t = it.pl ? rnd(0, 2) : pick([0, 2]), truth = Math.random() < .5;
    let st, right;
    if (t === 0) { const a = truth ? it.art : pick(["der", "die", "das"].filter(x => x !== it.art)); st = a + " " + it.w; right = it.de; }
    else if (t === 1) { const wr = pick(plWrong(it)); st = it.de + " → die " + (truth ? it.pl : wr); right = it.de + " → die " + it.pl; }
    else { const tr = truth ? it.tr : kindOther(it, 1, "tr")[0]; st = it.de + " = " + tr; right = it.de + " = " + it.tr; }
    $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${G.combo >= 3 ? "🔥 " + G.combo + " seri" : ""}</span><span class="t" id="gt">${G.left}</span></div>
      <div class="card flash" style="min-height:160px"><div class="mid">${["Artikel", "Çoğul", "Anlam"][t]}</div><div class="big" style="font-size:24px">${esc(st)}</div><div class="mid" id="tfr" style="visibility:hidden">${esc(right)}</div></div>
      <div class="tfbtn" style="margin-top:14px"><button class="y" data-v="1"><i>${I("check", "ln")}</i>Doğru</button><button class="n" data-v="0"><i>${I("x", "ln")}</i>Yanlış</button></div>`;
    let lock = 0;
    $$(".tfbtn button").forEach(b => b.onclick = () => {
      if (lock++) return;
      const ok = (b.dataset.v === "1") === truth;
      b.classList.add(ok ? "good" : "bad"); $(".tfbtn").classList.add("done"); hostReact(ok);
      if (ok) { G.combo++; G.sc += G.combo >= 5 ? 2 : 1; } else { G.combo = 0; $("#tfr").style.visibility = "visible"; speak(it.de); miss(t === 1 ? {de: "die " + it.pl, tr: it.tr + " (çoğul)", note: it.de + " → die " + it.pl} : it, GAMES.tf.t); }
      later(() => G.left > 0 && draw(), ok ? 350 : 1400);
    });
  };
  open(() => setTop("Doğru mu Yanlış mı?", true));
  gameTimer(60, () => gameOver("tf", "Doğru mu Yanlış mı?", G.sc));
  draw();
}

/* ---------- Harf Salatası ---------- */
function gSalad(){
  const pool = wordPool().filter(w => /^[A-Za-zÄÖÜäöüß]{3,9}$/.test(w.w));
  G = {i:0, sc:0};
  const draw = () => {
    const it = G.cur = pool[G.i++ % pool.length], W = it.w.toUpperCase(), L = shuffle(W.split("")), built = [];
    const pos = L.map((_, k) => ({x: 8 + (k % 4) * 22 + rnd(-4, 4), y: 10 + (k / 4 | 0) * 30 + rnd(-5, 5), r: rnd(-25, 25)}));
    const show = () => {
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span class="small muted">${esc(it.tr)}${it.art ? " · " + it.art : ""}</span><span class="t" id="gt">${G.left}</span></div>
        <div class="card flash" style="min-height:80px;padding:14px"><div class="big" style="letter-spacing:.12em">${W.split("").map((c, i) => i < built.length ? L[built[i]] : "_").join(" ")}</div></div>
        <div style="position:relative;height:${Math.ceil(L.length / 4) * 30 + 30}%;min-height:200px;margin-top:14px;border-radius:50% 50% 46% 46%/30% 30% 70% 70%;background:var(--acc-d);border:2px solid var(--line)">
          ${L.map((c, k) => `<button class="wd" data-k="${k}" style="position:absolute;left:${pos[k].x}%;top:${pos[k].y}%;transform:rotate(${pos[k].r}deg);width:46px;height:46px;padding:0;font-size:20px;${built.includes(k) ? "visibility:hidden" : ""}">${c}</button>`).join("")}</div>
        <div class="row2" style="margin-top:14px"><button class="btn2" id="sdel">⌫ Sil</button><button class="btn2" id="sskip">Geç</button></div>`;
      $$(".wd[data-k]").forEach(b => b.onclick = () => {
        built.push(+b.dataset.k); show();
        if (built.length === L.length) { if (built.map(k => L[k]).join("") === W) { G.cur = null; G.sc++; speak(it.de); later(() => G.left > 0 && draw(), 500); } else { toast("Olmadı"); built.length = 0; later(show, 400); } }
      });
      $("#sdel").onclick = () => { built.pop(); show(); };
      $("#sskip").onclick = () => { miss(it, GAMES.salad.t); toast(it.de); speak(it.de); draw(); };
    };
    show();
  };
  open(() => setTop("Harf Salatası", true));
  // süre bitince yarım kalan kelime de hata defterine
  gameTimer(60, () => { if (G.cur) miss(G.cur, GAMES.salad.t); gameOver("salad", "Harf Salatası", G.sc); });
  draw();
}

/* ---------- Kelime Eşle (iki sütun) ---------- */
function gMatch(){
  const all = distinctWords(wordPool().filter(w => w.tr.length <= 22)).slice(0, 20);
  G = {r:0, t0:Date.now(), pen:0};
  const round = () => {
    const its = all.slice(G.r * 5, G.r * 5 + 5);
    if (its.length < 5 || G.r >= 4) return gameOver("match", "Kelime Eşle", Math.round((Date.now() - G.t0) / 1000) + G.pen);
    const L = shuffle(its), R = shuffle(its), gone = new Set(); let sel = null;
    const draw = () => {
      $("#view").innerHTML = `<div class="hud"><span class="small muted">Tur ${G.r + 1}/4</span><span class="small muted">${G.pen ? "+" + G.pen + " sn ceza" : ""}</span></div>
        <div class="gpush" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div style="display:flex;flex-direction:column;gap:8px">${L.map(w => `<button class="mc ${gone.has(w.id) ? "done" : ""} ${sel === w.id ? "sel" : ""}" data-l="${w.id}" style="min-height:62px">${esc(w.de)}</button>`).join("")}</div>
          <div style="display:flex;flex-direction:column;gap:8px">${R.map(w => `<button class="mc ${gone.has(w.id) ? "done" : ""}" data-r="${w.id}" style="min-height:62px;color:var(--tx2)">${esc(w.tr)}</button>`).join("")}</div></div>`;
      $$("[data-l]").forEach(b => b.onclick = () => { sel = b.dataset.l; speak(BYID[sel].de); draw(); });
      $$("[data-r]").forEach(b => b.onclick = () => {
        if (!sel) return toast("Önce soldan seç");
        if (b.dataset.r === sel) { gone.add(sel); sel = null; if (gone.size === 5) { G.r++; return later(round, 300); } draw(); }
        else { G.pen += 3; miss(BYID[sel], GAMES.match.t); b.classList.add("bad"); later(() => b.classList.remove("bad"), 400); }
      });
    };
    draw();
  };
  open(() => setTop("Kelime Eşle", true));
  round();
}

/* ---------- Kelime Tahmini (fiil + sıfat adam asmaca) ---------- */
function gGuess(){
  const pool = shuffle(WORDS().filter(w => w.kind !== "n" && /^[A-Za-zÄÖÜäöüß]{3,11}$/.test(w.w)));
  G = {i:0, sc:0, lives:6};
  const KEYS = "QWERTZUIOPÜASDFGHJKLÖÄYXCVBNMß".split("");
  const round = () => {
    const it = pool[G.i % pool.length], W = it.w.replace(/[^ß]/g, c => c.toUpperCase()), got = new Set(), miss = new Set();
    const draw = () => {
      $("#view").innerHTML = `<div class="hud"><b>${G.sc}</b><span>${hearts(G.lives, 6)}</span></div>
        <div class="card flash" style="min-height:150px"><div class="mid">${esc(it.tr)} · ${it.kind === "v" ? "fiil" : "sıfat/zarf"}</div>
          <div class="big" style="letter-spacing:.12em;font-size:28px">${W.split("").map(c => got.has(c) ? c : "_").join(" ")}</div></div>
        <div class="pool" style="gap:6px">${KEYS.map(k => `<button class="wd" data-k="${k}" style="min-width:34px;padding:9px 8px;${got.has(k) ? "background:var(--ok-d)" : miss.has(k) ? "opacity:.3" : ""}" ${got.has(k) || miss.has(k) ? "disabled" : ""}>${k}</button>`).join("")}</div>`;
      $$(".pool .wd").forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        if (G.lives <= 0 || W.split("").every(c => got.has(c))) return;
        if (W.includes(k)) got.add(k); else { miss.add(k); G.lives--; }
        if (W.split("").every(c => got.has(c))) { G.sc++; speak(it.w); toast("✓ " + it.w); G.i++; later(round, 900); }
        else if (G.lives <= 0) { window.miss(it, GAMES.guess.t); speak(it.w); toast(it.w); later(() => gameOver("guess", "Kelime Tahmini", G.sc), 1200); }
        draw();
      });
    };
    draw();
  };
  open(() => setTop("Kelime Tahmini", true));
  round();
}

function gConj4(){
  quiz("conj4", "Çekim Seçmeli", wordPool("v"), it => {
    const p = rnd(0, 5), right = it.pr[p];
    let opts = uniq(it.pr.filter(f => f !== right));
    if (opts.length < 3) opts = opts.concat(kindOther(it, 3, "w").map(w => (BYID["v:" + w] || {pr:[]}).pr[p]).filter(Boolean));
    opts = shuffle([right].concat(shuffle(uniq(opts.filter(f => f !== right))).slice(0, 3)));
    return {top:`<div class="mid">${esc(it.w)} · ${esc(it.tr)}</div><div class="big">${PERS[p]} ___</div>`, opts, right, say: PERS[p].split("/")[0] + " " + right, full: PERS[p] + " " + right, m: {de: PERS[p] + " " + right, tr: it.tr + ", " + PERS_TR[p], note: it.w}};
  }, {lives:3});
}
function gPlural4(){
  quiz("plural4", "Çoğul Seçmeli", wordPool("n").filter(w => w.pl), it => {
    const w = it.w, wrong = shuffle(plWrong(it, [umlaut(w) + "er", w])).slice(0, 3);
    return {top:`<div class="big">${esc(it.de)}</div><div class="mid">${esc(it.tr)} · çoğulu?</div>`, opts: shuffle([it.pl].concat(wrong)).map(x => "die " + x), right: "die " + it.pl, full: "die " + it.pl, m: {de: "die " + it.pl, tr: it.tr + " (çoğul)", note: it.de + " → die " + it.pl}};
  }, {lives:3});
}
function gArtGuess(){
  quiz("artguess", "Artikel Tahmini", wordPool("n"), it => {
    const r = ruleFor(it.w);
    return {top:`<div class="big">${esc(it.w)}</div><div class="mid">${esc(it.tr)}</div>`, opts:["der", "die", "das"], right: it.art, say: it.de, note: r ? "📏 " + esc(r) : "", full: it.de};
  }, {lives:3});
}

const ERR = {
  not_granted: "Claude'a izin verilmedi. Sayfayı yenileyip izin verirsen düzeltme açılır.",
  rate_limited: "Şu an çok istek var. Biraz sonra tekrar dene.",
  session_expired: "Oturum süresi doldu. Sayfayı yenile.",
  prompt_too_large: "Metin çok uzun. Biraz kısaltıp tekrar dene.",
};
const errText = e => ERR[e && e.code] || "Claude'a ulaşılamadı. Biraz sonra tekrar dene.";

function correctionPrompt(topic, text){
  return `Sen Atakan'ın Almanca öğretmenisin. Atakan Türk, Almanya'da yaşıyor, seviyesi A2 civarı. Hedefi sınav Almancası değil, günlük hayatta doğal konuşmak ve yazmak.
Aşağıdaki günlük yazısını düzelt.

Kurallar:
- "natural": metnin bir Almanın günlük hayatta yazacağı doğal hâli. Anlamı ve kişisel içeriği koru, gereksiz süsleme yapma, A2-B1 seviyesinde tut.
- "mistakes": gerçek hatalar (dilbilgisi, kelime seçimi, doğal olmayan ifade). Her biri için "wrong" (Atakan'ın yazdığı kısa parça), "right" (doğrusu), "rule" (Türkçe, tek kısa cümle, ezber kural değil pratik ipucu). En fazla 8 tane, en önemlileri.
- "note": Türkçe, tek cümle, samimi bir geri bildirim (neyi iyi yaptı ya da bir sonraki adım).
Sadece şu biçimde JSON döndür: {"natural":"...","mistakes":[{"wrong":"...","right":"...","rule":"..."}],"note":"..."}

Konu: ${topic}
Metin:
${text}`;
}

function renderWrite(){
  setTop("Günlük yazı", true);
  const pr = todaysPrompt(), txt = S.drafts[TODAY] || "";
  const last = allWritings().filter(w => w.date === TODAY).pop();
  $("#view").innerHTML = `
    <div class="card prompt"><div class="k">Bugünün konusu</div><div class="h">${esc(pr.tr)}</div>${pr.start ? `<div class="st">Başlangıç: ${esc(pr.start)}</div>` : ""}</div>
    <textarea class="write" id="tx" placeholder="Almanca yaz. Hata yapmaktan korkma; 5-8 cümle yeter." lang="de" spellcheck="false">${esc(txt)}</textarea>
    <div class="wc"><span id="wc"></span><span>Otomatik kaydediliyor</span></div>
    ${SAMPLE ? `<button class="cta" id="fix">Claude düzeltsin</button>` : `<button class="cta" id="send">Kopyala ve Claude'a gönder</button>`}
    ${SAMPLE ? `<button class="linkbtn" id="send">ya da kopyala</button>` : `<p class="hint">Kopyala, Claude'daki çalışma başlığına yapıştır.</p>`}
    <div id="res">${last ? fixHtml(last) : ""}</div>
    <button class="linkbtn" id="lib" style="padding:10px 8px;margin-top:2px">Eski yazılarım ve hata defterim</button>
    <div style="height:20px"></div>`;
  const tx = $("#tx");
  const wc = () => { const n = (tx.value.trim().match(/\S+/g) || []).length; $("#wc").textContent = n + " kelime"; };
  wc();
  tx.oninput = () => { S.drafts[TODAY] = tx.value; save(); wc(); };
  $("#send").onclick = () => {
    if (tx.value.trim().length < 10) { toast("Önce birkaç cümle yaz"); tx.focus(); return; }
    copy(`📝 Günlük yazı · ${trDate(TODAY)}\nKonu: ${pr.tr}\n\n${tx.value.trim()}`);
    mark("write");
  };
  if ($("#fix")) $("#fix").onclick = async () => {
    const text = tx.value.trim();
    if (text.length < 10) { toast("Önce birkaç cümle yaz"); tx.focus(); return; }
    const b = $("#fix"); b.disabled = true; b.textContent = "Claude okuyor…";
    $("#res").innerHTML = `<div class="card fixbox"><span class="thinking">Claude düzeltiyor. Bu 20-40 saniye sürebilir.</span></div>`;
    try {
      const r = await SAMPLE.json(correctionPrompt(pr.tr, text), {modelTier: "default", cache: false});
      const w = {date: TODAY, at: new Date().toISOString().slice(11, 16), title: pr.tr, mine: text,
                 natural: String(r.natural || ""), note: String(r.note || ""),
                 mistakes: (Array.isArray(r.mistakes) ? r.mistakes : []).slice(0, 8).map(m => ({wrong: String(m.wrong || ""), right: String(m.right || ""), rule: String(m.rule || "")}))};
      WRITINGS.push(w); mark("write");
      if (DB) DB.collection("writings").doc(TODAY + "-" + w.at.replace(":", "")).set(w).catch(() => toast("Hesabına kaydedilemedi"));
      renderWrite();
      $("#res").scrollIntoView({block: "start", behavior: "smooth"});
    } catch(e) {
      $("#res").innerHTML = `<div class="card fixbox"><span class="muted">${esc(errText(e))}</span></div>`;
      b.disabled = false; b.textContent = "Claude düzeltsin";
    }
  };
  document.querySelectorAll(".spk-nat").forEach(b => b.onclick = () => speak(b.dataset.t));
  $("#lib").onclick = () => { S.opt.lib = "write"; save(); go("library"); };
}

    ${w.note ? `<p class="note">${esc(w.note)}</p>` : ""}</div>`;
