irtmek için de kullan.","k9.7":"Bebek bezi değiştirmek için tek fiil; die Windel wechseln de denir.","k10.0":"geben Dativ + Akkusativ ister: mir (bana) + das Salz; mal ricayı yumuşatır.","k10.1":"Yardım teklifine 'ben hallederim' demek; schon güven verir.","k10.2":"Yer tarifi: vorne/hinten + links/rechts; ocakta 'ön sol göz' gibi.","k10.3":"Miktar ve zamanda yaklaşık: ungefähr zehn Minuten; 'etwa' da aynı anlamda.","k10.4":"übernehmen ayrılmaz fiil; birinin işini devralmayı teklif ederken kibar soru.","k10.5":"probieren 'tatmak/denemek'; du emri, mal 'bi' anlamı katar.","k10.6":"schmecken'in kısaltılmış sorusu (Schmeckt es?); yemekte ev sahibi sorar.","k10.7":"fehlen 'eksik olmak'; yemek tadarken: Da fehlt noch Salz.","k10.8":"'Gördün mü, haklıymışım' tonu; hafif ben demiştim anlamı taşır.","k10.9":"Sofra kurmak için sabit kalıp; tersi 'den Tisch abräumen'.","k11.0":"'so einen' vurgu katar; Hunger eril olduğu için einen (Akkusativ).","k11.1":"Uyarı: dikkat et! auf + Akkusativ ile 'göz kulak ol' da olur.","k11.2":"werden'in Perfekt'i (ist geworden): yemeğin sonucunu övmek için ideal.","k11.3":"Akşam eve gelen birine sorulur; geçmiş için war kullanılır.","k11.4":"İş ya da gün için 'yorucu'; Türkçe konuşanlar müde ile karıştırmasın: müde kişi içindir.","k11.5":"Keyfi kaçık kişi için; tersi 'gut gelaunt', 'Laune' ruh hali demek.","k11.6":"Kendini savunurken; tam hali 'Das ist nicht meine Schuld.'","k11.7":"Asıl önemli olanı vurgular: Hauptsache, wir sind gesund.","k11.8":"Yemek ikram edilince kabul; gern burada 'memnuniyetle' anlamında.","k12.0":"fürs = für das; çocuklara yatma saatini söylerken klasik.","k12.1":"Görevi üstlenirken; Almancada şimdiki zaman gelecek için de kullanılır.","k12.2":"Bu kalıpta nicht nesneden sonra en sona gelir: Vergiss den Schlüssel nicht!","k12.3":"'Şimdiden hazırlık' anlamı: Ich mach schon mal das Bett.","k12.4":"Alışkanlığı vurgular; cümle sonuna eklenebilir: Er ist zu spät, wie immer.","k12.5":"Ezberden bilmek için können + auswendig: Ich kann das Lied auswendig.","k12.6":"Dürüst/ters bir görüş öncesi giriş; arkasından fiil gelir: ehrlich gesagt bin ich müde.","k12.7":"Şans dileme jesti (başparmakları avuçta sıkmak); cevabı 'Ich drück dir die Daumen!'","k13.0":"Rahatlama ifadesi; dindar anlam taşımaz, herkes kullanır.","k13.1":"sich setzen dönüşlü; zu mir 'yanıma' demek (zu + Dativ).","k13.2":"nichts'ten sonra sıfat büyük harfle ve -es ile: nichts Schweres, nichts Neues.","k13.3":"anmachen ayrılabilen: an sona gider; tersi ausmachen (kapatmak).","k13.4":"gucken samimi 'bakmak'; mal 'bi' anlamı katar, dikkat çekmek için.","k13.5":"Plan değişince sorun etmediğini gösterir; rahat ve olumlu.","k13.6":"verpassen 'kaçırmak' (otobüs, film, olay); Perfekt: hab verpasst.","k13.7":"gern'in karşılaştırma hali; tercih bildirir: Ich trinke lieber Tee.","k14.0":"Çok yorgunluk için samimi; kaputt eşya için 'bozuk' anlamına da gelir.","k14.1":"Fiziksel ya da sinirsel sınıra gelince; nicht mehr = artık değil.","k14.2":"Çocukların mızmızlanması için tipik fiil: Das Kind quengelt.","k14.3":"Acıma ifadesi; erkek için der Arme, kadın/kız için die Arme.","k14.4":"Bir öneri ya da fikirden önce dikkat çekmek için giriş.","k14.5":"Samimi ve kısa; mir Dativ'dir, ton kaba kaçabilir.","k14.6":"Bağlaç olarak 'sürece', zarf olarak 'o arada'; bağlaçta fiil sona gider.","k14.7":"aufpassen auf + Akkusativ: auf das Kind aufpassen; auf ayrılır: Ich passe auf.","k14.8":"Ayrılabilen fiil: Am Sonntag schlafe ich aus; tatil sabahı için ideal.","k14.9":"Gerçekleşmeyecek bir dilek için alaycı cevap; samimi.","k14.10":"Karşıdakinin haklı olduğunu sonradan kabul ederken; wieder burada vurgu.","k15.0":"Lust auf + Akkusativ: Hast du Lust auf Pizza? Davet için samimi.","k15.1":"Hafif çekinceli evet; 'aslında evet ama…' sezdirir.","k15.2":"wohin yön bildirir (nereye), wo yer (nerede); denn merak katar.","k15.3":"lieber tercih bildirir; bir öneriyi başka bir seçenekle değiştirirken.","k15.4":"Ayrılabilen: Wir fahren um 8 los; araçla yola çıkmak için.","k15.5":"gelaunt'un karşılaştırması; tersi 'schlecht gelaunt'.","k15.6":"nichts'i güçlendirir: Ich hab gar nichts gemacht = hiçbir şey yapmadım.","k15.7":"Klingt gut'un daha coşkulu hali; plan kabul ederken.","k15.8":"'Zaten öyle olacaktı' anlamı: Ich muss sowieso einkaufen.","k16.0":"lassen 'bırakmak, karışmamak'; sie burada Akkusativ (onu).","k16.1":"Birini rahatlatırken; 'Mach dir keine Sorgen' daha uzun hali.","k16.2":"ganz 'tamamen' vurgusu katar: ganz oben = en üstte.","k16.3":"İronik; bir şey ters gidince 'harika ya' gibi, ses tonu önemli.","k16.4":"İronik; espriyi beğenmeyince söylenir, gerçek övgü değil.","k16.5":"werden ile değişim anlatılır: es wird kalt/dunkel; hava için özne es.","k16.6":"Spaß haben = eğlenmek; bir şey eğlenceliyse 'Das macht Spaß' denir, karıştırma.","k16.7":"Uyarıda 'yoksa': Zieh die Jacke an, sonst wird dir kalt; sonst'tan sonra fiil gelir.","k16.8":"Konuşmada 'olay/yaygara': Mach kein Theater! Tiyatro anlamı da var.","k17.0":"anfassen ayrılabilen: emirde an sona gider; ateşi kontrol ederken.","k17.1":"Fieber haben = ateşi olmak, Fieber messen = ateş ölçmek; artikelsiz kullanılır.","k17.2":"sehr'den biraz hafif 'epey': ziemlich warm, ziemlich müde.","k17.3":"Doktor için: einen Termin machen/vereinbaren; Termin eril, Akkusativ einen.","k17.4":"Bir öneri ya da saat uygun mu diye sorarken; resmi ortamda da uygun.","k17.5":"Schluck eril, Akkusativ'de einen; içecek tadarken: Nimm einen Schluck.","k17.6":"Hastalıkta halsizlik için; müde'den farklı, enerjisizlik anlatır.","k17.7":"Teselli kalıbı; werden burada 'düzelmek/yoluna girmek' anlamında, schon güven katar.","k17.8":"es önceki söyleneni karşılar; konuşmada 'Hoffentlich!' ya da 'Ich hoffe doch' da çok denir.","k18.0":"aussehen ayrılabilen: Er sieht aus wie sein Vater; wie ile karşılaştırma yapılır.","k18.1":"Yardım teklif ederken mantık sunar; geht's = geht es.","k18.2":"Görev isterken ya da çaresizlikte; tonla anlam değişir.","k18.3":"Ayrılabilen fiil: Ich hänge die Wäsche auf; Wäsche tekil kullanılır.","k18.4":"wegräumen ayrılabilen (weg sona); saugen = staubsaugen, süpürgeyle süpürmek.","k18.5":"Ayrılabilen: Ich bringe den Müll runter; runter = aşağı.","k18.6":"Aynılığı vurgular: Mir geht's genauso = bende de aynısı.","k18.7":"dank'tan sonra Dativ (konuşmada) ya da Genitiv gelir: dank deiner Hilfe.","k19.0":"Soruya ya da dikkat çekmeye giriş; samimi, 'Sag mal, …?'","k19.1":"wen 'kimi' Akkusativ'dir; wer kim, wem kime ile karıştırma.","k19.2":"Karşıdakine izin/onay verir; mach = 'yap hadi'.","k19.3":"ob dolaylı evet/hayır sorusu kurar; fiil sona: Frag, ob sie kommt.","k19.4":"Öğleden sonra kahve-pasta daveti için tipik Alman geleneği.","k19.5":"Almancada süre devam ediyorsa şimdiki zaman: Seit wann wohnst du hier?","k19.6":"Bir işi küçümserken retorik soru; sonra genelde zor çıkar.","k19.7":"Ekstra önlem alırken gerekçe; Türkçedeki 'ne olur ne olmaz'.","k19.8":"Kapı zili çalınca; telefon için 'Das Telefon klingelt'.","k19.9":"Yardım isterken gerekçe; die Hände voll haben sabit kalıp.","k19.10":"Misafir gelince sıcak karşılama; dass yan cümlesinde fiil sona gider.","k20.0":"Tekrarlanan sinir bozucu durum: Schon wieder Stau!","k20.1":"Eşyayı ortada bırakmak; liegen + lassen iki mastar yan yana: Lass das nicht liegen!","k20.2":"Söz verirken ciddiyet katar; önceki sözler tutulmamış imasını taşır.","k20.3":"recht haben sabit kalıp (Recht diye de yazılabilir); 'Da hast du recht' de çok sık.","k20.4":"Samimi özür; mir Dativ'dir, güçlendirmek için 'Tut mir echt leid', çok samimide 'Sorry'.","k20.5":"an + Dativ ile hängen bleiben: yükün hep birine kaldığını anlatır, sitem.","k20.6":"Kibarca itiraz etmek için; 'Das stimmt nicht' kadar sert değil.","k20.7":"Kısmi kabul: 'evet ama…' tonu, genelde arkasından aber gelir.","k20.8":"Ayrılabilen: Er denkt mit; ortak işte düşünceli olmayı anlatır.","k20.9":"Söz vermeden niyet; 's = es, tam hali 'Ich versuche es'.","k20.10":"Sinirli, gergin ruh hali için; 'genervt' de yakın anlamda.","k20.11":"Tartışmayı kapatırken ya da özrü kabul ederken; 'yeter' anlamı da olabilir.","k20.12":"Mesajlarda özne ich düşer; unterwegs = yolda.","s1.1":"Sipariş kalıbı: ich hätte gern + Akkusativ; Cappuccino eril: einen.","s1.3":"Para ya da bir şey uzatırken söylenir; bitte burada 'buyurun'.","s1.5":"mit'ten sonra Dativ: mit Karte, mit Bargeld; kasada sık sorulur.","s1.7":"Kasadan ayrılırken nazik kapanış; noch iyi dileği kalan güne yayar.","s1k0":"Kibar sipariş kalıbı; ardından Akkusativ: einen Kaffee, eine Cola.","s1k1":"Kasiyerin sorusu; cevap 'Zum Mitnehmen, bitte' ya da 'Für hier, bitte'.","s1k2":"Almanya'da bazı yerler sadece nakit alır, sormak önemli; mit + Dativ.","s1k3":"Rica ya da teşekküre rahat cevap; kafede garson da sık söyler.","s2.1":"zusammen arbeiten ile ilişkiyi anlatırsın; 'Und du?' konuşmayı devam ettirir.","s2.3":"Meslekte artikel kullanılmaz: Ich arbeite als Ingenieur; ya da Ich bin Ingenieur.","s2.5":"Türkei artikelli ülke: aus der Türkei; seit + süre, şimdiki zamanla.","s2.7":"schon burada çekinceli 'evet' sezdirir; naja ile hafif şikayet gelir.","s2k0":"İş/hayat sorusu; samimi, resmi ortamda 'Was machen Sie beruflich?'","s2k1":"Kısa şaşkınlık ya da ilgi; tonla soru olur, samimi.","s2k2":"Konuşmada 'aslında' ya da soruda 'bu arada': Was machst du eigentlich?","s2k3":"Kararsızlık veya hafif hoşnutsuzluk; cümleye giriş olarak da gelir.","s3.1":"vorhaben ayrılabilen: vor sona gider; birinin planını sorarken.","s3.3":"Saat sormak için Um wie viel Uhr? kalıbı; cevap um + saat.","s3.5":"sich ändern dönüşlü; wenn yan cümlesinde fiil sona gider.","s3k0":"Davet; zu + mastar ile: Hast du Lust, ins Kino zu gehen?","s3k1":"vorhaben ayrılabilen fiil; 'Hast du heute was vor?' de çok sık.","s3k2":"Kabul cevabı; 'Klingt super' ya da 'Klingt perfekt' da denir.","s3k3":"sich melden'in du emri; mesajlaşmada samimi kapanış.","s4.1":"deins nötr isim yerine geçer (dein Wochenende → deins); eril der Tag için 'Und deiner?' denir.","s4.3":"total ve echt samimi vurgu kelimeleri; fertig burada 'bitkin'.","s4.5":"einen = einen Kaffee, eril zamir; gern ile teklif kabul edilir.","s4k0":"İş arkadaşına samimi giriş; resmi ortamda kullanma.","s4k1":"Was ist los?'taki los; 'Bei uns ist viel los' = bizde çok iş var.","s4k2":"Yorgunluk için; fertig 'hazır' anlamına da gelir, bağlamdan anla.","s4k3":"Empati bildirir; baştaki nesne das düşmüş, tam hali 'Das kenne ich.'","s5.0":"Bahn rötarı en yaygın mazeret; mesajda özne ich düşer: Bin … da.","s5.2":"echt özrü güçlendirir; schon lange ile 'uzun zamandır mı' sorulur.","s5.4":"mit der Bahn ekiyle konuya bağlanır; Dativ: mit der.","s5k0":"Mesajda kısa 'yoldayım'; özne ich düşer.","s5k1":"Samimi özür; resmi durumda 'Entschuldigen Sie bitte'.","s5k2":"Özre rahatlatıcı cevap; samimi, 'Kein Problem' alternatifi.","s5k3":"Sinir ve hayret ifadesi; doch vurgu katar.","b1.0":"'Morgen' konuşmada 'Guten Morgen'in kısaltmasıdır; 'Schatz' eşe/sevgiliye en yaygın hitaptır.","b1.1":"Saati sormanın en yaygın yolu 'Wie spät ist es?'; eş anlamlısı 'Wie viel Uhr ist es?'.","b1.2":"'kurz nach' = biraz geçe, 'kurz vor' = az kala; örn. kurz vor acht = sekize az var.","b1.3":"'schon' burada 'şimdiden/çoktan', 'noch' ise 'hâlâ' demek; ikisini karıştırmamak önemli.","b1.4":"'heute Nacht' geçen gece için de kullanılır; 'dreimal' gibi sayı+mal = kaç kere (zweimal, viermal).","b1.5":"'hab' konuşmada 'habe'nin kısaltmasıdır; Perfekt: schlafen haben ile kurulur, ich habe geschlafen.","b1.6":"'liegen bleiben' = yatmaya devam etmek; emir kipinde bleib başa gelir, liegen sona gider.","b1.7":"'Du bist ein Schatz' biri iyilik yapınca söylenen samimi bir teşekkür kalıbıdır.","b1.8":"'wissen' düzensizdir: ich weiß, du weißt, er weiß; ich ve er/sie formunda -t eki almaz.","b1.9":"Evet/hayır sorusunda fiil başa gelir: Ist Gece schon wach? 'wach sein' = uyanık olmak.","b1.10":"'im Bett' = in dem Bett; yer bildirirken (wo?) in'den sonra Dativ gelir.","b1.11":"'Es ist vorbei mit ...' = ... faslı bitti; 'Na dann' 'eh o zaman' gibi teslimiyet tonu verir.","b1.12":"'holen' = gidip almak/getirmek; 'Bleib ruhig liegen'deki 'ruhig' çekinme, rahat ol anlamı katar.","b1.13":"'aufstehen' ayrılabilir fiildir: ich stehe auf; 'Geht schon' = idare eder, sorun değil.","b1.14":"Tek kelimelik 'Sicher?' = 'Emin misin?'; tam hali: Bist du sicher?","b1.15":"'zuerst' = önce/ilk olarak; sıralamada zuerst, dann, danach, zum Schluss kullanılır.","b1.16":"'mit' her zaman Dativ ister; sütlü = mit Milch, şekersiz = ohne Zucker (ohne Akkusativ).","b1.17":"'viel' sayılamayan isimle çekimsiz kalır: viel Milch, viel Zeit; sayılanda viele Eier.","b2.0":"'wollen' modal fiildir, asıl fiil (frühstücken) cümle sonuna gider.","b2.1":"Sorudaki 'denn' merak tonu katar ve cümleyi doğal yapar: Was haben wir denn?","b2.2":"'Oliven sind auch noch da' = zeytin de hâlâ var; 'da sein' bir şeyin mevcut olduğunu söyler.","b2.3":"'dann' başa gelince fiil ikinci sırada kalır, özne fiilden sonra gelir: Dann mach ich...","b2.4":"'ohne' Akkusativ ister ve sık sık artikelsiz kullanılır: ohne Zwiebeln, ohne Zucker.","b2.5":"'essen' düzensizdir: ich esse, du isst, sie isst; e harfi i'ye dönüşür.","b2.6":"'wollte' wollen'in Präteritum halidir; modal fiillerde geçmişte Perfekt yerine bu kullanılır.","b2.7":"Almanca bileşik isimlerle kolayca yeni kelime yapar: Brot + Phase = Brot-Phase; artikel son kelimeden gelir.","b2.8":"'aufsetzen' (Wasser/Tee) ayrılabilir fiildir; kannst gibi modalda mastar sona gider.","b2.9":"'Schon passiert' = çoktan hallettim; 'laufen' cihazlar için 'çalışmak' anlamında da kullanılır.","b2.10":"Soruda 'eigentlich' 'bu arada, aslında' anlamı katar ve konu değiştirmeyi yumuşatır.","b2.11":"'ganz oben' = en üstte; benzerleri ganz unten, ganz hinten, ganz vorne.","b2.12":"'hab ihn' = (ich) habe ihn; der Honig Akkusativde ihn olur, burada 'buldum' anlamında.","b2.13":"'mit' Dativ ister, dişi isimde iyelik -er alır: mit ihrer Puppe, mit meiner Mutter.","b2.14":"'herbringen' = buraya getirmek; 'her' konuşana doğru, 'hin' konuşandan uzağa yönü verir.","b2.15":"'Mach ich' = 'Yaparım/Tamam' anlamında çok yaygın kısa cevap; 'Es gibt' + Akkusativ = var.","b2.16":"'Na siehst du' = gördün mü işte; 'klappen' = işe yaramak, yolunda gitmek (samimi).","b3.0":"'sollen' burada 'ne giysin?' gibi öneri/karar sorar; anziehen ayrılmadan sona gider.","b3.1":"'Nimm' nehmen'in du emir halidir (e→i); 'die dicke Hose' Akkusativde dişi artikel değişmez.","b3.2":"İsim tekrar edilmeyince sıfat artikelle tek başına kalır: die blaue (Hose) = mavi olanı.","b3.3":"'in der Wäsche sein' = yıkamada/kirli sepetinde olmak; yer bildirdiği için Dativ.","b3.4":"'oben' = üstte, 'unten' = altta; kıyafette 'üstüne ne giysin' demenin kısa yolu.","b3.5":"Akkusativde eril artikel değişir: der rote Pulli → den roten Pulli.","b3.6":"Eril 'der Pulli' Akkusativde zamir olarak 'ihn' olur: Sie will ihn nicht.","b3.7":"'zeigen' kime → Dativ: Zeig ihr (ona) zwei Pullis; 'selbst' = kendisi.","b3.8":"'den mit dem Hasen' = tavşanlı olanı; artikel tek başına zamir gibi kullanılabilir.","b3.9":"'Na also!' = 'İşte bak, oldu!' beklenen sonuç gelince söylenir.","b3.10":"'Halt still!' = kıpırdama; 'Maus' çocuklara sevgi hitabıdır (Mäuschen da denir).","b3.11":"'brauchen' Akkusativ alır: Brauchst du Hilfe? Kibar alternatif: Kann ich dir helfen?","b3.12":"'doch' burada 'yok dedim ama aslında evet' anlamında fikir değiştirmeyi gösterir.","b3.13":"'gleich' = birazdan; 'fertig sein' = bitmiş/hazır olmak.","b3.14":"'Geschafft!' (schaffen'in Partizip'i) bir işi bitirince söylenen 'başardık!' ünlemidir.","b3.15":"'noch' burada 'bir de, ayrıca' anlamı katar: Und jetzt noch die Schuhe.","b3.16":"Nesne başa alınabilir, fiil yine ikinci sırada kalır: Die Schuhe hab ich vergessen.","b4.0":"'Ich muss los' = çıkmam lazım; los ile gehen fiili düşer, çok yaygın kalıptır.","b4.1":"'erst' = daha/ancak (beklenenden erken); 'doch' itiraz tonu katar: Es ist doch erst acht.","b4.2":"'halb neun' = sekiz buçuk; Almancada yarım bir sonraki saate göre söylenir, Türkçeye ters.","b4.3":"'Ach so' = 'haa, anladım'; 'der Geldbeutel' güneyde, 'das Portemonnaie' genel kullanımdır.","b4.4":"'Moment' = 'dur bi saniye'; tam hali 'Einen Moment, bitte' resmi ortamda kullanılır.","b4.5":"'auf' yer bildirirken Dativ: auf dem Tisch; 'im Flur' = in dem Flur.","b4.6":"'würde + mastar' Konjunktiv II'dir: Was würde ich ohne dich machen? = ne yapardım?","b4.7":"'Wann' zaman sorar; 'zu Hause' = evde (wo?), 'nach Hause' = eve (wohin?).","b4.8":"'So gegen sechs' = altı sularında; 'gegen' saatle 'civarı' demektir.","b4.9":"'mitbringen' ayrılabilir; modal (kannst) varken ayrılmadan sona gider.","b4.10":"'Sonst noch was?' = başka bir şey? Kasada satıcıların da sık sorduğu kalıptır.","b4.11":"'alle sein' konuşmada 'bitmek' demek: Die Windeln sind fast alle.","b4.12":"'Schreib's' = schreib es; 'am besten' = en iyisi, tavsiye vermenin pratik yolu.","b4.13":"'geben' iki nesne alır: kime Dativ, neyi Akkusativ: Gib Gece einen Kuss.","b4.14":"'arbeiten gehen' = işe gitmek; gehen + mastar kalıbı: einkaufen gehen, schwimmen gehen.","b4.15":"'bis' ile vedalaşma kalıpları: bis heute Abend, bis morgen, bis später, bis gleich.","b4.16":"'Hab dich lieb' sevgi ifadesidir, 'Ich liebe dich'ten biraz daha hafif ve aile içinde yaygın.","b4.17":"'Ich dich auch' kısa cevap: fiil tekrar edilmez ama nesne zamiri (dich) korunur.","b5.0":"'bei dir' = sende/senin tarafta; 'bei' her zaman Dativ ister: bei mir, bei euch.","b5.1":"'Und bei euch?' = ya sizde?; 'euch' ihr'in Dativ/Akkusativ halidir.","b5.2":"'vollmachen' = (bir şeyle) her yeri doldurmak/kirletmek; Perfekt: hat vollgemacht.","b5.3":"'überall' = her yerde; tek kelimelik soru olarak şaşkınlık bildirir.","b5.4":"'ja' burada 'malum, ki' anlamında bilinen bir gerçeği vurgular: wir haben ja keine Katze.","b5.5":"'was' konuşmada 'etwas'ın kısaltmasıdır; 'wenigstens' = en azından.","b5.6":"'ein bisschen' = biraz; 'jetzt' başa gelince fiil ikinci sırada kalır: Jetzt spielt sie.","b5.7":"'vom Supermarkt' = von dem; 'von' Dativ ister ve dem ile kaynaşır.","b5.8":"İsim + 'bitte' bir şey istemenin kısa yoludur: Bananen bitte; 'Und' ile kolayca madde eklenir.","b5.9":"'welcher' artikel gibi çekimlenir: der Käse → Akkusativde welchen Käse?","b5.10":"'du weißt schon' = bilirsin işte; açıklamaya gerek yok demenin samimi yolu.","b5.11":"Almanya'da beyaz peynir genelde 'Feta' ya da 'Hirtenkäse' adıyla satılır.","b5.12":"'Genau' = aynen/tam öyle; konuşmada onaylamanın en yaygın yolu.","b5.13":"'sich melden' = haber vermek/yazmak; dönüşlü fiil: ich melde mich, du meldest dich.","b5.14":"'Viel Erfolg!' = başarılar; işte olana 'kolay gelsin' demenin en yakın karşılığı.","b5.15":"Kısa mesajda 'Danke' yeter; daha sıcak alternatifler: Danke dir!, Danke schön!","b6.0":"'Lass uns ... machen' = hadi ... yapalım; mastar sona gider, 'mal' öneriyi yumuşatır.","b6.1":"'brauchen' Akkusativ alır; 'Was brauchen wir?' alışverişte en temel sorudur.","b6.2":"'alle sein' = bitmek; 'noch haben' = hâlâ var: Reis ist alle, Nudeln haben wir noch.","b6.3":"'Schreibst du oder ich?' ile kimin yapacağı sorulur; 'oder ich' kısadır, fiil tekrarlanmaz.","b6.4":"'in den Kühlschrank schauen': içine bakma yönü olduğu için in + Akkusativ.","b6.5":"'Weiter' tek başına 'devam, sonraki' demektir; 'Mach weiter!' = devam et.","b6.6":"'für' Akkusativ ister; zaman için de kullanılır: für morgen, für das Wochenende.","b6.7":"'Wie viel' sayılamayanlar için, 'Wie viele' sayılabilen çoğullar için: wie viele Eier?","b6.8":"'reichen' = yetmek; 'Das reicht!' aynı zamanda 'Yeter artık!' anlamına da gelir.","b6.9":"'das Obst' sayılamaz ve tekil kullanılır; tek bir meyve için konuşmada 'ein Stück Obst' denir.","b6.10":"'gerade' burada 'şu sıralar/şu an' anlamındadır, süregelen durumu anlatır.","b6.11":"'das Gemüse' tekil ve toplu isimdir, çoğul yapılmaz; 'Und ...?' ile kısa soru kurulur.","b6.12":"'Ach, und ...' unutulan bir şeyi eklerken kullanılan doğal bir kalıptır.","b6.13":"'Brauchen wir ...?' kalıbıyla listeye eklenecek şeyler sorulur; 'das Waschmittel' = deterjan.","b6.14":"'Warte' warten'in du emir halidir; 'ich schau mal' = bi bakayım (mal yumuşatır).","b6.15":"'Noch was?' = başka bir şey? (noch etwas'ın kısa hali).","b6.16":"'die Schokolade' tekil kullanılır; tablet için 'eine Tafel Schokolade' denir.","b6.17":"'für' Akkusativ ister ama özel isimlerde artikel olmadığı için değişiklik görünmez.","b6.18":"'für' Akkusativ ister: für mich, für dich, für uns; Dativ 'mir' burada yanlış olur.","b7.0":"Süpermarkette 'der Wagen' (Einkaufswagen) alışveriş arabasıdır; Akkusativde einen Wagen.","b7.1":"'im Wagen sitzen': yer bildirdiği için in + Dativ; 'wollen' ile sitzen sona gider.","b7.2":"'anfangen mit' = ...ile başlamak (Dativ); 'Fangen wir an' = başlayalım.","b7.3":"'im Angebot sein' = indirimde olmak; 'Schau mal' dikkat çekmenin samimi yoludur.","b7.4":"'aussehen' ayrılabilir: Sie sehen nicht so gut aus; 'nicht so' = pek değil.","b7.5":"'Stimmt' = doğru/haklısın; 'lassen' = bırakmak, almaktan vazgeçmek.","b7.6":"'bei' Dativ ister: bei Gece, bei mir; 'Bleibst du ...?' rica anlamında sorulur.","b7.7":"'Ja, klar' = tabii ki; daha vurgulu olarak 'Na klar!' de denir.","b7.8":"'Was fehlt noch?' = ne eksik kaldı?; fehlen 'eksik olmak' demek, özne eksik olan şeydir.","b7.9":"'das Waschmittel' = çamaşır deterjanı; bulaşık deterjanı ise 'das Spülmittel'.","b7.10":"'zeigen auf' = işaret etmek; 'drauf' darauf'un kısaltmasıdır, 'onun üstüne' demek.","b7.11":"'kein' isim olumsuzlar: keine Kekse; 'nicht' fiil/sıfat olumsuzlar.","b7.12":"'anfangen zu + mastar' = ...meye başlamak: Sie fängt an zu weinen.","b7.13":"'geben' kime → Dativ: ihr; neyi → Akkusativ: eine Banane.","b7.14":"'ruhig sein' = sakin olmak; 'Puh' rahatlama ünlemidir.","b7.15":"'bevor' yan cümle kurar, fiil sona gider: bevor sie wieder anfängt.","b7.16":"'zahlen' = ödemek; kasada 'Ich zahle mit Karte' ya da 'bar' (nakit) denir.","b7.17":"'einpacken' ayrılabilir: ich pack ein; 'Mist!' = hay aksi (hafif, samimi küfür).","b7.18":"'Egal' = boş ver, fark etmez; 'eine' burada 'bir tane (poşet)' yerine zamir gibi kullanılır.","b8.0":"'endlich' = sonunda (uzun bekleyişten sonra); 'zuletzt' ile karıştırmayın, o 'en son' demek.","b8.1":"Perfekt: schaffen haben ile kurulur, ge-...-t alır: Wie hast du das geschafft?","b8.2":"'vorlesen' = sesli okumak; Perfekt'te ge araya girer: vorgelesen; kime → Dativ ihr.","b8.3":"'Respekt!' takdir bildiren kısa, samimi bir ünlemdir, 'helal olsun' gibi.","b8.4":"'sei' sein'in du emir halidir: Sei leise!, Sei vorsichtig!; 'aufwachen' ayrılabilir.","b8.5":"'flüstern' = fısıldamak; karşıtı 'laut sprechen' ya da 'schreien'.","b8.6":"'wohl' soruya 'acaba' anlamı katar: Wie lange schläft sie wohl?","b8.7":"Cümle sonundaki ', oder?' Türkçedeki 'değil mi?' gibi onay ister.","b8.8":"'wenn' yan cümlesinde fiil sona gider: Wenn wir Glück haben; 'anderthalb' = bir buçuk.","b8.9":"Almanca şimdiki zaman yakın gelecek için de kullanılır: Was machen wir jetzt?","b8.10":"'erstmal' = önce bir; 'in Ruhe' = rahat rahat, kimse rahatsız etmeden.","b8.11":"'Soll ich ...?' = ...yapayım mı? diye yardım teklif etmenin en doğal yolu.","b8.12":"'sich hinlegen' dönüşlü ve ayrılabilir: ich lege mich hin; 'kurz' = kısa bir süre.","b8.13":"'aufräumen' ayrılabilir: ich räume auf; 'Mach das' = öyle yap, onaylayan cevap.","b8.14":"'Danke dir' samimi bir teşekkürdür; resmi karşılığı 'Danke Ihnen'.","b8.15":"Teşekküre cevap olarak 'Kein Problem' çok yaygın; benzerleri: Gern geschehen, Gerne, Passt schon.","b8.16":"'Was?' burada 'ne oldu?' demek; birini duymadığında kibarca 'Wie bitte?' denir.","b8.17":"'Ich glaub' sonrası dass'sız ana cümle sırası kalır: Ich glaub, sie ist wach.","b8.18":"'Das darf doch nicht wahr sein!' = olamaz, inanmıyorum; şaşkınlık ve bıkkınlık bildiren kalıp.","b9.0":"Ne pişirelim sorusu için şimdiki zaman yeterlidir: Was kochen wir heute?","b9.1":"'einfallen' Dativ ister: Mir fällt nichts ein = aklıma bir şey gelmiyor.","b9.2":"'Wie wär's mit ...?' + Dativ = ...ya ne dersin? öneri kalıbı.","b9.3":"Konuşmada baştaki 'das' düşebilir: (Das) hatten wir gestern schon; 'hatten' haben'in Präteritum'u.","b9.4":"'Und ...?' ile yeni öneri sunulur; bileşik isimde artikel son kelimeden: die Suppe → die Linsensuppe.","b9.5":"'warum nicht' = neden olmasın; 'Das geht schnell' = çabuk olur, uzun sürmez.","b9.6":"'noch' burada 'kaldı mı' anlamı katar: Haben wir noch ...? = hâlâ ... var mı?","b9.7":"'die Packung' = paket; ölçü: eine Packung Reis, eine Dose Tomaten, eine Flasche Milch.","b9.8":"'dazu' = yanına; 'ein bisschen wenig' = biraz az, kibarca eksik belirtme.","b9.9":"'können' modal fiildir, asıl fiil sona gider: Wir können noch Reis machen.","b9.10":"'Perfekt!' Almancada sık kullanılır ama gramerdeki Perfekt zamanıyla karıştırmayın.","b9.11":"Nesne vurgulanmak için başa alınabilir: Linsensuppe mag sie; 'zu scharf' = fazla acı.","b9.12":"'sich etwas drauf machen' = (yemeğin) üstüne kendine bir şey koymak; 'jeder' tekil fiil alır: jeder macht.","b9.13":"'schon mal' = 'sen bu arada başla' anlamı katar; 'wickeln' = bez değiştirmek.","b9.14":"'Mach ich' = tamam, yaparım; özne fiilden sonra gelir, 'Das mache ich' kısalmıştır.","b10.0":"'Kannst du mir mal ... geben?' masada bir şey istemenin en doğal kalıbıdır.","b10.1":"'Hier' bir şey uzatırken 'al' anlamındadır; 'Soll ich ...?' ile yardım teklif edilir.","b10.2":"'stellen' + auf + Akkusativ (nereye?): den Topf auf den Herd stellen.","b10.3":"'welche' dişi isimle: die Platte → welche Platte? (ocak gözü).","b10.4":"Yön kalıpları: vorne/hinten + links/rechts; 'vorne links' = ön sol.","b10.5":"'Wie viel' sayılamayan isimle: wie viel Wasser, wie viel Zeit.","b10.6":"'ungefähr' = aşağı yukarı; konuşmada 'etwa' veya 'so' da aynı anlamı verir.","b10.7":"'aufmachen' ayrılabilir: Mach das Fenster auf; karşıtı 'zumachen'.","b10.8":"'mir laufen die Tränen' Dativ ile kurulur; vücutla ilgili durumlar sık Dativ alır.","b10.9":"'übernehmen' ayrılmaz fiildir: ich übernehme; 'Soll ich übernehmen?' = ben devralayım mı?","b10.10":"'Gib mir mal ...' = bi ... ver; 'mal' emri yumuşatır, rica tonu katar.","b10.11":"'nicht zu viel' = fazla değil; 'zu' sıfattan önce 'fazla, aşırı' demek.","b10.12":"'Ja, ja' tekrarı hafif bıkkınlık ya da 'tamam anladım' tonu verir.","b10.13":"'Schmeckt's?' = Schmeckt es?; tadın güzelliğini sormak için en yaygın soru.","b10.14":"'fehlen' = eksik olmak; 'da fehlt noch ...' = içinde ... eksik.","b10.15":"'erst am Ende' = ancak en sonda; 'erst' burada 'daha önce değil' anlamı katar.","b10.16":"'müssen' modal fiil, asıl fiil 'kochen' sona gider: Wie lange muss das noch kochen?","b10.17":"'so' sayıdan önce 'kadar, civarı' anlamı verir: so zwanzig Minuten.","b10.18":"'den Tisch decken' = sofrayı kurmak; karşıtı 'den Tisch abräumen'.","b11.0":"Essen tek başına 'yemek' anlamında artikelsiz kullanılır: Essen ist fertig = sofra hazır çağrısı.","b11.1":"'Hunger haben' kalıbı: Türkçedeki 'acıktım' Almancada ich habe Hunger olur; hab konuşma dilinde habe'nin kısasıdır.","b11.2":"sich setzen dönüşlü fiildir: setz dich (sen), setzt euch (siz); yön bildirdiği için auf den Tisch Akkusativ.","b11.3":"'Maus' çocuklara sevgi sözcüğüdür; auf deinen Stuhl yön bildirdiği için Akkusativ (der Stuhl > deinen).","b11.4":"aufpassen ayrılabilen fiildir: Pass auf! emrinde auf sona gider; dikkat uyarısının en doğal yolu.","b11.5":"für'den sonra her zaman Akkusativ gelir: für sie (onun için), für mich, für dich.","b11.6":"geworden (werden'in Perfekt'i) 'olmuş' sonucunu vurgular: Der Kuchen ist gut geworden.","b11.7":"Konuşmada özne düşebilir: War Teamarbeit = Das war Teamarbeit; kısa, samimi bir cevap.","b11.8":"'eigentlich' soruda 'bu arada / peki' anlamı katar ve konuyu yumuşakça değiştirir.","b11.9":"'schlecht gelaunt' = keyifsiz; zıttı 'gut gelaunt'; insanların ruh hâli için çok kullanılır.","b11.10":"'Oh je' hafif üzüntü/acıma ünlemidir, 'eyvah, vah vah' gibi; samimi konuşmada çok yaygın.","b11.11":"'zu spät' = gecikmiş; 'Nicht meine Schuld' = suçum değil; 'egal' konuyu kapatmak için kullanılır.","b11.12":"'Hauptsache, ...' = 'önemli olan ...'; virgülden sonra normal cümle dizilişi gelir.","b11.13":"wie war's = wie war es; 'bei euch' = sizde/sizin tarafta, bei'den sonra Dativ gelir.","b11.14":"Perfekt: sehen ve rufen haben ile kurulur: hat gesehen, hat gerufen; 'die ganze Zeit' = sürekli.","b11.15":"'Wie süß!' = ne tatlı; 'wie' + sıfat ile ünlem kurulur: Wie schön! Wie toll!","b11.16":"Karşılaştırma: gut > besser als; 'als' ile kıyaslanır: besser als wir (bizden daha iyi).","b11.17":"'Wahrscheinlich' = muhtemelen; tek başına cevap olarak da kullanılır, cümlede genelde fiilden sonra gelir.","b11.18":"'noch' burada 'daha' anlamı verir: noch Suppe, noch ein Bier; modal fiil wollen ile soru.","b11.19":"'Gern' teklifi kabul etmenin kibar yoludur; 'noch ein bisschen' = biraz daha.","b12.0":"Saat: halb acht = yedi buçuk (sekize yarım var); Türkçedeki gibi düşünmek yaygın bir hatadır.","b12.1":"Präteritum: haben > hatte; konuşmada 'hat gehabt' yerine genelde 'hatte' denir.","b12.2":"vergessen + Akkusativ: Vergiss das nicht!; fiil adı büyük yazılır: das Zähneputzen.","b12.3":"Mastar emir gibi kullanılabilir: Zähne putzen! Aufstehen! Çocuklara verilen kısa komutlarda yaygın.","b12.4":"wegrennen ayrılabilen fiildir: sie rennt weg; weg ön eki 'uzağa, gitmek' anlamı katar.","b12.5":"Cümle Natürlich ile başlayınca fiil 2. sıraya geçer: Natürlich rennt sie weg; 'Hab dich!' = yakaladım.","b12.6":"'schon mal' = 'bu arada, şimdiden'; holen = gidip getirmek, Türklerin bringen ile karıştırdığı fiil.","b12.7":"'den' burada zamir: Den mit den Sternen = yıldızlı olanı (der Schlafanzug > Akkusativ den).","b12.8":"welch- artikel gibi çekimlenir: welches Buch (das), welcher Tag (der), welche Farbe (die).","b12.9":"'Das mit der Raupe' = tırtıllı olan; 'das mit + Dativ' bir şeyi özelliğiyle tarif etmenin pratik yolu.","b12.10":"'auswendig können/lernen' = ezbere bilmek/ezberlemek: Ich kann das Gedicht auswendig.","b12.11":"'ehrlich gesagt' = açıkçası; cümle başında veya sonunda itiraf tonu katar.","b12.12":"'jemanden lieb haben' sevgi ifadesi, aile ve çocuklar için; 'lieben'den daha yumuşak ve sık.","b12.13":"'Licht aus?' kısaltılmış sorudur (Soll ich das Licht ausmachen?); ausmachen = kapatmak, anmachen = açmak.","b12.14":"'anbleiben' = açık kalmak; 'an' cihazın/ışığın açık, 'aus' kapalı olduğunu gösterir: Das Licht ist an.","b12.15":"'Gute Nacht' yatmadan önce söylenir; akşam selamlaşmasında ise 'Guten Abend' kullanılır.","b12.16":"Fiilsiz yön ifadesi: (Wir gehen) jetzt leise raus; raus = heraus/hinaus'un konuşma dili hâli.","b12.17":"'jemandem die Daumen drücken' = şans dilemek deyimi; kişi Dativ olur: Drück mir die Daumen.","b13.0":"'Endlich' = nihayet, sonunda; tek kelimelik rahatlama ifadesi olarak çok kullanılır.","b13.1":"sich setzen zu + Dativ: setz dich zu mir = yanıma otur; zu'dan sonra hep Dativ gelir.","b13.2":"Konuşmada tek kelimelik sorular doğaldır: Serie? Kaffee? Pizza? Yükselen tonla sorulur.","b13.3":"'nichts' + sıfat büyük yazılır ve -es alır: nichts Schweres, nichts Neues, etwas Leckeres.","b13.4":"'Wie wär's mit + Dativ?' öneri kalıbı: Wie wär's mit einem Kaffee? = Bir kahveye ne dersin?","b13.5":"anmachen ayrılabilir: Machst du ... an?; cihaz/TV açmak için samimi ve en doğal fiil.","b13.6":"'Wo ist ...?' tekil, 'Wo sind ...?' çoğul için; die Fernbedienung = (TV) kumandası.","b13.7":"unter dem Kissen: yer bildirdiği (wo?) için Dativ; 'Guck mal' = bi bak, samimi.","b13.8":"'was' burada 'etwas'ın kısasıdır: was trinken = bir şey içmek; konuşma dilinde çok yaygın.","b13.9":"'noch' + haben: Haben wir noch ...? = Hâlâ ... var mı/kaldı mı?; Ein Wasser = bir şişe/bardak su.","b13.10":"'nur noch' = sadece ... kaldı; azalan miktarı anlatır: Ich habe nur noch fünf Euro.","b13.11":"'Auch gut' = o da olur; alternatifi rahatça kabul etmenin kısa ve samimi yolu.","b13.12":"Evet/hayır sorusunda fiil başa gelir: Schläfst du?; schlafen düzensiz: du schläfst, er schläft.","b13.13":"zumachen = kapatmak (ayrılabilir), Perfekt'te ge ortaya girer: zugemacht.","b13.14":"Perfekt: schlafen haben ile kurulur: du hast geschlafen (hareket fiili değil).","b13.15":"verpassen ayrılmaz ön ek (ver-) aldığı için Perfekt'te ge- almaz: verpasst; 'Echt?' = cidden mi?","b13.16":"'Lass uns ...' = hadi ... yapalım; ins Bett = in das Bett, yön bildirdiği için Akkusativ.","b13.17":"'Gute Idee' öneriye onay vermenin en kısa yolu; artikel olmadan söylenir.","b14.0":"'kaputt' insanlar için 'bitik, çok yorgun' anlamında da kullanılır, samimi konuşmada.","b14.1":"'nicht mehr' = artık değil; Ich kann nicht mehr = artık dayanamıyorum, çok kullanılan kalıp.","b14.2":"'oder?' cümle sonunda onay sorar (değil mi?); quengeln: çocuk mızmızlanması.","b14.3":"'Ich glaub' (glaube) sonrası dass'sız ana cümle dizilişi gelebilir: Ich glaub, sie kommt.","b14.4":"Sıfat isim olarak kullanılabilir: die Arme = zavallı (kadın/kız); der Arme erkek için.","b14.5":"Sıfat-isim çoğulda: die Armen; 'wir beide' = ikimiz, 'ihr beide' = ikiniz.","b14.6":"'Weißt du was?' fikir/sürpriz duyurmadan önce dikkat çeker; Ich bestell = ich bestelle.","b14.7":"'das wär super' (wäre) Konjunktiv II ile 'olsa süper olur' anlamı; dilek ve teşekkür tonu.","b14.8":"'oder' iki seçenek sunar: Pizza oder Döner? Tee oder Kaffee? Ses tonuyla soru yapılır.","b14.9":"'Mir egal' = bana fark etmez (Das ist mir egal); 'nicht müssen' = zorunda olmamak.","b14.10":"'dann' = o zaman; karar bildirir: Okay, dann Pizza. 'für dich' Akkusativ.","b14.11":"'ohne' + Akkusativ: ohne alles = sade, hiçbir şey koymadan; dönerde de kullanılır.","b14.12":"'Dauert' öznesi düşmüş: (Es) dauert vierzig Minuten; dauern = sürmek (zaman).","b14.13":"'solange' burada 'o arada' anlamında; gehen + mastar: duschen gehen, einkaufen gehen.","b14.14":"aufpassen auf + Akkusativ: ich passe auf Gece auf = Gece'ye göz kulak olmak.","b14.15":"'mir' burada 'benim için' anlamı katan Dativ'dir: Du rettest mir den Abend = akşamımı kurtarıyorsun.","b14.16":"müssen modal fiili mastarı sona iter: Wir müssen ... ausschlafen; 'mal' rica/plan tonu katar.","b14.17":"'Träum weiter!' = rüyanda görürsün; gerçekleşmez dileklere verilen esprili cevap.","b14.18":"'stimmt auch wieder' = o da doğru; karşı tarafın haklı olduğunu kabul ederken kullanılır.","b15.0":"Zaman ifadesi: am Wochenende (am = an dem); günler için de am Samstag, am Sonntag.","b15.1":"'Lust haben auf + Akkusativ' = canı çekmek: Hast du Lust auf Pizza? Lust auf einen Ausflug.","b15.2":"'denn' soruda merak/ilgi katar: Wohin denn? 'eigentlich schon' = aslında evet.","b15.3":"'wenn' yan cümlesinde fiil sona gider: wenn das Wetter gut ist; an den See = göle (Akkusativ).","b15.4":"der Wetterbericht = hava durumu raporu; 'sagen' haber/rapor için de kullanılır.","b15.5":"Hava için kısa notlar: Sonne, Regen; tam cümle: Am Samstag scheint die Sonne, am Sonntag regnet es.","b15.6":"'lieber' = tercih (gern > lieber > am liebsten); Dann lieber Samstag = o zaman cumartesi olsun.","b15.7":"losfahren ayrılabilir: Wann fahren wir los? = ne zaman yola çıkıyoruz; los = başlama, çıkış.","b15.8":"nach + Dativ: nach dem Mittagsschlaf; isimlerde iyelik -s ile: Geces Mittagsschlaf (kesme işaretsiz).","b15.9":"'ja' burada bilinen bir gerçeği hatırlatır (nasılsa); morgens = sabahları, sabah saatinde.","b15.10":"'Stimmt' = doğru; cümle 'im Auto' ile başlayınca fiil ikinci sıraya geçer: im Auto schläft sie.","b15.11":"mitnehmen ayrılabilir: Wir nehmen ein Picknick mit; yanında götürmek/almak demek.","b15.12":"Akkusativ: der Eimer > den Eimer; die Schaufel değişmez; 'ihre' = onun (kızın).","b15.13":"'Und am Sonntag?' kısa takip sorusu; 'Klar' = tabii, samimi onay.","b15.14":"'gar nichts' = hiç ama hiçbir şey; 'gar' olumsuzluğu güçlendirir: gar nicht, gar kein.","b15.15":"'Klingt gut/perfekt' = kulağa ... geliyor; Türkçedeki 'görünüyor' yerine Almanca 'klingen' kullanılır.","b15.16":"anrufen ayrılabilir ve Akkusativ alır: wir rufen deine Mutter an (Dativ değil!).","b15.17":"'sowieso' = zaten, nasılsa; 'per Video' = görüntülü; per + araç: per Mail, per Post.","b16.0":"warten'in emri: Warte! (du) / Wartet! (ihr); 'nicht so schnell' = o kadar hızlı değil.","b16.1":"'Lass sie' = bırak onu (karışma); lassen + Akkusativ zamir: lass mich, lass ihn.","b16.2":"'die' burada işaret zamiri: Die ist zu hoch = o çok yüksek; konuşmada sie yerine sık kullanılır.","b16.3":"mit + Dativ: mit ihr (onunla), mit ihm, mit mir; 'Keine Sorge' = merak etme.","b16.4":"'Hast du ...?' = sende ... var mı; Türkçedeki 'sende mi' için Almancada haben kullanılır.","b16.5":"in der Tasche: konum (wo?) bildirdiği için Dativ; 'ganz unten' = en altta.","b16.6":"'Na toll' ironiktir, aslında 'harika ya, bir bu eksikti' anlamında hoşnutsuzluk bildirir.","b16.7":"'doch' burada itirazı yumuşatır: Ist doch normal = canım, normal bu; 'Spaß' = şaka.","b16.8":"'Sehr witzig' çoğu zaman ironiktir: 'çok komik(!)'; ses tonuna dikkat.","b16.9":"'Schau mal' = bir bak(sana); dikkat çekmek için; schaukeln = salıncakta sallanmak.","b16.10":"anschubsen ayrılabilir: ich schubs sie an; 'ja?' cümle sonunda 'tamam mı?' anlamı verir.","b16.11":"Karşılaştırma: hoch > höher (umlaut alır); wollen modali mastarsız da kullanılabilir.","b16.12":"'nur ein bisschen' = sadece biraz; sınır koyarken veya isteği küçültürken çok kullanılır.","b16.13":"'Es wird kalt' = hava soğuyor; werden 'olmak, dönüşmek' değişimi anlatır.","b16.14":"'Spaß haben' = eğlenmek: Sie hat Spaß; 'Viel Spaß!' = iyi eğlenceler.","b16.15":"'sonst' = yoksa; sonrasında fiil hemen gelir: sonst wird sie müde (devrik dizilim).","b16.16":"'es gibt' = var; gibt's = gibt es; 'Theater' burada mecazen 'olay, ağlama-zırlama' demek.","b16.17":"'Wie immer' = her zamanki gibi; kısa ve hazır bir cevap kalıbı.","b17.0":"anfassen ayrılabilir: fass ... an; 'mal' emri yumuşatır: Fass mal an = bi dokun.","b17.1":"'Fieber haben' = ateşi olmak; Türkçedeki 'var' yerine haben kullanılır.","b17.2":"Ich mess mal = ich messe mal; 38,7 okunuşu: achtunddreißig Komma sieben.","b17.3":"'ziemlich' = epey, oldukça; sıfatı güçlendirir: ziemlich teuer, ziemlich gut.","b17.4":"'kein' isimleri olumsuzlar: keinen Appetit (der Appetit, Akkusativ > keinen).","b17.5":"sollen ile öneri sorusu: Sollen wir ...? = ... yapalım mı?; gehen fiili düşmüş (zum Arzt gehen).","b17.6":"fragen nach + Dativ: nach einem Termin fragen = randevu sormak; anrufen ayrılabilir.","b17.7":"können mastarı sona iter: Ich kann ... zur Arbeit gehen; zur = zu der (Dativ).","b17.8":"'Geht das?' = mümkün mü, olur mu?; Das geht / Das geht nicht günlük konuşmada çok yaygın.","b17.9":"schreiben + Dativ kişi: meinem Chef schreiben; der Chef > Dativ'de meinem.","b17.10":"Saat: um zehn = saat onda; zaman noktası için 'um' kullanılır.","b17.11":"die Krankenkassenkarte = sağlık sigortası kartı; doktora giderken mutlaka sorulur.","b17.12":"'die' zamir olarak kartı işaret eder; in meinem Portemonnaie: konum, Dativ (das > meinem).","b17.13":"geben iki nesne alır: ihr (Dativ, kime) + was zu trinken (Akkusativ, ne).","b17.14":"müssen + mastar sonda: Sie muss viel trinken; 'viel trinken' = bol sıvı almak.","b17.15":"'einen Schluck' = bir yudum (der Schluck > Akkusativ einen); 'Ganz toll' çocuğu övmek için.","b17.16":"'schlapp' = halsiz, takatsiz; hastalık anlatırken müde'den daha güçlü bir kelime.","b17.17":"'Das wird schon wieder' = geçer, düzelir; teselli için kalıp; gesund werden = iyileşmek.","b17.18":"'Ich hoffe es' = umarım; kısaca 'Hoffentlich' ya da konuşmada 'Ich hoff's' de denir.","b18.0":"'aussehen wie' = gibi görünmek; ayrılabilir: sieht ... aus; nach + Dativ: nach einer Party.","b18.1":"'überall' = her yer(de); das Spielzeug tekil ama toplu 'oyuncaklar' anlamında kullanılır.","b18.2":"aufräumen = toplamak, düzenlemek (ayrılabilir); geht's = geht es: daha hızlı olur.","b18.3":"sollen ile görev sorma: Was soll ich machen? = Ne yapmamı istersin?","b18.4":"'Kannst du ...?' kibar rica; aufhängen ayrılabilir ama modal fiille birlikte bitişik ve sonda kalır.","b18.5":"'Mach ich' = (Das) mache ich; isteği kabul etmenin kısa, doğal yolu.","b18.6":"wegräumen ve saugen: 'Staub saugen' süpürmek demek; 'dann' sıralama için kullanılır.","b18.7":"Çoğul soru: Wo sind ...? (sind, çünkü die Wäscheklammern çoğul).","b18.8":"neben + Dativ (konum): neben dem Wäscheständer; im = in dem.","b18.9":"runterbringen ayrılabilir: bringt den Müll runter; runter = aşağıya (herunter).","b18.10":"Perfekt: machen haben ile: ich hab's gemacht; hab's = habe es.","b18.11":"'Fair' Almancada da 'adil, haklı' anlamında yaygın; 'Okay, okay' isteksiz kabulü gösterir.","b18.12":"Almanya'da çöp ayrımı: das Altpapier = atık kâğıt (çoğu yerde mavi kutu), genel çöp ise der Restmüll.","b18.13":"'..., oder?' onay sorusu; voll = dolu, zıttı leer.","b18.14":"'Total' konuşmada 'tamamen, bayağı' anlamında güçlendirici; die ganzen = bütün o ...","b18.15":"brauchen + Akkusativ: eine Pause brauchen; nach dem Aufräumen: mastar isim yapılıp Dativ alır.","b18.16":"'genauso' = aynen böyle; 'in einer Stunde' = bir saat sonra (gelecek), vor einer Stunde = bir saat önce.","b18.17":"'dank' + Dativ (veya Genitiv) = sayesinde; çoğu zaman esprili/ironik kullanılır.","b18.18":"'Genau' = aynen, tam olarak; onaylamak için Almanların en sık kullandığı kelimelerden.","b19.0":"'Sag mal' = baksana, konu açmak için; einladen ayrılabilir ama modal fiille sonda bitişik kalır.","b19.1":"'Wen' wer'in Akkusativ hâli: Wen einladen? = kimi?; Dativ hâli 'wem'.","b19.2":"mit + Dativ: mit ihrem Sohn (der Sohn > ihrem); ihr = onların.","b19.3":"gern + fiil = severek yapmak: Sie spielt gern; mit ihm (er > Dativ ihm).","b19.4":"'Soll ich ...?' yardım önerme kalıbı: Soll ich helfen? = Yardım edeyim mi?; schreiben + Dativ.","b19.5":"'ob' (-ip -mediği) yan cümlede fiil sona gider: ob sie zum Kaffee kommen; 'so um drei' = üç gibi.","b19.6":"Perfekt: antworten haben ile: er hat geantwortet; 'kommen gern' = seve seve gelirler.","b19.7":"'Was machen wir zu essen?' = yemek olarak ne yapalım; zu + mastar yemek/içecek sorarken.","b19.8":"backen = fırında pişirmek (kek, ekmek); Türkçedeki 'kek yapmak' için Almanca backen kullanılır.","b19.9":"'Seit wann?' = ne zamandan beri; seit ile Almanca şimdiki zaman kullanılır: seit wann backst du.","b19.10":"'Wie schwer kann das sein?' retorik soru; können mastarı (sein) sona iter.","b19.11":"'Sicher ist sicher' = garanti olsun deyimi; lieber = tercihen, iyisi mi.","b19.12":"beim Bäcker = bei dem Bäcker (Dativ): fırından; dükkânlar için bei kullanılır: beim Metzger.","b19.13":"'Perfekt' sıfat olarak 'harika, mükemmel' demek; zaman adı olan Perfekt ile karıştırmayın.","b19.14":"'Es klingelt' = kapı/zil çalıyor; özne 'es' kişisizdir; 'Sie sind da' = geldiler.","b19.15":"aufmachen ayrılabilir: Machst du auf?; 'die Hände voll haben' = elleri dolu olmak.","b19.16":"'Kommt rein!' ihr emri (birden çok kişiye); 'Schön, dass ihr da seid': dass ile fiil sonda.","b20.0":"liegen lassen = (yerde) bırakmak; Perfekt'te genelde iki mastarla kurulur: hast ... liegen lassen.","b20.1":"wegräumen ayrılabilir; gelecek için şimdiki zaman + gleich yeterli: ich räum sie gleich weg.","b20.2":"'Das sagst du immer' sitem kalıbı; Das ile başlayınca fiil (sagst) 2. sırada.","b20.3":"'diesmal' = bu sefer; 'wirklich' vurgu için; söz verirken sık kullanılır.","b20.4":"'..., weißt du' cümle sonunda vurgu/sitem katar: 'biliyorsun değil mi'.","b20.5":"'recht haben' = haklı olmak (küçük harfle recht); 'Tut mir leid' = özür dilerim.","b20.6":"'an jemandem hängen bleiben' = birinin üstüne kalmak; Alles bleibt an mir hängen = her şey bana kalıyor.","b20.7":"'doch' burada itiraz bildirir: Ich mach doch auch viel = ama ben de çok şey yapıyorum.","b20.8":"Nesne başa gelince fiil 2. sırada kalır: Die kleinen Sachen vergisst du; 'Ja, schon' = evet ama.","b20.9":"können mastarı sona iter: Was kann ich besser machen? Yapıcı cevap için iyi bir kalıp.","b20.10":"mitdenken = düşünerek katkı vermek, inisiyatif almak; Almancaya özgü, Türkçede tam karşılığı yok.","b20.11":"'Ich versuch's' = ich versuche es; es'in kısaltması 's olarak fiile eklenir.","b20.12":"Präteritum: sein > war; ich war gereizt = gergindim; 'gerade' burada 'az önce' anlamında.","b20.13":"'Schon gut' = önemli değil, tamam; özrü kabul ederken kullanılan samimi kalıp.","b20.14":"'her' konuşana doğru yönü gösterir: Komm her! = buraya gel; 'hin' ise uzaklaşmayı.","b20.15":"'Wollen wir ...?' = ... yapalım mı?; öneri kalıbı, wollen mastarı (trinken) sona iter.","b20.16":"'erst' = önce: Aber erst die Socken = ama önce çoraplar; erst ... dann ... sıralaması.","b20.17":"'Bin schon unterwegs' = yoldayım/geliyorum; ich düşmüş, samimi konuşmada yaygın."};
const L1PH = [{"id":"L1-001","de":"Ich weiß nicht.","tr":"Bilmiyorum.","ex":"Ich weiß nicht, ob Nisa heute Zeit hat.","note":"Her yerde, herkesle; çok sık kullanılır.","cat":"Tepki"},{"id":"L1-002","de":"Ach so.","tr":"Haa, öyle mi / anladım.","ex":"Ach so, der Laden hat heute zu.","note":"Yeni bir bilgiyi anlayınca söylenir.","cat":"Tepki"},{"id":"L1-003","de":"Danke schön!","tr":"Çok teşekkürler!","ex":"Danke schön, das ist echt lieb von Ihnen.","note":"Her ortamda; biraz daha sıcak bir teşekkür.","cat":"Tepki"},{"id":"L1-004","de":"Bitte schön.","tr":"Buyurun / rica ederim.","ex":"Bitte schön, Ihr Kaffee.","note":"Bir şey uzatırken ya da teşekküre cevap.","cat":"Tepki"},{"id":"L1-005","de":"Na klar.","tr":"Tabii ki / elbette.","ex":"Na klar helfe ich dir beim Umzug.","note":"Samimi; isteğe içten 'evet' demek.","cat":"Tepki"},{"id":"L1-006","de":"Was ist los?","tr":"Ne oldu? / Ne var?","ex":"Gece weint so – was ist los?","note":"Bir terslik sezince sorulur.","cat":"Sohbet"},{"id":"L1-007","de":"Wie geht's?","tr":"Nasılsın?","ex":"Hallo Herr Weber, wie geht's Ihnen?","note":"Selamlaşmada; samimi ya da yarı resmi.","cat":"Sohbet"},{"id":"L1-008","de":"Tut mir leid.","tr":"Özür dilerim / üzgünüm.","ex":"Tut mir leid, ich hab dich nicht gesehen.","note":"Özür ya da kötü bir habere üzüntü ('Das tut mir leid.'); her ortamda. Başsağlığı için 'Mein Beileid.' denir.","cat":"Duygu"},{"id":"L1-009","de":"Entschuldigung, …","tr":"Pardon, … / Affedersiniz, …","ex":"Entschuldigung, wo sind hier die Windeln?","note":"Yabancıya hitap ederken ya da yol isterken.","cat":"Rica"},{"id":"L1-010","de":"Moment mal.","tr":"Bir dakika / dur bakalım.","ex":"Moment mal, das stimmt doch nicht.","note":"Araya girerken ya da itiraz ederken.","cat":"Tepki"},{"id":"L1-011","de":"Ich weiß.","tr":"Biliyorum.","ex":"Ich weiß, ich bin spät dran.","note":"Karşıdakinin söylediğini zaten bildiğinde.","cat":"Tepki"},{"id":"L1-012","de":"Stimmt.","tr":"Doğru.","ex":"Stimmt, morgen ist ja Feiertag.","note ch!","tr":"Acele et!","ex":"Beeil dich, der Bus kommt!","note":"Samimi; emir tonunda.","cat":"Zaman & plan"},{"id":"L1-131","de":"Lass dir Zeit.","tr":"Acele etme.","ex":"Kein Stress, lass dir Zeit.","note":"Birini rahatlatırken.","cat":"Zaman & plan"},{"id":"L1-132","de":"Ich bin spät dran.","tr":"Geç kalıyorum / geciktim.","ex":"Ich bin spät dran, mein Zug hat Verspätung. Fangt schon mal an!","note":"Gecikme haberi; mesajda da.","cat":"Zaman & plan"},{"id":"L1-133","de":"Wie spät ist es?","tr":"Saat kaç?","ex":"Wie spät ist es? Muss Gece schon ins Bett?","note":"Saati sorarken; 'Wie viel Uhr ist es?' de çok yaygın.","cat":"Zaman & plan"},{"id":"L1-134","de":"Wie lange dauert das?","tr":"Ne kadar sürer?","ex":"Wie lange dauert das ungefähr?","note":"Tamirde, doktorda, sırada.","cat":"Zaman & plan"},{"id":"L1-135","de":"Wie war dein Wochenende?","tr":"Hafta sonun nasıldı?","ex":"Morgen! Wie war dein Wochenende?","note":"Pazartesi iş yerinde klasik soru.","cat":"İş"},{"id":"L1-136","de":"Ich bin heute im Homeoffice.","tr":"Bugün evden çalışıyorum.","ex":"Ich bin heute im Homeoffice, schreib mir einfach.","note":"Mesajda, toplantıda.","cat":"İş"},{"id":"L1-137","de":"Ich bin krankgeschrieben.","tr":"Raporluyum.","ex":"Ich bin bis Freitag krankgeschrieben.","note":"İşe hastalık bildirirken.","cat":"İş"},{"id":"L1-138","de":"Ich hab gleich 'nen Termin.","tr":"Birazdan bir randevum / toplantım var.","ex":"Lass uns später reden, ich hab gleich 'nen Termin.","note":"Konuşmayı kibarca kısaltırken.","cat":"İş"},{"id":"L1-139","de":"Können wir das verschieben?","tr":"Bunu erteleyebilir miyiz?","ex":"Können wir das auf nächste Woche verschieben?","note":"Randevu, toplantı; resmi: 'Können wir den Termin …'.","cat":"Telefon & randevu"},{"id":"L1-140","de":"Lange nicht gesehen!","tr":"Görüşmeyeli uzun zaman oldu!","ex":"Hey, lange nicht gesehen! Wie geht's?","note":"Eski tanıdığa rastlayınca.","cat":"Sohbet"},{"id":"L1-141","de":"Komm rein!","tr":"Gel içeri!","ex":"Hallo, komm re const IV = [0, 1, 2, 4, 8, 16, 35, 75, 160];

function todaysPhrases(){

const readChapters = () => { const r = Object.keys(S.book.read || {}).map(Number); return r.length ? r : [1]; };

  if (src === "bk" || src === "bl") { const rc = readChapters(); return ITEMS.filter(i => i.src === src && rc.includes(i.ch)); }

  if (src === "due") return dueItems();

  if (src === "ms") return missItems();

}
const dueItems = () => ITEMS.filter(isDue).sort((a, b) => S.prog[a.id].due.localeCompare(S.prog[b.id].due) || S.prog[a.id].b - S.prog[b.id].b);

function newItems(){
  const out = ITEMS.filter(i => i.src === "my" && !S.prog[i.id]).concat(todaysPhrases().filter(p => !S.prog[p.id]));
  const rc = readChapters();
  const extra = ITEMS.filter(i => i.src === "bk" && rc.includes(i.ch) && !S.prog[i.id]);
  const room = Math.max(0, S.opt.pace - (dayRec().newSeen || 0));
  const wroom = Math.max(0, S.opt.wpace - (dayRec().newW || 0));
  const ws = WORDS().filter(w => !S.prog[w.id]).sort((a, b) => a.o - b.o).slice(0, wroom);

function speak(text, who, onend, opt){

/* ---------- metin karşılaştırma ---------- */
const norm = s => s.toLowerCase().replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/[.,!?¿¡;:"“„”'’()–\-…\/]/g," ").replace(/\s+/g," ").trim();
function similar(a, b){
  a = norm(a); b = norm(b);
  if (!a || !b) return 0;
  const m = a.length, n = b.length, dp = Array.from({length:m+1}, (_, i) => [i]);
  for (let j = 1; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return 1 - dp[m][n] / Math.max(m, n);
}

function bestVariant(it, said){
  const vars = it.de.split(" / ").flatMap(v => [v, v.replace(/\([^)]*\)/g, "")]).map(v => v.replace(/…/g, ""));
  return Math.max(...vars.map(v => similar(v, said)));
}
// alıştırmalar için tek, sade biçim: ilk varyant, parantez ve üç nokta yok
const plain = it => it.de.split(" / ")[0].replace(/\([^)]*\)/g, "").replace(/…/g, "").replace(/\s+/g, " ").trim();
const words = it => plain(it).split(" ").filter(Boolean);
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = a => a[Math.random() * a.length | 0];
// yanlış şıklar: önce aynı türden, uzunluğu benzer olanlar
function distractors(it, n, key){
  key = key || "de";
  const seenV = new Set([norm(it[key])]);
  const cand = shuffle(ITEMS.filter(x => x.id !== it.id)).sort((a, b) => (a.src !== it.src) - (b.src !== it.src) || Math.abs(a[key].length - it[key].length) - Math.abs(b[key].length - it[key].length));
  const out = [];
  for (const x of cand.slice(0, 40).sort(() => Math.random() - .5).concat(cand.slice(40))) {
    const v = norm(x[key]); if (seenV.has(v)) continue; seenV.add(v); out.push(x); if (out.length >= n) break;
  }
  return out;
}

let tab = "today", screen = null, onLeave = null;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2300); }
function setTop(title, back){
  $("#title").textContent = title;
  $("#back").hidden = !back;
  // sekme başlığında küçük Gedsche, her sekmede başka kostümle
  const tb = $("#tbat"), tc = !back && typeof bat === "function" && {Pratik:"grad", Oyun:"party", Dinle:"phones", Kitaplık:"glasses"}[title];
  if (tb) { tb.hidden = !tc; tb.innerHTML = tc ? bat("happy", 36, tc) : ""; tb.onclick = () => { tb.classList.remove("hop"); void tb.offsetWidth; tb.classList.add("hop"); if (typeof sfx === "function") sfx("tap"); }; }
  document.body.classList.toggle("full", !!back);
  const n = streak(); const st = $("#streak");
  st.innerHTML = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICO.flame}</svg>${n}`; st.classList.toggle("on", n > 0);
  if (typeof paintXP === "function") paintXP();
}
function copy(text, msg){
  const done = () => toast(msg || "Kopyalandı. Claude'a yapıştır.");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback(){ const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); done(); } catch(e) { toast("Kopyalanamadı"); } t.remove(); }
}

const TABS = {};
function leave(){ stopSpeak(); if (onLeave) { const f = onLeave; onLeave = null; f(); } }
function go(t){
  leave(); screen = null; tab = t; document.body.classList.remove("game", "sess", "rs-open"); $("#view").classList.remove("kbv");
  $$(".nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  TABS[t]();
  window.scrollTo(0, 0);
}
function open(fn){ leave(); screen = fn; document.body.classList.remove("sess", "rs-open"); fn(); window.scrollTo(0, 0); }
$("#back").onclick = () => go(tab);
$$(".nav button").forEach(b => b.onclick = () => go(b.dataset.tab));

function endCard(icon, title, sub, btn, fn){
  const n = streak();
  resultScreen({icon, title, sub, btn: btn || "Tamam", fn, top: $("#title").textContent, stats: n ? [["flame", n + " gün", "seri"]] : []});
}

// Gedsche — uygulamanın maskotu, sevimli bir yarasa (Fledermaus).
// bat(mood, size, cos): cos = kostüm (flag, party, grad, phones, glasses, crown).
// bat(mood, size) satır içi SVG döndürür. defs/id/text yok: aynı sayfada çok kopya sorun olmaz.
const BAT_COS = ["flag", "party", "grad", "phones", "glasses", "crown"];
const BAT_MOODS = ["happy", "cheer", "think", "sad", "sleep", "wave", "wow"];

function bat(mood, size, cos) {
  mood = BAT_MOODS.indexOf(mood) >= 0 ? mood : "happy";
  size = size || 96;
  const C = {
    body: "#7C5CFF", shade: "#5B3FD9", deep: "#4A2FC2", belly: "#C9B8FF", hi: "#9A80FF",
    cheek: "#FF8FB1", ear: "#FFB3CB", ink: "#1F1A4D", white: "#FFFFFF",
    scarf: "#3654F4", scarfD: "#2440C9", gold: "#FFC93C", moon: "#FFD66B", tongue: "#FF6F9C"
  };
  const P = (d, f, x) => '<path d="' + d + '" fill="' + f + '"' + (x || "") + "/>";
  const S = (d, c, w) => '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round"/>';
  const E = (cx, cy, rx, ry, f) => '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + f + '"/>';
  const O = (cx, cy, r, f) => '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + f + '"/>';
  const G = (t, inner) => '<g transform="' + t + '">' + inner + "</g>";
  const star = (x, y, r, f) => P("M" + x + "," + (y - r) + "Q" + x + "," + y + " " + (x + r) + "," + y + "Q" + x + "," + y + " " + x + "," + (y + r) +
    "Q" + x + "," + y + " " + (x - r) + "," + y + "Q" + x + "," + y + " " + x + "," + (y - r) + "Z", f);

  // Kanat: omuz (0,0) noktasında, sola uzanır; alt kenar tırtıklı.
  const wingShape =
    P("M4,-7C-6,-17 -22,-23 -34,-18Q-37,-16 -35,-12Q-30,-3 -31,8Q-24,2 -18,11Q-12,5 -5,13Q-1,6 5,5Z", C.shade) +
    S("M2,-4L-31,-14M0,-2L-28,4M1,0L-17,8M2,2L-6,10", C.body, 2.2) +
    O(-33, -16, 2.6, C.shade);
  const leftWing = (deg) => G("translate(40,80) rotate(" + deg + ") scale(0.94)", wingShape);
  const rightWing = (deg) => G("translate(120,0) scale(-1,1)", leftWing(deg));

  // Kulak: taban ortası (bx,by) etrafında döner.
  const earL = (deg) => G("rotate(" + deg + " 40 34)",
    P("M27,44Q21,22 26,9Q29,4 34,8Q46,18 55,30Z", C.body) +
    P("M31,38Q27,24 29,15Q31,12 34,15Q42,22 48,30Z", C.ear));
  const earR = (deg) => G("translate(120,0) scale(-1,1)", earL(deg));

  const sad = mood === "sad", sleep = mood === "sleep";
  let back = "", front = "", extra = "";

  // Kanat pozisyonları
  const wings = {
    happy: [-30, -30], cheer: [24, 24], think: [-30, null], sad: [-46, -46],
    sleep: [-38, -38], wave: [-30, null], wow: [6, 6]
  }[mood];
  back += '<g class="bwl">' + leftWing(wings[0]) + "</g>";
  if (wings[1] !== null) back += '<g class="bwr">' + rightWing(wings[1]) + "</g>";
  if (mood === "wave") {
    back += G("translate(120,0) scale(-1,1)", G("translate(34,78) rotate(26) scale(0.95)", wingShape));
    extra += S("M114,46Q118,38 116,30", C.gold, 3) + S("M112,22Q109,15 102,13", C.gold, 3);
  }
  if (mood === "think") {
    // sağ kanat çeneye
    front += G("translate(120,0) scale(-1,1)", G("translate(34,92) rotate(115) scale(0.68)", wingShape));
  }

  // Kulaklar
  const ed = sad ? 26 : mood === "wow" ? -6 : 0;
  if (!sleep) back += earL(-ed) + earR(-ed);

  // Gövde + baş
  let body =
    E(49, 110, 7, 4, C.deep) + E(71, 110, 7, 4, C.deep) +
    E(60, 88, 26, 22, C.body) +
    E(60, 92, 16, 14, C.belly) +
    P("M52,86Q54,89 56,86M58,92Q60,95 62,92M64,86Q66,89 68,86", "none", ' stroke="' + C.hi + '" stroke-width="2" stroke-linecap="round"') +
    E(60, 54, 36, 32, C.body) +
    P("M32,40Q40,26 56,24Q44,30 38,42Z", C.hi);
  // Atkı
  body += P("M34,76Q60,88 86,76Q88,82 84,85Q60,95 36,85Q32,82 34,76Z", C.scarf) +
    P("M72,84Q80,86 82,98Q78,101 74,99Q74,90 68,86Z", C.scarfD) +
    P("M36,82Q60,92 84,82", "none", ' stroke="' + C.scarfD + '" stroke-width="1.6"');

  // Yüz
  let face = E(33, 66, 6.5, 4.2, C.cheek) + E(87, 66, 6.5, 4.2, C.cheek);
  const eye = (cx, cy, rx, ry, px, py, pr) =>
    E(cx, cy, rx, ry, C.white) + O(cx + px, cy + py, pr, C.ink) +
    O(cx + px + pr * 0.38, cy + py - pr * 0.42, pr * 0.38, C.white) + O(cx + px - pr * 0.35, cy + py + pr * 0.4, pr * 0.17, C.white);
  const fangs = (y) => P("M53.5," + y + "l2.4,4.2l2.4,-4.2Z", C.white) + P("M61.7," + y + "l2.4,4.2l2.4,-4.2Z", C.white);
  const closedHappy = (cx, cy) => S("M" + (cx - 7) + "," + (cy + 3) + "Q" + cx + "," + (cy - 7) + " " + (cx + 7) + "," + (cy + 3), C.ink, 3.6);
  const closedSleep = (cx, cy) => S("M" + (cx - 7) + "," + cy + "Q" + cx + "," + (cy + 6) + " " + (cx + 7) + "," + cy, C.ink, 3.4);

  if (mood === "happy") {
    face += '<g class="beye">' + eye(46, 52, 10.5, 12, 0.5, 1.5, 7) + eye(74, 52, 10.5, 12, -0.5, 1.5, 7) + "</g>";
    face += P("M51,67Q60,77 69,67Q60,70.5 51,67Z", C.ink, ' stroke="' + C.ink + '" stroke-width="2" stroke-linejoin="round"') + fangs(68.4);
  } else if (mood === "wave") {
    face += '<g class="beye">' + eye(46, 52, 10.5, 12, 1.5, 1, 7) + eye(74, 52, 10.5, 12, 1.5, 1, 7) + "</g>";
    face += P("M50,66Q60,79 70,66Q60,70 50,66Z", C.ink, ' stroke="' + C.ink + '" stroke-width="2" stroke-linejoin="round"') + fangs(67.6);
  } else if (mood === "cheer") {
    face += closedHappy(46, 53) + closedHappy(74, 53);
    face += P("M48,64Q60,63 72,64Q71,80 60,80Q49,80 48,64Z", C.ink) +
      P("M53,75Q60,70 67,75Q64,79.5 60,79.5Q56,79.5 53,75Z", C.tongue) + fangs(64.2);
    extra += star(16, 22, 6, C.gold) + star(104, 20, 5, C.gold) + star(10, 44, 3.5, C.gold) + star(110, 42, 3.5, C.gold);
  } else if (mood === "think") {
    face += '<g class="beye">' + eye(46, 51, 10.5, 12, 3, -4, 6.5) + eye(74, 51, 10.5, 12, 3, -4, 6.5) + "</g>";
    face += S("M38,36Q45,33 52,36", C.deep, 3) + S("M68,34Q75,30 82,33", C.deep, 3);
    face += S("M53,70Q58,68 66,69", C.ink, 3.2);
    extra += O(100, 30, 3, C.belly) + O(107, 20, 4.2, C.belly) + O(113, 8, 5.4, C.belly);
  } else if (mood === "sad") {
    face += '<g class="beye">' + eye(46, 53, 10.5, 11.5, 0, 3, 7) + eye(74, 53, 10.5, 11.5, 0, 3, 7) + "</g>";
    face += S("M38,40Q45,35 52,35", C.deep, 3) +
      S("M68,35Q75,35 82,40", C.deep, 3);
    face += S("M53,72Q60,67 67,72", C.ink, 3.2);
  } else if (mood === "sleep") {
    face += closedSleep(46, 54) + closedSleep(74, 54);
    face += S("M56,69Q60,72 64,69", C.ink, 3);
    // gece takkesi
    extra += P("M30,36Q58,16 88,34Q86,18 72,10Q56,2 36,10Q22,18 20,38Q24,40 30,36Z", C.scarf) +
      P("M28,37Q58,17 90,35Q92,40 88,42Q58,24 30,44Q25,42 28,37Z", C.white) +
      P("M36,10Q22,18 20,38", "none", ' stroke="' + C.scarfD + '" stroke-width="2"') +
      O(20, 40, 5.5, C.white);
    // ay ve zzz
    extra += P("M106,3A11,11 0 1 0 116,20A8.5,8.5 0 1 1 106,3Z", C.moon);
    extra += S("M92,46h7l-7,8h7", C.belly, 2.6) + S("M101,58h5l-5,6h5", C.belly, 2.2);
  } else if (mood === "wow") {
    face += '<g class="beye">' + eye(46, 51, 12, 13.5, 0, 0, 5) + eye(74, 51, 12, 13.5, 0, 0, 5) + "</g>";
    face += S("M37,33Q45,28 53,32", C.deep, 3) + S("M67,32Q75,28 83,33", C.deep, 3);
    face += E(60, 72, 5.5, 6.5, C.ink) + E(60, 74.5, 3.5, 2.6, C.tongue);
    extra += S("M14,30l7,5M10,48h8M18,14l5,7M106,30l-7,5M110,48h-8M102,14l-5,7", C.gold, 3);
    extra += star(14, 66, 4, C.gold) + star(106, 66, 4, C.gold);
  }

  // Kostümler
  let vb = "0 0 120 120", costume = "", under = "";
  const R = (x, y, w, h, f, rx) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 0) + '" fill="' + f + '"/>';
  if (cos === "flag") {
    vb = "-2 -16 160 138";
    // sağ kanat bayrak direğini tutar
    under += R(110, -8, 4.5, 114, "#8A5A2B", 2.2) + O(112.2, -9, 4.6, C.gold);
    costume += '<g class="bflag">' +
      P("M114,-4Q133,-10 156,-3L156,9Q133,2 114,8Z", "#1F1A1A") +
      P("M114,8Q133,2 156,9L156,21Q133,14 114,20Z", "#E8232A") +
      P("M114,20Q133,14 156,21L156,33Q133,26 114,32Z", "#FFCE00") + "</g>";
    costume += G("translate(120,0) scale(-1,1)", G("translate(30,74) rotate(58) scale(0.78)", wingShape));
  } else if (cos === "party") {
    vb = "0 -22 120 142";
    costume += G("rotate(-12 60 20)", P("M44,26L62,-12L80,26Q62,32 44,26Z", "#FF5DA2") +
      S("M50,14L70,20M55,2L68,6", C.gold, 3.2) + O(62, -13, 5, C.gold) + P("M44,26Q62,32 80,26", "none", ' stroke="#D63C80" stroke-width="2.4"'));

/* ---------- ses ve titreşim ---------- */
let AC = null;
function sfx(kind){
  if (S.opt.sound === false || (typeof noListen === "function" && noListen())) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime;
    const N = (f, d, s, type, v) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + s);
      g.gain.exponentialRampToValueAtTime(v || 0.16, t + s + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + s + d);
      o.connect(g); g.connect(AC.destination); o.start(t + s); o.stop(t + s + d + 0.03);
    };
    if (kind === "ok") { N(784, .12, 0); N(1175, .2, .08); }
    else if (kind === "bad") { N(220, .2, 0, "triangle", .2); N(174, .26, .09, "triangle", .16); }
    else if (kind === "win") [523, 659, 784, 1047].forEach((f, i) => N(f, .26, i * .11, "sine", .15));
    else if (kind === "tap") N(660, .05, 0, "sine", .05);
  } catch(e) {}
}
const buzz = p => { try { if (S.opt.vib !== false && navigator.vibrate) navigator.vibrate(p); } catch(e) {} };

const fmtN = n => n >= 10000 ? (n / 1000).toFixed(1).replace(".", ",") + "b" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
function paintXP(bump){
  const el = $("#xp"); if (!el) return;
  el.innerHTML = I("bolt") + fmtN(S.xp || 0);
  if (bump) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}
function addXP(n){
  if (!n) return;

}

  const party = o.party !== undefined ? o.party : (!has || pct >= 60);
  const cols = ["#FFB020", "#22C55E", "#3D7BFF", "#F43F5E", "#8B5CF6"];
  const conf = party ? Array.from({length: 26}, (_, i) => `<i style="left:${4 + Math.random() * 92}%;background:${cols[i % 5]};animation-delay:${(Math.random() * .5).toFixed(2)}s;--r:${Math.round(Math.random() * 360)}deg"></i>`).join("") : "";
  const C = 2 * Math.PI * 34, tone = !has ? "" : pct >= 80 ? "g" : pct >= 55 ? "a" : "r";

      <div class="rhero">

        ${o.sub ? `<p class="rsub">${esc(o.sub)}</p>` : ""}

      </div>
      ${st.length ? `<div class="rstats n${Math.min(st.length, 3)}">${st.map((x, i) => `<div class="rs" style="--d:${i * 70}ms">${I(x[0])}<b>${esc(String(x[1]))}</b><small>${esc(x[2])}</small></div>`).join("")}</div>` : ""}

/* ---------- çalışma takvimi (son 5 hafta) ---------- */
function heatHtml(){
  const cells = [], t = new Date(); t.setHours(12);
  const start = new Date(t); start.setDate(t.getDate() - ((t.getDay() + 6) % 7) - 28);
  let act = 0;
  for (let i = 0; i < 35; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = ymd(d), r = S.days[k] || {}, n = (r.n || 0) + (Object.keys(r).length ? 3 : 0);
    if (n && d <= t) act++;
    const lv = d > t ? "f" : !n ? "" : n < 15 ? "h1" : n < 40 ? "h2" : "h3";
    cells.push(`<i class="${lv} ${k === TODAY ? "td" : ""}" style="--d:${(i * .018).toFixed(3)}s" title="${trDate(k)}"></i>`);
  }
  return `<div class="heathd"><b>${act}</b><span>gün çalıştın<br>son 5 haftada</span><span class="hl"><span>Az</span><i></i><i class="h1"></i><i class="h2"></i><i class="h3"></i><span>Çok</span></span></div><div class="heat">${["P","S","Ç","P","C","C","P"].map(d => `<span>${d}</span>`).join("")}${cells.join("")}</div>`;
}

    const dw = diffWords(said, plain(it)), df = said.trim() && sc < 0.97 && dw.includes("<u") && /(^|\s)[^<\s]/.test(dw.replace(/<u[^>]*>[^<]*<\/u>/g, "")) ? `<span class="small" style="display:block;margin-top:6px;color:var(--tx2)">${ok ? "Doğru sayıldı, şuna dikkat: " : "Farklı yerler: "}${dw}</span>` : "";
    $("#vd").innerHTML = verdict(ok, it, said, df ? `<span class="muted small">${esc(it.tr)}</span>` + df : "");
    if (!audio || !ok) speak(it.de);
    footNext();
  };
  addHint(it, plain(it), true);
  $("#ck").onclick = () => check($("#typed").value);
  $("#typed").onkeydown = e => { if (e.key === "Enter") check($("#typed").value); };
  $("#sk").onclick = () => check("");
  appKbd();
  if (!audio && S.opt.syskb) setTimeout(() => $("#typed") && $("#typed").focus({preventScroll:true}), 50);
}

/* ---------- hata kartları: önce doğrusunu seç, sonra kelimelerle kur ---------- */
function startMistakes(){
  const L = shuffle(allMistakes()).slice(0, 15);
  if (!L.length) { toast("Henüz hata kartı yok"); return; }
  const q = [];
  L.forEach(m => q.push({m, k:"pick"}));
  L.forEach(m => { const n = m.right.split(" ").filter(Boolean).length; if (n >= 2 && n <= 12 && norm(m.right) !== norm(m.wrong)) q.push({m, k:"build"}); });
  let i = 0, lock = 0, okN = 0; const again = new Set();
  const fin = (ok, cur) => { if (ok) okN++; else if (!again.has(cur.k + cur.m.right)) { again.add(cur.k + cur.m.right); q.push(cur); } };
  const r = () => {
    setTop("Hatalarım", true); lock = 0;
    const cur = q[i];
    if (!cur) { mark("mist"); endCard("✅", "Hatalar tekrarlandı", L.length + " hata · " + okN + " doğru cevap", "Tamam"); return; }
    const m = cur.m, top = `<div class="ptop"><div class="pbar"><i style="width:${i/q.length*100}%"></i></div><span class="small muted">${i+1}/${q.length}</span></div>`;
    const rule = m.rule ? `<span class="small" style="display:block;margin-top:6px;color:var(--tx2)">💡 ${esc(m.rule)}</span>` : "";
    const foot = () => { $(".foot").innerHTML = `<button class="cta" id="nx">Devam</button>`; $(".foot").hidden = false; $("#nx").onclick = () => { i++; r(); }; };
    if (cur.k === "pick") {
      const opts = shuffle([m.right, m.wrong]);
      $("#view").innerHTML = top + `<div class="phase">🩹 Hangisi doğru?</div>
        <div class="opts">${opts.map((o, j) => `<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div>
        <div id="vd"></div><div class="foot" hidden></div>`;
      $$(".opt").forEach(b => b.onclick = () => {
        if (lock) return; lock = 1;
        const ok = opts[+b.dataset.j] === m.right;
        $$(".opt").forEach(x => x.classList.add(opts[+x.dataset.j] === m.right ? "good" : "bad"));
        fin(ok, cur); speak(m.right);
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Doğru!" : "Doğrusu:"}<b>${esc(m.right)}</b>${rule}</div>`;
        foot();
      });
    } else {
      const w = m.right.split(" ").filter(Boolean), pool = shuffle(w.map((x, k) => ({x, k}))), built = [];
      if (pool.every((p, k) => p.k === k) && w.length > 1) pool.reverse();
      $("#view").innerHTML = top + `<div class="phase">🧱 Doğrusunu kur</div>
        <div class="card flash" style="min-height:90px"><div class="mid">Senin yazdığın</div><div class="big" style="font-size:19px;color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px">${esc(m.wrong)}</div></div>
        <div class="built" id="built"></div>
        <div class="pool" id="pool">${pool.map((p, k) => `<button class="wd" data-k="${k}">${esc(p.x)}</button>`).join("")}</div>
        <div id="vd"></div>
        <div class="foot"><div class="row2"><button class="btn2" id="clr">Temizle</button><button class="cta" id="ck" disabled>Kontrol et</button></div></div>`;
      const draw = () => {
        $("#built").innerHTML = built.map((k, j) => `<button class="wd" data-j="${j}">${esc(pool[k].x)}</button>`).join("");
        $$("#pool .wd").forEach(b => b.classList.toggle("used", built.includes(+b.dataset.k)));
        $$("#built .wd").forEach(b => b.onclick = () => { if (lock) return; built.splice(+b.dataset.j, 1); draw(); });
        $("#ck").disabled = built.length !== w.length;
      };
      $$("#pool .wd").forEach(b => b.onclick = () => { if (lock || built.includes(+b.dataset.k)) return; built.push(+b.dataset.k); draw(); });
      $("#clr").onclick = () => { if (lock) return; built.length = 0; draw(); };
      $("#ck").onclick = () => {
        if (lock) return; lock = 1;
        const ok = norm(built.map(k => pool[k].x).join(" ")) === norm(m.right);
        fin(ok, cur); speak(m.right);
        $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Harika!" : "Doğrusu:"}<b>${esc(m.right)}</b>${rule}</div>`;
        foot();
      };
    }
  };
  open(r);
}

// örnek cümle + Türkçesi (kelime ve kalıp kartlarında)
function exHtml(it, small){

const PERS = ["ich", "du", "er/sie", "wir", "ihr", "sie/Sie"];
function wordInfo(it){
  if (it.kind === "n") return `<div class="ex" style="font-style:normal">Çoğul: <b>${it.pl ? "die " + esc(it.pl) : "çoğulu yok"}</b></div>`;

  if (it.kind === "a" && it.opp) return `<div class="ex" style="font-style:normal">Zıttı: <b>${esc(it.opp)}</b></div>`;

}
const umlaut = w => { const m = w.match(/^(.*?)(au|a|o|u)([^aeiouäöü]*(?:e[lnr]?)?)$/i); return m ? m[1] + ({au:"äu",a:"ä",o:"ö",u:"ü"})[m[2].toLowerCase()] + m[3] : w; };
const uniq = a => a.filter((x, i) => x && a.indexOf(x) === i);
// ortak seçmeli kart: soru, şıklar, doğru cevap
function choose(it, m, top, opts, right, cols){
  opts = shuffle(uniq([right].concat(opts.filter(o => o !== right))).slice(0, 4));
  if (!opts.includes(right)) opts[0] = right;
  opts = shuffle(opts);
  $("#view").innerHTML = head(m) + `
    <div class="card flash" style="min-height:130px">${top}</div>
    <div class="${cols ? "opts2" : "opts"}" ${cols === 3 ? 'style="grid-template-columns:repeat(3,1fr)"' : ""}>${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <div id="vd"></div><div class="foot" hidden></div>`;
  $$(".opt").forEach(b => b.onclick = () => {
    if (P.lock) return; P.lock = 1;
    const ok = opts[+b.dataset.i] === right;
    b.classList.add(ok ? "good" : "bad"); if (!ok) $(`.opt[data-i="${opts.indexOf(right)}"]`).classList.add("good");
    answer(it, ok);
    $("#vd").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? pick(["Doğru!","Harika!","Aynen!"]) : "Doğrusu:"}<b>${esc(it.de)}</b><span class="muted small">${esc(it.tr)}</span>${wordInfo(it).replace('class="ex"', 'class="small wi" style="margin-top:6px;color:var(--tx2)"')}</div>`;
    speak(it.kind === "v" ? it.pr[2] + ". " + it.pf : it.de);
    footNext();
  });
}
Object.assign(R_MODE, {
  artikel(it){
    choose(it, "artikel", `<div class="mid">${esc(it.tr)}</div><div class="big">___ ${esc(it.w)}</div>`, ["der", "die", "das"], it.art, 3);
  },
  plural(it){
    const w = it.w, cand = [w + "e", w + "en", w + "n", w + "s", umlaut(w) + "e", w, w + "er", umlaut(w) + "er", umlaut(w)].filter(x => x !== it.pl);
    choose(it, "plural", `<div class="mid">${esc(it.tr)}</div><div class="big">${esc(it.de)}</div><div class="mid">→ die ?</div>`, shuffle(cand).slice(0, 3).map(x => x), it.pl, 2);
    $$(".opt").forEach(b => b.textContent = "die " + b.textContent);
  },
  conj(it){
    const p = Math.random() * 6 | 0, right = it.pr[p];
    const stem = it.w.replace(/e?n$/, "");
    const reg = [stem + "e", stem + "st", stem + "t", it.w, stem + "en"].map(f => it.pr[0].includes(" ") ? f + " " + it.pr[0].split(" ")[1] : f);
    choose(it, "conj", `<div class="mid">${esc(it.w)} · ${esc(it.tr)}</div><div class="big">${PERS[p]} ___</div>`, shuffle(uniq(it.pr.concat(reg))).filter(f => f !== right).slice(0, 3), right, 2);
  },
  perfekt(it){
    const [aux, part] = [it.pf.split(" ")[0], it.pf.split(" ").slice(1).join(" ")];
    const alt = aux === "hat" ? "ist" : "hat", stem = it.w.replace(/^sich /, "").replace(/ \S+$/, "").replace(/e?n$/, "");
    const reg = (/^(be|ver|er|ent|zer|ge)/.test(it.w) ? "" : "ge") + stem + "t";
    choose(it, "perfekt", `<div class="mid">${esc(it.w)} · ${esc(it.tr)}</div><div class="big">Gestern ___ er …</div><div class="mid">Perfekt</div>`,
      shuffle([alt + " " + part, aux + " " + reg, alt + " " + reg, aux + " ge" + it.w.replace(/^sich /, "")]), it.pf, 2);
  },
  prat(it){
    const stem = it.w.replace(/e?n$/, ""), sep = it.pt.includes(" ") ? " " + it.pt.split(" ")[1] : "";
    const other = pick(WORDS().filter(x => x.kind === "v" && x.id !== it.id)).pt;
    choose(it, "prat", `<div class="mid">${esc(it.w)} · ${esc(it.tr)}</div><div class="big">Früher ___ er …</div><div class="mid">Präteritum</div>`,
      shuffle([stem.replace(sep.trim(), "") + "te" + sep, it.pr[2], other, stem + "ete" + sep]), it.pt, 2);
  },
  opp(it){
    const others = WORDS().filter(x => x.kind === "a" && x.w !== it.opp && x.w !== it.w).map(x => x.w);
    choose(it, "opp", `<div class="mid">Zıttı ne?</div><div class="big">${esc(it.w)}</div><div class="mid">${esc(it.tr)}</div>`, shuffle(others).slice(0, 3), it.opp, 2);
  },
  scramble(it){
    const L = it.w.split(""), sh = shuffle(L.map((c, i) => ({c, i}))), built = [];
    if (sh.every((x, i) => x.i === i)) sh.reverse();
    $("#view").innerHTML = head("scramble") + `
      <div class="card flash" style="min-height:100px"><div class="mid">${it.art ? esc(it.art) + " …" : ""}</div><div class="big" style="font-size:22px">${esc(it.tr)}</div></div>
      <div class="built" id="built" style="justify-content:center"></div>
      <div class="pool" id="pool">${sh.map((x, k) => `<button class="wd" data-k="${k}" style="min-width:42px">${esc(x.c)}</button>`).join("")}</div>
      <div id="vd"></div>
      <div class="foot"><div class="row2"><button class="btn2" id="clr">Sil</button><button class="cta" id="ck" disabled>Kontrol et</button></div></div>`;
    const draw = () => {
      $("#built").innerHTML = built.map(k => `<span class="wd">${esc(sh[k].c)}</span>`).join("");
      $$("#pool .wd").forEach(b => b.classList.toggle("used", built.includes(+b.dataset.k)));
      $("#ck").disabled = built.length !== L.length;
    };
    $$("#pool .wd").forEach(b => b.onclick = () => { if (P.lock || built.includes(+b.dataset.k)) return; built.push(+b.dataset.k); draw(); });
    $("#clr").onclick = () => { if (P.lock) return; built.pop(); draw(); };
    $("#ck").onclick = () => {
      if (P.lock) return; P.lock = 1;
      const said = built.map(k => sh[k].c).join(""), ok = said.toLowerCase() === it.w.toLowerCase();
      answer(it, ok); $("#vd").innerHTML = verdict(ok, it, ok ? "" : said); speak(it.de); footNext();
    };
  },
});

/* ---------- uygulama klavyesi: telefon klavyesi açılıp ekranı kaydırmasın ---------- */
const KB_ROWS = ["qwertzuiopü", "asdfghjklöä", "⇧yxcvbnmß⌫"];
function appKbd(){
  const inp = $("#typed"), foot = $(".foot");
  if (!inp || !foot) return;
  $("#view").classList.add("kbv");
  if (S.opt.syskb) {
    foot.insertAdjacentHTML("afterbegin", `<button class="kbsw" id="kbsw">${I("keyboard")} Uygulama klavyesini kullan</button>`);

    return;
  }
  inp.readOnly = true; inp.setAttribute("inputmode", "none"); inp.classList.add("kbin"); inp.blur();
  let up = false;
  const key = k => `<button class="kk${k === "⇧" ? " ksh" : k === "⌫" ? " kbs" : ""}" data-k="${k}">${k}</button>`;
  foot.insertAdjacentHTML("afterbegin", `<div class="kbd" id="kbd">${KB_ROWS.map(r => `<div class="kr">${[...r].map(key).join("")}</div>`).join("")}

  const kb = $("#kbd");
  const paint = () => { kb.classList.toggle("up", up); };
  const put = k => {
    if (P && P.lock) return;
    if (k === "⇧") { up = !up; return paint(); }
    if (k === "⌫") inp.value = inp.value.slice(0, -1);
    else if (k === "sys") { S.opt.syskb = 1; save(); kb.remove(); inp.readOnly = false; inp.removeAttribute("inputmode"); inp.classList.remove("kbin"); appKbd(); inp.focus(); return; }
    else { inp.value += up ? k.toUpperCase() : k; if (up) { up = false; paint(); } }
    buzz(6);
  };
  let rep;
  kb.querySelectorAll(".kk").forEach(b => {
    b.onpointerdown = e => { e.preventDefault(); b.classList.add("on"); put(b.dataset.k); if (b.dataset.k === "⌫") rep = setTimeout(function r(){ put("⌫"); rep = setTimeout(r, 70); }, 420); };
    b.onpointerup = b.onpointerleave = b.onpointercancel = () => { b.classList.remove("on"); clearTimeout(rep); };
  });
  // fiziksel klavye (bilgisayar) yine çalışsın
  onKbdKey.inp = inp;
}
function onKbdKey(e){
  const inp = onKbdKey.inp;
  if (!inp || !document.body.contains(inp) || !inp.readOnly || (P && P.lock)) return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target !== inp) return;
  if (e.key === "Enter") { if (document.activeElement !== inp && $("#ck")) { $("#ck").click(); e.preventDefault(); } }
  else if (e.key === "Backspace") { inp.value = inp.value.slice(0, -1); e.preventDefault(); }
  else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) { inp.value += e.key; e.preventDefault(); }
}
document.addEventListener("keydown", onKbdKey);

/* ================= TURBO: duy, söyle, düzelt ================= */
let T = null;
function startTurbo(src){
  if (noListen()) return toast("Şu an dinleyemem açık. Bugün ekranından kapatabilirsin.");
  const items = srcItems(src, 20);
  if (!items.length) { toast("Bu kaynakta cümle yok"); return; }
  T = {items, i:0, dir: S.opt.tdir || "trde", run:true, tok:0, ok:0, n:0, res:{}};
  open(renderTurbo);
  onLeave = stopTurbo;
  wake(true);
  setTimeout(turboStep, 400);
}
function stopTurbo(){
  if (!T) return; T.run = false; T.tok++; stopSpeak(); wake(false);
  Object.entries(T.res).forEach(([id, ok]) => { seen(BYID[id]); grade(BYID[id], ok); }); T.res = {}; save();
  if (T.rec) try { T.rec.abort(); } catch(e) {}
}
function renderTurbo(){
  setTop("Turbo", true);
  const it = T.items[T.i];
  $("#view").innerHTML = `
    <div class="seg" id="tdir" style="margin-top:6px"><button data-v="trde" class="${T.dir === "trde" ? "on" : ""}">Türkçe → Almanca</button><button data-v="detr" class="${T.dir === "detr" ? "on" : ""}">Almanca → Türkçe</button></div>
