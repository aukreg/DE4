na eklenebilir: Er ist zu spät, wie immer.","k12.5":"Ezberden bilmek için können + auswendig: Ich kann das Lied auswendig.","k12.6":"Dürüst/ters bir görüş öncesi giriş; arkasından fiil gelir: ehrlich gesagt bin ich müde.","k12.7":"Şans dileme jesti (başparmakları avuçta sıkmak); cevabı 'Ich drück dir die Daumen!'","k13.0":"Rahatlama ifadesi; dindar anlam taşımaz, herkes kullanır.","k13.1":"sich setzen dönüşlü; zu mir 'yanıma' demek (zu + Dativ).","k13.2":"nichts'ten sonra sıfat büyük harfle ve -es ile: nichts Schweres, nichts Neues.","k13.3":"anmachen ayrılabilen: an sona gider; tersi ausmachen (kapatmak).","k13.4":"gucken samimi 'bakmak'; mal 'bi' anlamı katar, dikkat çekmek için.","k13.5":"Plan değişince sorun etmediğini gösterir; rahat ve olumlu.","k13.6":"verpassen 'kaçırmak' (otobüs, film, olay); Perfekt: hab verpasst.","k13.7":"gern'in karşılaştırma hali; tercih bildirir: Ich trinke lieber Tee.","k14.0":"Çok yorgunluk için samimi; kaputt eşya için 'bozuk' anlamına da gelir.","k14.1":"Fiziksel ya da sinirsel sınıra gelince; nicht mehr = artık değil.","k14.2":"Çocukların mızmızlanması için tipik fiil: Das Kind quengelt.","k14.3":"Acıma ifadesi; erkek için der Arme, kadın/kız için die Arme.","k14.4":"Bir öneri ya da fikirden önce dikkat çekmek için giriş.","k14.5":"Samimi ve kısa; mir Dativ'dir, ton kaba kaçabilir.","k14.6":"Bağlaç olarak 'sürece', zarf olarak 'o arada'; bağlaçta fiil sona gider.","k14.7":"aufpassen auf + Akkusativ: auf das Kind aufpassen; auf ayrılır: Ich passe auf.","k14.8":"Ayrılabilen fiil: Am Sonntag schlafe ich aus; tatil sabahı için ideal.","k14.9":"Gerçekleşmeyecek bir dilek için alaycı cevap; samimi.","k14.10":"Karşıdakinin haklı olduğunu sonradan kabul ederken; wieder burada vurgu.","k15.0":"Lust auf + Akkusativ: Hast du Lust auf Pizza? Davet için samimi.","k15.1":"Hafif çekinceli evet; 'aslında evet ama…' sezdirir.","k15.2":"wohin yön bildirir (nereye), wo yer (nerede); denn merak katar.","k15.3":"lieber tercih bildirir; bir öneriyi başka bir seçenekle değiştirirken.","k15.4":"Ayrılabilen: Wir fahren um 8 los; araçla yola çıkmak için.","k15.5":"'gut gelaunt'un karşılaştırma hali; tersi 'schlecht gelaunt'.","k15.6":"nichts'i güçlendirir: Ich hab gar nichts gemacht = hiçbir şey yapmadım.","k15.7":"Klingt gut'un daha coşkulu hali; plan kabul ederken.","k15.8":"'Zaten öyle olacaktı' anlamı: Ich muss sowieso einkaufen.","k16.0":"lassen 'bırakmak, karışmamak'; sie burada Akkusativ (onu).","k16.1":"Birini rahatlatırken; 'Mach dir keine Sorgen' daha uzun hali.","k16.2":"ganz 'tamamen' vurgusu katar: ganz oben = en üstte.","k16.3":"İronik; bir şey ters gidince 'harika ya' gibi, ses tonu önemli.","k16.4":"İronik; espriyi beğenmeyince söylenir, gerçek övgü değil.","k16.5":"werden ile değişim anlatılır: es wird kalt/dunkel; hava için özne es.","k16.6":"Spaß haben = eğlenmek; bir şey eğlenceliyse 'Das macht Spaß' denir, karıştırma.","k16.7":"Uyarıda 'yoksa': Zieh die Jacke an, sonst wird dir kalt; sonst'tan sonra fiil gelir.","k16.8":"Konuşmada 'olay/yaygara': Mach kein Theater! Tiyatro anlamı da var.","k17.0":"anfassen ayrılabilen: emirde an sona gider; ateşi kontrol ederken.","k17.1":"Fieber haben = ateşi olmak, Fieber messen = ateş ölçmek; artikelsiz kullanılır.","k17.2":"sehr'den biraz hafif 'epey': ziemlich warm, ziemlich müde.","k17.3":"Doktor için: einen Termin machen/vereinbaren; Termin eril, Akkusativ einen.","k17.4":"Bir öneri ya da saat uygun mu diye sorarken; resmi ortamda da uygun.","k17.5":"Schluck eril, Akkusativ'de einen; içecek tadarken: Nimm einen Schluck.","k17.6":"Hastalıkta halsizlik için; müde'den farklı, enerjisizlik anlatır.","k17.7":"Teselli kalıbı; werden burada 'düzelmek/yoluna girmek' anlamında, schon güven katar.","k17.8":"es önceki söyleneni karşılar; konuşmada 'Hoffentlich!' ya da 'Ich hoffe doch' da çok denir.","k18.0":"aussehen ayrılabilen: Er sieht aus wie sein Vater; wie ile karşılaştırma yapılır.","k18.1":"Yardım teklif ederken mantık sunar; geht's = geht es.","k18.2":"Görev isterken ya da çaresizlikte; tonla anlam değişir.","k18.3":"Ayrılabilen fiil: Ich hänge die Wäsche auf; Wäsche tekil kullanılır.","k18.4":"wegräumen ayrılabilen (weg sona); saugen = staubsaugen, süpürgeyle süpürmek.","k18.5":"Ayrılabilen: Ich bringe den Müll runter; runter = aşağı.","k18.6":"Aynılığı vurgular: Mir geht's genauso = bende de aynısı.","k18.7":"dank'tan sonra Dativ (konuşmada) ya da Genitiv gelir: dank deiner Hilfe.","k19.0":"Soruya ya da dikkat çekmeye giriş; samimi, 'Sag mal, …?'","k19.1":"wen 'kimi' Akkusativ'dir; wer kim, wem kime ile karıştırma.","k19.2":"Karşıdakine izin/onay verir; mach = 'yap hadi'.","k19.3":"ob dolaylı evet/hayır sorusu kurar; fiil sona: Frag, ob sie kommt.","k19.4":"Öğleden sonra kahve-pasta daveti için tipik Alman geleneği.","k19.5":"Almancada süre devam ediyorsa şimdiki zaman: Seit wann wohnst du hier?","k19.6":"Bir işi küçümserken retorik soru; sonra genelde zor çıkar.","k19.7":"Ekstra önlem alırken gerekçe; Türkçedeki 'ne olur ne olmaz'.","k19.8":"Kapı zili çalınca; telefon için 'Das Telefon klingelt'.","k19.9":"Yardım isterken gerekçe; die Hände voll haben sabit kalıp.","k19.10":"Misafir gelince sıcak karşılama; dass yan cümlesinde fiil sona gider.","k20.0":"Tekrarlanan sinir bozucu durum: Schon wieder Stau!","k20.1":"Eşyayı ortada bırakmak; liegen + lassen iki mastar yan yana: Lass das nicht liegen!","k20.2":"Söz verirken ciddiyet katar; önceki sözler tutulmamış imasını taşır.","k20.3":"recht haben sabit kalıp (Recht diye de yazılabilir); 'Da hast du recht' de çok sık.","k20.4":"Samimi özür; mir Dativ'dir, güçlendirmek için 'Tut mir echt leid', çok samimide 'Sorry'.","k20.5":"an + Dativ ile hängen bleiben: yükün hep birine kaldığını anlatır, sitem.","k20.6":"Kibarca itiraz etmek için; 'Das stimmt nicht' kadar sert değil.","k20.7":"Kısmi kabul: 'evet ama…' tonu, genelde arkasından aber gelir.","k20.8":"Ayrılabilen: Er denkt mit; ortak işte düşünceli olmayı anlatır.","k20.9":"Söz vermeden niyet; 's = es, tam hali 'Ich versuche es'.","k20.10":"Sinirli, gergin ruh hali için; 'genervt' de yakın anlamda.","k20.11":"Tartışmayı kapatırken ya da özrü kabul ederken; 'yeter' anlamı da olabilir.","k20.12":"Mesajlarda özne ich düşer; unterwegs = yolda.","s1.1":"Sipariş kalıbı: ich hätte gern + Akkusativ; Cappuccino eril: einen.","s1.3":"'Zum Mitnehmen oder hier?' sorusuna cevap: hier = burada (içeride yiyeceğim); paket için 'Zum Mitnehmen, bitte.'","s1.5":"mit'ten sonra Dativ: mit Karte, mit Bargeld; kasada sık sorulur.","s1.7":"Kasadan ayrılırken nazik kapanış; noch iyi dileği kalan güne yayar.","s1k0":"Kibar sipariş kalıbı; ardından Akkusativ: einen Kaffee, eine Cola.","s1k1":"Kasiyerin sorusu; cevap 'Zum Mitnehmen, bitte' ya da 'Für hier, bitte'.","s1k2":"Almanya'da bazı yerler sadece nakit alır, sormak önemli; mit + Dativ.","s1k3":"Rica ya da teşekküre rahat cevap; kafede garson da sık söyler.","s2.1":"zusammen arbeiten ile ilişkiyi anlatırsın; 'Und du?' konuşmayı devam ettirir.","s2.3":"Meslekte artikel kullanılmaz: Ich arbeite als Ingenieur; ya da Ich bin Ingenieur.","s2.5":"Türkei artikelli ülke: aus der Türkei; seit + süre, şimdiki zamanla.","s2.7":"schon burada çekinceli 'evet' sezdirir; naja ile hafif şikayet gelir.","s2k0":"İş/hayat sorusu; samimi, resmi ortamda 'Was machen Sie beruflich?'","s2k1":"Kısa şaşkınlık ya da ilgi; tonla soru olur, samimi.","s2k2":"Konuşmada 'aslında' ya da soruda 'bu arada': Was machst du eigentlich?","s2k3":"Kararsızlık veya hafif hoşnutsuzluk; cümleye giriş olarak da gelir.","s3.1":"vorhaben ayrılabilen: vor sona gider; birinin planını sorarken.","s3.3":"Saat sormak için Um wie viel Uhr? kalıbı; cevap um + saat.","s3.5":"sich ändern dönüşlü; wenn yan cümlesinde fiil sona gider.","s3k0":"Davet; zu + mastar ile: Hast du Lust, ins Kino zu gehen?","s3k1":"vorhaben ayrılabilen fiil; 'Hast du heute was vor?' de çok sık.","s3k2":"Kabul cevabı; 'Klingt super' ya da 'Klingt perfekt' da denir.","s3k3":"sich melden'in du emri; mesajlaşmada samimi kapanış.","s4.1":"deins nötr isim yerine geçer (dein Wochenende → deins); eril der Tag için 'Und deiner?' denir.","s4.3":"total ve echt samimi vurgu kelimeleri; fertig burada 'bitkin'.","s4.5":"einen = einen Kaffee, eril zamir; gern ile teklif kabul edilir.","s4k0":"İş arkadaşına samimi giriş; resmi ortamda kullanma.","s4k1":"Was ist los?'taki los; 'Bei uns ist viel los' = bizde çok iş var.","s4k2":"Yorgunluk için; fertig 'hazır' anlamına da gelir, bağlamdan anla.","s4k3":"Empati bildirir; baştaki nesne das düşmüş, tam hali 'Das kenne ich.'","s5.0":"Bahn rötarı en yaygın mazeret; mesajda özne ich düşer: Bin … da.","s5.2":"echt özrü güçlendirir; schon lange ile 'uzun zamandır mı' sorulur.","s5.4":"mit der Bahn ekiyle konuya bağlanır; Dativ: mit der.","s5k0":"Mesajda kısa 'hemen oradayım/geliyorum'; özne ich düşer.","s5k1":"Samimi özür; resmi durumda 'Entschuldigen Sie bitte'.","s5k2":"Özre rahatlatıcı cevap; samimi, 'Kein Problem' alternatifi.","s5k3":"Sinir ve hayret ifadesi; doch vurgu katar.","b1.0":"'Morgen' konuşmada 'Guten Morgen'in kısaltmasıdır; 'Schatz' eşe/sevgiliye en yaygın hitaptır.","b1.1":"Saati sormanın en yaygın yolu 'Wie spät ist es?'; eş anlamlısı 'Wie viel Uhr ist es?'.","b1.2":"'kurz nach' = biraz geçe, 'kurz vor' = az kala; örn. kurz vor acht = sekize az var.","b1.3":"'schon' burada 'şimdiden/çoktan', 'noch' ise 'hâlâ' demek; ikisini karıştırmamak önemli.","b1.4":"'heute Nacht' geçen gece için de kullanılır; 'dreimal' gibi sayı+mal = kaç kere (zweimal, viermal).","b1.5":"'hab' konuşmada 'habe'nin kısaltmasıdır; Perfekt: schlafen haben ile kurulur, ich habe geschlafen.","b1.6":"'liegen bleiben' = yatmaya devam etmek; emir kipinde bleib başa gelir, liegen sona gider.","b1.7":"'Du bist ein Schatz' biri iyilik yapınca söylenen samimi bir teşekkür kalıbıdır.","b1.8":"'wissen' düzensizdir: ich weiß, du weißt, er weiß; ich ve er/sie formunda -t eki almaz.","b1.9":"Evet/hayır sorusunda fiil başa gelir: Ist Gece schon wach? 'wach sein' = uyanık olmak.","b1.10":"'im Bett' = in dem Bett; yer bildirirken (wo?) in'den sonra Dativ gelir.","b1.11":"'Es ist vorbei mit ...' = ... faslı bitti; 'Na dann' 'eh o zaman' gibi teslimiyet tonu verir.","b1.12":"'holen' = gidip almak/getirmek; 'Bleib ruhig liegen'deki 'ruhig' çekinme, rahat ol anlamı katar.","b1.13":"'aufstehen' ayrılabilir fiildir: ich stehe auf; 'Geht schon' = idare eder, sorun değil.","b1.14":"Tek kelimelik 'Sicher?' = 'Emin misin?'; tam hali: Bist du sicher?","b1.15":"'zuerst' = önce/ilk olarak; sıralamada zuerst, dann, danach, zum Schluss kullanılır.","b1.16":"'mit' her zaman Dativ ister; sütlü = mit Milch, şekersiz = ohne Zucker (ohne Akkusativ).","b1.17":"'viel' sayılamayan isimle çekimsiz kalır: viel Milch, viel Zeit; sayılanda viele Eier.","b2.0":"'wollen' modal fiildir, asıl fiil (frühstücken) cümle sonuna gider.","b2.1":"Sorudaki 'denn' merak tonu katar ve cümleyi doğal yapar: Was haben wir denn?","b2.2":"'Oliven sind auch noch da' = zeytin de hâlâ var; 'da sein' bir şeyin mevcut olduğunu söyler.","b2.3":"'dann' başa gelince fiil ikinci sırada kalır, özne fiilden sonra gelir: Dann mach ich...","b2.4":"'ohne' Akkusativ ister ve sık sık artikelsiz kullanılır: ohne Zwiebeln, ohne Zucker.","b2.5":"'essen' düzensizdir: ich esse, du isst, sie isst; e harfi i'ye dönüşür.","b2.6":"'wollte' wollen'in Präteritum halidir; modal fiillerde geçmişte Perfekt yerine bu kullanılır.","b2.7":"Almanca bileşik isimlerle kolayca yeni kelime yapar: Brot + Phase = Brot-Phase; artikel son kelimeden gelir.","b2.8":"'aufsetzen' (Wasser/Tee) ayrılabilir fiildir; kannst gibi modalda mastar sona gider.","b2.9":"'Schon passiert' = çoktan hallettim; 'laufen' cihazlar için 'çalışmak' anlamında da kullanılır.","b2.10":"Soruda 'eigentlich' 'bu arada, aslında' anlamı katar ve konu değiştirmeyi yumuşatır.","b2.11":"'ganz oben' = en üstte; benzerleri ganz unten, ganz hinten, ganz vorne.","b2.12":"'hab ihn' = (ich) habe ihn; der Honig Akkusativde ihn olur, burada 'buldum' anlamında.","b2.13":"'mit' Dativ ister, dişi isimde iyelik -er alır: mit ihrer Puppe, mit meiner Mutter.","b2.14":"'herbringen' = buraya getirmek; 'her' konuşana doğru, 'hin' konuşandan uzağa yönü verir.","b2.15":"'Mach ich' = 'Yaparım/Tamam' anlamında çok yaygın kısa cevap; 'Es gibt' + Akkusativ = var.","b2.16":"'Na siehst du' = gördün mü işte; 'klappen' = işe yaramak, yolunda gitmek (samimi).","b3.0":"'sollen' burada 'ne giysin?' gibi öneri/karar sorar; anziehen ayrılmadan sona gider.","b3.1":"'Nimm' nehmen'in du emir halidir (e→i); 'die dicke Hose' Akkusativde dişi artikel değişmez.","b3.2":"İsim tekrar edilmeyince sıfat artikelle tek başına kalır: die blaue (Hose) = mavi olanı.","b3.3":"'in der Wäsche sein' = yıkamada/kirli sepetinde olmak; yer bildirdiği için Dativ.","b3.4":"'oben' = üstte, 'unten' = altta; kıyafette 'üstüne ne giysin' demenin kısa yolu.","b3.5":"Akkusativde eril artikel değişir: der rote Pulli → den roten Pulli.","b3.6":"Eril 'der Pulli' Akkusativde zamir olarak 'ihn' olur: Sie will ihn nicht.","b3.7":"'zeigen' kime → Dativ: Zeig ihr (ona) zwei Pullis; 'selbst' = kendisi.","b3.8":"'den mit dem Hasen' = tavşanlı olanı; artikel tek başına zamir gibi kullanılabilir.","b3.9":"'Na also!' = 'İşte bak, oldu!' beklenen sonuç gelince söylenir.","b3.10":"'Halt still!' = kıpırdama; 'Maus' çocuklara sevgi hitabıdır (Mäuschen da denir).","b3.11":"'brauchen' Akkusativ alır: Brauchst du Hilfe? Kibar alternatif: Kann ich dir helfen?","b3.12":"'doch' burada 'yok dedim ama aslında evet' anlamında fikir değiştirmeyi gösterir.","b3.13":"'gleich' = birazdan; 'fertig sein' = bitmiş/hazır olmak.","b3.14":"'Geschafft!' (schaffen'in Partizip'i) bir işi bitirince söylenen 'başardık!' ünlemidir.","b3.15":"'noch' burada 'bir de, ayrıca' anlamı katar: Und jetzt noch die Schuhe.","b3.16":"Nesne başa alınabilir, fiil yine ikinci sırada kalır: Die Schuhe hab ich vergessen.","b4.0":"'Ich muss los' = çıkmam lazım; los ile gehen fiili düşer, çok yaygın kalıptır.","b4.1":"'erst' = daha/ancak (beklenenden erken); 'doch' itiraz tonu katar: Es ist doch erst acht.","b4.2":"'halb neun' = sekiz buçuk; Almancada yarım bir sonraki saate göre söylenir, Türkçeye ters.","b4.3":"'Ach so' = 'haa, anladım'; 'der Geldbeutel' güneyde, 'das Portemonnaie' genel kullanımdır.","b4.4":"'Moment' = 'dur bi saniye'; tam hali 'Einen Moment, bitte' resmi ortamda kullanılır.","b4.5":"'auf' yer bildirirken Dativ: auf dem Tisch; 'im Flur' = in dem Flur.","b4.6":"'würde + mastar' Konjunktiv II'dir: Was würde ich ohne dich machen? = ne yapardım?","b4.7":"'Wann' zaman sorar; 'zu Hause' = evde (wo?), 'nach Hause' = eve (wohin?).","b4.8":"'So gegen sechs' = altı sularında; 'gegen' saatle 'civarı' demektir.","b4.9":"'mitbringen' ayrılabilir; modal (kannst) varken ayrılmadan sona gider.","b4.10":"'Sonst noch was?' = başka bir şey? Kasada satıcıların da sık sorduğu kalıptır.","b4.11":"'alle sein' konuşmada 'bitmek' demek: Die Windeln sind fast alle.","b4.12":"'Schreib's' = schreib es; 'am besten' = en iyisi, tavsiye vermenin pratik yolu.","b4.13":"'geben' iki nesne alır: kime Dativ, neyi Akkusativ: Gib Gece einen Kuss.","b4.14":"'arbeiten gehen' = işe gitmek; gehen + mastar kalıbı: einkaufen gehen, schwimmen gehen.","b4.15":"'bis' ile vedalaşma kalıpları: bis heute Abend, bis morgen, bis später, bis gleich.","b4.16":"'Hab dich lieb' sevgi ifadesidir, 'Ich liebe dich'ten biraz daha hafif ve aile içinde yaygın.","b4.17":"'Ich dich auch' kısa cevap: fiil tekrar edilmez ama nesne zamiri (dich) korunur.","b5.0":"'bei dir' = sende/senin tarafta; 'bei' her zaman Dativ ister: bei mir, bei euch.","b5.1":"'Und bei euch?' = ya sizde?; 'euch' ihr'in Dativ/Akkusativ halidir.","b5.2":"'vollmachen' = (bir şeyle) her yeri doldurmak/kirletmek; Perfekt: hat vollgemacht.","b5.3":"'überall' = her yerde; tek kelimelik soru olarak şaşkınlık bildirir.","b5.4":"'ja' burada 'malum, ki' anlamında bilinen bir gerçeği vurgular: wir haben ja keine Katze.","b5.5":"'was' konuşmada 'etwas'ın kısaltmasıdır; 'wenigstens' = en azından.","b5.6":"'ein bisschen' = biraz; 'jetzt' başa gelince fiil ikinci sırada kalır: Jetzt spielt sie.","b5.7":"'vom Supermarkt' = von dem; 'von' Dativ ister ve dem ile kaynaşır.","b5.8":"İsim + 'bitte' bir şey istemenin kısa yoludur: Bananen bitte; 'Und' ile kolayca madde eklenir.","b5.9":"'welcher' artikel gibi çekimlenir: der Käse → Akkusativde welchen Käse?","b5.10":"'du weißt schon' = bilirsin işte; açıklamaya gerek yok demenin samimi yolu.","b5.11":"Almanya'da beyaz peynir genelde 'Feta' ya da 'Hirtenkäse' adıyla satılır.","b5.12":"'Genau' = aynen/tam öyle; konuşmada onaylamanın en yaygın yolu.","b5.13":"'sich melden' = haber vermek/yazmak; dönüşlü fiil: ich melde mich, du meldest dich.","b5.14":"'Viel Erfolg!' = başarılar; işte olana 'kolay gelsin' demenin en yakın karşılığı.","b5.15":"Kısa mesajda 'Danke' yeter; daha sıcak alternatifler: Danke dir!, Danke schön!","b6.0":"'Lass uns ... machen' = hadi ... yapalım; mastar sona gider, 'mal' öneriyi yumuşatır.","b6.1":"'brauchen' Akkusativ alır; 'Was brauchen wir?' alışverişte en temel sorudur.","b6.2":"'alle sein' = bitmek; 'noch haben' = hâlâ var: Reis ist alle, Nudeln haben wir noch.","b6.3":"'Schreibst du oder ich?' ile kimin yapacağı sorulur; 'oder ich' kısadır, fiil tekrarlanmaz.","b6.4":"'in den Kühlschrank schauen': içine bakma yönü olduğu için in + Akkusativ.","b6.5":"'Weiter' tek başına 'devam, sonraki' demektir; 'Mach weiter!' = devam et.","b6.6":"'für' Akkusativ ister; zaman için de kullanılır: für morgen, für das Wochenende.","b6.7":"'Wie viel' sayılamayanlar için, 'Wie viele' sayılabilen çoğullar için: wie viele Eier?","b6.8":"'reichen' = yetmek; 'Das reicht!' aynı zamanda 'Yeter artık!' anlamına da gelir.","b6.9":"'das Obst' sayılamaz ve tekil kullanılır; tek bir meyve için konuşmada 'ein Stück Obst' denir.","b6.10":"'gerade' burada 'şu sıralar/şu an' anlamındadır, süregelen durumu anlatır.","b6.11":"'das Gemüse' tekil ve toplu isimdir, çoğul yapılmaz; 'Und ...?' ile kısa soru kurulur.","b6.12":"'Ach, und ...' unutulan bir şeyi eklerken kullanılan doğal bir kalıptır.","b6.13":"'Brauchen wir ...?' kalıbıyla listeye eklenecek şeyler sorulur; 'das Waschmittel' = deterjan.","b6.14":"'Warte' warten'in du emir halidir; 'ich schau mal' = bi bakayım (mal yumuşatır).","b6.15":"'Noch was?' = başka bir şey? (noch etwas'ın kısa hali).","b6.16":"'die Schokolade' tekil kullanılır; tablet için 'eine Tafel Schokolade' denir.","b6.17":"'für' Akkusativ ister ama özel isimlerde artikel olmadığı için değişiklik görünmez.","b6.18":"'für' Akkusativ ister: für mich, für dich, für uns; Dativ 'mir' burada yanlış olur.","b7.0":"Süpermarkette 'der Wagen' (Einkaufswagen) alışveriş arabasıdır; Akkusativde einen Wagen.","b7.1":"'im Wagen sitzen': yer bildirdiği için in + Dativ; 'wollen' ile sitzen sona gider.","b7.2":"'anfangen mit' = ...ile başlamak (Dativ); 'Fangen wir an' = başlayalım.","b7.3":"'im Angebot sein' = indirimde olmak; 'Schau mal' dikkat çekmenin samimi yoludur.","b7.4":"'aussehen' ayrılabilir: Sie sehen nicht so gut aus; 'nicht so' = pek değil.","b7.5":"'Stimmt' = doğru/haklısın; 'lassen' = bırakmak, almaktan vazgeçmek.","b7.6":"'bei' Dativ ister: bei Gece, bei mir; 'Bleibst du ...?' rica anlamında sorulur.","b7.7":"'Ja, klar' = tabii ki; daha vurgulu olarak 'Na klar!' de denir.","b7.8":"'Was fehlt noch?' = ne eksik kaldı?; fehlen 'eksik olmak' demek, özne eksik olan şeydir.","b7.9":"'das Waschmittel' = çamaşır deterjanı; bulaşık deterjanı ise 'das Spülmittel'.","b7.10":"'zeigen auf' = işaret etmek; 'drauf' darauf'un kısaltmasıdır, 'onun üstüne' demek.","b7.11":"'kein' isim olumsuzlar: keine Kekse; 'nicht' fiil/sıfat olumsuzlar.","b7.12":"'anfangen zu + mastar' = ...meye başlamak: Sie fängt an zu weinen.","b7.13":"'geben' kime → Dativ: ihr; neyi → Akkusativ: eine Banane.","b7.14":"'ruhig sein' = sakin olmak; 'Puh' rahatlama ünlemidir.","b7.15":"'bevor' yan cümle kurar, fiil sona gider: bevor sie wieder anfängt.","b7.16":"'zahlen' = ödemek; kasada 'Ich zahle mit Karte' ya da 'bar' (nakit) denir.","b7.17":"'einpacken' ayrılabilir: ich pack ein; 'Mist!' = hay aksi (hafif, samimi küfür).","b7.18":"'Egal' = boş ver, fark etmez; 'eine' burada 'bir tane (poşet)' yerine zamir gibi kullanılır.","b8.0":"'endlich' = sonunda (uzun bekleyişten sonra); 'zuletzt' ile karıştırmayın, o 'en son' demek.","b8.1":"Perfekt: schaffen haben ile kurulur, ge-...-t alır: Wie hast du das geschafft?","b8.2":"'vorlesen' = sesli okumak; Perfekt'te ge araya girer: vorgelesen; kime → Dativ ihr.","b8.3":"'Respekt!' takdir bildiren kısa, samimi bir ünlemdir, 'helal olsun' gibi.","b8.4":"'sei' sein'in du emir halidir: Sei leise!, Sei vorsichtig!; 'aufwachen' ayrılabilir.","b8.5":"'flüstern' = fısıldamak; karşıtı 'laut sprechen' ya da 'schreien'.","b8.6":"'wohl' soruya 'acaba' anlamı katar: Wie lange schläft sie wohl?","b8.7":"Cümle sonundaki ', oder?' Türkçedeki 'değil mi?' gibi onay ister.","b8.8":"'wenn' yan cümlesinde fiil sona gider: Wenn wir Glück haben; 'anderthalb' = bir buçuk.","b8.9":"Almanca şimdiki zaman yakın gelecek için de kullanılır: Was machen wir jetzt?","b8.10":"'erstmal' = önce bir; 'in Ruhe' = rahat rahat, kimse rahatsız etmeden.","b8.11":"'Soll ich ...?' = ...yapayım mı? diye yardım teklif etmenin en doğal yolu.","b8.12":"'sich hinlegen' dönüşlü ve ayrılabilir: ich lege mich hin; 'kurz' = kısa bir süre.","b8.13":"'aufräumen' ayrılabilir: ich räume auf; 'Mach das' = öyle yap, onaylayan cevap.","b8.14":"'Danke dir' samimi bir teşekkürdür; resmi karşılığı 'Danke Ihnen'.","b8.15":"Teşekküre cevap olarak 'Kein Problem' çok yaygın; benzerleri: Gern geschehen, Gerne, Passt schon.","b8.16":"'Was?' burada 'ne oldu?' demek; birini duymadığında kibarca 'Wie bitte?' denir.","b8.17":"'Ich glaub' sonrası dass'sız ana cümle sırası kalır: Ich glaub, sie ist wach.","b8.18":"'Das darf doch nicht wahr sein!' = olamaz, inanmıyorum; şaşkınlık ve bıkkınlık bildiren kalıp.","b9.0":"Ne pişirelim sorusu için şimdiki zaman yeterlidir: Was kochen wir heute?","b9.1":"'einfallen' Dativ ister: Mir fällt nichts ein = aklıma bir şey gelmiyor.","b9.2":"'Wie wär's mit ...?' + Dativ = ...ya ne dersin? öneri kalıbı.","b9.3":"Konuşmada baştaki 'das' düşebilir: (Das) hatten wir gestern schon; 'hatten' haben'in Präteritum'u.","b9.4":"'Und ...?' ile yeni öneri sunulur; bileşik isimde artikel son kelimeden: die Suppe → die Linsensuppe.","b9.5":"'warum nicht' = neden olmasın; 'Das geht schnell' = çabuk olur, uzun sürmez.","b9.6":"'noch' burada 'kaldı mı' anlamı katar: Haben wir noch ...? = hâlâ ... var mı?","b9.7":"'die Packung' = paket; ölçü: eine Packung Reis, eine Dose Tomaten, eine Flasche Milch.","b9.8":"'dazu' = yanına; 'ein bisschen wenig' = biraz az, kibarca eksik belirtme.","b9.9":"'können' modal fiildir, asıl fiil sona gider: Wir können noch Reis machen.","b9.10":"'Perfekt!' Almancada sık kullanılır ama gramerdeki Perfekt zamanıyla karıştırmayın.","b9.11":"Nesne vurgulanmak için başa alınabilir: Linsensuppe mag sie; 'zu scharf' = fazla acı.","b9.12":"'sich etwas drauf machen' = (yemeğin) üstüne kendine bir şey koymak; 'jeder' tekil fiil alır: jeder macht.","b9.13":"'schon mal' = 'sen bu arada başla' anlamı katar; 'wickeln' = bez değiştirmek.","b9.14":"'Mach ich' = tamam, yaparım; özne fiilden sonra gelir, 'Das mache ich' kısalmıştır.","b10.0":"'Kannst du mir mal ... geben?' masada bir şey istemenin en doğal kalıbıdır.","b10.1":"'Hier' bir şey uzatırken 'al' anlamındadır; 'Soll ich ...?' ile yardım teklif edilir.","b10.2":"'stellen' + auf + Akkusativ (nereye?): den Topf auf den Herd stellen.","b10.3":"'welche' dişi isimle: die Platte → welche Platte? (ocak gözü).","b10.4":"Yön kalıpları: vorne/hinten + links/rechts; 'vorne links' = ön sol.","b10.5":"'Wie viel' sayılamayan isimle: wie viel Wasser, wie viel Zeit.","b10.6":"'ungefähr' = aşağı yukarı; konuşmada 'etwa' veya 'so' da aynı anlamı verir.","b10.7":"'aufmachen' ayrılabilir: Mach das Fenster auf; karşıtı 'zumachen'.","b10.8":"'mir laufen die Tränen' Dativ ile kurulur; vücutla ilgili durumlar sık Dativ alır.","b10.9":"'übernehmen' ayrılmaz fiildir: ich übernehme; 'Soll ich übernehmen?' = ben devralayım mı?","b10.10":"'Gib mir mal ...' = bi ... ver; 'mal' emri yumuşatır, rica tonu katar.","b10.11":"'nicht zu viel' = fazla değil; 'zu' sıfattan önce 'fazla, aşırı' demek.","b10.12":"'Ja, ja' tekrarı hafif bıkkınlık ya da 'tamam anladım' tonu verir.","b10.13":"'Schmeckt's?' = Schmeckt es?; tadın güzelliğini sormak için en yaygın soru.","b10.14":"'fehlen' = eksik olmak; 'da fehlt noch ...' = içinde ... eksik.","b10.15":"'erst am Ende' = ancak en sonda; 'erst' burada 'daha önce değil' anlamı katar.","b10.16":"'müssen' modal fiil, asıl fiil 'kochen' sona gider: Wie lange muss das noch kochen?","b10.17":"'so' sayıdan önce 'kadar, civarı' anlamı verir: so zwanzig Minuten.","b10.18":"'den Tisch decken' = sofrayı kurmak; karşıtı 'den Tisch abräumen'.","b11.0":"Essen tek başına 'yemek' anlamında artikelsiz kullanılır: Essen ist fertig = sofra hazır çağrısı.","b11.1":"'Hunger haben' kalıbı: Türkçedeki 'acıktım' Almancada ich habe Hunger olur; hab konuşma dilinde habe'nin kısasıdır.","b11.2":"sich setzen dönüşlü fiildir: setz dich (sen), setzt euch (siz); yön bildirdiği için auf den Tisch Akkusativ.","b11.3":"'Maus' çocuklara sevgi sözcüğüdür; auf deinen Stuhl yön bildirdiği için Akkusativ (der Stuhl > deinen).","b11.4":"aufpassen ayrılabilen fiildir: Pass auf! emrinde auf sona gider; dikkat uyarısının en doğal yolu.","b11.5":"für'den sonra her zaman Akkusativ gelir: für sie (onun için), für mich, für dich.","b11.6":"geworden (werden'in Perfekt'i) 'olmuş' sonucunu vurgular: Der Kuchen ist gut geworden.","b11.7":"Konuşmada özne düşebilir: War Teamarbeit = Das war Teamarbeit; kısa, samimi bir cevap.","b11.8":"'eigentlich' soruda 'bu arada / peki' anlamı katar ve konuyu yumuşakça değiştirir.","b11.9":"'schlecht gelaunt' = keyifsiz; zıttı 'gut gelaunt'; insanların ruh hâli için çok kullanılır.","b11.10":"'Oh je' hafif üzüntü/acıma ünlemidir, 'eyvah, vah vah' gibi; samimi konuşmada çok yaygın.","b11.11":"'hinterherhängen' = geride kalmak, gecikmek (iş/proje için, samimi); 'Nicht meine Schuld' = suçum değil; 'egal' konuyu kapatmak için kullanılır.","b11.12":"'Hauptsache, ...' = 'önemli olan ...'; virgülden sonra normal cümle dizilişi gelir.","b11.13":"wie war's = wie war es; 'bei euch' = sizde/sizin tarafta, bei'den sonra Dativ gelir.","b11.14":"Perfekt: sehen ve rufen haben ile kurulur: hat gesehen, hat gerufen; 'die ganze Zeit' = sürekli.","b11.15":"'Wie süß!' = ne tatlı; 'wie' + sıfat ile ünlem kurulur: Wie schön! Wie toll!","b11.16":"Karşılaştırma: gut > besser als; 'als' ile kıyaslanır: besser als wir (bizden daha iyi).","b11.17":"'Wahrscheinlich' = muhtemelen; tek başına cevap olarak da kullanılır, cümlede genelde fiilden sonra gelir.","b11.18":"'noch' burada 'daha' anlamı verir: noch Suppe, noch ein Bier; modal fiil wollen ile soru.","b11.19":"'Gern' teklifi kabul etmenin kibar yoludur; 'noch ein bisschen' = biraz daha.","b12.0":"Saat: halb acht = yedi buçuk (sekize yarım var); Türkçedeki gibi düşünmek yaygın bir hatadır.","b12.1":"Präteritum: haben > hatte; konuşmada 'hat gehabt' yerine genelde 'hatte' denir.","b12.2":"vergessen + Akkusativ: Vergiss das nicht!; fiil adı büyük yazılır: das Zähneputzen.","b12.3":"Mastar emir gibi kullanılabilir: Zähne putzen! Aufstehen! Çocuklara verilen kısa komutlarda yaygın.","b12.4":"wegrennen ayrılabilen fiildir: sie rennt weg; weg ön eki 'uzağa, gitmek' anlamı katar.","b12.5":"Cümle Natürlich ile başlayınca fiil 2. sıraya geçer: Natürlich rennt sie weg; 'Hab dich!' = yakaladım.","b12.6":"'schon mal' = 'bu arada, şimdiden'; holen = gidip getirmek, Türklerin bringen ile karıştırdığı fiil.","b12.7":"'den' burada zamir: Den mit den Sternen = yıldızlı olanı (der Schlafanzug > Akkusativ den).","b12.8":"welch- artikel gibi çekimlenir: welches Buch (das), welcher Tag (der), welche Farbe (die).","b12.9":"'Das mit der Raupe' = tırtıllı olan; 'das mit + Dativ' bir şeyi özelliğiyle tarif etmenin pratik yolu.","b12.10":"'auswendig können/lernen' = ezbere bilmek/ezberlemek: Ich kann das Gedicht auswendig.","b12.11":"'ehrlich gesagt' = açıkçası; cümle başında veya sonunda itiraf tonu katar.","b12.12":"'jemanden lieb haben' sevgi ifadesi, aile ve çocuklar için; 'lieben'den daha yumuşak ve sık.","b12.13":"'Licht aus?' kısaltılmış sorudur (Soll ich das Licht ausmachen?); ausmachen = kapatmak, anmachen = açmak.","b12.14":"'anbleiben' = açık kalmak; 'an' cihazın/ışığın açık, 'aus' kapalı olduğunu gösterir: Das Licht ist an.","b12.15":"'Gute Nacht' yatmadan önce söylenir; akşam selamlaşmasında ise 'Guten Abend' kullanılır.","b12.16":"Fiilsiz yön ifadesi: (Wir gehen) jetzt leise raus; raus = heraus/hinaus'un konuşma dili hâli.","b12.17":"'jemandem die Daumen drücken' = şans dilemek deyimi; kişi Dativ olur: Drück mir die Daumen.","b13.0":"'Endlich' = nihayet, sonunda; tek kelimelik rahatlama ifadesi olarak çok kullanılır.","b13.1":"sich setzen zu + Dativ: setz dich zu mir = yanıma otur; zu'dan sonra hep Dativ gelir.","b13.2":"Konuşmada tek kelimelik sorular doğaldır: Serie? Kaffee? Pizza? Yükselen tonla sorulur.","b13.3":"'nichts' + sıfat büyük yazılır ve -es alır: nichts Schweres, nichts Neues, etwas Leckeres.","b13.4":"'Wie wär's mit + Dativ?' öneri kalıbı: Wie wär's mit einem Kaffee? = Bir kahveye ne dersin?","b13.5":"anmachen ayrılabilir: Machst du ... an?; cihaz/TV açmak için samimi ve en doğal fiil.","b13.6":"'Wo ist ...?' tekil, 'Wo sind ...?' çoğul için; die Fernbedienung = (TV) kumandası.","b13.7":"unter dem Kissen: yer bildirdiği (wo?) için Dativ; 'Guck mal' = bi bak, samimi.","b13.8":"'was' burada 'etwas'ın kısasıdır: was trinken = bir şey içmek; konuşma dilinde çok yaygın.","b13.9":"'noch' + haben: Haben wir noch ...? = Hâlâ ... var mı/kaldı mı?; Ein Wasser = bir şişe/bardak su.","b13.10":"'nur noch' = sadece ... kaldı; azalan miktarı anlatır: Ich habe nur noch fünf Euro.","b13.11":"'Auch gut' = o da olur; alternatifi rahatça kabul etmenin kısa ve samimi yolu.","b13.12":"Evet/hayır sorusunda fiil başa gelir: Schläfst du?; schlafen düzensiz: du schläfst, er schläft.","b13.13":"zumachen = kapatmak (ayrılabilir), Perfekt'te ge ortaya girer: zugemacht.","b13.14":"Perfekt: schlafen haben ile kurulur: du hast geschlafen (hareket fiili değil).","b13.15":"verpassen ayrılmaz ön ek (ver-) aldığı için Perfekt'te ge- almaz: verpasst; 'Echt?' = cidden mi?","b13.16":"'Lass uns ...' = hadi ... yapalım; ins Bett = in das Bett, yön bildirdiği için Akkusativ.","b13.17":"'Gute Idee' öneriye onay vermenin en kısa yolu; artikel olmadan söylenir.","b14.0":"'kaputt' insanlar için 'bitik, çok yorgun' anlamında da kullanılır, samimi konuşmada.","b14.1":"'nicht mehr' = artık değil; Ich kann nicht mehr = artık dayanamıyorum, çok kullanılan kalıp.","b14.2":"'oder?' cümle sonunda onay sorar (değil mi?); quengeln: çocuk mızmızlanması.","b14.3":"'Ich glaub' (glaube) sonrası dass'sız ana cümle dizilişi gelebilir: Ich glaub, sie kommt.","b14.4":"Sıfat isim olarak kullanılabilir: die Arme = zavallı (kadın/kız); der Arme erkek için.","b14.5":"Sıfat-isim çoğulda: die Armen; 'wir beide' = ikimiz, 'ihr beide' = ikiniz.","b14.6":"'Weißt du was?' fikir/sürpriz duyurmadan önce dikkat çeker; Ich bestell = ich bestelle.","b14.7":"'das wär super' (wäre) Konjunktiv II ile 'olsa süper olur' anlamı; dilek ve teşekkür tonu.","b14.8":"'oder' iki seçenek sunar: Pizza oder Döner? Tee oder Kaffee? Ses tonuyla soru yapılır.","b14.9":"'Mir egal' = bana fark etmez (Das ist mir egal); 'nicht müssen' = zorunda olmamak.","b14.10":"'dann' = o zaman; karar bildirir: Okay, dann Pizza. 'für dich' Akkusativ.","b14.11":"'ohne' + Akkusativ: ohne alles = sade, hiçbir şey koymadan; dönerde de kullanılır.","b14.12":"'Dauert' öznesi düşmüş: (Es) dauert vierzig Minuten; dauern = sürmek (zaman).","b14.13":"'solange' burada 'o arada' anlamında; gehen + mastar: duschen gehen, einkaufen gehen.","b14.14":"aufpassen auf + Akkusativ: ich passe auf Gece auf = Gece'ye göz kulak olmak.","b14.15":"'mir' burada 'benim için' anlamı katan Dativ'dir: Du rettest mir den Abend = akşamımı kurtarıyorsun.","b14.16":"müssen modal fiili mastarı sona iter: Wir müssen ... ausschlafen; 'mal' rica/plan tonu katar.","b14.17":"'Träum weiter!' = rüyanda görürsün; gerçekleşmez dileklere verilen esprili cevap.","b14.18":"'stimmt auch wieder' = o da doğru; karşı tarafın haklı olduğunu kabul ederken kullanılır.","b15.0":"Zaman ifadesi: am Wochenende (am = an dem); günler için de am Samstag, am Sonntag.","b15.1":"'Lust haben auf + Akkusativ' = canı çekmek: Hast du Lust auf Pizza? Lust auf einen Ausflug.","b15.2":"'denn' soruda merak/ilgi katar: Wohin denn? 'eigentlich schon' = aslında evet.","b15.3":"'wenn' yan cümlesinde fiil sona gider: wenn das Wetter gut ist; an den See = göle (Akkusativ).","b15.4":"der Wetterbericht = hava durumu raporu; 'sagen' haber/rapor için de kullanılır.","b15.5":"Hava için kısa notlar: Sonne, Regen; tam cümle: Am Samstag scheint die Sonne, am Sonntag regnet es.","b15.6":"'lieber' = tercih (gern > lieber > am liebsten); Dann lieber Samstag = o zaman cumartesi olsun.","b15.7":"losfahren ayrılabilir: Wann fahren wir los? = ne zaman yola çıkıyoruz; los = başlama, çıkış.","b15.8":"nach + Dativ: nach dem Mittagsschlaf; isimlerde iyelik -s ile: Geces Mittagsschlaf (kesme işaretsiz).","b15.9":"'ja' burada bilinen bir gerçeği hatırlatır (nasılsa); morgens = sabahları, sabah saatinde.","b15.10":"'Stimmt' = doğru; cümle 'im Auto' ile başlayınca fiil ikinci sıraya geçer: im Auto schläft sie.","b15.11":"mitnehmen ayrılabilir: Wir nehmen ein Picknick mit; yanında götürmek/almak demek.","b15.12":"Akkusativ: der Eimer > den Eimer; die Schaufel değişmez; 'ihre' = onun (kızın).","b15.13":"'Und am Sonntag?' kısa takip sorusu; 'Klar' = tabii, samimi onay.","b15.14":"'gar nichts' = hiç ama hiçbir şey; 'gar' olumsuzluğu güçlendirir: gar nicht, gar kein.","b15.15":"'Klingt gut/perfekt' = kulağa ... geliyor; Türkçedeki 'görünüyor' yerine Almanca 'klingen' kullanılır.","b15.16":"anrufen ayrılabilir ve Akkusativ alır: wir rufen deine Mutter an (Dativ değil!).","b15.17":"'sowieso' = zaten, nasılsa; 'per Video' = görüntülü; per + araç: per Mail, per Post.","b16.0":"warten'in emri: Warte! (du) / Wartet! (ihr); 'nicht so schnell' = o kadar hızlı değil.","b16.1":"'Lass sie' = bırak onu (karışma); lassen + Akkusativ zamir: lass mich, lass ihn.","b16.2":"'die' burada işaret zamiri: Die ist zu hoch = o çok yüksek; konuşmada sie yerine sık kullanılır.","b16.3":"mit + Dativ: mit ihr (onunla), mit ihm, mit mir; 'Keine Sorge' = merak etme.","b16.4":"'Hast du ...?' = sende ... var mı; Türkçedeki 'sende mi' için Almancada haben kullanılır.","b16.5":"in der Tasche: konum (wo?) bildirdiği için Dativ; 'ganz unten' = en altta.","b16.6":"'Na toll' ironiktir, aslında 'harika ya, bir bu eksikti' anlamında hoşnutsuzluk bildirir.","b16.7":"'doch' burada itirazı yumuşatır: Ist doch normal = canım, normal bu; 'Spaß' = şaka.","b16.8":"'Sehr witzig' çoğu zaman ironiktir: 'çok komik(!)'; ses tonuna dikkat.","b16.9":"'Schau mal' = bir bak(sana); dikkat çekmek için; schaukeln = salıncakta sallanmak.","b16.10":"anschubsen ayrılabilir: ich schubs sie an; 'ja?' cümle sonunda 'tamam mı?' anlamı verir.","b16.11":"Karşılaştırma: hoch > höher (umlaut alır); wollen modali mastarsız da kullanılabilir.","b16.12":"'nur ein bisschen' = sadece biraz; sınır koyarken veya isteği küçültürken çok kullanılır.","b16.13":"'Es wird kalt' = hava soğuyor; werden 'olmak, dönüşmek' değişimi anlatır.","b16.14":"'Spaß haben' = eğlenmek: Sie hat Spaß; 'Viel Spaß!' = iyi eğlenceler.","b16.15":"'sonst' = yoksa; sonrasında fiil hemen gelir: sonst wird sie müde (devrik dizilim).","b16.16":"'es gibt' = var; gibt's = gibt es; 'Theater' burada mecazen 'olay, ağlama-zırlama' demek.","b16.17":"'Wie immer' = her zamanki gibi; kısa ve hazır bir cevap kalıbı.","b17.0":"anfassen ayrılabilir: fass ... an; 'mal' emri yumuşatır: Fass mal an = bi dokun.","b17.1":"'Fieber haben' = ateşi olmak; Türkçedeki 'var' yerine haben kullanılır.","b17.2":"Ich mess mal = ich messe mal; 38,7 okunuşu: achtunddreißig Komma sieben.","b17.3":"'ziemlich' = epey, oldukça; sıfatı güçlendirir: ziemlich teuer, ziemlich gut.","b17.4":"'kein' isimleri olumsuzlar: keinen Appetit (der Appetit, Akkusativ > keinen).","b17.5":"sollen ile öneri sorusu: Sollen wir ...? = ... yapalım mı?; gehen fiili düşmüş (zum Arzt gehen).","b17.6":"fragen nach + Dativ: nach einem Termin fragen = randevu sormak; anrufen ayrılabilir.","b17.7":"können mastarı sona iter: Ich kann ... zur Arbeit gehen; zur = zu der (Dativ).","b17.8":"'Geht das?' = mümkün mü, olur mu?; Das geht / Das geht nicht günlük konuşmada çok yaygın.","b17.9":"schreiben + Dativ kişi: meinem Chef schreiben; der Chef > Dativ'de meinem.","b17.10":"Saat: um zehn = saat onda; zaman noktası için 'um' kullanılır.","b17.11":"die Krankenkassenkarte = sağlık sigortası kartı; doktora giderken mutlaka sorulur.","b17.12":"'die' zamir olarak kartı işaret eder; in meinem Portemonnaie: konum, Dativ (das > meinem).","b17.13":"geben iki nesne alır: ihr (Dativ, kime) + was zu trinken (Akkusativ, ne).","b17.14":"müssen + mastar sonda: Sie muss viel trinken; 'viel trinken' = bol sıvı almak.","b17.15":"'einen Schluck' = bir yudum (der Schluck > Akkusativ einen); 'Ganz toll' çocuğu övmek için.","b17.16":"'schlapp' = halsiz, takatsiz; hastalık anlatırken müde'den daha güçlü bir kelime.","b17.17":"'Das wird schon wieder' = geçer, düzelir; teselli için kalıp; gesund werden = iyileşmek.","b17.18":"'Ich hoffe es' = umarım; kısaca 'Hoffentlich' ya da konuşmada 'Ich hoff's' de denir.","b18.0":"'aussehen wie' = gibi görünmek; ayrılabilir: sieht ... aus; nach + Dativ: nach einer Party.","b18.1":"'überall' = her yer(de); das Spielzeug tekil ama toplu 'oyuncaklar' anlamında kullanılır.","b18.2":"aufräumen = toplamak, düzenlemek (ayrılabilir); geht's = geht es: daha hızlı olur.","b18.3":"sollen ile görev sorma: Was soll ich machen? = Ne yapmamı istersin?","b18.4":"'Kannst du ...?' kibar rica; aufhängen ayrılabilir ama modal fiille birlikte bitişik ve sonda kalır.","b18.5":"'Mach ich' = (Das) mache ich; isteği kabul etmenin kısa, doğal yolu.","b18.6":"wegräumen ve saugen: 'Staub saugen' süpürmek demek; 'dann' sıralama için kullanılır.","b18.7":"Çoğul soru: Wo sind ...? (sind, çünkü die Wäscheklammern çoğul).","b18.8":"neben + Dativ (konum): neben dem Wäscheständer; im = in dem.","b18.9":"runterbringen ayrılabilir: bringt den Müll runter; runter = aşağıya (herunter).","b18.10":"Perfekt: machen haben ile: ich hab's gemacht; hab's = habe es.","b18.11":"'Fair' Almancada da 'adil, haklı' anlamında yaygın; 'Okay, okay' isteksiz kabulü gösterir.","b18.12":"Almanya'da çöp ayrımı: das Altpapier = atık kâğıt (çoğu yerde mavi kutu), genel çöp ise der Restmüll.","b18.13":"'..., oder?' onay sorusu; voll = dolu, zıttı leer.","b18.14":"'Total' konuşmada 'tamamen, bayağı' anlamında güçlendirici; die ganzen = bütün o ...","b18.15":"brauchen + Akkusativ: eine Pause brauchen; nach dem Aufräumen: mastar isim yapılıp Dativ alır.","b18.16":"'genauso' = aynen böyle; 'in einer Stunde' = bir saat sonra (gelecek), vor einer Stunde = bir saat önce.","b18.17":"'dank' + Dativ (veya Genitiv) = sayesinde; çoğu zaman esprili/ironik kullanılır.","b18.18":"'Genau' = aynen, tam olarak; onaylamak için Almanların en sık kullandığı kelimelerden.","b19.0":"'Sag mal' = baksana, konu açmak için; einladen ayrılabilir ama modal fiille sonda bitişik kalır.","b19.1":"'Wen' wer'in Akkusativ hâli: Wen einladen? = kimi?; Dativ hâli 'wem'.","b19.2":"mit + Dativ: mit ihrem Sohn (der Sohn > ihrem); ihr = onların.","b19.3":"gern + fiil = severek yapmak: Sie spielt gern; mit ihm (er > Dativ ihm).","b19.4":"'Soll ich ...?' yardım önerme kalıbı: Soll ich helfen? = Yardım edeyim mi?; schreiben + Dativ.","b19.5":"'ob' (-ip -mediği) yan cümlede fiil sona gider: ob sie zum Kaffee kommen; 'so um drei' = üç gibi.","b19.6":"Perfekt: antworten haben ile: er hat geantwortet; 'kommen gern' = seve seve gelirler.","b19.7":"'Was machen wir zu essen?' = yiyecek olarak ne hazırlayalım; zu + mastar: was zu essen, was zu trinken.","b19.8":"backen = fırında pişirmek (kek, ekmek); Türkçedeki 'kek yapmak' için Almanca backen kullanılır.","b19.9":"'Seit wann?' = ne zamandan beri; seit ile Almanca şimdiki zaman kullanılır: seit wann backst du.","b19.10":"'Wie schwer kann das sein?' retorik soru; können mastarı (sein) sona iter.","b19.11":"'Sicher ist sicher' = garanti olsun deyimi; lieber = tercihen, iyisi mi.","b19.12":"beim Bäcker = bei dem Bäcker (Dativ): fırından; dükkânlar için bei kullanılır: beim Metzger.","b19.13":"'Perfekt' sıfat olarak 'harika, mükemmel' demek; zaman adı olan Perfekt ile karıştırmayın.","b19.14":"'Es klingelt' = kapı/zil çalıyor; özne 'es' kişisizdir; 'Sie sind da' = geldiler.","b19.15":"aufmachen ayrılabilir: Machst du auf?; 'die Hände voll haben' = elleri dolu olmak.","b19.16":"'Kommt rein!' ihr emri (birden çok kişiye); 'Schön, dass ihr da seid': dass ile fiil sonda.","b20.0":"liegen lassen = (yerde) bırakmak; Perfekt'te genelde iki mastarla kurulur: hast ... liegen lassen.","b20.1":"wegräumen ayrılabilir; gelecek için şimdiki zaman + gleich yeterli: ich räum sie gleich weg.","b20.2":"'Das sagst du immer' sitem kalıbı; Das ile başlayınca fiil (sagst) 2. sırada.","b20.3":"'diesmal' = bu sefer; 'wirklich' vurgu için; söz verirken sık kullanılır.","b20.4":"'..., weißt du' cümle sonunda vurgu/sitem katar: 'biliyorsun değil mi'.","b20.5":"'recht haben' = haklı olmak (küçük harfle recht); 'Tut mir leid' = özür dilerim.","b20.6":"'an jemandem hängen bleiben' = birinin üstüne kalmak; Alles bleibt an mir hängen = her şey bana kalıyor.","b20.7":"'doch' burada itiraz bildirir: Ich mach doch auch viel = ama ben de çok şey yapıyorum.","b20.8":"Nesne başa gelince fiil 2. sırada kalır: Die kleinen Sachen vergisst du; 'Ja, schon' = evet ama.","b20.9":"können mastarı sona iter: Was kann ich besser machen? Yapıcı cevap için iyi bir kalıp.","b20.10":"mitdenken = düşünerek katkı vermek, inisiyatif almak; Almancaya özgü, Türkçede tam karşılığı yok.","b20.11":"'Ich versuch's' = ich versuche es; es'in kısaltması 's olarak fiile eklenir.","b20.12":"Präteritum: sein > war; ich war gereizt = gergindim; 'gerade' burada 'az önce' anlamında.","b20.13":"'Schon gut' = önemli değil, tamam; özrü kabul ederken kullanılan samimi kalıp.","b20.14":"'her' konuşana doğru yönü gösterir: Komm her! = buraya gel; 'hin' ise uzaklaşmayı.","b20.15":"'Wollen wir ...?' = ... yapalım mı?; öneri kalıbı, wollen mastarı (trinken) sona iter.","b20.16":"'erst' = önce: Aber erst die Socken = ama önce çoraplar; erst ... dann ... sıralaması.","b20.17":"'Bin schon unterwegs' = yoldayım/geliyorum; ich düşmüş, samimi konuşmada yaygın."};
const L1PH = [{"id":"L1-001","de":"Ich weiß nicht.","tr":"Bilmiyorum.","ex":"Ich weiß nicht, ob Nisa heute Zeit hat.","note":"Her yerde, herkesle; çok sık kullanılır.","cat":"Tepki"},{"id":"L1-002","de":"Ach so.","tr":"Haa, öyle mi / anladım.","ex":"Ach so, der Laden hat heute zu.","note":"Yeni bir bilgiyi anlayınca söylenir.","cat":"Tepki"},{"id":"L1-003","de":"Danke schön!","tr":"Çok teşekkürler!","ex":"Danke schön, das ist echt lieb von Ihnen.","note":"Her ortamda; biraz daha sıcak bir teşekkür.","cat":"Tepki"},{"id":"L1-004","de":"Bitte schön.","tr":"Buyurun / rica ederim.","ex":"Bitte schön, Ihr Kaffee.","note":"Bir şey uzatırken ya da teşekküre cevap.","cat":"Tepki"},{"id":"L1-005","de":"Na klar.","tr":"Tabii ki / elbette.","ex":"Na klar helfe ich dir beim Umzug.","note":"Samimi; isteğe içten 'evet' demek.","cat":"Tepki"},{"id":"L1-006","de":"Was ist los?","tr":"Ne oldu? / Ne var?","ex":"Gece weint so – was ist los?","note":"Bir terslik sezince sorulur.","cat":"Sohbet"},{"id":"L1-007","de":"Wie geht's?","tr":"Nasılsın?","ex":"Hallo Herr Weber, wie geht's Ihnen?","note":"Selamlaşmada; samimi ya da yarı resmi.","cat":"Sohbet"},{"id":"L1-008","de":"Tut mir leid.","tr":"Özür dilerim / üzgünüm.","ex":"Tut mir leid, ich hab dich nicht gesehen.","note":"Özür ya da kötü bir habere üzüntü ('Das tut mir leid.'); her ortamda. Başsağlığı için 'Mein Beileid.' denir.","cat":"Duygu"},{"id":"L1-009","de":"Entschuldigung, …","tr":"Pardon, … / Affedersiniz, …","ex":"Entschuldigung, wo sind hier die Windeln?","note":"Yabancıya hitap ederken ya da yol isterken.","cat":"Rica"},{"id":"L1-010","de":"Moment mal.","tr":"Bir dakika / dur bakalım.","ex":"Moment mal, das stimmt doch nicht.","note":"Araya girerken ya da itiraz ederken.","cat":"Tepki"},{"id":"L1-011","de":"Ich weiß.","tr":"Biliyorum.","ex":"Ich weiß, ich bin spät dran.","note":"Karşıdakinin söylediğini zaten bildiğinde.","cat":"Tepki"},{"id":"L1-012","de":"Stimmt.","tr":"Doğru.","ex":"Stimmt, morgen ist ja Feiertag.","note":"Hak verirken; kısa ve çok yaygın.","cat":"Tepki"},{"id":"L1-013","de":"Doch!","tr":"Var! / Öyle! (olumsuz soruya 'evet' cevabı)","ex":"„Du hast keinen Schlüssel?“ – „Doch!“","note":"Olumsuz soruya/iddiaya 'evet' itirazı.","cat":"Tepki"},{"id":"L1-014","de":"Nee.","tr":"Yok. / Hayır.","ex":"„Hast du schon gegessen?“ – „Nee, noch nicht.“","note":"Konuşmada 'nein' yerine en sık söylenen biçim; samimi.","cat":"Tepki"},{"id":"L1-015","de":"…, oder?","tr":"…, değil mi?","ex":"Das war ein schöner Tag, oder?","note":"Cümle sonunda onay beklerken.","cat":"Sohbet"},{"id":"L1-016","de":"Sag mal, …","tr":"Baksana, … / Söylesene, …","ex":"Sag mal, kommst du heute später nach Hause?","note":"Samimi; soru sormadan önce dikkat çeker.","cat":"Sohbet"},{"id":"L1-017","de":"Guck mal!","tr":"Bak! / Baksana!","ex":"Guck mal, Gece, ein Hund!","note":"Bir şeyi göstermek için; çocukla çok sık.","cat":"Ev & aile"},{"id":"L1-018","de":"Na ja.","tr":"Eh işte / şey…","ex":"Na ja, das Wetter war nicht so toll.","note":"Kararsızlık ya da hafif hayal kırıklığı.","cat":"Tepki"},{"id":"L1-019","de":"Bis später!","tr":"Sonra görüşürüz!","ex":"Ich geh kurz einkaufen. Bis später!","note":"Aynı gün tekrar görüşecekken.","cat":"Zaman & plan"},{"id":"L1-020","de":"Sorry!","tr":"Pardon! / Kusura bakma!","ex":"Sorry, hab deine Nachricht erst jetzt gesehen.","note":"Konuşmada 'Entschuldigung'dan daha sık kullanılan, hafif ve samimi özür.","cat":"Tepki"},{"id":"L1-021","de":"Oh Mann!","tr":"Off ya! / Hay aksi!","ex":"Oh Mann, der Bus ist schon weg.","note":"Sinir ya da hayal kırıklığı; samimi.","cat":"Duygu"},{"id":"L1-022","de":"Wie bitte?","tr":"Efendim? / Anlamadım?","ex":"Wie bitte? Ich hab Sie nicht verstanden.","note":"Duyamayınca kibarca sorulur.","cat":"Sohbet"},{"id":"L1-023","de":"Gerne!","tr":"Seve seve! / Rica ederim!","ex":"„Danke fürs Helfen!“ – „Gerne!“","note":"Teşekküre cevap ya da teklifi kabul.","cat":"Tepki"},{"id":"L1-024","de":"Nein, danke.","tr":"Hayır, teşekkürler.","ex":"„Möchten
