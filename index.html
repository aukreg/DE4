<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3654F4">
<title>Gedsches Deutsch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gedsche">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Rubik:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FB; --bg2:#FFFFFF; --bg3:#EAEDF6; --bg4:#DCE1EE;
  --line:#DFE3EF; --tx:#171B36; --tx2:#5A6080; --tx3:#8A90AE;
  --acc:#3654F4; --acc2:#2B47E0; --acc-s:#2338B8; --acc-d:#E6EAFE; --onacc:#FFFFFF;
  --ok:#1FAF6E; --ok-s:#138552; --ok-d:#E2F7EC; --bad:#EE4F57; --bad-s:#BF2F37; --bad-d:#FDE7E8;
  --blue:#0E8FD6; --blue-d:#E0F2FE; --amber:#FFA928; --amber-s:#D9821A; --amber-d:#FFF2DC;
  --violet:#8B5CF6; --teal:#14B8A6; --rose:#F43F5E; --nav:#171B36;
  --grad:linear-gradient(var(--acc),var(--acc));
  --sh:0 2px 0 var(--line);
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --disp:"Rubik",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --r:18px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1020; --bg2:#181B2E; --bg3:#22263D; --bg4:#2E3350;
  --line:#272B44; --tx:#EEF0FB; --tx2:#A3A9C9; --tx3:#6E7497;
  --acc:#6A82FF; --acc2:#8095FF; --acc-s:#3F55D6; --acc-d:#20264A; --onacc:#FFFFFF;
  --ok:#2FCB84; --ok-s:#1B9A60; --ok-d:#12301F; --bad:#FF6B72; --bad-s:#C93C44; --bad-d:#3A171B;
  --blue:#5CC3FF; --blue-d:#102A3D; --amber:#FFB547; --amber-s:#C9831F; --amber-d:#3A2A10;
  --violet:#A78BFA; --teal:#2DD4BF; --rose:#FB7185; --nav:#22263D;
  --grad:linear-gradient(var(--acc),var(--acc));
  --sh:0 2px 0 var(--line);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1020; --bg2:#181B2E; --bg3:#22263D; --bg4:#2E3350;
  --line:#272B44; --tx:#EEF0FB; --tx2:#A3A9C9; --tx3:#6E7497;
  --acc:#6A82FF; --acc2:#8095FF; --acc-s:#3F55D6; --acc-d:#20264A; --onacc:#FFFFFF;
  --ok:#2FCB84; --ok-s:#1B9A60; --ok-d:#12301F; --bad:#FF6B72; --bad-s:#C93C44; --bad-d:#3A171B;
  --blue:#5CC3FF; --blue-d:#102A3D; --amber:#FFB547; --amber-s:#C9831F; --amber-d:#3A2A10;
  --violet:#A78BFA; --teal:#2DD4BF; --rose:#FB7185; --nav:#22263D;
  --grad:linear-gradient(var(--acc),var(--acc));
  --sh:0 2px 0 var(--line);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
textarea,input{font:inherit;color:var(--tx)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* üst bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px;padding-top:env(safe-area-inset-top)}
.top h1{font-size:20px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tx2)}
.ib:active{background:var(--bg3)}
.ib svg{width:22px;height:22px}
.streak{cursor:pointer;display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;color:var(--tx3);padding:0 6px}
.streak.on{color:var(--acc2)}

/* alt menü */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:64px;padding:0 6px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--tx3)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--acc)}
body.full .nav{display:none}
body.full{padding-bottom:env(safe-area-inset-bottom)}

/* genel */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin:26px 2px 10px}
.muted{color:var(--tx2)}
.small{font-size:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:15px;background:var(--grad);color:var(--onacc);font-weight:700;font-size:17px;box-shadow:0 12px 30px -10px rgba(255,160,60,.45)}
.cta:active{transform:scale(.985)}
.cta[disabled]{opacity:.45;box-shadow:none}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;background:var(--bg3);font-weight:600;color:var(--tx)}
.btn2:active{background:var(--bg4)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--bg3);border-radius:12px;padding:4px;gap:4px;margin:4px 0 6px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--tx2)}
.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:var(--sh)}
.empty{text-align:center;color:var(--tx2);padding:28px 18px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* Bugün */
.hello{margin:6px 2px 16px}
.hello .d{color:var(--tx3);font-size:14px;font-weight:600}
.hello .t{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.ring{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px}
.ring .bar{flex:1;height:10px;border-radius:6px;background:var(--bg3);overflow:hidden}
.ring .bar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .4s}
.ring b{font-size:15px;white-space:nowrap}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.step{display:flex;align-items:center;gap:14px;padding:14px 14px;text-align:left;width:100%}
.step .ic{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--bg3);font-size:21px}
.step .tx{flex:1;min-width:0}
.step .tx b{display:block;font-size:16px}
.step .tx span{display:block;font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--bg4);display:grid;place-items:center}
.step.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done .tx b{color:var(--tx2)}
.step.next{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset,var(--sh)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--acc-d);color:var(--acc);margin-left:6px;vertical-align:2px}

/* kalıp listesi */
.plist{display:flex;flex-direction:column}
.pi{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.pi:last-child{border-bottom:0}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--bg4)}
.dot.s1{background:var(--acc)}.dot.s2{background:var(--ok)}
.pi .de{font-weight:600;font-size:16px}
.pi .tr{color:var(--tx2);font-size:14px}
.pi .ex{display:none;margin-top:6px;font-size:14px;color:var(--tx2);font-style:italic}
.pi.open .ex{display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--tx2);margin:8px 2px 0}
.legend span{display:flex;align-items:center;gap:6px}.legend .dot{margin:0}

/* alıştırma */
.ptop{display:flex;align-items:center;gap:10px;padding:10px 0}
.pbar{flex:1;height:8px;border-radius:5px;background:var(--bg3);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad);transition:width .3s}
.phase{font-size:13px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin:10px 0 14px}
.flash{padding:28px 20px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.flash .big{font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.flash .mid{font-size:18px;color:var(--tx2)}
.flash .ex{font-size:15px;color:var(--tx2);font-style:italic;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.say{display:inline-flex;align-items:center;gap:6px;align-self:center;padding:8px 14px;border-radius:20px;background:var(--bg3);font-weight:600;font-size:14px;color:var(--tx2)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{padding:15px 16px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--line);text-align:left;font-weight:600;font-size:16px}
.opt.good{border-color:var(--ok);background:var(--ok-d)}
.opt.bad{border-color:var(--bad);background:var(--bad-d)}
.mic{width:84px;height:84px;border-radius:50%;background:var(--grad);color:var(--onacc);display:grid;place-items:center;margin:18px auto 8px;box-shadow:0 12px 30px -10px rgba(255,160,60,.5)}
.mic svg{width:34px;height:34px}
.mic.rec{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.typed{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);padding:12px 14px;font-size:17px;margin-top:12px}
.verdict{margin-top:14px;padding:14px;border-radius:14px;font-size:15px}
.verdict.good{background:var(--ok-d);color:var(--ok)}
.verdict.bad{background:var(--bad-d);color:var(--bad)}
.verdict b{display:block;color:var(--tx);margin-top:4px;font-size:16px}
.foot{position:sticky;bottom:0;padding:12px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);margin-top:16px}

/* diyalog okuyucu */
.chap{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.chap:last-child{border-bottom:0}
.chap .no{flex:none;width:34px;height:34px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--tx2)}
.chap.read .no{background:var(--ok-d);color:var(--ok)}
.chap .tx{flex:1;min-width:0}
.chap .tx b{display:block;font-weight:600}
.chap .tx span{font-size:13.5px;color:var(--tx2)}
.chap .cnt{font-size:12px;color:var(--tx3);font-weight:600}
.hero{padding:18px;margin-bottom:6px}
.hero .k{font-size:13px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.hero .h{font-size:21px;font-weight:700;margin:4px 0 2px}
.hero .s{color:var(--tx2);font-size:14px;margin-bottom:14px}
.desc{padding:14px 16px;font-size:15px;color:var(--tx2);margin-bottom:10px}
.msgs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;background:var(--bg2);border:1px solid var(--line);align-self:flex-start;text-align:left;position:relative}
.msg.me{align-self:flex-end;background:var(--acc-d);border-color:transparent}
.msg .who{font-size:12px;font-weight:700;color:var(--tx3);margin-bottom:2px}
.msg .de{font-size:16.5px}
.msg .tr{display:none;font-size:14px;color:var(--tx2);margin-top:4px}
.msg.showtr .tr{display:block}
.msg.hide .de{filter:blur(7px);user-select:none}
.msg.hide .tr{display:block;color:var(--tx)}
.msg.cur{outline:2px solid var(--acc);outline-offset:2px}
.msg.wait{outline:2px dashed var(--acc);outline-offset:2px}
.hint{font-size:13px;color:var(--tx3);text-align:center;margin:10px 0 0}
.klist{padding:6px 0}
.klist div{display:flex;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:15px}
.klist div:last-child{border-bottom:0}
.klist b{font-weight:600}
.klist span{color:var(--tx2)}
.tip{padding:14px 16px;font-size:14.5px;background:var(--blue-d);color:var(--tx);border-radius:14px;margin-top:12px}
.tip b{color:var(--blue)}

/* yazı */
.prompt{padding:18px}
.prompt .k{font-size:13px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.prompt .h{font-size:20px;font-weight:700;margin:6px 0}
.prompt .st{font-size:15px;color:var(--tx2);font-style:italic}
textarea.write{width:100%;min-height:220px;margin-top:12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--bg2);padding:14px 16px;font-size:17px;line-height:1.55;resize:vertical}
textarea.write:focus,.typed:focus{outline:none;border-color:var(--acc)}
.wc{display:flex;justify-content:space-between;font-size:13px;color:var(--tx3);margin:8px 2px 12px}
.mist{padding:14px 16px;border-bottom:1px solid var(--line)}
.mist:last-child{border-bottom:0}
.mist .w{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.mist .r{color:var(--ok);font-weight:600;margin-top:2px}
.mist .rule{font-size:14px;color:var(--tx2);margin-top:4px}
.wr{padding:14px 16px;border-bottom:1px solid var(--line)}
.wr:last-child{border-bottom:0}
.wr .dt{font-size:13px;color:var(--tx3);font-weight:600}
.wr .nat{margin-top:6px;font-size:15.5px}
.wr details{margin-top:6px;font-size:14px;color:var(--tx2)}

/* ayarlar */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .in{background:var(--bg2);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto}
.sheet h2{font-size:19px;margin:4px 2px 12px}
.sheet .lbl{font-size:14px;font-weight:600;color:var(--tx2);margin:14px 2px 4px}
.sheet .row2{margin-top:8px}

/* Claude: düzeltme ve sohbet */
.ai{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
.fixbox{margin-top:14px;padding:16px}
.fixbox .nat{font-size:17px;line-height:1.55}
.fixbox .note{font-size:14.5px;color:var(--tx2);margin-top:10px}
.linkbtn{display:block;margin:10px auto 0;font-size:14px;font-weight:600;color:var(--tx2);text-decoration:underline;text-underline-offset:3px}
.thinking{color:var(--tx3);font-style:italic}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chat .fix{align-self:flex-end;max-width:86%;font-size:13.5px;color:var(--ok);background:var(--ok-d);padding:6px 12px;border-radius:12px}
.chatin{display:flex;gap:8px;align-items:flex-end}
.chatin textarea{flex:1;min-width:0;min-height:50px;max-height:140px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);padding:12px 14px;font-size:16px;resize:none}
.chatin textarea:focus{outline:none;border-color:var(--acc)}
.chatin .cta{width:auto;min-width:64px;min-height:50px;padding:0 16px;font-size:16px}

/* seçim çipleri ve mod ızgarası */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:19px;background:var(--bg3);font-weight:600;font-size:14px;color:var(--tx2);border:1.5px solid transparent}
.chip.on{background:var(--acc-d);color:var(--acc);border-color:var(--acc)}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.grp{font-size:12.5px;font-weight:700;color:var(--tx3);margin:14px 2px 8px;letter-spacing:.03em}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:74px;padding:8px 4px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--tx2);text-align:center}
.mode i{font-style:normal;font-size:22px}
.mode.on{border-color:var(--acc);color:var(--tx);background:var(--acc-d)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:15px 14px;text-align:left;min-height:104px}
.tile .ic{font-size:24px}
.tile b{font-size:15.5px}
.tile span{font-size:13px;color:var(--tx2);line-height:1.35}
.tile .best{margin-top:auto;font-size:12px;font-weight:700;color:var(--acc)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0}
.tile.wide .tx{flex:1}
.tile.wide .tx b,.tile.wide .tx span{display:block}

/* kelime kutucukları (sırala) */
.built{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:12px;border-radius:14px;border:1.5px dashed var(--bg4);margin-top:14px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.wd{padding:10px 13px;border-radius:11px;background:var(--bg2);border:1.5px solid var(--line);font-weight:600;font-size:16px;box-shadow:var(--sh)}
.wd.used{visibility:hidden}
.built .wd{background:var(--acc-d);border-color:transparent;box-shadow:none}
.gapw{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--acc);color:var(--acc)}
.tfbtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfbtn button{min-height:60px;border-radius:15px;font-weight:700;font-size:17px}
.tfbtn .y{background:var(--ok-d);color:var(--ok)}
.tfbtn .n{background:var(--bad-d);color:var(--bad)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.mc{min-height:66px;padding:10px;border-radius:13px;background:var(--bg2);border:1.5px solid var(--line);font-weight:600;font-size:14.5px;line-height:1.3}
.mc.sel{border-color:var(--acc);background:var(--acc-d)}
.mc.done{opacity:.25;pointer-events:none}
.mc.bad{border-color:var(--bad);background:var(--bad-d)}
.mc.back{background:var(--bg3);color:transparent}

/* oyun üst bilgisi */
.hud{display:flex;justify-content:space-between;align-items:center;margin:12px 2px}
.hud b{font-size:22px}
.hud .t{font-size:22px;font-weight:700;color:var(--acc)}
.hud .t.low{color:var(--bad)}

/* oynatıcı */
.player{padding:26px 20px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.player .de{font-size:25px;font-weight:700;line-height:1.3}
.player .tr{font-size:17px;color:var(--tx2)}
.player .who{font-size:12.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.ctrl{display:flex;justify-content:center;align-items:center;gap:22px;margin:20px 0 6px}
.ctrl button{width:56px;height:56px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-size:20px}
.ctrl .pp{width:76px;height:76px;background:var(--grad);color:var(--onacc);font-size:28px;box-shadow:0 12px 30px -10px rgba(255,160,60,.5)}
.phase2{font-size:13px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opts2 .opt{text-align:center;font-size:15px}
textarea.imp{width:100%;min-height:90px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg3);padding:10px;font-size:13px}

.mic.on{background:var(--bad);animation:micp 1s ease-in-out infinite}
@keyframes micp{50%{transform:scale(1.08)}}
.autobar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.28);animation:autob linear forwards}
@keyframes autob{to{width:100%}}
/* düşen kelime oyunları */
.drop{position:relative;height:max(380px,calc(100dvh - 250px));border-radius:var(--r);background:var(--bg2);border:1px solid var(--line);overflow:hidden;touch-action:manipulation;user-select:none}
.dw{position:absolute;top:0;left:50%;z-index:2;padding:9px 16px;border-radius:14px;background:var(--bg4);border:1.5px solid var(--line);text-align:center;transition:left .18s ease;box-shadow:var(--sh);white-space:nowrap}
.dw b{display:block;font-size:20px}
.dw span{display:block;font-size:12.5px;color:var(--tx2)}
.dw.ok{border-color:var(--ok);background:var(--ok-d)}
.dw.no{border-color:var(--bad);background:var(--bad-d)}
.gates{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}
.gate{padding:16px 6px;border-radius:12px;font-weight:700;font-size:17px;background:var(--bg3);border:1.5px solid var(--line)}
.gates .g0{color:var(--blue)} .gates .g1{color:var(--bad)} .gates .g2{color:var(--ok)}
.gate.good{background:var(--ok-d);border-color:var(--ok);color:var(--ok)}
.gate.bad{background:var(--bad-d);border-color:var(--bad);color:var(--bad)}
.grow{position:absolute;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 6px;opacity:.35;transition:opacity .2s}
.grow small{position:absolute;left:10px;top:-17px;font-size:11px;color:var(--tx3)}
.grow .gate{font-size:15px;padding:11px 4px}
.grow.on{opacity:1}
.grow.on .gate{border-color:var(--acc)}
.grow.done{opacity:.6}
.dbreak{position:absolute;inset:0;z-index:3;background:var(--bg2);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px;text-align:center}
.dbreak[hidden]{display:none}
.dbreak .big{font-size:22px;font-weight:700}
.dbreak .big u{text-decoration-color:var(--bad);text-decoration-thickness:3px;text-underline-offset:4px}
.dbreak .mid{color:var(--tx2)}
.dbreak .ex{font-size:15px;font-style:italic;border-top:1px solid var(--line);padding-top:12px}
.dw.pop{animation:dpop .26s ease-out forwards}
@keyframes dpop{to{scale:1.6;opacity:0}}
/* oyun ekranı: içerik ortada, seçenekler başparmağın altında */
body.game #view{display:flex;flex-direction:column;min-height:calc(100dvh - 58px - env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
body.game #view > .flash{margin-top:auto;margin-bottom:auto}
body.game #view > .flash ~ .flash{margin-top:14px}
body.game .gpush{margin-top:auto}
body.game #view > .hud{margin:10px 2px 12px}
body.game .opt{min-height:62px!important;font-size:16.5px}
body.game .opts,body.game .opts2,body.game .tfbtn{margin-top:16px}
body.game .tfbtn button{min-height:72px}
body.game button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
body.game .foot{margin-top:12px}
body.game #view > .hint:last-child{margin-bottom:4px}
/* eşleştirme ızgarası */
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gt{aspect-ratio:1/1.05;border-radius:16px;padding:6px;display:grid;place-items:center;background:var(--bg2);border:1.5px solid var(--line);color:var(--tx2);font-weight:600;font-size:13.5px;line-height:1.2;box-shadow:var(--sh);transition:transform .12s,background .15s,opacity .25s}
.gt span{overflow-wrap:anywhere;hyphens:auto}
.gt.de{background:var(--blue-d);border-color:color-mix(in srgb,var(--blue) 35%,transparent);color:var(--tx);font-size:14.5px}
.gt:active{transform:scale(.95)}
.gt.sel{background:var(--acc-d);border-color:var(--acc);color:var(--tx);transform:scale(1.04)}
.gt.hit{background:var(--ok-d);border-color:var(--ok);color:var(--ok);animation:gthit .28s ease-out forwards}
@keyframes gthit{to{transform:scale(.6);opacity:0}}
.gt.bad{background:var(--bad-d);border-color:var(--bad);animation:gtshake .35s}
@keyframes gtshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gt.gone{visibility:hidden}
.glg{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--bg2);border:1.5px solid var(--line);vertical-align:-1px}
.glg.de{background:var(--blue-d);border-color:var(--blue)}
body.game .toast{bottom:auto;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-12px)}
body.game .toast.show{transform:translateX(-50%)}
body.game .wd{min-height:46px}
body.game .pool{gap:7px}
/* örnek cümle: Almanca + Türkçesi */
.ex .ext{display:block;font-style:normal;color:var(--tx3);font-size:13.5px;margin-top:3px}
.exa{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.exa .ex{border:0;padding:0;margin:0;font-size:15px;color:var(--tx);font-style:normal;line-height:1.35}
.exa .exk{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-right:4px}
/* bildirimler üstte: alttaki düğmeleri kapatmasın */
.toast{bottom:auto;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-12px)}
#st{padding:10px 4px;min-height:40px}
.verdict .wi b{display:inline;margin:0;font-size:inherit}

/* ================= YENİ TASARIM: kobalt, basılan düğmeler, çizgi ikonlar ================= */
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em;flex:none}
.lgt{display:inline-grid;place-items:center;font:800 .62em/1 var(--disp);letter-spacing:.04em;padding:.28em .38em;border-radius:.4em;vertical-align:.12em}
.lgt{background:var(--acc);color:#fff}
.emo{font-size:1em}
h1,h2,h3,.big,.hello .t,.hero .h,.prompt .h,.tile b,.chap .tx b,.player .de{font-family:var(--disp)}
.t-acc{--t:var(--acc)} .t-ok{--t:var(--ok)} .t-amber{--t:var(--amber)} .t-violet{--t:var(--violet)} .t-rose{--t:var(--rose)} .t-teal{--t:var(--teal)} .t-blue{--t:var(--blue)}

/* üst bar */
.top{background:color-mix(in srgb,var(--bg) 90%,transparent)}
.top h1{font-size:22px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:999px;background:var(--bg2);border:1.5px solid var(--line);font:700 14px var(--disp);color:var(--tx3)}
.pill svg.i{width:16px;height:16px}
.pill.fl.on{color:var(--amber-s);border-color:color-mix(in srgb,var(--amber) 40%,var(--line))}
.pill.fl.on svg{color:var(--amber)}
.pill.xp{color:var(--acc)}
.pill.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.18)}}
.ib{color:var(--tx3)}

/* yüzen alt menü + Başla */
body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.nav{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--nav);border:0;border-radius:26px;padding-bottom:0;max-width:536px;margin:0 auto;box-shadow:0 14px 30px -12px rgb(15 20 50/.45)}
.nav .wrap{grid-template-columns:1fr 1fr 76px 1fr 1fr;height:66px;padding:0 6px;position:relative}
.nav button[data-tab]{color:rgb(255 255 255/.55);font:600 11px var(--body);gap:4px}
.nav button[data-tab] svg.i{width:23px;height:23px}
.nav button[data-tab].on{color:#fff}
.nav button[data-tab].on span{position:relative}
.nav button[data-tab].on span::after{content:"";position:absolute;left:50%;bottom:-6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff}
.fab{position:absolute;left:50%;top:-20px;transform:translateX(-50%);width:64px;height:64px;border-radius:22px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 var(--acc-s),0 0 0 6px var(--bg);transition:transform .08s,box-shadow .08s}
.fab svg.i{width:28px;height:28px;margin-left:3px}
.fab:active{transform:translateX(-50%) translateY(5px);box-shadow:0 0 0 var(--acc-s),0 0 0 6px var(--bg)}
body.full{padding-bottom:env(safe-area-inset-bottom)}

/* kartlar ve düğmeler */
.card{border-radius:var(--r);box-shadow:0 2px 0 var(--line)}
.sec{font:700 12.5px var(--body);letter-spacing:.1em;color:var(--tx3)}
.cta{background:var(--acc);color:#fff;box-shadow:0 4px 0 var(--acc-s);font-family:var(--disp);font-weight:700;letter-spacing:.02em;border-radius:16px;transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(4px);box-shadow:0 0 0 var(--acc-s)}
.cta[disabled]{box-shadow:0 4px 0 var(--acc-s)}
.btn2{background:var(--bg2);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn2:active{background:var(--bg2);transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.opt{border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:16px;transition:transform .08s,box-shadow .08s,background .15s}
.opt:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.opt.good{border-color:var(--ok);background:var(--ok-d);color:var(--ok-s);box-shadow:0 3px 0 var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-d);color:var(--bad-s);box-shadow:0 3px 0 var(--bad);animation:shake .35s}
:root[data-theme="dark"] .opt.good{color:var(--ok)} :root[data-theme="dark"] .opt.bad{color:var(--bad)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.good{color:var(--ok)} :root:not([data-theme="light"]) .opt.bad{color:var(--bad)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.chip{background:var(--bg2);border:2px solid var(--line);color:var(--tx2)}
.chip.on{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
.mode{border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:16px}
.mode i svg.i{width:24px;height:24px;color:var(--acc)}
.mode.on{border-color:var(--acc);box-shadow:0 3px 0 var(--acc)}
.tile{border-radius:18px}
.tile .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--t,var(--acc)) 14%,transparent);color:var(--t,var(--acc));font-size:20px;flex:none}
.tile .ic svg.i{width:22px;height:22px}
.wd{border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:13px;transition:transform .08s}
.wd:active{transform:translateY(3px);box-shadow:none}
.built .wd{background:var(--acc-d);border-color:var(--acc);box-shadow:0 3px 0 var(--acc);color:var(--tx)}
.built{border:2px dashed var(--bg4);border-radius:16px}
.tfbtn button{box-shadow:0 4px 0 currentColor;transition:transform .08s,box-shadow .08s}
.tfbtn button:active{transform:translateY(4px);box-shadow:none}
.tfbtn .y{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-s)}
.tfbtn .n{background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-s)}
.mc{border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:15px}
.mc.sel{border-color:var(--acc);box-shadow:0 3px 0 var(--acc)}
.seg{background:var(--bg3);border-radius:14px}
.seg button.on{box-shadow:0 2px 0 var(--line)}
.typed,textarea.write{border:2px solid var(--line);border-radius:16px}
.mic,.ctrl .pp{background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc-s)}
.mic.on{background:var(--bad);box-shadow:0 5px 0 var(--bad-s)}
.say{background:var(--acc-d);color:var(--acc)}
.dot.s1{background:var(--amber)}
.msg.me{background:var(--acc-d)}
.tag{background:var(--acc-d);color:var(--acc)}
.endi{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 6px;border-radius:26px;background:var(--amber);color:#fff;box-shadow:0 5px 0 var(--amber-s);font-size:40px}
.endi svg.i{width:44px;height:44px}

/* alıştırma ekranı */
body.sess .top{display:none}
body.sess #view{padding-top:env(safe-area-inset-top)}
.ptop{gap:12px;padding:14px 0 6px}
.ptop .px{width:36px;height:36px;margin-left:-6px}
.ptop .px svg.i{width:24px;height:24px}
.pbar{height:14px;border-radius:99px}
.pbar i{background:var(--ok);border-radius:99px;box-shadow:inset 0 -4px 0 rgb(0 0 0/.12),inset 0 3px 0 rgb(255 255 255/.25);transition:width .45s cubic-bezier(.3,1.4,.6,1)}
.pcnt{font:700 13px var(--disp);color:var(--tx3)}
.phase{font:700 13px var(--body);letter-spacing:.06em;margin:6px 0 10px;display:flex;align-items:center;justify-content:center;gap:6px}
.phase svg.i{width:16px;height:16px}
.flash{border-radius:22px}
.flash .big{font-size:29px}
/* alttan açılan sonuç paneli */
.rsheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;padding:16px 16px calc(14px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;animation:rsin .26s cubic-bezier(.2,.9,.3,1.1)}
.rsheet.good{background:var(--ok-d)} .rsheet.bad{background:var(--bad-d)}
@keyframes rsin{from{transform:translateY(100%)}}
.rsheet .rsi{position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.rsheet.good .rsi{background:var(--ok)} .rsheet.bad .rsi{background:var(--bad)}
.rsheet .rsi svg.i{width:18px;height:18px;stroke-width:3}
.rsheet #vd{padding-left:40px;min-height:30px}
.rsheet .verdict{background:none!important;padding:0;margin:0;font:800 20px var(--disp);line-height:30px}
.rsheet .verdict.good{color:var(--ok)} .rsheet .verdict.bad{color:var(--bad)}
.rsheet .verdict b{font:600 17px/1.35 var(--disp);margin-top:2px}
.rsheet .verdict .muted,.rsheet .verdict span{font:500 14px/1.4 var(--body);color:var(--tx2)}
.rsheet .verdict .wi{font-weight:500;line-height:1.5}
.rsheet .exa{background:var(--bg2);border:0;margin-top:10px}
.rsheet .foot{position:static;background:none;padding:0;margin-top:12px}
.rsheet.good .cta{background:var(--ok);box-shadow:0 4px 0 var(--ok-s)}
.rsheet.bad .cta{background:var(--bad);box-shadow:0 4px 0 var(--bad-s)}
.rsheet.good .cta:active,.rsheet.bad .cta:active{box-shadow:none}
.rsheet .btn2{background:var(--bg2)}
body.rs-open #view{padding-bottom:280px}
body.rs-open .opt:not(.good):not(.bad){opacity:.5}

/* kutlama */
.fin{position:relative;display:grid;justify-items:center;text-align:center;gap:12px;padding:56px 8px 20px;min-height:calc(100dvh - 140px);align-content:center}
.fin .badge{width:104px;height:104px;border-radius:32px;background:var(--amber);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--amber-s);transform:rotate(-6deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.fin .badge svg.i{width:54px;height:54px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.fin h2{font-size:30px;font-weight:800;color:var(--amber-s);margin:6px 0 0}
:root[data-theme="dark"] .fin h2{color:var(--amber)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fin h2{color:var(--amber)}}
.fin p{margin:0;color:var(--tx2)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-width:380px;margin-top:10px}
.stats3 > div{border:2.5px solid var(--t);border-radius:16px;overflow:hidden;background:var(--bg2)}
.stats3 small{display:block;background:var(--t);color:#fff;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:5px 0}
.stats3 b{display:block;font:700 20px var(--disp);color:var(--t);padding:10px 0}
.stats3 .s1{--t:var(--amber)} .stats3 .s2{--t:var(--ok)} .stats3 .s3{--t:var(--acc)}
.finstreak{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--amber-s);margin-top:6px}
.finstreak svg.i{color:var(--amber)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:conf 2.4s ease-in forwards;transform:rotate(var(--r))}
@keyframes conf{to{transform:translateY(75vh) rotate(calc(var(--r) + 540deg));opacity:0}}

/* Bugün */
.hello .t{font-size:27px;font-weight:700}
.goal{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:12px}
.gring{--p:0;width:60px;height:60px;border-radius:50%;flex:none;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--bg3) 0);display:grid;place-items:center}
.gring b{width:46px;height:46px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:700 14px var(--disp)}
.gtx{flex:1;min-width:0}
.gtx b{display:block;font:600 16px var(--disp)}
.gtx span{display:block;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gxp{display:grid;justify-items:center;color:var(--acc);flex:none;line-height:1.1}
.gxp b{font:700 17px var(--disp)} .gxp span{font-size:11px;color:var(--tx3)}
.evebar{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:12px;background:linear-gradient(135deg,#1D2150,#2A1F6B);color:#fff;border:0;box-shadow:none}
.evebar svg.i{width:26px;height:26px;color:#FFD34E}
.evebar b{display:block;font-family:var(--disp)} .evebar span{font-size:13px;opacity:.8}
.unit{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:14px 16px;border-radius:20px;background:var(--acc);color:#fff;box-shadow:0 4px 0 var(--acc-s)}
.unit small{display:block;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.unit b{font:700 18px var(--disp)}
.unit svg.i{width:28px;height:28px;opacity:.9}
.path{display:flex;flex-direction:column;gap:6px;padding:18px 0 4px}
.pnode{display:flex;align-items:center;gap:14px;text-align:left;padding:6px 0 6px var(--o);position:relative}
.pdot{position:relative;width:66px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--bg2);border:2px solid var(--line);color:var(--tx3);box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s}
.pdot svg.i{width:28px;height:28px}
.pnode:active .pdot{transform:translateY(5px);box-shadow:0 0 0 var(--line)}
.pnode.done .pdot{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok-s)}
.pnode.done .pdot svg.i{stroke-width:3}
.pnode.now .pdot{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc-s),0 0 0 7px color-mix(in srgb,var(--acc) 18%,transparent)}
.pdot em{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font:700 12px var(--disp);font-style:normal;letter-spacing:.06em;color:var(--acc);background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:3px 9px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-3px)}}
.pnode.now{margin-top:22px}
.ptx{flex:1;min-width:0}
.ptx b{display:block;font:600 16px var(--disp)}
.ptx span{display:block;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnode.done .ptx b{color:var(--tx2)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.qk{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:var(--bg2);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.qk:active{transform:translateY(3px);box-shadow:none}
.qk i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 15%,transparent);color:var(--t)}
.qk i svg.i{width:21px;height:21px}
.qk b{font:600 12.5px var(--body)}
.heatc{display:block;width:100%;padding:14px;text-align:left}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat span{font:600 10.5px var(--body);color:var(--tx3);text-align:center}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--bg3)}
.heat i.h1{background:color-mix(in srgb,var(--ok) 35%,var(--bg3))}
.heat i.h2{background:color-mix(in srgb,var(--ok) 65%,var(--bg3))}
.heat i.h3{background:var(--ok)}
.heat i.f{background:transparent;border:1.5px dashed var(--line)}
.heat i.td{outline:2px solid var(--acc);outline-offset:1px}
.hl{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:10px;font-size:11px;color:var(--tx3)}
.hl i{width:11px;height:11px;border-radius:3px;background:var(--bg3)}
.hl i.h1{background:color-mix(in srgb,var(--ok) 35%,var(--bg3))} .hl i.h2{background:color-mix(in srgb,var(--ok) 65%,var(--bg3))} .hl i.h3{background:var(--ok)}

/* oyun vitrini */
.feat{display:flex;align-items:center;gap:14px;width:100%;margin-top:8px;padding:16px;border-radius:22px;text-align:left;color:#fff;background:linear-gradient(135deg,var(--violet),var(--acc));box-shadow:0 5px 0 color-mix(in srgb,var(--acc-s) 80%,#000)}
.feat:active{transform:translateY(4px);box-shadow:none}
.fi{width:58px;height:58px;border-radius:18px;background:rgb(255 255 255/.2);display:grid;place-items:center;flex:none}
.fi svg.i{width:30px;height:30px}
.ft{flex:1;min-width:0} .ft small{display:block;font-size:12px;opacity:.85} .ft b{display:block;font:700 19px var(--disp)}
.fp{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--acc);display:grid;place-items:center;flex:none}
.fp svg.i{width:20px;height:20px;margin-left:2px}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gtile{display:grid;gap:8px;justify-items:start;text-align:left;padding:12px;border-radius:18px;background:var(--bg2);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.gtile:active{transform:translateY(3px);box-shadow:none}
.gtile i,.gsheet > i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--t);color:#fff}
.gtile i svg.i{width:21px;height:21px}
.gtile b{font:600 14.5px/1.2 var(--disp)}
.gtile small{font-size:12px;font-weight:600;color:var(--tx3)}
.gsheet{display:grid;justify-items:center;text-align:center;gap:10px;padding:8px 4px 4px}
.gsheet > i{width:68px;height:68px;border-radius:22px}
.gsheet > i svg.i{width:36px;height:36px}
.gsheet h2{margin:4px 0 0;font-size:22px}
.gsheet p{margin:0;color:var(--tx2);max-width:40ch}
.gbest{display:flex;align-items:center;gap:6px;color:var(--amber-s);font-size:14px}
.gsheet .cta{margin-top:8px}
.sheet .in{border-radius:26px 26px 0 0}

/* geçişler */
@media (prefers-reduced-motion: no-preference){
  #view.enter > *:not(.rsheet):not(.drop):not(.hud){animation:vin .28s cubic-bezier(.2,.8,.3,1) both}
  body.sess #view.enter > *:not(.rsheet){animation-name:qin}
  #view.enter > *:nth-child(2){animation-delay:.03s} #view.enter > *:nth-child(3){animation-delay:.06s} #view.enter > *:nth-child(4){animation-delay:.09s} #view.enter > *:nth-child(5){animation-delay:.12s}
}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
@keyframes qin{from{opacity:0;transform:translateX(26px)}}
@media (prefers-reduced-motion: reduce){.confetti,.pdot em{animation:none!important}.rsheet{animation:none}}
body.full #xp{display:none}
/* ---- release 2: karakterler, kaydırmalı kart, sohbet, rozetler ---- */
svg.av{display:block;flex:none;border-radius:50%}
.talk{display:flex;align-items:flex-end;gap:10px;margin:6px 2px 4px}
.talk .avw{flex:none;animation:qin .35s ease}
.bub{position:relative;flex:1;background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:700;font-size:19px;line-height:1.3}
.bub small{display:block;font-size:12px;font-weight:600;color:var(--tx3);margin-bottom:3px}
.bub:before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--bg2);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.built.lined{border:0;border-radius:0;padding:6px 0;min-height:104px;background:repeating-linear-gradient(to bottom,transparent 0 50px,var(--line) 50px 52px)}
.built.lined .wd{margin-bottom:2px}
.swz{position:relative;height:300px;margin:10px 0 14px;display:grid;place-items:center}
.swl{position:absolute;top:10px;z-index:3;display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;transition:opacity .15s}
.swl svg{width:16px;height:16px}
.swl.no{left:6px;background:var(--bad);color:#fff}.swl.yes{right:6px;background:var(--ok);color:#fff}
.swz.ton .swl.no,.swz.toy .swl.yes{opacity:1}
.swc{position:relative;width:100%;height:100%;touch-action:pan-y;user-select:none;cursor:grab;perspective:900px}
.swf,.swb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center;background:var(--bg2);border:2px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);backface-visibility:hidden;transition:transform .4s ease}
.swb{transform:rotateY(180deg)}
.swc.flip .swf{transform:rotateY(-180deg)}.swc.flip .swb{transform:rotateY(0)}
.swb .ex{text-align:center}
.swbtn{display:flex;justify-content:center;align-items:center;gap:22px}
.swbtn button{width:66px;height:66px;border-radius:50%;display:grid;place-items:center}
.swbtn button svg{width:30px;height:30px}
.swbtn .n{background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-s)}
.swbtn .y{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-s)}
.swbtn .say{width:52px;height:52px;padding:0;justify-content:center}
.swbtn .n:active,.swbtn .y:active{transform:translateY(4px);box-shadow:none}
.chatgo{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:4px 0 12px}
.chatgo svg{width:20px;height:20px}
.chatlog{display:flex;flex-direction:column;gap:10px;padding:8px 0 4px}
.cmsg{display:flex;align-items:flex-end;gap:8px;max-width:88%;animation:qin .3s ease}
.cmsg.me{align-self:flex-end;flex-direction:row-reverse}
.cb{background:var(--bg2);border:2px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 13px;text-align:left;cursor:pointer}
.cmsg.me .cb{background:var(--acc);border-color:var(--acc);color:var(--onacc);border-radius:18px 18px 6px 18px}
.cb small{display:block;font-size:11.5px;font-weight:700;color:var(--tx3);margin-bottom:2px}
.cmsg.me .cb small{color:inherit;opacity:.75}
.cb .de{display:block;font-size:16.5px;font-weight:600;line-height:1.35}
.cb .tr{display:none;font-size:13.5px;opacity:.75;margin-top:3px}
.cmsg.showtr .tr{display:block}
.cb.typing{display:flex;gap:4px;padding:14px 16px}
.cb.typing i{width:8px;height:8px;border-radius:50%;background:var(--tx3);animation:tdot 1s infinite}
.cb.typing i:nth-child(2){animation-delay:.15s}.cb.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.chatch{display:flex;flex-direction:column;gap:9px;padding:6px 0 18px}
.chatch:empty{display:none}
.chq{padding:10px 12px;border-radius:14px;background:var(--acc-d)}
.chq small{display:block;font-size:12px;color:var(--tx2);font-weight:600}
.chq b{font-size:16px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.bdg i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);color:var(--tx3);border:2px solid var(--line)}
.bdg i svg{width:24px;height:24px}
.bdg.on i{background:var(--amber);color:#fff;border-color:var(--amber-s);box-shadow:0 3px 0 var(--amber-s)}
.bdg b{font-size:11.5px;font-weight:700;line-height:1.2;color:var(--tx2)}
.bdg.on b{color:var(--tx)}
.bdg small{font-size:10.5px;color:var(--tx3);line-height:1.2}
.badges.cmp .bdg i{width:46px;height:46px}
.bdgc{display:block;width:100%;padding:14px 10px;text-align:left}
@media (prefers-reduced-motion:reduce){.swf,.swb,.cmsg,.talk .avw{transition:none;animation:none}.cb.typing i{animation:none}}
.pool .wd.used{visibility:visible;color:transparent;background:var(--bg3);border-color:var(--bg3);box-shadow:none;pointer-events:none}
/* ================= SÜRÜM 3: cam görünüm, alt sekmeler, çizim ikonlar, yarasa ================= */
:root{
  --bg:#EEF1FF; --bg2:rgb(255 255 255/.66); --bg3:rgb(40 50 120/.07); --bg4:rgb(40 50 120/.13);
  --line:rgb(80 92 170/.17); --tx:#151A3A; --tx2:#4F5680; --tx3:#7D84A8;
  --solid:#FFFFFF; --glass-b:rgb(255 255 255/.85); --nav:rgb(255 255 255/.72);
  --mesh:radial-gradient(70% 45% at 0% 0%,#C9C2FF 0%,transparent 70%),radial-gradient(60% 40% at 100% 18%,#BDE9FF 0%,transparent 70%),radial-gradient(70% 45% at 30% 100%,#FFD6EC 0%,transparent 70%),radial-gradient(50% 35% at 100% 85%,#C8F5E0 0%,transparent 70%),#EEF1FF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1026; --bg2:rgb(255 255 255/.075); --bg3:rgb(255 255 255/.06); --bg4:rgb(255 255 255/.12);
    --line:rgb(255 255 255/.13); --tx:#F1F3FF; --tx2:#AEB4D8; --tx3:#7A81A8;
    --solid:#1A1F3F; --glass-b:rgb(255 255 255/.16); --nav:rgb(20 25 58/.72);
    --mesh:radial-gradient(80% 50% at 0% 0%,#4A31D6 0%,transparent 62%),radial-gradient(70% 45% at 100% 35%,#0B7FBF 0%,transparent 64%),radial-gradient(60% 40% at 20% 100%,#7A2A9E 0%,transparent 66%),#0B1026;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1026; --bg2:rgb(255 255 255/.075); --bg3:rgb(255 255 255/.06); --bg4:rgb(255 255 255/.12);
  --line:rgb(255 255 255/.13); --tx:#F1F3FF; --tx2:#AEB4D8; --tx3:#7A81A8;
  --solid:#1A1F3F; --glass-b:rgb(255 255 255/.16); --nav:rgb(20 25 58/.72);
  --mesh:radial-gradient(80% 50% at 0% 0%,#4A31D6 0%,transparent 62%),radial-gradient(70% 45% at 100% 35%,#0B7FBF 0%,transparent 64%),radial-gradient(60% 40% at 20% 100%,#7A2A9E 0%,transparent 66%),#0B1026;
}
html{background:var(--bg)}
body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--mesh);pointer-events:none}
.top{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
body.scrolled .top{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.card,.qk,.gtile,.opt,.btn2,.wd,.pill,.feat,.mode,.tile,.chip,.bt,.msg,.cb,.chap,.pi{border-color:var(--glass-b)!important}
.card{background:var(--bg2);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 8px 24px -14px rgb(30 30 90/.35)}
.sheet .in,.rsheet,.bub,.gsheet{background:var(--solid)!important}
.bub:before{background:var(--solid)}
.toast{background:var(--solid);color:var(--tx);border:1px solid var(--glass-b);box-shadow:0 10px 30px -10px rgb(0 0 0/.35)}
textarea,input[type=text],input[type=search],input:not([type]){background:var(--solid)!important}

/* çizim ikonlar */
svg.i.il{stroke:none;fill:none;width:1.35em;height:1.35em;vertical-align:-.3em}
.qk i{background:transparent!important;width:46px;height:46px}
.qk i svg.il{width:42px;height:42px}

/* B1: alt sekme çubuğu (cam) */
.nav{left:0;right:0;bottom:0;max-width:none;margin:0;border-radius:24px 24px 0 0;background:var(--nav);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid var(--glass-b);box-shadow:0 -10px 30px -18px rgb(30 30 90/.35);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{grid-template-columns:repeat(4,1fr);height:70px;padding:0 10px;gap:6px}
.nav .navgap,.nav .fab{display:none!important}
.nav button[data-tab]{color:var(--tx3);font:700 11px var(--body);gap:3px;border-radius:16px;margin:7px 0}
.nav button[data-tab] svg.i{width:30px;height:30px;transition:transform .2s}
.nav button[data-tab]:not(.on) svg.il{filter:saturate(.35);opacity:.75}
.nav button[data-tab].on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent)}
.nav button[data-tab].on svg.i{transform:translateY(-1px) scale(1.08)}
.nav button[data-tab].on span::after{display:none}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}

/* E1: yarasa */
svg.bat{display:block;flex:none}
.batrow{display:flex;align-items:flex-end;gap:10px;margin:2px 0 14px}
.batrow .bat{animation:batfloat 3.2s ease-in-out infinite}
@keyframes batfloat{50%{transform:translateY(-5px)}}
.batsay{position:relative;flex:1;background:var(--solid);border:1px solid var(--glass-b);border-radius:18px;padding:11px 14px;font:600 14.5px/1.35 var(--body);box-shadow:0 8px 20px -14px rgb(30 30 90/.4);margin-bottom:14px}
.batsay b{display:block;font:700 19px var(--disp);margin-bottom:2px}
.batsay:before{content:"";position:absolute;left:-7px;bottom:16px;width:13px;height:13px;background:var(--solid);border-left:1px solid var(--glass-b);border-bottom:1px solid var(--glass-b);transform:rotate(45deg)}

/* C3: bento pano */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.bx{position:relative;text-align:left;padding:13px;border-radius:22px;min-height:112px;display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:transform .1s}
.bx:active{transform:scale(.98)}
.bx small{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.bx b{font:700 21px var(--disp);line-height:1.15}
.bx b em{font-style:normal;font-size:13px;color:var(--tx3);font-weight:600}
.bx .s{font-size:12.5px;color:var(--tx2);line-height:1.3}
.bx .bi{position:absolute;right:8px;top:8px;width:40px;height:40px}
.bx.wide{grid-column:1/3;flex-direction:row;align-items:center;gap:14px;min-height:0;padding:16px}
.bx.hero{background:linear-gradient(135deg,#4F46E5,#3654F4 55%,#0EA5E9)!important;color:#fff;border:0!important;box-shadow:0 12px 26px -12px rgb(54 84 244/.65)}
.bx.hero small{color:rgb(255 255 255/.8)}
.bx.hero .s{color:rgb(255 255 255/.85)}
.bx.hero .go{margin-left:auto;background:#fff;color:#2B3FD1;border-radius:14px;padding:10px 16px;font:800 14px var(--disp);box-shadow:0 4px 0 rgb(0 0 40/.25);white-space:nowrap}
.bx.hero .gring{background:conic-gradient(#fff calc(var(--p)*1%),rgb(255 255 255/.22) 0)}
.bx.hero .gring b{background:#3448E6;color:#fff;font-size:14px}
.mini7{display:flex;gap:4px;margin-top:auto}
.mini7 i{flex:1;height:9px;border-radius:4px;background:var(--bg4)}
.mini7 i.on{background:var(--amber)}
.lvbar{height:9px;border-radius:9px;background:var(--bg4);overflow:hidden;margin-top:auto}
.lvbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ok),#7EE0A8)}
.bx.chest.ready{background:linear-gradient(135deg,#FFB020,#FF7A1A)!important;color:#fff;border:0!important;box-shadow:0 10px 24px -12px rgb(255 122 26/.7)}
.bx.chest.ready small,.bx.chest.ready .s{color:rgb(255 255 255/.9)}
.bx.chest.ready .bi{animation:wob 1.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-5deg)}}
.pathhd{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 0}
.pathhd b{font:700 18px var(--disp)}
.pathhd span{font-size:13px;color:var(--tx3);font-weight:600}
.pdot{background:var(--solid);border-color:var(--glass-b)}
.pdot svg.il{width:38px;height:38px}
.pnode.now .pdot{background:var(--solid);border:3px solid var(--acc);box-shadow:0 5px 0 var(--acc-s),0 0 0 7px color-mix(in srgb,var(--acc) 20%,transparent)}
.pnode.done .pdot svg.i{width:30px;height:30px}

/* D4: tam ekran seri */
@keyframes cin{from{opacity:0;transform:scale(1.06)}}
@keyframes cout{to{opacity:0;transform:scale(.96)}}

/* E5: sandık, E12: günün kelimesi, E10 rapor, E8 tur */
.chestfx{display:grid;justify-items:center;gap:10px;text-align:center;padding:10px 0 4px}
.chestfx svg.il{width:120px;height:120px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.chestfx b{font:800 30px var(--disp);color:var(--amber-s)}
.wday{text-align:center;padding:26px 18px 22px;border-radius:26px;background:linear-gradient(150deg,#6D5BFF,#3654F4 50%,#0EA5E9);color:#fff;position:relative;overflow:hidden}
.wday small{font:700 11.5px var(--body);letter-spacing:.14em;opacity:.85}
.wday h2{font:800 34px var(--disp);margin:8px 0 2px}
.wday .tr{font-size:17px;opacity:.95}
.wday .ex{margin-top:14px;background:rgb(255 255 255/.14);border-radius:16px;padding:11px 12px;font-size:14.5px;text-align:left}
.wday .ex span{display:block;opacity:.8;font-size:13px}
.wday .bat{position:absolute;right:-6px;bottom:-8px;opacity:.95}
.rep .big2{font:800 30px var(--disp)}
.repgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.repgrid .card{padding:14px}
.repgrid small{display:block;font-size:12px;color:var(--tx3);font-weight:600}
.repgrid b{font:700 22px var(--disp)}
.wkbars{display:flex;align-items:flex-end;gap:8px;height:110px;padding:6px 2px 0}
.wkbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.wkbars i{width:100%;border-radius:8px 8px 4px 4px;background:var(--acc);min-height:4px}
.wkbars i.best{background:var(--ok)}
.wkbars i.cur{background:var(--amber)}
.wkbars span{font-size:11px;color:var(--tx3);font-weight:600}
.onb{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 22px calc(30px + env(safe-area-inset-bottom));text-align:center;background:var(--mesh)}
.onb h2{font:800 28px var(--disp);margin:0}
.onb p{margin:0;color:var(--tx2);font-size:16px;max-width:340px}
.onb .dots{display:flex;gap:6px}
.onb .dots i{width:8px;height:8px;border-radius:50%;background:var(--bg4)}
.onb .dots i.on{background:var(--acc);width:22px;border-radius:5px}
.onb .goalpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:360px}
.onb .goalpick button{padding:14px 6px;border-radius:18px;background:var(--bg2);border:2px solid var(--glass-b);font:700 16px var(--disp)}
.onb .goalpick button small{display:block;font:500 12px var(--body);color:var(--tx3)}
.onb .goalpick button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--solid));color:var(--acc)}
.onb .cta{width:100%;max-width:360px}
.msg .who{display:flex;align-items:center;gap:6px}
.msg .who svg.av{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){.batrow .bat,.bx.chest.ready .bi,.bpeek,.chestfx svg.il{animation:none!important}}
.fin .finbat{position:relative;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

/* ---- rozetler: parlayan, hafif yüzen; kilitliler soluk cam ---- */

@media (prefers-reduced-motion:reduce){.pnode.now .pdot,.pnode.now .pdot svg.il,.heat i,.bdg i,.bdg i::after,.pchk{animation:none!important}}

/* ---------- Gedsche: hafif canlılık (kanat, göz kırpma, bayrak) ---------- */
svg.bat .bwl,svg.bat .bwr{transform-box:view-box;animation:bflap 3.4s ease-in-out infinite}
svg.bat .bwl{transform-origin:40px 80px}
svg.bat .bwr{transform-origin:80px 80px;animation-name:bflapr}
svg.bat .beye{transform-box:fill-box;transform-origin:center;animation:bblink 5.2s infinite}
svg.bat .bflag{transform-box:fill-box;transform-origin:0 50%;animation:bwave 1.4s ease-in-out infinite alternate}
@keyframes bflap{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes bflapr{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes bblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes bwave{from{transform:skewY(-5deg) scaleX(.96)}to{transform:skewY(4deg) scaleX(1.02)}}
.hop{animation:bhop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes bhop{0%{transform:translateY(0)}35%{transform:translateY(-14px) rotate(-6deg)}70%{transform:translateY(2px)}100%{transform:none}}
#tdbat{display:block;flex:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* başlıkta küçük Gedsche */
.tbat{flex:none;width:36px;height:36px;margin:0 -4px 0 -2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tbat svg.bat{width:36px;height:36px;animation:batfloat 3.2s ease-in-out infinite}
/* ilerleme çubuğunda giden Gedsche */
.pbw{position:relative;flex:1;display:flex;align-items:center}
.pbw .pbar{flex:1}
.pbat{position:absolute;top:50%;width:30px;height:30px;transform:translate(-50%,-58%);transition:left .45s cubic-bezier(.3,1.4,.6,1);pointer-events:none;filter:drop-shadow(0 2px 4px rgb(40 20 90/.3))}
.pbat svg.bat{width:30px;height:30px}
.pbat.hop{animation:bhop2 .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes bhop2{35%{transform:translate(-50%,-110%) rotate(-8deg)}100%{transform:translate(-50%,-58%)}}
@media (prefers-reduced-motion:reduce){svg.bat .bwl,svg.bat .bwr,svg.bat .beye,svg.bat .bflag,.hop,.pbat.hop,.tbat svg.bat{animation:none!important}}
/* Gedsche soru kartında */
body.game #view > .flash{position:relative;overflow:visible}
.host{position:absolute;right:12px;top:-34px;width:54px;height:54px;z-index:2;pointer-events:none;filter:drop-shadow(0 4px 8px rgb(40 20 90/.28))}
body.game:not(.sess) .host{top:-24px;width:46px;height:46px}
.host svg.bat{width:100%;height:100%}
.host.hop{animation:bhop .55s cubic-bezier(.3,1.6,.5,1)}
.hsay{position:absolute;right:58px;top:6px;white-space:nowrap;font:800 13px var(--disp);font-style:normal;padding:5px 10px;border-radius:12px 12px 4px 12px;background:var(--solid);border:1px solid var(--glass-b);box-shadow:0 4px 12px rgb(0 0 0/.12);opacity:0;transform:translateX(6px) scale(.9)}
.hsay.ok{color:var(--ok)}.hsay.no{color:var(--bad)}
.host.talking .hsay{animation:hsay 1.6s ease forwards}
@keyframes hsay{0%{opacity:0;transform:translateX(6px) scale(.9)}12%,75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-4px)}}
/* etkinlik sonu: Gedsche uçarak gelir, zıplayıp dans eder */
.res .finbat.dance{animation:ffly .8s cubic-bezier(.3,1.45,.5,1) both}
.res .finbat.dance svg.bat{animation:fjump .62s .85s ease-in-out 3;transform-origin:50% 100%}
.res .finbat.dance svg.bat .bwl,.res .finbat.dance svg.bat .bwr{animation-duration:.45s}
@keyframes ffly{0%{opacity:0;transform:translate(-90px,140px) rotate(-25deg) scale(.5)}60%{opacity:1;transform:translate(8px,-14px) rotate(8deg) scale(1.05)}100%{transform:none}}
@keyframes fjump{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-22px) scale(.95,1.06) rotate(-5deg)}80%{transform:translateY(0) scale(1.06,.94)}}
.fsay{position:absolute;left:-6px;top:4px;transform:translateX(-100%);white-space:nowrap;font:800 15px var(--disp);padding:7px 13px;border-radius:16px 16px 4px 16px;background:var(--solid);border:1px solid var(--glass-b);box-shadow:0 6px 16px rgb(0 0 0/.14);color:var(--tx);animation:fsay .5s .7s cubic-bezier(.3,1.5,.5,1) both;z-index:2}
@keyframes fsay{from{opacity:0;transform:translateX(-100%) translateY(8px) scale(.8)}}
@media (prefers-reduced-motion:reduce){.host.hop,.host.talking .hsay,.res .finbat.dance,.res .finbat.dance svg.bat,.fsay{animation:none!important}.host.talking .hsay{opacity:1}}

.gtile.cz::after{content:"";position:absolute;top:-40%;left:-60%;width:40%;height:180%;background:linear-gradient(90deg,transparent,rgb(255 255 255/.55),transparent);transform:rotate(20deg);animation:gshine 5s var(--d,0s) infinite;pointer-events:none}

.grec{position:absolute;left:10px;bottom:10px;font-style:normal;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgb(0 0 0/.22);color:#fff}

.z0{--c1:#FF4F8B;--c2:#E0216A;--c3:#A3124A}
.z1{--c1:#FFA43A;--c2:#F06A0F;--c3:#B04700}

/* günün oyunu: jackpot */
.feat.jack{position:relative;overflow:hidden;padding:18px 16px;border-radius:24px;background:linear-gradient(135deg,#7C3AED,#DB2777 55%,#F59E0B);border:2px solid #FFE066!important;box-shadow:0 6px 0 #8A1C5C,0 12px 28px -8px #DB2777,inset 0 2px 0 rgb(255 255 255/.4)}
.feat.jack::after{content:"";position:absolute;top:-50%;left:-60%;width:35%;height:200%;background:linear-gradient(90deg,transparent,rgb(255 255 255/.5),transparent);transform:rotate(20deg);animation:gshine 3.6s infinite;pointer-events:none}
.feat.jack .ft b{display:block;font:800 26px/1.05 "Baloo 2",var(--disp);text-shadow:0 2px 0 #8A1C5C}

@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

body.arcade:not(.sess) .dw{background:#fff!important;color:#1F1A4D!important;border:2px solid var(--c1)!important;box-shadow:0 4px 0 var(--c2),0 8px 20px -6px var(--c2)!important}

body[data-gz="7"]{--ct:#5A3300}
body.arcade:not(.sess) .wd{color:var(--ct,#fff)}
body[data-gz="7"].arcade .wd{text-shadow:none}

/* ===== Efektler ===== */
#fx{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.fxp{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c),0 0 14px var(--c);animation:fxfly .7s cubic-bezier(.15,.7,.3,1) forwards}
.fxp.star{border-radius:0;width:calc(var(--s)*1.8);height:calc(var(--s)*1.8);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
@keyframes fxfly{0%{transform:translate(0,0) scale(1.2);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 30px)) scale(.3) rotate(160deg);opacity:0}}
.fxring{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;border:4px solid #FFD23F;box-shadow:0 0 18px #FFD23F,inset 0 0 12px #fff;animation:fxring .5s ease-out forwards}
@keyframes fxring{0%{transform:scale(.4);opacity:1}100%{transform:scale(7);opacity:0}}
.fxbolt{position:absolute;inset:0;animation:fxflash .6s steps(1) forwards}
.fxbolt::before{content:"";position:absolute;inset:0;background:rgb(255 248 200/.35);animation:fxbg .6s ease-out forwards}
.fxbolt svg{position:absolute;inset:0}
.fxbolt polyline{fill:none;stroke:#FFF6B0;stroke-width:5;stroke-linejoin:round;filter:drop-shadow(0 0 6px #FFE45C) drop-shadow(0 0 16px #FFC400)}
@keyframes fxflash{0%{opacity:1}15%{opacity:0}25%{opacity:1}55%{opacity:1}100%{opacity:0}}
@keyframes fxbg{0%{opacity:1}100%{opacity:0}}
.fxban{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);padding:10px 22px;border-radius:99px;font:800 30px "Baloo 2",var(--disp);color:#fff;white-space:nowrap;background:linear-gradient(135deg,#FF4F8B,#F59E0B);border:3px solid #FFE066;box-shadow:0 6px 0 #A3124A,0 0 40px #FFC400;text-shadow:0 2px 0 rgb(0 0 0/.25);animation:fxban 1.1s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes fxban{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1) rotate(2deg);opacity:1}75%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
.fxbad{position:absolute;inset:0;box-shadow:inset 0 0 60px 10px rgb(225 29 72/.55);animation:fxbg .45s ease-out forwards}
#fxbg{display:none;position:fixed;inset:0;z-index:-1;pointer-events:none}
body.arcade:not(.sess) #fxbg{display:block}
#fxbg i{position:absolute;width:var(--z);height:var(--z);border-radius:50%;background:#fff;box-shadow:0 0 10px 3px var(--c1,#FFD23F),0 0 22px 6px color-mix(in srgb,var(--c1,#FFD23F) 50%,transparent);animation:twk var(--t) var(--dl) ease-in-out infinite;opacity:0}
@keyframes twk{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1)}}
:root[data-theme="light"] #fxbg i{background:var(--c1)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) #fxbg i{background:var(--c1)}}

.clg{display:flex;overflow-x:auto;scrollbar-width:none}

.clt{flex:1;min-width:0;display:grid;gap:2px}
